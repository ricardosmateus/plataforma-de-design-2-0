<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Progress Bar v2 - Corrigida</title>
<style>
  :root{
    --fill-accent:#0BA5EC; --fill-primary:#FCD34D;
    --text-muted:#6B7280; --border:#E5E7EB; --border-strong:#D1D5DB;
    --neutral-100:#F9FAFB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--neutral-100);padding:32px}
  h1{font-size:20px;margin-bottom:8px}
  p{color:var(--text-muted);margin-bottom:20px;font-size:14px}
  button{padding:10px 16px;border:none;border-radius:6px;background:var(--fill-accent);color:#fff;font-weight:600;cursor:pointer;margin-right:8px;margin-bottom:16px}
  .stage{position:relative;width:100%;height:300px;background:#eee;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}

  .canvas-progress{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:60px;background:rgba(10,13,18,.8);backdrop-filter:blur(4px);z-index:20;border-bottom:1px solid var(--border)}
  .canvas-progress[hidden]{display:none}
  .canvas-progress-bar{width:90%;max-width:400px;height:3px;background:var(--border-strong);border-radius:999px;overflow:hidden;margin-bottom:8px;box-shadow:0 0 0 1px var(--border)}
  .canvas-progress-fill{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--fill-accent),var(--fill-primary));border-radius:999px;box-shadow:0 0 8px var(--fill-accent);transition:width 1.4s cubic-bezier(.16,1,.3,1)}
  .canvas-progress-label{font-size:12px;color:var(--text-muted);font-weight:500}

  #log{background:#1e1e1e;color:#9cdcfe;font-family:monospace;font-size:12px;padding:12px;border-radius:6px;margin-top:16px;min-height:80px;white-space:pre-wrap}
</style>
</head>
<body>
  <h1>✅ Barra de Progresso — versão corrigida</h1>
  <p>Elemento real (não pseudo-elemento) + transition. Teste rápido/lento simula a mesma lógica usada em board.js.</p>

  <button onclick="testeRapido()">Simular carregamento RÁPIDO (100ms)</button>
  <button onclick="testeLento()">Simular carregamento LENTO (4s)</button>
  <button onclick="reset()">Reset</button>

  <div class="stage">
    <div class="canvas-progress" id="canvasProgress" hidden>
      <div class="canvas-progress-bar"><div class="canvas-progress-fill" id="canvasProgressFill"></div></div>
      <div class="canvas-progress-label">Carregando painéis do quadro...</div>
    </div>
    <span>Canvas do board</span>
  </div>

  <div id="log">Aguardando teste...</div>

<script>
var progressoControl = {
  fill:null, container:null, timer:null, mostradoEm:0, MINIMO_VISIVEL:450,
  elementos:function(){
    if(!this.container){ this.container=document.getElementById('canvasProgress'); this.fill=document.getElementById('canvasProgressFill'); }
    return !!(this.container && this.fill);
  },
  mostrar:function(){
    if(!this.elementos()) return;
    if(this.timer){ clearTimeout(this.timer); this.timer=null; }
    this.container.hidden=false;
    this.mostradoEm=Date.now();
    log('mostrar() → container.hidden=false');
    this.fill.style.transition='none';
    this.fill.style.width='0%';
    void this.fill.offsetWidth;
    this.fill.style.transition='';
    this.fill.style.width='70%';
    log('fill width → 70% (transição 1.4s)');
  },
  esconder:function(){
    if(!this.elementos()) return;
    if(this.timer){ clearTimeout(this.timer); this.timer=null; }
    var completar=function(){
      this.fill.style.transition='width .25s ease-out';
      this.fill.style.width='100%';
      log('fill width → 100%');
      this.timer=setTimeout(function(){
        this.container.hidden=true;
        this.fill.style.transition='none';
        this.fill.style.width='0%';
        log('escondido, resetado p/ próxima carga');
      }.bind(this), 320);
    }.bind(this);
    var decorrido=Date.now()-this.mostradoEm;
    if(decorrido<this.MINIMO_VISIVEL){
      log('carregou em '+decorrido+'ms — aguardando mínimo de '+this.MINIMO_VISIVEL+'ms');
      this.timer=setTimeout(completar, this.MINIMO_VISIVEL-decorrido);
    } else { completar(); }
  }
};

function log(msg){
  var el=document.getElementById('log');
  el.textContent += '\n['+new Date().toLocaleTimeString()+'] '+msg;
  el.scrollTop = el.scrollHeight;
}

function testeRapido(){
  document.getElementById('log').textContent='=== Teste RÁPIDO (100ms) ===';
  progressoControl.mostrar();
  setTimeout(function(){ progressoControl.esconder(); }, 100);
}

function testeLento(){
  document.getElementById('log').textContent='=== Teste LENTO (4s) ===';
  progressoControl.mostrar();
  setTimeout(function(){ progressoControl.esconder(); }, 4000);
}

function reset(){
  document.getElementById('log').textContent='Reset.';
  var c=document.getElementById('canvasProgress');
  var f=document.getElementById('canvasProgressFill');
  c.hidden=true; f.style.transition='none'; f.style.width='0%';
}
</script>
</body>
</html>
