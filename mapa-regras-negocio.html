\" e \"aqui não tem nada\" levam o usuário a ações opostas — limpar a busca, ou criar a primeira idéia. Uma mensagem só para os dois casos empurra metade dos usuários para o caminho errado.\n\n### 1.4 Estado vazio — `IDEIA-VAZIO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IDEIA-VAZIO-001 | O estado vazio substitui o quadro inteiro quando o projeto não tem **nenhuma** idéia — não quando uma coluna está vazia. Coluna vazia tem o vazio próprio dela (IDEIA-BUSCA-002). | Interface existente |\n| IDEIA-VAZIO-002 | O estado vazio traz o botão \"Nova idéia\" para quem pode criar. Quem só visualiza vê a ilustração e o texto, sem botão. | Decorre de IDEIA-CRIA-004 |\n| IDEIA-VAZIO-003 | O botão \"Gerar com ajuda da IA\" **sai** do estado vazio nesta versão — a IA foi adiada (decisão I3). Ele volta junto com a funcionalidade de verdade. | Decisão I3 |\n\n**Atenção de implementação — armadilha já vivida.** Em `projetos.html`, a linha que revelava o botão \"Novo projeto\" morava dentro da função que desenha a lista, e por isso só rodava quando já existia pelo menos um item. Resultado: o estado vazio aparecia sem botão nenhum, e não havia caminho para criar o primeiro projeto. A permissão precisa ser aplicada **nos dois caminhos** — lista e vazio. Ver `projetos-listagem.md`, mesma nota.\n\n---\n\n## 2. Contrato da API — `GET /empresas/:empresaId/projetos/:projetoId/ideias`\n\nRequisição autenticada pelo cookie de acesso. Sem corpo.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ ideias: [...], papel }` | Desenha o quadro; lista vazia → estado vazio (IDEIA-VAZIO-001) |\n| Sessão inválida | `401` | Renovação silenciosa via `/auth/sessao`; só então login |\n| Conta suspensa | `403` com `suspensao` | Mostra a mensagem |\n| Qualquer elo da corrente falha (IDEIA-ISO-003) | `404` | Redireciona para `projetos.html` |\n| Falha de rede | — | Toast de erro de conexão |\n\nCada item traz `id`, `titulo`, `descricao`, `importancia`, `status`, `criado_em` e `atualizado_em`. O `papel` de quem pediu vem **uma vez, na raiz da resposta** — não repetido em cada idéia, já que é o mesmo para todas.\n\n---\n\n## 3. Modelo de dados\n\n```\nideias\n  id            uuid (pk)\n  projeto_id    uuid (not null, fk → projetos.id, cascade)\n  titulo        varchar(60)  (not null)\n  descricao     varchar(280) (not null)\n  importancia   smallint (not null, default 0, check 0..5)\n  status        enum StatusIdeia (not null, default 'ideias')\n  criado_por    uuid (not null, fk → users.id)\n  arquivado_em  timestamp (null)\n  criado_em     timestamp (not null, default now())\n  atualizado_em timestamp (not null)\n\n  índice (projeto_id, arquivado_em)   -- toda listagem filtra por isso\n```\n\n```\nenum StatusIdeia = 'ideias' | 'andamento' | 'finalizado'\n```\n\nOs limites de 60 e 280 vêm do `maxlength` que o protótipo já usa nos campos — ver `ideias-criacao.md` §1. `importancia` aceita 0 porque as estrelas começam apagadas e o protótipo não as torna obrigatórias; 0 significa \"sem prioridade definida\".\n\n`status` é enum e não texto livre pelo mesmo motivo que `TipoProjeto` é: as três colunas são fixas (IDEIA-QUADRO-001), então o banco deve recusar um quarto valor em vez de aceitá-lo silenciosamente e quebrar a tela.\n\n`onDelete: Cascade` em `projeto_id` existe como rede de segurança do banco. Na prática nada é apagado de verdade — arquivar é o caminho normal (E1).\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| I1 | As colunas são fixas ou o usuário cria as dele? | Fixas — três, definidas pelo produto. Quadro configurável é outro produto, e não é o que a tela desenha. | 24/08/2026 |\n| I2 | Quem enxerga as idéias de um projeto? | Todo mundo com vínculo ativo na empresa, sem granularidade por projeto — mesma régua de PROJ-LIST. | 24/08/2026 |\n| I3 | \"Gerar com ajuda da IA\" e o assistente lateral entram no lançamento? | **Não.** Ambos ficam para um bloco próprio, depois do quadro funcionando de verdade. Mesma estratégia do catálogo de tipos de projeto (P7): lançar estreito e crescer. | 24/08/2026 |\n| I4 | Busca/ordenação no cliente ou no servidor? | No cliente. Um projeto tem dezenas de idéias, não milhares; paginar agora seria complexidade sem problema correspondente. Revisitar se surgir volume. | 24/08/2026 |\n\n---\n\n## 5. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| IA (gerar idéias + assistente) | **Adiada por decisão I3.** Quando entrar, exige decidir: custo por token, consumo de créditos da conta, e que contexto do projeto a IA recebe. |\n| Card ilustrado (`illustration`) | O protótipo tem uma variante de card cujo corpo é uma imagem, usada pela \"Matriz CSD\", e que navega para `matriz_csd.html`. Não está no modelo de dados acima porque pertence ao módulo de atividades, ainda não especificado. |\n| Destino do botão \"Acessar\" | Hoje leva a `atividade.html` ou `matriz_csd.html`, ambas fora deste módulo. O contrato dessa navegação entra junto do módulo de atividades. |\n| Volume e paginação | Ver decisão I4 — revisitar se um projeto real passar de algumas centenas de idéias. |\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.1 | 2026-09-13 | Sem mudança de regra. Cabeçalho corrigido: dizia \"implementação não iniciada\" com o quadro no ar desde então. Conferidas IDEIA-ISO-002/003/004, IDEIA-QUADRO-005/007/008 e IDEIA-VAZIO-002/003 — todas cumpridas. IDEIA-BUSCA fica para uma próxima conferência. |\n| 1.0.0 | 2026-08-24 | Documento criado. Regras de isolamento (IDEIA-ISO), quadro (IDEIA-QUADRO), busca (IDEIA-BUSCA) e estado vazio (IDEIA-VAZIO) definidas, junto das decisões I1 a I4. |\n"},{"id":"ideias/ideias-taxonomia","nome":"ideias-taxonomia","titulo":"Regras de Negócio — Taxonomia de uma Idéia (pasta e tags)","versao":"1.0.0","status":"Implementado","pagina":null,"ids":["IDEIA-MOV-017","IDEIA-TAX","IDEIA-TAX-001","IDEIA-TAX-002","IDEIA-TAX-003","IDEIA-TAX-004","IDEIA-TAX-005","IDEIA-MOV-018","IDEIA-TAX-006","IDEIA-TAX-007","IDEIA-TAX-008","IDEIA-MOV-004","IDEIA-TAX-009","IDEIA-ISO-003","PROJ-CRIA-007"],"modificado":"2026-09-13T11:03:04.268Z","bytes":8429,"rel":"Regras_de_negocio/modulos/ideias/ideias-taxonomia.md","md":"# Regras de Negócio — Taxonomia de uma Idéia (pasta e tags)\n\n> **Versão:** 1.0.0 · **Status:** Implementado\n> **Conferido em:** 13/09/2026, contra `api/src/rotas/ideias.ts`, `api/src/ia/taxonomia.ts`, `api/src/ia/taxonomia-vocabulario.ts` e `js/grafo-painel.js`\n> **Módulo:** Idéias · **Páginas:** `visao_do_projeto.html` (a coluna decide se há taxonomia), `Sobre_a_empresa.html` (onde a pasta aparece e onde ela é corrigida)\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`ideias-movimentacao.md`](ideias-movimentacao.md) — IDEIA-MOV-017/018, que ligam e desligam a taxonomia · [`../grafo-conhecimento-v2.md`](../grafo-conhecimento-v2.md) — o planejamento de onde estas regras vêm\n\n---\n\nEste documento existia apenas como prosa em `../grafo-conhecimento-v2.md` (\"Regra 1/2/3\"), sem identificadores, sem versionamento e fora do módulo da entidade que ele governa. A rota `PATCH …/ideias/:id/taxonomia` estava implementada e no ar sem nenhuma regra citável. Foi registrado em 13/09/2026, a partir do código, na conferência de `visao_do_projeto.html`.\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Taxonomia da idéia (pasta e tags) |\n| Módulo | Idéias |\n| Endpoint | `PATCH /empresas/:empresaId/projetos/:projetoId/ideias/:id/taxonomia` |\n| Entidades | `ideias` (`assunto`, `tags`, `taxonomia_manual`), `recortes_taxonomia` |\n| Vocabulário | `api/src/ia/taxonomia-vocabulario.ts` — cinco domínios (Descoberta, Produto, Experiência, Negócio, Tecnologia) e as categorias dentro deles |\n| Componentes | Painel de pasta em \"Sobre a empresa\" (`js/grafo-painel.js`) |\n\n---\n\n## 1. Regras\n\n### 1.1 Quando existe taxonomia — `IDEIA-TAX`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IDEIA-TAX-001 | **Só idéia em `finalizado` tem taxonomia.** Em `ideias` e `andamento`, `assunto` é nulo e `tags` é vazio — sempre, sem exceção. A taxonomia é consequência da coluna, não um atributo independente. | `../grafo-conhecimento-v2.md` Regra 1; registrado 13/09/2026 |\n| IDEIA-TAX-002 | A taxonomia tem **um `assunto`** (a pasta, exatamente um) e **até três `tags`** (temas transversais). Pasta é onde a idéia mora; tag é por onde ela também é encontrada. | `grafo-conhecimento-v2.md` Regra 3 + limite lido do código |\n| IDEIA-TAX-003 | `assunto` e `tags` só aceitam valores **do vocabulário fechado** (`taxonomia-vocabulario.ts`). Valor fora dele é `400` — \"Essa pasta não existe na taxonomia.\" ou \"Há tag fora da taxonomia.\". Não é campo livre. | Registrado 13/09/2026, a partir do código |\n| IDEIA-TAX-004 | O `assunto` **nunca se repete entre as `tags`**. Se vier repetido no pedido, o servidor o remove da lista em vez de recusar — a pasta já é a categoria principal, repeti-la como tema secundário não acrescenta nada. | Registrado 13/09/2026, a partir do código |\n| IDEIA-TAX-005 | A idéia entra em `finalizado` e a IA **propõe** a classificação; a pessoa **confirma ou corrige**. A proposta chega em segundo plano (IDEIA-MOV-018), então a pasta aparece alguns instantes depois do card chegar à coluna. | `grafo-conhecimento-v2.md`; registrado 13/09/2026 |\n\n### 1.2 Correção manual — `IDEIA-TAX`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IDEIA-TAX-006 | Corrigir a pasta à mão marca a idéia como **`taxonomia_manual`**. Sem essa marca a correção duraria até a próxima reclassificação, e a pessoa veria a pasta errada voltar sozinha. | Registrado 13/09/2026, a partir do código |\n| IDEIA-TAX-007 | Pedir taxonomia para uma idéia que **não está em `finalizado`** devolve **`409`** — \"Só idéias finalizadas têm pasta.\" Aceitar criaria, pela porta dos fundos, exatamente o estado que IDEIA-TAX-001 existe para impedir. | Registrado 13/09/2026, a partir do código |\n| IDEIA-TAX-008 | **Quem move, classifica**: proprietário, membro e especialista. Mesma régua de IDEIA-MOV-004, e pelo mesmo motivo — corrigir a pasta é organizar, não destruir. Papel sem permissão recebe `403` \"Seu papel não permite classificar idéias.\" | Registrado 13/09/2026; decorre de IDEIA-MOV-004 |\n| IDEIA-TAX-009 | Corrigir a pasta **refaz os recortes por tema** daquela idéia, em segundo plano. Sem isso a correção valeria pela metade: pasta certa no mapa, texto ainda servido na página do tema antigo. | Registrado 13/09/2026, a partir do código |\n\n**Por que a correção manual precisou existir.** O planejamento prometia \"a taxonomia que a IA propõe e o usuário confirma\". Até esta rota existir, só havia a proposta: consertar uma pasta errada exigia tirar a idéia de \"Finalizado\" e devolver — o que apaga tudo (IDEIA-MOV-017) e reclassifica no escuro, na esperança de sair diferente. Esta rota é a metade que faltava da promessa.\n\n**Por que o vocabulário é fechado (IDEIA-TAX-003).** Pasta livre viraria cinquenta pastas com o mesmo significado escrito de jeitos diferentes, e o mapa de conhecimento perde a serventia exatamente quando começa a ter volume. O custo aceito é que uma idéia sobre algo fora dos cinco domínios não tem onde morar direito — acrescentar categoria é decisão de negócio, registrada no vocabulário, não digitação de quem classifica.\n\n**A ligação com a movimentação.** Esta é a metade estática; `ideias-movimentacao.md` IDEIA-MOV-017/018/019 é a dinâmica. As duas descrevem o mesmo invariante por ângulos diferentes: **idéia fora de `finalizado` não tem taxonomia, e nada pode criar o estado contrário.**\n\n---\n\n## 2. Contrato da API — `PATCH …/ideias/:id/taxonomia`\n\nRequisição autenticada pelo cookie de acesso.\n\n| Campo do corpo | Obrigatório | Regra |\n|---|---|---|\n| `assunto` | Sim | Uma categoria do vocabulário. Ausente → `400` \"Escolha a pasta.\" |\n| `tags` | Não (padrão `[]`) | Até três, todas do vocabulário. Acima disso → `400` \"No máximo três tags.\" |\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ ideia }` | Atualiza a pasta exibida e marca a idéia como corrigida à mão |\n| Corpo inválido (IDEIA-TAX-002/003) | `400` com `campo` | Mostra o erro no campo |\n| Sessão inválida | `401` | Renovação silenciosa via `/auth/sessao`; só então login |\n| Conta suspensa | `403` com `suspensao` | Mostra a mensagem |\n| Papel sem permissão (IDEIA-TAX-008) | `403` | \"Seu papel não permite classificar idéias.\" |\n| Qualquer elo da corrente falha (IDEIA-ISO-003) | `404` | Redireciona |\n| Idéia não está em `finalizado` (IDEIA-TAX-007) | `409` | \"Só idéias finalizadas têm pasta.\" |\n\nO `200` volta assim que a idéia é gravada. A re-segmentação de IDEIA-TAX-009 corre depois, em segundo plano — quem corrigiu está olhando para um `\u003cselect>` e não pode esperar o modelo.\n\n---\n\n## 3. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| T1 | Pasta é campo livre ou vocabulário fechado? | Fechado. Ver a justificativa em §1.2. | Registrado 13/09/2026, a partir do código em produção |\n| T2 | Quantas tags por idéia? | Até três. Acima disso \"tema transversal\" deixa de discriminar qualquer coisa. | Registrado 13/09/2026 |\n| T3 | A correção manual sobrevive a uma reclassificação? | Sim — é para isso que existe `taxonomia_manual` (IDEIA-TAX-006). | Registrado 13/09/2026 |\n\n---\n\n## 4. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| Origem das decisões T1 a T3 | Foram **lidas do código**, não de uma decisão registrada em conversa. Estão certas quanto ao que o sistema faz; falta confirmar que refletem o que se quer que ele faça — em especial o teto de três tags. |\n| Categoria nova no vocabulário | Acrescentar categoria é mudança de regra de negócio, não de copy: mexe em `taxonomia-vocabulario.ts`, na cópia do cliente em `js/tema.js` e no que já foi classificado. Falta registrar o procedimento, como PROJ-CRIA-007 fez para tipo de projeto. |\n| Reclassificar o que já existe | Quando uma categoria entra ou sai, as idéias já classificadas continuam com a taxonomia antiga. Não há migração definida. |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-09-13 | Documento criado na conferência de `visao_do_projeto.html`. As regras existiam como prosa sem identificadores em `../grafo-conhecimento-v2.md`, e a rota `PATCH …/taxonomia` estava implementada sem regra citável. IDEIA-TAX-001 a 009 registradas a partir do código, decisões T1 a T3 e três pendências abertas. |\n"}]},{"nome":"projetos","emoji":"📁","docs":[{"id":"projetos/projetos-criacao","nome":"projetos-criacao","titulo":"Regras de Negócio — Criação de Projeto","versao":"1.2.0","status":"Implementado","pagina":"projetos.html","ids":["PROJ-CRIA-009","PROJ-ISO","PROJ-CRIA-001","PROJ-CRIA-002","PROJ-CRIA-003","PROJ-CRIA-004","PROJ-CRIA-005","EMP-CRIA-002","EMP-EXCL-002","EMP-EXCL-005","PROJ-ISO-003","PROJ-CRIA-006","PROJ-CRIA-007","PROJ-CRIA-008"],"modificado":"2026-09-13T10:52:58.655Z","bytes":9074,"rel":"Regras_de_negocio/modulos/projetos/projetos-criacao.md","md":"# Regras de Negócio — Criação de Projeto\n\n> **Versão:** 1.2.0 · **Status:** Implementado · \"Editar\" fora da interface no lançamento (PROJ-CRIA-009)\n> **Conferido em:** 13/09/2026, contra `api/src/rotas/projetos.ts`, `api/src/projetos/catalogo.ts` e `projetos.html`\n> **Módulo:** Projetos · **Página:** `projetos.html` (modal \"Novo projeto\")\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`projetos-listagem.md`](projetos-listagem.md) — a listagem que este modal alimenta, e de onde vem PROJ-ISO\n\n---\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Novo projeto (modal) |\n| Módulo | Projetos |\n| Endpoint | `POST /empresas/:empresaId/projetos` |\n| Entidades | `projetos` |\n| Componentes | Modal \"Novo projeto\" (seletor de tipo), mesma modal reaproveitada para \"Editar projeto\" |\n\nO protótipo já tem a modal desenhada: uma lista de tipos de projeto (rádio), sem campo de nome ou descrição. A decisão **P1** (`projetos-listagem.md` §4) confirma que é assim mesmo — criar um projeto é escolher um tipo, não preencher um formulário.\n\n---\n\n## 1. Regras\n\n| ID | Regra | Fonte |\n|---|---|---|\n| PROJ-CRIA-001 | Criar projeto exige escolher um `tipo` da lista fechada — não é texto livre. | Decorre de P1 |\n| PROJ-CRIA-002 | `nome` e `descricao` exibidos no card não são digitados: vêm de um catálogo fixo `tipo → {nome, descricao}` mantido no servidor. O cliente nunca envia nem `nome` nem `descricao`. | Decorre de P1 |\n| PROJ-CRIA-003 | Não há checagem de duplicidade: a mesma empresa pode ter mais de um projeto do mesmo `tipo`. | Consequência aceita de P1 |\n| PROJ-CRIA-004 | Só proprietário e membro da empresa podem criar projeto. Especialista vinculado pode ver, mas o botão \"Novo projeto\" e a opção \"Editar\" não aparecem para ele. | Decidido 24/08/2026 (decisão P2 de `projetos-listagem.md`) |\n| PROJ-CRIA-005 | \"Editar projeto\" reaproveita a mesma modal, para trocar o `tipo` de um projeto existente. Não existe edição parcial (só nome, por exemplo) porque não há nome próprio a editar. | Decorre de PROJ-CRIA-002 |\n\n**Por que PROJ-CRIA-003 é uma regra, e não uma omissão.** Em `empresas-criacao.md`, nome duplicado é bloqueado (EMP-CRIA-002) porque o nome ali identifica a empresa para quem lista. Aqui o \"nome\" do projeto é só o rótulo do tipo escolhido — bloquear duplicidade impediria uma empresa de ter duas \"Startup\" ao mesmo tempo, o que é uma limitação de produto real (fica registrada em `projetos-listagem.md` §5), mas não um problema de integridade de dado. Por isso não é bloqueado no servidor.\n\n**Por que PROJ-CRIA-004 corta especialista.** Mesma lógica de papéis já usada em `empresas-exclusao.md` EMP-EXCL-002: um especialista contratado atua *dentro* dos projetos que lhe são atribuídos, não decide quais projetos a empresa tem. Diferente de empresa (onde só o proprietário exclui), aqui membro também cria/edita — times costumam ter mais de uma pessoa organizando os próprios projetos internos.\n\n---\n\n## 2. Contrato da API — `POST /empresas/:empresaId/projetos`\n\nRequisição autenticada pelo cookie de acesso. Corpo `application/json`.\n\n| Campo | Obrigatório | Regra |\n|---|---|---|\n| `tipo` | Sim | Um dos valores do catálogo (§3). Qualquer outro valor é `400`. |\n\n| Situação | Resposta |\n|---|---|\n| Criado | `201` com o projeto, no formato do `GET /empresas/:empresaId/projetos` |\n| `tipo` ausente ou fora do catálogo | `400`, `campo: \"tipo\"` |\n| Sessão inválida | `401` |\n| Conta suspensa | `403` |\n| Vínculo existe, mas é especialista (PROJ-CRIA-004) | `403`, mensagem \"Só proprietário ou membro podem criar projetos.\" |\n| `:empresaId` inexistente, arquivada, ou sem vínculo ativo | `404` — mesma resposta de `empresas-exclusao.md` EMP-EXCL-005, por PROJ-ISO-003 |\n\n`PUT /empresas/:empresaId/projetos/:id` segue o mesmo contrato, trocando `201` por `200` — usado pela mesma modal em modo \"Editar\" (PROJ-CRIA-005). As mesmas checagens de papel e de vínculo se aplicam.\n\n> **Nota de 13/09/2026.** O `PUT` está implementado e no ar, mas nenhuma tela o chama: a opção \"Editar\" não existe na interface do lançamento (PROJ-CRIA-009). Isso torna a menção a \"Editar\" em PROJ-CRIA-004 uma regra sobre o que *voltará* a aparecer, não sobre o que aparece hoje — hoje o menu do card tem só \"Excluir\", para todos os papéis que operam.\n\n---\n\n## 3. Catálogo de tipos — lançamento só com Startup\n\n| ID | Regra | Fonte |\n|---|---|---|\n| PROJ-CRIA-006 | No lançamento, o único `tipo` habilitado é `startup`. Os demais (Franquia, Plano de Negócios, e o resto do protótipo) ficam **fora do catálogo** — não é possível criar projeto com eles ainda, mesmo que a modal um dia volte a listá-los visualmente. | Decidido 24/08/2026 com o Ricardo |\n| PROJ-CRIA-007 | Novos tipos entram um de cada vez, conforme forem sendo construídos — cada um é um novo valor no enum mais a tela/fluxo que aquele tipo de projeto abre ao ser acessado. Não é uma tarefa de copy isolada: \"adicionar o tipo Franquia\" só fecha quando o que existe *dentro* de um projeto Franquia também existir. | Decidido 24/08/2026 |\n| PROJ-CRIA-008 | Cada `tipo` tem uma **miniatura** própria no card. Ela faz parte do que um tipo novo precisa trazer (junto do valor de enum e da tela interna, PROJ-CRIA-007): sem ela o card cai num recurso genérico e o tipo entra na listagem parecendo defeito. | Registrado 13/09/2026, a partir do código |\n| PROJ-CRIA-009 | No lançamento **não existe \"Editar projeto\" na interface**. Com um único tipo no catálogo (PROJ-CRIA-006), reabrir a modal para escolher Startup de novo não muda nada. O `PUT` continua no ar e com o contrato da §2 — a regra retira a opção da tela, não o endpoint. Quando o segundo tipo entrar, a opção volta sob PROJ-CRIA-005, sem contrato novo. | Decidido durante a implementação; registrado 13/09/2026 |\n\n| `tipo` | Rótulo | Descrição | Status |\n|---|---|---|---|\n| `startup` | Startup | São empresas jovens e inovadoras que buscam resolver desafios específicos por meio de modelos de negócios que podem crescer rapidamente e se adaptar facilmente... | **Habilitado** |\n| `franquia` | Franquia | *(placeholder no protótipo — \"Lorem ipsum dollor\")* | Fora do catálogo — entra depois |\n| `plano_negocios` | Plano de Negócios | *(placeholder no protótipo — \"Lorem ipsum dollor\")* | Fora do catálogo — entra depois |\n| *(5 slots restantes da modal)* | Sem título definido | *(placeholder no protótipo — \"Lorem ipsum dollor\")* | Fora do catálogo — nem reservados ainda |\n\nConsequência direta para a implementação: o enum `TipoProjeto` nasce com um único valor (`startup`); o `POST`/`PUT` rejeita (`400`) qualquer outro; e a modal \"Novo projeto\" mostra só a opção Startup, sem a lista de categorias placeholder do protótipo — mostrar opções que não podem ser escolhidas seria confuso, não \"preparado para o futuro\". Adicionar um `tipo` novo depois é sempre uma migração aditiva (novo valor de enum), nunca uma mudança de contrato.\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| P3 | Quem pode criar/editar projeto? | Proprietário e membro. Especialista só visualiza. | 24/08/2026 |\n| P4 | Nome duplicado bloqueia? | Não — não existe nome próprio, só `tipo`, e repetir tipo é permitido (PROJ-CRIA-003). | 24/08/2026 |\n| P7 | Lançar com o catálogo completo ou só parte dele? | Só `startup`. Os demais tipos entram depois, um a um, junto com o que cada um abre por dentro. | 24/08/2026 |\n| P8 | A miniatura do card vem do catálogo do servidor, como nome e descrição? | **Em aberto.** Hoje não: o mapa `THUMBS` vive no `\u003cscript>` de `projetos.html`, e um tipo ausente dele cai em `img/projetos-vazio.svg` — a arte de \"nenhum projeto\". Nome e descrição vêm do servidor por PROJ-CRIA-002, justamente para o cliente não decidir isso; a imagem escapou dessa regra. Recomendação: mover o nome do arquivo para `CATALOGO_TIPOS`, ao lado de `nome` e `descricao`, e trocar o fallback por um recurso neutro que não se confunda com estado vazio. | Levantado 13/09/2026 |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-24 | Documento criado. Regras de criação por tipo fechado (PROJ-CRIA-001 a 005), contrato de `POST`/`PUT` e catálogo parcial de tipos registrados antes da implementação. |\n| 1.1.0 | 2026-08-24 | PROJ-CRIA-006 e 007: lançamento restrito ao tipo `startup`; demais tipos ficam fora do catálogo até serem construídos, um de cada vez. Decisão P7. |\n| 1.2.0 | 2026-09-13 | Conferência contra o código implementado. PROJ-CRIA-008 (miniatura por tipo) e PROJ-CRIA-009 (\"Editar\" fora da interface no lançamento) registradas — a segunda existia só como comentário de código. Decisão P8 aberta sobre a miniatura vir ou não do catálogo do servidor. Nota na §2 esclarecendo que o `PUT` está no ar sem tela que o chame. Cabeçalho atualizado de \"implementação não iniciada\" para o estado real. |\n"},{"id":"projetos/projetos-exclusao","nome":"projetos-exclusao","titulo":"Regras de Negócio — Exclusão de Projeto","versao":"1.0.1","status":"Implementado","pagina":"projetos.html","ids":["PROJ-EXCL-001","EMP-EXCL-001","PROJ-EXCL-002","PROJ-CRIA-004","PROJ-EXCL-003","PROJ-LIST-004","PROJ-EXCL-004","PROJ-ISO-004","PROJ-EXCL-005","PROJ-LIST-008"],"modificado":"2026-09-13T10:52:58.656Z","bytes":5276,"rel":"Regras_de_negocio/modulos/projetos/projetos-exclusao.md","md":"# Regras de Negócio — Exclusão de Projeto\n\n> **Versão:** 1.0.1 · **Status:** Implementado · sem divergências\n> **Conferido em:** 13/09/2026, contra `api/src/rotas/projetos.ts` e `projetos.html`\n> **Módulo:** Projetos · **Página:** `projetos.html` (menu do card → Excluir)\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`projetos-listagem.md`](projetos-listagem.md) · [`projetos-criacao.md`](projetos-criacao.md) · [`../empresas/empresas-exclusao.md`](../empresas/empresas-exclusao.md) — mesmo mecanismo de arquivamento, reaproveitado aqui\n\n---\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Excluir projeto (modal de confirmação) |\n| Módulo | Projetos |\n| Endpoint | `DELETE /empresas/:empresaId/projetos/:id` |\n| Entidades | `projetos` |\n| Componentes | Menu do card (kebab), modal \"Excluir projeto\" (já desenhada no protótipo) |\n\n---\n\n## 1. Regras\n\n| ID | Regra | Fonte |\n|---|---|---|\n| PROJ-EXCL-001 | Excluir **arquiva** o projeto (`arquivado_em = now()`), não apaga a linha — mesmo mecanismo de `empresas-exclusao.md` EMP-EXCL-001. | Decidido 24/08/2026 |\n| PROJ-EXCL-002 | Proprietário e membro podem excluir. Especialista não. Mesma régua de quem pode criar (`projetos-criacao.md` PROJ-CRIA-004) — quem organiza os projetos da empresa é quem decide encerrar um. | Decidido 24/08/2026 |\n| PROJ-EXCL-003 | Projeto arquivado some da listagem de todo mundo com vínculo na empresa (efeito de PROJ-LIST-004 — nenhuma mudança na consulta é necessária além do que já está em `projetos-listagem.md`). | Decorre de PROJ-LIST-004 |\n| PROJ-EXCL-004 | Pedir exclusão de projeto inexistente, já arquivado, ou que pertence a outra empresa devolve **404** — mesma resposta nos três casos. | Decorre de PROJ-ISO-004 |\n| PROJ-EXCL-005 | A opção **\"Duplicar projeto\"**, presente no protótipo, é removida. Mesma decisão já tomada para empresas (`retirar o botão duplicar empresa`, 22/08/2026). | Decidido 24/08/2026 com o Ricardo |\n\n**Por que proprietário e membro, e não só proprietário (diferente de empresa).** Excluir *empresa* é uma decisão que afeta o negócio inteiro — só o dono deveria poder. Excluir *projeto* é operação do dia a dia de quem organiza o trabalho ali dentro; travar em \"só proprietário\" obrigaria o dono a ser chamado toda vez que um projeto interno for encerrado. A régua de PROJ-CRIA-004 (quem cria, edita) se estende para quem exclui, por consistência.\n\n**Por que remover Duplicar.** Mesmo raciocínio já registrado para empresas: sem um `nome` próprio por projeto (decisão P1), \"duplicar\" duplicaria só o `tipo` — criaria um segundo projeto idêntico e indistinguível do original, sem nenhum ganho sobre simplesmente clicar em \"Novo projeto\" de novo. A opção fica sem função clara até o dia em que projetos tiverem conteúdo interno que valha a pena copiar.\n\n---\n\n## 2. Contrato da API — `DELETE /empresas/:empresaId/projetos/:id`\n\n**Requisição.** `DELETE /empresas/:empresaId/projetos/:id`, autenticada pelo cookie de acesso. Sem corpo.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Excluído | `200` com `{ ok: true }` | Remove o card da grade; se era o último, volta ao estado vazio |\n| Sessão inválida | `401` | Toast, sem tentar renovar sozinho — diferente da listagem, que renova (`projetos-listagem.md` PROJ-LIST-008) |\n| Conta suspensa | `403` com `suspensao` | Toast |\n| Vínculo existe, mas é especialista | `403` | \"Só proprietário ou membro podem excluir projetos.\" |\n| `:empresaId` sem vínculo ativo, arquivada, ou inexistente | `404` | \"Empresa não encontrada.\" |\n| `:id` do projeto inexistente, já arquivado, ou de outra empresa | `404` | \"Projeto não encontrado.\" |\n\nO botão de confirmação trava enquanto a API responde — mesmo padrão do \"Salvar\" e do \"Excluir\" de empresa.\n\n---\n\n## 3. Estados obrigatórios\n\n| Estado | Situação | Observação |\n|---|---|---|\n| Sucesso | ✅ Card sai da grade, toast confirma | Se era o último, volta ao estado vazio |\n| Sem permissão (especialista) | ✅ Toast explica o motivo | PROJ-EXCL-002 |\n| Não encontrado (projeto ou empresa) | ✅ Toast genérico, sem revelar existência | PROJ-EXCL-004 |\n| Sessão expirada | ✅ Toast, sem redirecionar sozinho | — |\n| Conta suspensa | ✅ Toast com o motivo | — |\n| Falha de rede | ✅ Toast de erro de conexão | — |\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| P5 | Excluir apaga a linha ou arquiva? | Arquiva — reaproveita o mecanismo de E1/EMP-EXCL-001 | 24/08/2026 |\n| P6 | Mantém \"Duplicar projeto\"? | Removido — mesma decisão de empresas, sem função clara sem nome próprio | 24/08/2026 |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-24 | Documento criado. Regras PROJ-EXCL-001 a 005, contrato de `DELETE` e decisões P5/P6 registradas antes da implementação. |\n| 1.0.1 | 2026-09-13 | Conferência contra o código: as cinco regras e o contrato do `DELETE` conferem, nenhuma mudança de regra. Linha do `401` na §2 ganhou a referência cruzada para PROJ-LIST-008, que registra a assimetria deliberada com a listagem. Cabeçalho atualizado de \"implementação não iniciada\" para o estado real. |\n"},{"id":"projetos/projetos-listagem","nome":"projetos-listagem","titulo":"Regras de Negócio — Listagem de Projetos","versao":"1.1.0","status":"Implementado","pagina":"projetos.html","ids":["PROJ-ISO","PROJ-ISO-001","PROJ-ISO-002","PROJ-ISO-003","EMP-LIST-009","EMP-EXCL-005","PROJ-ISO-004","PROJ-ISO-005","EMP-LIST-011","PROJ-LIST","PROJ-LIST-001","PROJ-LIST-002","PROJ-LIST-003","EMP-LIST-010","PROJ-LIST-004","PROJ-LIST-005","PROJ-LIST-006","PROJ-LIST-007","PROJ-LIST-008","PROJ-LIST-009","IDEIA-ISO-002","ACS-SESSAO-001","PROJ-CRIA-004"],"modificado":"2026-09-13T10:52:58.654Z","bytes":13129,"rel":"Regras_de_negocio/modulos/projetos/projetos-listagem.md","md":"# Regras de Negócio — Listagem de Projetos\n\n> **Versão:** 1.1.0 · **Status:** Implementado · uma divergência aberta (§5)\n> **Conferido em:** 13/09/2026, contra `api/src/rotas/projetos.ts`, `projetos.html` e `js/projetos.js`\n> **Módulo:** Projetos · **Página:** `projetos.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`../empresas/empresas-listagem.md`](../empresas/empresas-listagem.md) — de onde vem o vínculo que autoriza tudo aqui · [`projetos-criacao.md`](projetos-criacao.md) · [`projetos-exclusao.md`](projetos-exclusao.md)\n\n---\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Projetos (de uma empresa) |\n| Módulo | Projetos |\n| Rota | `/projetos.html?empresa=:id` |\n| Arquivo de interface | `projetos.html` |\n| Entidades | `projetos`, `empresas`, `empresa_membros` |\n| Componentes | Rail, cabeçalho com nome/logo da empresa, breadcrumb, card de projeto, estado vazio, modal \"Novo projeto\", toast |\n| Páginas relacionadas | `empresas.html` (origem — botão \"Acessar\" do card), `visao_do_projeto.html` (destino — botão \"Acessar\" do card de projeto) |\n\nHoje `projetos.html` é um protótipo estático: dado de exemplo fixo no JS (`EMPRESAS`, com um único projeto \"Nome do projeto\"), cabeçalho com o nome \"Nike\" fixo no HTML, e o link \"Acessar\" de cada card da empresa em `empresas.html` aponta para `projetos.html` **sem nenhum identificador da empresa**. Este documento assume a reescrita necessária para a página parar de mentir sobre qual empresa está mostrando.\n\n> **Nota de 13/09/2026.** A reescrita aconteceu. `projetos.html` lê o `?empresa=` da URL, o cabeçalho mostra o nome real da empresa e os cards vêm de `GET /empresas/:empresaId/projetos`. O parágrafo acima fica como registro do ponto de partida, não do estado atual.\n\n---\n\n## 1. Regras\n\n### 1.1 Isolamento entre empresas — `PROJ-ISO`\n\nEsta é a regra que motivou o documento.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| PROJ-ISO-001 | **Todo projeto pertence a exatamente uma empresa.** `empresa_id` é obrigatório e imutável — não existe projeto \"solto\", nem projeto que muda de empresa. | Pedido do Ricardo, 24/08/2026 |\n| PROJ-ISO-002 | A página `projetos.html` só existe no contexto de uma empresa: a URL carrega `?empresa=:id`, e toda chamada à API para listar, criar, editar ou excluir projeto informa esse `:id`. | Decorre de PROJ-ISO-001 |\n| PROJ-ISO-003 | Antes de tocar em qualquer projeto, o servidor confirma que quem fez a chamada tem **vínculo ativo** com a empresa do `:id` — o mesmo vínculo que já autoriza ver a empresa em `GET /empresas` (`empresas-listagem.md` EMP-LIST-009). Sem vínculo ativo, a resposta é **404**, nunca a lista de projetos de outra empresa. | Decidido 24/08/2026, mesmo padrão de `empresas-exclusao.md` EMP-EXCL-005 |\n| PROJ-ISO-004 | Um projeto só é retornado se o seu `empresa_id` bater com o `:id` da URL. Pedir um projeto pelo id direto (edição, exclusão) e ele pertencer a outra empresa devolve **404 \"Projeto não encontrado\"** — a mesma resposta de \"esse id não existe\". | Decidido 24/08/2026 |\n| PROJ-ISO-005 | Empresa arquivada (`arquivado_em` preenchido) não tem seus projetos acessíveis por ninguém, mesmo por quem ainda tem vínculo ativo registrado. | Decorre de EMP-LIST-011 |\n\n**Por que 404 e não 403 em PROJ-ISO-003.** Mesmo raciocínio já registrado em `empresas-exclusao.md`: devolver 403 (\"existe, mas você não pode\") para uma empresa que a pessoa não tem vínculo nenhum revelaria que aquele `id` corresponde a uma empresa real. 404 não distingue \"não existe\" de \"existe, mas não é seu\" — quem tenta adivinhar ids de empresas alheias não aprende nada.\n\n**Por que PROJ-ISO-004 é uma regra própria, e não só \"faz join e pronto\".** É o erro mais fácil de cometer numa API aninhada: implementar `GET /projetos/:id` sem checar `empresa_id`, confiando que o `:empresa` da URL \"já garante\" o filtro. Ele só garante se o código explicitamente comparar os dois — a regra existe para que essa comparação nunca seja opcional ou esquecida numa rota nova (edição, por exemplo).\n\n**Consequência prática para a implementação.** As rotas de projeto vivem aninhadas em `/empresas/:empresaId/projetos...`, e **toda** rota — sem exceção, inclusive as que recebem `:id` do projeto — repete a checagem de vínculo do `:empresaId` antes de tocar no banco. Não existe rota de projeto que aceite só o id do projeto sem também confirmar a empresa.\n\n### 1.2 O que a listagem mostra — `PROJ-LIST`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| PROJ-LIST-001 | A listagem mostra os projetos ativos (não arquivados) da empresa do `:empresa` da URL, para quem tem vínculo ativo com ela. | Decorre de PROJ-ISO |\n| PROJ-LIST-002 | Sem nenhum projeto, a tela mostra o estado vazio já desenhado, com o convite para criar o primeiro. | Interface existente |\n| PROJ-LIST-003 | Vazio, carregando e erro são três coisas diferentes — mesma regra de `empresas-listagem.md` EMP-LIST-010. Uma falha de rede ou um erro do servidor nunca vira \"nenhum projeto ainda\". | Decorre de EMP-LIST-010 |\n| PROJ-LIST-004 | Projeto arquivado não aparece na listagem e não conta para decidir se ela está vazia — mesmo mecanismo de EMP-LIST-011. | Decorre de EMP-LIST-011 |\n| PROJ-LIST-005 | O cabeçalho da página mostra o nome de verdade da empresa (hoje fixo em \"Nike\" no HTML) e o breadcrumb mostra `Empresas > {nome da empresa} > Projetos`. | Decidido 24/08/2026 — corrige o protótipo |\n| PROJ-LIST-006 | Se `?empresa=` estiver ausente, for um id inválido, ou a pessoa não tiver vínculo ativo com ele, a página redireciona para `empresas.html` em vez de mostrar uma tela quebrada ou vazia. | Decidido 24/08/2026 |\n| PROJ-LIST-007 | A listagem chega ordenada por `criado_em` **decrescente** — projeto mais recente primeiro. Um projeto recém-criado entra no topo da grade sem recarregar a página, para a tela concordar com a ordem que o servidor devolveria no carregamento seguinte. | Registrado 13/09/2026, a partir do código |\n| PROJ-LIST-008 | Um `401` na listagem **não expulsa ninguém de imediato**: a tela chama `GET /auth/sessao` para girar o refresh e repete a chamada uma vez. Só se a renovação também recusar é que volta ao login, com `?motivo=sessao-expirada&destino=` apontando de volta para esta página com o `?empresa=` preservado. | Registrado 13/09/2026 — mesma decisão de `empresas-listagem.md` §2 |\n| PROJ-LIST-009 | O botão \"Acessar\" do card leva a `visao_do_projeto.html` carregando **os dois** identificadores na URL: `?empresa=:empresaId&projeto=:projetoId`. O destino depende dos dois (`ideias-quadro.md` IDEIA-ISO-002) e devolve a pessoa para cá se faltar qualquer um. | Registrado 13/09/2026, a partir do código |\n\n**Por que PROJ-LIST-006 existe.** Hoje não existe verificação nenhuma: a página abre do mesmo jeito sem `?empresa=` na URL, porque nada nela depende disso ainda. No momento em que passar a depender, uma URL adulterada ou um link antigo sem o parâmetro não pode virar tela em branco silenciosa — o mesmo princípio de honestidade de EMP-LIST-010 aplicado à navegação, não só aos dados.\n\n**Por que a ordem virou regra (PROJ-LIST-007).** Ela vive em dois arquivos que precisam concordar: o `orderBy` da rota e o `insertAdjacentHTML('afterbegin')` da tela. Nada acusa quando deixam de concordar — trocar o `orderBy` para crescente faria o projeto novo continuar nascendo no topo e pular para o fim no refresh seguinte, que é o tipo de inconsistência que se atribui a \"bug de cache\" e se investiga pelo lado errado.\n\n**Por que PROJ-LIST-008 contradiz o que este documento dizia.** Até a versão 1.0.0, a §2 registrava para o `401` \"não redireciona sozinho\". Era o oposto do implementado, e do que `empresas-listagem.md` §2 já descrevia. O motivo de renovar antes de desistir é o mesmo lá e aqui: o token de acesso vive 15 minutos (ACS-SESSAO-001), então `401` é o caso **normal** de quem deixou a aba aberta, não o excepcional. Expulsar em todo `401` mandaria a pessoa reautenticar a cada quinze minutos com a sessão ainda válida.\n\n**Atenção à assimetria com criar e excluir.** PROJ-LIST-008 vale para a *listagem*. As chamadas de criação e exclusão não renovam: um `401` ali vira toast, como registrado em `projetos-exclusao.md` §2. A diferença é deliberada — a listagem acontece sozinha ao abrir a página, quando a pessoa não pediu nada e não entenderia ser expulsa; criar e excluir são ações deliberadas, em que um erro visível é a resposta certa.\n\n---\n\n## 2. Contrato da API — `GET /empresas/:empresaId/projetos`\n\nRequisição autenticada pelo cookie de acesso. Sem corpo.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ projetos: [...] }` | Desenha os cards; lista vazia → estado vazio (PROJ-LIST-002) |\n| Sessão inválida | `401` | Renova por `GET /auth/sessao` e repete uma vez; só depois volta ao login (PROJ-LIST-008) |\n| Conta suspensa | `403` com `suspensao` | Mostra a mensagem |\n| Sem vínculo ativo com `:empresaId`, empresa arquivada, ou `:empresaId` não existe | `404` | Redireciona para `empresas.html` (PROJ-LIST-006) |\n| Falha de rede | — | Toast de erro de conexão, mesmo padrão das outras chamadas |\n\nCada item de `projetos` traz `id`, `tipo`, `nome` e `descricao` já resolvidos a partir do catálogo de tipos (ver `projetos-criacao.md` §3), `papel` (o papel de quem pediu, para a tela decidir se mostra \"Editar\"/\"Excluir\" no menu — `PROJ-CRIA-004`), e `criado_em`.\n\n---\n\n## 3. Modelo de dados\n\nNova tabela, complementando `empresas` e `empresa_membros` (já existentes):\n\n```\nprojetos\n  id            uuid (pk)\n  empresa_id    uuid (not null, fk → empresas.id, cascade)\n  tipo          enum TipoProjeto (not null)\n  criado_por    uuid (not null, fk → users.id)\n  arquivado_em  timestamp (null)\n  criado_em     timestamp (not null, default now())\n  atualizado_em timestamp (not null)\n\n  índice (empresa_id, arquivado_em)  -- toda listagem filtra por isso\n```\n\nSem `nome` nem `descricao` próprios — decorre da decisão P1 (§4): o rótulo e a descrição exibidos vêm do catálogo de `tipo`, não de texto digitado por quem cria. Ver a consequência disso em `projetos-criacao.md` §1.\n\n`onDelete: Cascade` em `empresa_id`: existe só como rede de segurança do banco. Na prática nenhuma linha de `empresas` é apagada de verdade (E1) — arquivar é o caminho normal —, então essa cascata nunca deveria disparar em uso normal.\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| P1 | Projeto tem nome livre digitado, ou só o tipo escolhido? | Só o tipo — nome/descrição exibidos vêm do catálogo do tipo, não são campos próprios do projeto. Consequência aceita: dois projetos do mesmo tipo na mesma empresa ficam com o mesmo rótulo na tela. | 24/08/2026 |\n| P2 | Quem pode ver os projetos de uma empresa? | Todo mundo com vínculo ativo na empresa (proprietário, membro, especialista) — mesma régua de visibilidade de `empresas-listagem.md`. Quem pode **criar/editar/excluir** é mais restrito — ver `projetos-criacao.md` e `projetos-exclusao.md`. | 24/08/2026 |\n\n---\n\n## 5. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| Nome da empresa no breadcrumb (PROJ-LIST-005) | **Não cumprida.** O `\u003ch1>` já mostra o nome real da empresa, mas o breadcrumb de `projetos.html` traz só `Empresas > Projetos`, além do link \"Voltar\" — o segmento `{nome da empresa}` que a regra exige não existe no markup nem é preenchido por JS. Divergência aberta em 13/09/2026, na conferência deste documento contra o código. |\n| Catálogo de tipos de projeto | **Resolvido para o lançamento** (decisão P7, `projetos-criacao.md` §3): só `startup` fica habilitado. Franquia, Plano de Negócios e o restante do protótipo entram depois, um tipo de cada vez, junto com a tela que cada um abre por dentro. |\n| Especialista e projetos específicos | Hoje o vínculo com uma empresa é único por conta (`empresa_membros`, sem granularidade por projeto). Se no futuro um especialista precisar ver só **alguns** projetos de uma empresa (não todos), isso exige uma tabela nova de atribuição — fora do escopo deste documento. Por ora, especialista vê todos os projetos da empresa em que tem vínculo, como qualquer outro papel. |\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-24 | Documento criado. Regras de isolamento entre empresas (PROJ-ISO) e de listagem (PROJ-LIST) definidas e autorizadas, junto das decisões P1 e P2. |\n| 1.1.0 | 2026-09-13 | Conferência contra o código implementado. PROJ-LIST-007 (ordem da listagem), PROJ-LIST-008 (renovação silenciosa no `401`) e PROJ-LIST-009 (destino do \"Acessar\") registradas — as três eram decisões que só existiam no código. Linha do `401` na §2 corrigida: dizia \"não redireciona sozinho\", o oposto do implementado. PROJ-LIST-005 registrada como não cumprida em §5. Cabeçalho atualizado de \"implementação não iniciada\" para o estado real. |\n"}]},{"nome":"temas","emoji":"🏷️","docs":[{"id":"temas/temas-pagina","nome":"temas-pagina","titulo":"Regras de Negócio — Página de um Tema","versao":"1.0.0","status":"Implementado","pagina":"tema.html","ids":["IDEIA-MOV-017","TEMA-LEITURA","TEMA-LEITURA-001","TEMA-LEITURA-002","TEMA-LEITURA-003","IDEIA-TAX-005","TEMA-LEITURA-004","TEMA-LEITURA-005","IDEIA-TAX-001","TEMA-LEITURA-006","TEMA-ISO","TEMA-ISO-001","TEMA-ISO-002","TEMA-ISO-003","TEMA-ISO-004","PROJ-ISO-003","TEMA-ISO-005","IDEIA-TAX-003","IDEIA-MOV-015","TEMA-NAV","TEMA-NAV-001","IDEIA-QUADRO-007","TEMA-NAV-002","TEMA-NAV-003","IDEIA-QUADRO-008","TEMA-NAV-004","TEMA-NAV-005","TEMA-NAV-006","TEMA-SINTESE","TEMA-SINTESE-001","TEMA-SINTESE-002","TEMA-SINTESE-003","TEMA-SINTESE-004","TEMA-SINTESE-005","TEMA-SINTESE-006","TEMA-SINTESE-007","TEMA-SINTESE-008","IA-CUSTO","TEMA-SINTESE-009","TEMA-ORIGEM","TEMA-ORIGEM-001","TEMA-ORIGEM-002","BOARD-ACESSO-003","TEMA-ORIGEM-003","TEMA-ORIGEM-004","TEMA-ORIGEM-005","TEMA-ORIGEM-006","TEMA-ORIGEM-007","PROJ-CRIA-002","IDEIA-QUADRO-003"],"modificado":"2026-09-13T11:30:37.206Z","bytes":16242,"rel":"Regras_de_negocio/modulos/temas/temas-pagina.md","md":"# Regras de Negócio — Página de um Tema\n\n> **Versão:** 1.0.0 · **Status:** Implementado\n> **Conferido em:** 13/09/2026, contra `tema.html`, `js/tema.js`, `js/graficos.js`, `api/src/rotas/grafo.ts` e `api/src/ia/enriquecimento*.ts`\n> **Módulo:** Temas · **Página:** `tema.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`../ideias/ideias-taxonomia.md`](../ideias/ideias-taxonomia.md) — de onde vêm as categorias e os recortes · [`../ideias/ideias-movimentacao.md`](../ideias/ideias-movimentacao.md) — IDEIA-MOV-017, que faz conteúdo sair daqui · [`../atividades/board-lista.md`](../atividades/board-lista.md) — `board.html`, o destino de todo link desta página\n\n---\n\n`tema.html` estava no ar sem documento de regra, o que a seção *Fonte oficial* de `Skills/regra_de_negocio.skill` não permite. O comportamento era governado por `Skills/categorizacao-taxonomia.skill` e `Skills/enriquecimento-tema.skill`, com o plano em `Documentacao/enriquecimento-tema.md` — nenhum deles versionado como regra nem citável por ID. Este documento foi escrito em 13/09/2026 a partir do código, promovendo a regra o que já estava decidido e implementado.\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Página de um tema |\n| Módulo | Temas |\n| Rota | `/tema.html?empresa=:id&categoria=:nome` (`&projeto=:id` opcional, só para a navegação) |\n| Endpoints | `GET /empresas/:empresaId/temas/:categoria` · `GET /empresas/:empresaId/temas/:categoria/sintese` |\n| Entidades | `recortes_taxonomia`, `sinteses_tema`, `ideias`, `tarefas` |\n| Vocabulário | `api/src/ia/taxonomia-vocabulario.ts` — cinco domínios, 24 categorias |\n| Páginas relacionadas | `Sobre_a_empresa.html` (origem e volta), `board.html` (destino de todo link) |\n\n**O que a página responde.** \"Sobre a empresa\" responde *de que* a empresa fala — Mercado, Estratégia, Concorrentes. Esta responde *o que ela diz* sobre um deles. É a metade da pergunta que faltava.\n\n---\n\n## 1. Regras\n\n### 1.1 O que a página mostra — `TEMA-LEITURA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| TEMA-LEITURA-001 | A página mostra os **recortes** de uma categoria, agrupados por tarefa de origem. Cada bloco é uma tarefa, nunca uma fusão de várias — porque cada bloco termina num link para **um** quadro, e fundir dois mandaria a pessoa ao lugar errado na metade das vezes. | Registrado 13/09/2026, a partir do código |\n| TEMA-LEITURA-002 | O texto exibido é o registro do quadro, **letra por letra**. A página não reescreve, não resume e não corrige — é isso que faz \"editar no quadro\" encontrar o que a pessoa acabou de ler. | Registrado 13/09/2026 |\n| TEMA-LEITURA-003 | A página **não pensa**: a segmentação já aconteceu, uma vez, quando a idéia foi finalizada (`IDEIA-TAX-005`). Abrir um tema é leitura pura — instantâneo e **sem custo de crédito**. | Registrado 13/09/2026 |\n| TEMA-LEITURA-004 | Os blocos vêm **mais recente primeiro**, com título da idéia e depois da tarefa como desempate. O desempate não é detalhe: sem ele a página remontaria em ordem diferente a cada carga. | Registrado 13/09/2026, a partir do código |\n| TEMA-LEITURA-005 | Só entra recorte de idéia **em `finalizado`**, não arquivada, de projeto não arquivado, da empresa da URL. O filtro é redundante por decisão: `IDEIA-MOV-017` já apaga os recortes ao sair de `finalizado`, e este `where` é o cinto de segurança caso algum escape. | Decorre de IDEIA-TAX-001 |\n| TEMA-LEITURA-006 | Todo texto é escrito na tela por `textContent`, nunca por `innerHTML`. O conteúdo vem de registros que pessoas digitaram em quadros: montar isto por `innerHTML` executaria, na página de conhecimento da empresa, o que alguém escreveu num post-it. | Registrado 13/09/2026 |\n\n### 1.2 Um tema cruza projetos — `TEMA-ISO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| TEMA-ISO-001 | O escopo da página é a **empresa**, não o projeto. \"Concorrentes\" reúne o que foi descoberto em **todos** os projetos da empresa — é essa reunião que dá sentido à página. | Registrado 13/09/2026 |\n| TEMA-ISO-002 | O `?projeto=` da URL é **só contexto de navegação** (para onde o rail e o \"voltar\" apontam). Ele não filtra o conteúdo e não pode ser usado para montar link de origem. | Registrado 13/09/2026, a partir do código |\n| TEMA-ISO-003 | O link de cada trecho usa o **projeto da idéia**, lido da resposta — nunca o projeto da URL. Mandar todos para o projeto da barra de endereço levaria ao quadro errado, ou a um redirecionamento de volta, que é como o defeito apareceria primeiro. | Registrado 13/09/2026 |\n| TEMA-ISO-004 | Antes de qualquer leitura, o servidor confirma **vínculo ativo** com a empresa da URL. Sem vínculo, `404` — nunca o conteúdo de outra empresa, e nunca um `403` que confirmaria que aquele id existe. | Decorre de PROJ-ISO-003 |\n| TEMA-ISO-005 | A categoria da URL é comparada com o **vocabulário fechado**. Nome fora dele devolve `404` \"Esse tema não existe na taxonomia\" — sem isso, qualquer nome inventado teria uma pasta fantasma com endereço próprio e conteúdo sempre vazio. | Decorre de IDEIA-TAX-003 |\n\n**Por que TEMA-ISO-003 merece regra própria.** É o mesmo erro que `IDEIA-MOV-015` já corrigiu em outro lugar: usar o identificador que está à mão em vez do que descreve o registro. Aqui ele é especialmente fácil de cometer, porque o `?projeto=` está na URL e \"funciona\" em todos os testes feitos dentro de um projeto só. Ele quebra exatamente quando a página cumpre o propósito dela — reunir trechos de projetos diferentes.\n\n### 1.3 Navegação e estados — `TEMA-NAV`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| TEMA-NAV-001 | Sem `?empresa=` a página volta para `empresas.html`; sem `?categoria=` volta para `Sobre_a_empresa.html`. Não é estado vazio — é navegação inválida, e cada caso volta ao lugar mais próximo que ainda faz sentido. | Decorre de IDEIA-QUADRO-007 |\n| TEMA-NAV-002 | `404` do servidor — empresa sem vínculo **ou** tema fora da taxonomia — leva para `Sobre_a_empresa.html`, que é a página que sabe quais temas existem. As duas causas levam ao mesmo lugar de propósito. | Decorre de TEMA-ISO-004/005 |\n| TEMA-NAV-003 | Carregando, vazio e erro são três estados distintos. Um tema vazio por falha de rede, desenhado como tema vazio de verdade, faria alguém concluir que a empresa não sabe nada sobre concorrentes. | Decorre de IDEIA-QUADRO-008 |\n| TEMA-NAV-004 | O estado de erro traz \"Tentar de novo\", e cada tentativa é uma **carga do zero** — a leitura guiada da tentativa anterior é descartada antes, para não ficar acesa por cima de um tema que a carga atual ainda não confirmou que tem conteúdo. | Registrado 13/09/2026, a partir do código |\n| TEMA-NAV-005 | Cada categoria tem uma **frase de introdução** explicando o que ela promete conter. \"Mercado\" e \"Benchmark\" têm leitura ambígua fora deste vocabulário: sem a frase, quem chega pelo grafo ou por uma tag lê os trechos sem saber o que a pasta significa. Categoria sem entrada não quebra a página — a introdução fica oculta —, mas é esquecimento, não omissão proposital. | `Skills/categorizacao-taxonomia.skill`; registrado 13/09/2026 |\n| TEMA-NAV-006 | A categoria chega pela URL e é reconhecida **sem acento e sem diferença de caixa**, tanto no servidor quanto na introdução. Um link antigo ou digitado à mão não pode deixar a página muda por causa de um acento. | Registrado 13/09/2026 |\n\n### 1.4 Leitura guiada e gráficos — `TEMA-SINTESE`\n\nCamada **aditiva** por cima de §1.1. Origem: `Skills/enriquecimento-tema.skill` e `Documentacao/enriquecimento-tema.md`.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| TEMA-SINTESE-001 | A leitura crua de §1.1 **continua existindo e continua grátis**, sempre. Se o enriquecimento nunca rodou, falhou, ou não tem saldo, a tela mostra o que sempre mostrou. Nada nesta seção pode bloquear ou atrasar a rota de leitura. | `enriquecimento-tema.skill`, \"O que não muda, nunca\" |\n| TEMA-SINTESE-002 | **O modelo rotula, não escreve.** Ele devolve título de seção, título de gráfico e rótulo de ponto, mais números que apontam para recortes existentes. O texto de cada trecho é montado no servidor a partir do banco, a cada requisição, **nunca copiado da resposta do modelo**. | `enriquecimento-tema.skill` |\n| TEMA-SINTESE-003 | **Nenhum recorte some.** Recorte que o modelo esqueceu cai numa seção final \"Outros trechos\", gerada pelo servidor e não pelo modelo — se fosse um título que o modelo tem liberdade de propor, a garantia de que nada some ficaria refém da educação da resposta. | `enriquecimento-tema.skill` |\n| TEMA-SINTESE-004 | Quando a leitura guiada existe, ela **substitui** a lista por atividade de origem; as duas nunca aparecem juntas e não há botão para trocar. Escolher a vista era uma pergunta que só se responde depois de ler as duas — e ler as duas é ler o mesmo conteúdo duas vezes, que é o que a leitura guiada existe para evitar. | Registrado 13/09/2026 |\n| TEMA-SINTESE-005 | Leitura guiada e gráficos têm **status e fingerprint próprios**. Um tema pode ter gráfico sem ter leitura guiada, e o contrário. | `enriquecimento-tema.skill` |\n| TEMA-SINTESE-006 | O reprocessamento é decidido por **fingerprint, não por flag**: o `sha256` dos ids dos recortes do tema. Os recortes são recriados por inteiro a cada segmentação, então o conjunto muda sempre que há algo novo para reler, e não muda quando uma idéia sem relação nenhuma é finalizada. Igual ao gravado, não reprocessa. | `enriquecimento-tema.skill` |\n| TEMA-SINTESE-007 | O disparo acontece **depois** da transação que grava os recortes, sem `await`, por `(empresa, categoria)` — não por idéia. \"A leitura de Mercado\" é o tema inteiro, não o que uma idéia isolada disse. | `enriquecimento-tema.skill` |\n| TEMA-SINTESE-008 | Custo entra como tipo próprio `sintese_tema`, separado de `classificacao` e `assistente`, para \"quanto custou enriquecer os temas\" ter resposta própria. Saldo insuficiente **não é erro**: o tema não é enriquecido e a leitura crua continua de pé (TEMA-SINTESE-001). | `enriquecimento-tema.skill`; decorre de IA-CUSTO |\n| TEMA-SINTESE-009 | Resposta ilegível do modelo preserva a leitura anterior (`null`), e **não** a substitui por vazio. Lista vazia e `null` decidem coisas opostas. | `enriquecimento-tema.skill` |\n\n### 1.5 Rastreabilidade — `TEMA-ORIGEM`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| TEMA-ORIGEM-001 | Todo trecho exibido leva de volta ao quadro de origem. É a razão de a página existir: conhecimento que não se pode conferir na fonte vira boato com layout bonito. | Registrado 13/09/2026 |\n| TEMA-ORIGEM-002 | O link carrega os **quatro** ids que `board.html` exige (`BOARD-ACESSO-003`): empresa, projeto, idéia e tarefa. Faltando qualquer um, o link não é desenhado — melhor nenhum link do que um que volta. | Decorre de BOARD-ACESSO-003 |\n| TEMA-ORIGEM-003 | Na leitura guiada o link é **por trecho**, não por bloco: uma seção pode misturar recortes de tarefas diferentes, e um link no fim do bloco apontaria para uma só. | `Documentacao/enriquecimento-tema.md` |\n| TEMA-ORIGEM-004 | Cada gráfico traz a lista das origens dos seus dados **como links de verdade**, abaixo dele. Clicar na barra é o atalho; o link é a porta — e é o único caminho até a origem que funciona sem mouse. | `enriquecimento-tema.skill`, \"Rastreabilidade e acessibilidade\" |\n| TEMA-ORIGEM-005 | Um recorte citado por dois pontos do mesmo gráfico aparece **uma vez só** na lista de origens. A pessoa quer chegar ao trecho, não contar quantas vezes ele foi usado. | Registrado 13/09/2026 |\n| TEMA-ORIGEM-006 | O rótulo do link de origem é o **nome da tarefa**, não \"ver origem\": numa lista de três, três links iguais não dizem qual é qual. | Registrado 13/09/2026 |\n| TEMA-ORIGEM-007 | Trecho órfão — cujo recorte já não tem tarefa viva — não vira link nem parágrafo em branco, e seção que ficou sem nenhum trecho válido não vira card vazio. | Registrado 13/09/2026 |\n\n---\n\n## 2. Contrato da API\n\n### `GET /empresas/:empresaId/temas/:categoria`\n\nLeitura pura. Não chama o modelo, não custa crédito (TEMA-LEITURA-003).\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ categoria, dominio, total_trechos, blocos }` | Desenha os blocos; `blocos` vazio → estado vazio |\n| Sessão inválida | `401` | Volta ao login com `?motivo=sessao-expirada&destino=` |\n| Conta suspensa | `403` com `suspensao` | Volta ao login com `?motivo=suspenso` |\n| Sem vínculo com a empresa, ou `:empresaId` inválido | `404` \"Empresa não encontrada.\" | Vai para `Sobre_a_empresa.html` |\n| Categoria fora do vocabulário | `404` \"Esse tema não existe na taxonomia.\" | Vai para `Sobre_a_empresa.html` |\n| Falha de rede ou `5xx` | — | Estado de erro com \"Tentar de novo\" (TEMA-NAV-003/004) |\n\n`categoria` volta com a **grafia canônica** do vocabulário, não como veio na URL (TEMA-NAV-006). Cada bloco traz `ideia_id`, `ideia_titulo`, `projeto_id`, `projeto_nome`, `tarefa_id`, `tarefa_titulo` e `trechos[]`. `projeto_nome` sai do catálogo de tipos (`PROJ-CRIA-002`), a mesma fonte que monta o card em `projetos.html` — se divergissem, o mesmo projeto teria dois nomes em duas telas.\n\n### `GET /empresas/:empresaId/temas/:categoria/sintese`\n\nAditiva. Falha aqui **nunca** afeta a rota acima (TEMA-SINTESE-001).\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Enriquecida | `200` com `status_leitura`/`status_graficos` `\"ok\"`, `secoes`, `recortes`, `graficos` | Desenha a leitura guiada e/ou os gráficos |\n| Ainda não rodou, ou falhou | `200` com status `\"pendente\"` | Nada — a leitura crua já está na tela |\n| Qualquer erro | — | Silencioso: a tela não avisa e não muda de estado |\n\nAs duas chamadas partem **em paralelo** na carga da página. A síntese nunca atrasa a leitura.\n\n---\n\n## 3. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| TM1 | A página filtra pelo projeto da URL? | Não. O escopo é a empresa (TEMA-ISO-001); o `?projeto=` é só navegação. | Registrado 13/09/2026, a partir do código |\n| TM2 | Leitura guiada e lista crua convivem, com um seletor? | Não. Quando a guiada existe, ela é a vista (TEMA-SINTESE-004). | Registrado 13/09/2026 |\n| TM3 | O enriquecimento é por idéia ou por tema? | Por `(empresa, categoria)`. O tema inteiro, não o que uma idéia disse. | Registrado 13/09/2026 |\n| TM4 | Reprocessar por flag ou por conteúdo? | Por fingerprint do conjunto de recortes (TEMA-SINTESE-006). | Registrado 13/09/2026 |\n\n---\n\n## 4. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| Origem das decisões TM1 a TM4 | Foram **lidas do código**, não de decisão registrada em conversa. Descrevem corretamente o que o sistema faz; falta confirmar que é o que se quer que ele faça. |\n| Fase 3 — Lacunas | Planejada em `Documentacao/enriquecimento-tema.md` §\"Fase 3\" e **não construída**: não há arquivo, prompt nem coluna em uso. Quando entrar, vira `TEMA-SINTESE` novo aqui, não só no plano. |\n| Categoria sem frase de introdução | TEMA-NAV-005 diz que toda categoria precisa de entrada em `DESCRICOES`, mas nada verifica. A lista vive em `js/tema.js` e o vocabulário em `taxonomia-vocabulario.ts`: as duas podem divergir em silêncio, e o sintoma é uma página muda, não um erro. |\n| Papéis | Nenhuma regra distingue papéis nesta página — quem tem vínculo ativo lê tudo. Está coerente com `IDEIA-QUADRO-003`, mas nunca foi decidido explicitamente para temas. |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-09-13 | Documento criado. `tema.html` estava no ar sem documento de regra — a única página nessa situação, junto de um rascunho na raiz. O comportamento era governado por `categorizacao-taxonomia.skill` e `enriquecimento-tema.skill`, com o plano em `Documentacao/enriquecimento-tema.md`, nenhum deles citável por ID. Registradas `TEMA-LEITURA` (6), `TEMA-ISO` (5), `TEMA-NAV` (6), `TEMA-SINTESE` (9) e `TEMA-ORIGEM` (7), os contratos das duas rotas, decisões TM1 a TM4 e quatro pendências. |\n"}]}]}</script>
<script>
(function(){
  'use strict';
  var D = JSON.parse(document.getElementById('dados').textContent);
  var nav = document.getElementById('nav');
  var alvo = document.getElementById('conteudo');
  var campo = document.getElementById('q');
  var indice = {};
  D.modulos.forEach(function(m){ m.docs.forEach(function(d){ indice[d.id] = d; }); });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var CRASE = String.fromCharCode(96);
  var reCodigo   = new RegExp(CRASE + '([^' + CRASE + ']+)' + CRASE, 'g');
  var reCerca    = new RegExp('^\\s*' + CRASE + CRASE + CRASE);
  var SEP = String.fromCharCode(1);

  function embutido(s){
    var guarda = [];
    s = String(s).replace(reCodigo, function(_, c){
      guarda.push(c);
      return SEP + (guarda.length - 1) + SEP;
    });
    var out = esc(s)
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '$1')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, t, h){
        return /^https?:/.test(h) ? '<a href="' + h + '" target="_blank" rel="noopener">' + t + '</a>' : t;
      })
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>');
    var reVolta = new RegExp(SEP + '(\\d+)' + SEP, 'g');
    return out.replace(reVolta, function(_, n){ return '<code>' + esc(guarda[+n]) + '</code>'; });
  }

  function celulas(l){
    return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){ return c.trim(); });
  }

  function render(md){
    var linhas = String(md).split(/\r?\n/), h = [], i = 0;
    while (i < linhas.length){
      var l = linhas[i];

      if (reCerca.test(l)){
        var buf = []; i++;
        while (i < linhas.length && !reCerca.test(linhas[i])) buf.push(linhas[i++]);
        i++;
        h.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^\s*\|/.test(l) && /^\s*\|[\s:|-]+\|?\s*$/.test(linhas[i + 1] || '')){
        var cab = celulas(l); i += 2;
        var corpo = [];
        while (i < linhas.length && /^\s*\|/.test(linhas[i])) corpo.push(celulas(linhas[i++]));
        h.push('<div class="rolagem"><table><thead><tr>' +
          cab.map(function(c){ return '<th>' + embutido(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          corpo.map(function(r){
            return '<tr>' + cab.map(function(_, k){ return '<td>' + embutido(r[k] || '') + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>');
        continue;
      }
      if (/^\s*>/.test(l)){
        var cit = [];
        while (i < linhas.length && /^\s*>/.test(linhas[i])) cit.push(linhas[i++].replace(/^\s*>\s?/, ''));
        h.push('<blockquote>' + render(cit.join('\n')) + '</blockquote>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(l)){
        var ul = [];
        while (i < linhas.length && /^\s*[-*+]\s+/.test(linhas[i])) ul.push(linhas[i++].replace(/^\s*[-*+]\s+/, ''));
        h.push('<ul>' + ul.map(function(x){ return '<li>' + embutido(x) + '</li>'; }).join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)){
        var ol = [];
        while (i < linhas.length && /^\s*\d+[.)]\s+/.test(linhas[i])) ol.push(linhas[i++].replace(/^\s*\d+[.)]\s+/, ''));
        h.push('<ol>' + ol.map(function(x){ return '<li>' + embutido(x) + '</li>'; }).join('') + '</ol>');
        continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ h.push('<hr>'); i++; continue; }
      var t = l.match(/^(#{1,6})\s+(.*)$/);
      if (t){ var n = t[1].length; h.push('<h' + n + '>' + embutido(t[2]) + '</h' + n + '>'); i++; continue; }
      if (l.trim() === ''){ i++; continue; }
      var p = [];
      while (i < linhas.length && linhas[i].trim() !== '' &&
             !/^\s*(#{1,6}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(linhas[i]) &&
             !reCerca.test(linhas[i])) p.push(linhas[i++]);
      h.push('<p>' + embutido(p.join(' ')) + '</p>');
    }
    return h.join('\n');
  }

  function montarNav(filtro){
    nav.innerHTML = '';
    var achou = 0;
    D.modulos.forEach(function(m){
      var docs = m.docs.filter(function(d){
        if (!filtro) return true;
        return (d.titulo + ' ' + d.nome + ' ' + m.nome + ' ' + d.md).toLowerCase().indexOf(filtro) >= 0;
      });
      if (!docs.length) return;
      achou += docs.length;
      var det = document.createElement('details');
      det.className = 'modulo';
      det.open = true;
      var sum = document.createElement('summary');
      sum.innerHTML = '<span>' + m.emoji + '</span><span>' +
        m.nome.charAt(0).toUpperCase() + m.nome.slice(1) +
        '</span><span class="cont">' + docs.length + '</span>';
      det.appendChild(sum);
      docs.forEach(function(d){
        var a = document.createElement('a');
        a.href = '#' + encodeURIComponent(d.id);
        a.textContent = d.nome;
        a.dataset.id = d.id;
        det.appendChild(a);
      });
      nav.appendChild(det);
    });
    if (!achou) nav.innerHTML = '<p class="vazio">Nada encontrado.</p>';
  }

  function selos(d){
    var s = [];
    if (d.versao) s.push('<span class="selo">v' + esc(d.versao) + '</span>');
    if (d.status){
      var cls = /implementad|verificad|conclu/i.test(d.status) ? 'ok'
              : /pend|bloquei|n[ãa]o existe|levantamento/i.test(d.status) ? 'warn' : '';
      s.push('<span class="selo ' + cls + '">' + esc(d.status) + '</span>');
    }
    if (d.pagina) s.push('<span class="selo">' + esc(d.pagina) + '</span>');
    s.push('<span class="selo">' + (d.bytes / 1024).toFixed(1) + ' KB</span>');
    s.push('<span class="selo">alterado ' + new Date(d.modificado).toLocaleDateString('pt-BR') + '</span>');
    return s.join('');
  }

  function abrir(id){
    var d = indice[id];
    if (!d) return inicio();
    alvo.innerHTML =
      '<div class="cabecalho"><h2>' + esc(d.titulo) + '</h2><div class="selos">' + selos(d) + '</div>' +
      '<div class="caminho">' + esc(d.rel) + '</div></div>' +
      '<div class="md">' + render(d.md) + '</div>' +
      '<p class="rodape">Conteúdo embutido a partir do arquivo em disco. ' +
      'Rode <code>node ferramentas/mapa-regras/gerar.mjs</code> para atualizar.</p>';
    marcar();
    [].forEach.call(nav.querySelectorAll('a'), function(a){
      a.classList.toggle('ativo', a.dataset.id === id);
    });
    document.querySelector('main').scrollTop = 0;
  }

  function inicio(){
    var nIds = 0;
    D.modulos.forEach(function(m){ m.docs.forEach(function(d){ nIds += d.ids.length; }); });
    alvo.innerHTML =
      '<div class="cabecalho"><h2>Regras de Negócio</h2><div class="selos"><span class="selo">gerado em ' +
      new Date(D.geradoEm).toLocaleString('pt-BR') + '</span></div></div>' +
      '<div class="painel">' +
        '<div class="cartao"><b>' + D.modulos.length + '</b><span>módulos</span></div>' +
        '<div class="cartao"><b>' + D.totalDocs + '</b><span>documentos</span></div>' +
        '<div class="cartao"><b>' + nIds + '</b><span>identificadores de regra</span></div>' +
        '<div class="cartao"><b>' + D.totalKB + '</b><span>KB de documentação</span></div>' +
      '</div>' +
      '<div class="md"><p>Escolha um documento na barra lateral. A busca percorre o ' +
      '<strong>texto inteiro</strong> de todas as regras, não apenas os títulos.</p>' +
      '<p>Esta página é autocontida: todo o conteúdo está embutido nela, então abre sem API e sem servidor. ' +
      'Ela não é servida pela API de propósito — a allowlist de <code>api/src/servidor.ts</code> ' +
      'mantém a documentação interna fora da web.</p></div>';
  }

  function marcar(){
    var termo = campo.value.trim();
    if (termo.length < 2) return;
    var re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    var raiz = alvo.querySelector('.md');
    if (!raiz) return;
    var it = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
    var nos = [], n;
    while ((n = it.nextNode())) if (re.test(n.nodeValue)) nos.push(n);
    nos.forEach(function(no){
      var span = document.createElement('span');
      span.innerHTML = esc(no.nodeValue).replace(re, '<mark>$1</mark>');
      no.parentNode.replaceChild(span, no);
    });
  }

  campo.addEventListener('input', function(){
    montarNav(campo.value.trim().toLowerCase());
    if (location.hash) abrir(decodeURIComponent(location.hash.slice(1)));
  });
  window.addEventListener('hashchange', function(){
    abrir(decodeURIComponent(location.hash.slice(1)));
  });

  montarNav('');
  if (location.hash) abrir(decodeURIComponent(location.hash.slice(1))); else inicio();
})();
</script>
