esmo padrão do `EMAIL_DRIVER` |\n\n**Por que EMP-CRIA-002 é por conta, não global.** Nome de empresa não é único no mundo real — duas pessoas podem legitimamente ter uma \"Nike\" cada uma na própria carteira de clientes. Travar globalmente faria a primeira pessoa a cadastrar um nome comum reservá-lo para sempre, para todo mundo.\n\n**Por que ignora acento e maiúscula.** É o que a pessoa que está digitando espera. Sem isso, \"Nike\" e \"NIKE\" seriam duas empresas diferentes na mesma lista — confusão sem nenhum ganho.\n\n**Por que a empresa arquivada não conta.** Consistente com a decisão E1 (`empresas-listagem.md` §5): arquivar tira a empresa do caminho de verdade, não é um rótulo. Se o nome continuasse reservado, arquivar não teria resolvido nada para quem quer recomeçar com o mesmo nome.\n\n**Por que EMP-CRIA-005 existe.** O `POST /empresas` não pode ficar bloqueado esperando a conta no Cloudflare R2 ser criada. O mesmo problema já apareceu com e-mail: `EMAIL_DRIVER=console` permitiu testar o cadastro inteiro antes do Resend existir. Aqui, `S3_DRIVER=none` permite testar a criação de empresa (sem logo) antes do R2 existir — e, se alguém tentar anexar um arquivo nesse meio-tempo, a resposta é honesta: \"envio de logotipo indisponível no momento\", não um 500.\n\n---\n\n## 2. Contrato da API — `POST /empresas`\n\n**Requisição.** `multipart/form-data`, autenticada pelo cookie de acesso.\n\n| Campo | Obrigatório | Regra |\n|---|---|---|\n| `nome` | Sim | EMP-CRIA-001, EMP-CRIA-002 |\n| `descricao` | Não | até 600 caracteres |\n| `logotipo` | Não | EMP-CRIA-003 |\n\n| Situação | Resposta |\n|---|---|\n| Criada | `201` com a empresa, no formato do `GET /empresas` |\n| Nome vazio ou longo demais | `400`, `campo: \"nome\"` |\n| Nome duplicado (não arquivada) | `400`, `campo: \"nome\"`, mensagem \"Você já tem uma empresa com esse nome.\" |\n| Arquivo de tipo ou tamanho inválido | `400`, `campo: \"logotipo\"` |\n| Anexou arquivo sem `S3_DRIVER` configurado | `400`, `campo: \"logotipo\"`, mensagem \"Envio de logotipo indisponível no momento.\" |\n| Sessão inválida | `401` |\n| Conta suspensa | `403` |\n\n**Ordem de validação:** nome antes do upload. Um nome duplicado não deve gastar uma chamada ao armazenamento — o arquivo só sobe depois que se sabe que a empresa vai existir.\n\n---\n\n## 3. Modelo de dados\n\nComplementa `empresas` (já criada em `empresas-listagem.md` §3):\n\n```\nempresas\n  ...campos existentes...\n  nome_busca   text (not null)   -- nome normalizado: minúsculo, sem acento\n\n  índice único parcial (criado_por, nome_busca) where arquivado_em is null\n```\n\n`nome_busca` é gravado pelo servidor a partir de `nome`, nunca recebido do cliente — evita que alguém mande um `nome_busca` que não bate com o `nome` de verdade.\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| E7 | SVG pode conter script embutido | Aceito sem sanitização por ora. Não bloqueia — relevante se um dia a plataforma exibir logotipos de uma empresa para pessoas de fora dela. | Registrada 22/08/2026, não resolvida |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-22 | Documento criado. Regras de nome duplicado e armazenamento de logotipo definidas e autorizadas. |\n"},{"id":"empresas/empresas-edicao","nome":"empresas-edicao","titulo":"Regras de Negócio — Edição de Empresa","versao":"1.0.0","status":"Regras definidas; implementação em andamento","pagina":"empresas.html","ids":["EMP-EDIT-001","EMP-CRIA-001","EMP-EDIT-002","EMP-CRIA-002","EMP-EDIT-003","EMP-CRIA-003","EMP-EDIT-004","EMP-EDIT-005","EMP-EXCL-002","EMP-EDIT-006","EMP-EXCL-005","EMP-EDIT-007","EMP-CRIA-004","EMP-CRIA-005"],"modificado":"2026-09-03T16:23:54.308Z","bytes":7784,"rel":"Regras_de_negocio/modulos/empresas/empresas-edicao.md","md":"# Regras de Negócio — Edição de Empresa\n\n> **Versão:** 1.0.0 · **Status:** Regras definidas; implementação em andamento\n> **Módulo:** Empresas · **Página:** `empresas.html` (menu do card → Editar empresa)\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`empresas-criacao.md`](empresas-criacao.md) — o modal que esta tela reaproveita, mesmos campos e mesma validação · [`empresas-exclusao.md`](empresas-exclusao.md) — de onde vem a régua de \"só o proprietário\" e o padrão de 404 antes de 403\n\n---\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Editar empresa (modal, mesmo desenho de \"Nova empresa\") |\n| Módulo | Empresas |\n| Endpoint | `PUT /empresas/:id` |\n| Entidades | `empresas` |\n| Componentes | Menu do card (kebab) → \"Editar empresa\", modal \"Nova empresa\" reaproveitada com título trocado |\n\nO menu de três pontos de cada card tem a opção **Editar empresa**, que abre o mesmo modal usado para criar — só que com nome, descrição e logotipo já preenchidos com o que está gravado, e o título trocado para \"Editar empresa\". Antes desta versão, o botão abria o modal vazio e o \"Salvar\" só fechava a modal com um aviso de sucesso falso — nada era lido nem gravado. Este documento cobre o que passa a acontecer de verdade.\n\n---\n\n## 1. Regras\n\n| ID | Regra | Fonte |\n|---|---|---|\n| EMP-EDIT-001 | Nome é obrigatório, até 120 caracteres — mesma regra de EMP-CRIA-001. | Decorre de EMP-CRIA-001 |\n| EMP-EDIT-002 | Nome duplicado é bloqueado **por conta**, ignorando maiúscula/acento — mesma regra de EMP-CRIA-002. Como é a própria linha sendo atualizada, ela nunca colide consigo mesma: só barra se OUTRA empresa ativa da mesma conta já tiver esse nome. | Decorre de EMP-CRIA-002 |\n| EMP-EDIT-003 | Descrição é opcional, até 600 caracteres — mesma regra de EMP-CRIA-003 (numeração da criação; aqui é sobre descrição, não logotipo). | Decorre de EMP-CRIA-003 |\n| EMP-EDIT-004 | Logotipo tem três estados possíveis no envio: **substituir** (veio um arquivo novo, mesma validação de formato/tamanho da criação), **remover** (campo `remover_logotipo=true`, sem arquivo) ou **manter** (nem um nem outro — o que já estava gravado continua). | Decidido 03/09/2026 |\n| EMP-EDIT-005 | Só quem tem papel **proprietário** naquela empresa pode editá-la. Membro ou designer de apoio vinculado não pode — mesma régua de EMP-EXCL-002. | Decidido 03/09/2026, por analogia a EMP-EXCL-002 |\n| EMP-EDIT-006 | Pedir edição de empresa inexistente, já arquivada, ou onde a pessoa não tem vínculo ativo devolve **404** — mesmo padrão de EMP-EXCL-005, para não revelar a quem não tem acesso se a empresa existe. | Decorre de EMP-EXCL-005 |\n| EMP-EDIT-007 | Vínculo existe, mas o papel não é proprietário: **403** com mensagem explicando o motivo. | Decorre de EMP-EXCL-002 |\n\n**Por que a validação de nome/descrição é idêntica à criação.** Não haveria razão de produto para uma empresa aceitar na criação um nome que ela recusa na edição, ou vice-versa — a mesma entidade, os mesmos campos, a mesma régua.\n\n**Por que só o proprietário edita (EMP-EDIT-005).** Nome, descrição e logotipo são a identidade da empresa para todo mundo que tem vínculo com ela — não uma preferência pessoal de quem está vendo a tela. Um designer de apoio contratado por um cliente não deveria conseguir renomear a empresa do cliente ou trocar o logotipo dela. É a mesma leitura de `empresa_membros.papel` que EMP-EXCL-002 já faz para excluir; aqui ela se estende a editar.\n\n**Por que o logotipo precisa de um sinal explícito de remoção (EMP-EDIT-004).** Sem o campo `remover_logotipo`, o servidor não teria como distinguir \"a pessoa não mexeu no logotipo\" de \"a pessoa quer tirar o logotipo que já existia\" — os dois enviam a requisição sem nenhum arquivo. Um checkbox mudo faria uma dessas duas intenções virar a outra por acidente.\n\n**Por que o arquivo antigo não é apagado do armazenamento ao substituir.** A criação (EMP-CRIA-004) já nomeia cada logotipo com um UUID novo — nunca reescreve um nome existente — então não há \"versão anterior no mesmo lugar\" para limpar. Editar segue a mesma escolha: o arquivo antigo fica órfão no S3/R2, e limpeza de arquivos órfãos é uma rotina separada (fora do escopo desta regra), não algo que o caminho de escrita precisa fazer de forma síncrona.\n\n---\n\n## 2. Contrato da API — `PUT /empresas/:id`\n\nAutorizado em 03/09/2026.\n\n**Requisição.** `multipart/form-data`, autenticada pelo cookie de acesso — mesmo formato de `POST /empresas`.\n\n| Campo | Obrigatório | Regra |\n|---|---|---|\n| `nome` | Sim | EMP-EDIT-001, EMP-EDIT-002 |\n| `descricao` | Não | até 600 caracteres |\n| `logotipo` | Não | arquivo novo — substitui o atual (EMP-EDIT-004) |\n| `remover_logotipo` | Não | `\"true\"` remove o logotipo atual sem substituir (EMP-EDIT-004); ignorado se `logotipo` também veio |\n\n| Situação | Resposta |\n|---|---|\n| Editada | `200` com a empresa, no formato do `GET /empresas` |\n| Nome vazio ou longo demais | `400`, `campo: \"nome\"` |\n| Nome duplicado (outra empresa ativa da mesma conta) | `400`, `campo: \"nome\"`, mensagem \"Você já tem uma empresa com esse nome.\" |\n| Arquivo de tipo ou tamanho inválido | `400`, `campo: \"logotipo\"` |\n| Anexou arquivo sem `S3_DRIVER` configurado | `400`, `campo: \"logotipo\"` |\n| Sessão inválida | `401` |\n| Conta suspensa | `403` com `suspensao` |\n| Vínculo existe, mas não é proprietário | `403` |\n| Não existe, já arquivada, ou sem vínculo | `404` |\n\n**Ordem de validação:** vínculo e papel antes de ler o corpo da requisição — a mesma lógica de EMP-EXCL-005/002 aplicada aqui: quem não tem acesso não deveria nem fazer o servidor processar um upload de arquivo. Depois, nome antes do logotipo, mesmo motivo de EMP-CRIA-005 — um nome inválido não deve gastar uma chamada ao armazenamento.\n\n---\n\n## 3. Estados obrigatórios\n\n| Estado | Situação | Observação |\n|---|---|---|\n| Sucesso | ✅ Card é atualizado na grade (nome, descrição, logotipo), toast confirma | Sem redesenhar a grade inteira — mesmo cuidado de `acrescentarEmpresa` em não perder menus abertos/foco de outros cards |\n| Nome inválido ou duplicado | ✅ Campo marcado, toast explica | Mesmo padrão da criação |\n| Logotipo recusado | ✅ Erro no upload, toast explica | Mesmo padrão da criação |\n| Sem permissão (não é dono) | ✅ Toast explica o motivo | EMP-EDIT-005 |\n| Não encontrada / sem vínculo | ✅ Toast genérico, sem revelar existência | EMP-EDIT-006 |\n| Sessão expirada | ✅ Toast, sem redirecionar sozinho | Mesmo padrão da criação/exclusão |\n| Conta suspensa | ✅ Toast com o motivo | — |\n| Falha de rede | ✅ Toast de erro de conexão | `e.rede`, mesmo padrão das outras chamadas de `js/api.js` |\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| Y1 | Quem pode editar? | Só o papel proprietário — mesma régua de X2 (empresas-exclusao.md) | 03/09/2026 |\n| Y2 | Como o cliente sinaliza \"tirar o logotipo\" sem enviar um novo? | Campo explícito `remover_logotipo=true` no multipart, em vez de inferir pela ausência de arquivo | 03/09/2026 |\n| Y3 | O arquivo antigo é apagado do armazenamento ao trocar o logotipo? | Não — mesma escolha de não limpar da criação (nomes são UUID, nunca reescritos) | 03/09/2026 |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-09-03 | Documento criado. Regras EMP-EDIT-001 a 007, contrato de `PUT /empresas/:id` e decisões Y1-Y3 registradas junto da implementação — o botão \"Editar empresa\" já existia na interface (desenhado, sem função real por trás) antes deste documento. |\n"},{"id":"empresas/empresas-exclusao","nome":"empresas-exclusao","titulo":"Regras de Negócio — Exclusão de Empresa","versao":"1.0.0","status":"Regras definidas; implementação em andamento","pagina":"empresas.html","ids":["EMP-EXCL-001","EMP-LIST-011","EMP-EXCL-002","EMP-EXCL-003","EMP-EXCL-004","EMP-CRIA-002","EMP-EXCL-005","EMP-LIST-003"],"modificado":"2026-08-23T00:47:37.902Z","bytes":5450,"rel":"Regras_de_negocio/modulos/empresas/empresas-exclusao.md","md":"# Regras de Negócio — Exclusão de Empresa\n\n> **Versão:** 1.0.0 · **Status:** Regras definidas; implementação em andamento\n> **Módulo:** Empresas · **Página:** `empresas.html` (menu do card → Excluir)\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`empresas-listagem.md`](empresas-listagem.md) — de onde vem a decisão E1, reaproveitada aqui · [`empresas-criacao.md`](empresas-criacao.md) — o modal que cria o que esta tela apaga\n\n---\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Excluir empresa (modal de confirmação) |\n| Módulo | Empresas |\n| Endpoint | `DELETE /empresas/:id` |\n| Entidades | `empresas`, `empresa_membros` |\n| Componentes | Menu do card (kebab), Modal \"Excluir empresa\" |\n\nO menu de três pontos de cada card tem a opção **Excluir**, que abre um modal de confirmação já desenhado e aprovado. Este documento cobre o que acontece quando a pessoa confirma.\n\n---\n\n## 1. Regras\n\n| ID | Regra | Fonte |\n|---|---|---|\n| EMP-EXCL-001 | Excluir **arquiva** a empresa (`arquivado_em = now()`), não apaga a linha do banco. Mesmo mecanismo da decisão **E1** (`empresas-listagem.md` EMP-LIST-011). | Decidido 22/08/2026 com o Ricardo |\n| EMP-EXCL-002 | Só quem tem papel **proprietário** naquela empresa pode excluí-la. Membro ou designer de apoio vinculado não pode. | Decidido 22/08/2026 com o Ricardo |\n| EMP-EXCL-003 | Empresa arquivada some da listagem de todo mundo que tinha vínculo com ela (efeito já implementado por EMP-LIST-011 — nenhuma mudança na consulta do `GET /empresas` foi necessária). | Decorre de EMP-LIST-011 |\n| EMP-EXCL-004 | O nome da empresa excluída fica livre para reuso na mesma conta (já implementado por EMP-CRIA-002 — nenhuma mudança foi necessária). | Decorre de EMP-CRIA-002 |\n| EMP-EXCL-005 | Pedir exclusão de empresa inexistente, já arquivada, ou onde a pessoa não tem vínculo ativo devolve **404** — a mesma resposta nos três casos, para não revelar a quem não tem acesso se a empresa existe. | Decidido 22/08/2026 |\n\n**Por que arquivar, e não `DELETE` de verdade.** O texto do modal aprovado diz \"esta ação não pode ser desfeita\" — o que descreve a experiência da pessoa (o card some, sem opção de desfazer na interface), não precisa descrever o que acontece no banco. Arquivar já é o mecanismo que este projeto usa para \"isso acabou\" (E1): reaproveitá-lo evita dois caminhos fazendo a mesma coisa de formas diferentes, e mantém a porta aberta para o dia em que a empresa tiver projetos e outros dados vinculados — apagar de verdade nesse momento exigiria decidir o que fazer com eles, decisão que não precisa ser tomada agora.\n\n**Por que só o proprietário.** Um designer de apoio contratado por uma empresa não deveria conseguir apagar a empresa do cliente. É a mesma lógica de papéis que já existe em `empresa_membros.papel` — esta é a primeira regra que efetivamente lê esse campo para decidir permissão, não só para exibir.\n\n**Por que 404 e não 403 para quem não tem vínculo nenhum.** Devolver 403 (\"proibido\") para uma pessoa sem vínculo revelaria que o `id` corresponde a uma empresa real. 404 é a mesma resposta de \"não existe\" — quem não tem vínculo não aprende nada sobre o que existe no banco. Só quem **tem** vínculo mas não é proprietário recebe 403, porque nesse caso a existência já era conhecida por essa pessoa (ela vê o card na própria listagem).\n\n---\n\n## 2. Contrato da API — `DELETE /empresas/:id`\n\nAutorizado em 22/08/2026.\n\n**Requisição.** `DELETE /empresas/:id`, autenticada pelo cookie de acesso. Sem corpo.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Excluída | `200` com `{ ok: true }` | Remove o card da grade; se era o último, volta ao estado vazio |\n| Sessão inválida | `401` | Mostra a mensagem no toast — mesmo padrão do `POST /empresas`, sem tentar renovar sozinho (`empresas-listagem.md` §2) |\n| Conta suspensa | `403` com `suspensao` | Mostra a mensagem no toast |\n| Vínculo existe, mas não é proprietário | `403` | Mostra \"Só o proprietário pode excluir a empresa.\" no toast |\n| Não existe, já arquivada, ou sem vínculo | `404` | Mostra \"Empresa não encontrada.\" no toast |\n\nO botão de confirmação trava enquanto a API responde, mesmo padrão do botão \"Salvar\" do modal de criação.\n\n---\n\n## 3. Estados obrigatórios\n\n| Estado | Situação | Observação |\n|---|---|---|\n| Sucesso | ✅ Card sai da grade, toast confirma | Se era o último card, a tela volta ao estado vazio (EMP-LIST-003) |\n| Sem permissão (não é dono) | ✅ Toast explica o motivo | EMP-EXCL-002 |\n| Não encontrada / sem vínculo | ✅ Toast genérico, sem revelar existência | EMP-EXCL-005 |\n| Sessão expirada | ✅ Toast, sem redirecionar sozinho | Mesmo padrão da criação |\n| Conta suspensa | ✅ Toast com o motivo | — |\n| Falha de rede | ✅ Toast de erro de conexão | `e.rede`, mesmo padrão das outras chamadas de `js/api.js` |\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| X1 | Excluir apaga a linha ou arquiva? | Arquiva — reaproveita E1 | 22/08/2026 |\n| X2 | Quem pode excluir? | Só o papel proprietário | 22/08/2026 |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-22 | Documento criado. Regras EMP-EXCL-001 a 005, contrato de `DELETE /empresas/:id` e decisões X1/X2 registradas antes da implementação. |\n"},{"id":"empresas/empresas-listagem","nome":"empresas-listagem","titulo":"Regras de Negócio — Listagem de Empresas","versao":"2.2.0","status":"Tela funcional sobre o layout aprovado","pagina":"empresas.html","ids":["ACS-LOGIN-017","EMP-LIST","EMP-LIST-001","EMP-LIST-002","EMP-LIST-003","EMP-LIST-004","EMP-LIST-005","EMP-LIST-006","EMP-LIST-007","EMP-LIST-008","EMP-LIST-012","EMP-LIST-009","EMP-LIST-010","EMP-LIST-011","ACS-LOGIN-012","ACS-SESSAO-001","ACS-LOGIN-016"],"modificado":"2026-08-22T22:49:07.209Z","bytes":22698,"rel":"Regras_de_negocio/modulos/empresas/empresas-listagem.md","md":"# Regras de Negócio — Listagem de Empresas\n\n> **Versão:** 2.2.0 · **Status:** Tela funcional sobre o layout aprovado · **Falta rodar a migração**\n> **Módulo:** Empresas · **Página:** `empresas.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`../acesso/login.md`](../acesso/login.md) — identidade, vínculos e cascata de roteamento\n\n---\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Minhas Empresas |\n| Módulo | Empresas |\n| Rota | `/empresas.html` |\n| Arquivo de interface | `empresas.html` |\n| Arquivo de comportamento | `js/empresas.js` (estado) + embutido *(dívida — ver §8)* |\n| Arquivo de regras | `Regras_de_negocio/modulos/empresas/empresas-listagem.md` *(este documento)* |\n| Entidades | `empresas`, `empresa_membros`, `users`, `perfil_especialista` |\n| Componentes | Rail, Cabeçalho de página, Card de empresa, Estado vazio, Modal de criação, Painel de perfil, Toast |\n| Páginas relacionadas | `criar-empresa.html`, `projetos.html`, `login.html` |\n\n**É a página principal da plataforma.** Desde a `ACS-LOGIN-017` (22/08/2026), a cascata de roteamento deposita aqui **todo mundo que entra** — com vínculo ou sem nenhum, proprietário ou especialista. Não é mais \"a tela de quem já tem empresa\": é a porta de entrada do produto, e o estado vazio é a primeira coisa que uma conta nova vê.\n\n---\n\n## 1. Regras\n\n### 1.1 O que a listagem mostra — `EMP-LIST`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| EMP-LIST-001 | A listagem mostra, na mesma tela, as empresas que a pessoa **possui** e aquelas em que foi **contratada**. | `login.md` §2.1 (D1) e §4 |\n| EMP-LIST-002 | Cada card indica o papel da pessoa naquela empresa. | **[PROPOSTA]** — decorre de EMP-LIST-001 |\n| EMP-LIST-003 | Sem nenhuma empresa, a tela mostra o estado vazio em vez de uma grade em branco. | Interface existente |\n| EMP-LIST-004 | Criar empresa usa **sempre o modal**, tanto no estado vazio quanto na listagem. O botão do estado vazio diz *Nova empresa*. | Layout aprovado |\n| EMP-LIST-005 | Quem ativou perfil de designer de apoio e ainda não foi contratado vê uma variante própria do estado vazio. | Decidido 22/08/2026 |\n| EMP-LIST-006 | Abrir uma empresa leva aos projetos dela. | Interface existente |\n| EMP-LIST-007 | A listagem é o destino de **todo** login bem-sucedido de não-administrador, inclusive de quem não tem vínculo nenhum. Não existe rota alternativa para \"conta nova\". | `login.md` ACS-LOGIN-017 |\n\n### 1.2 De onde vem a resposta \"você não tem empresa\" — `EMP-LIST-008` a `EMP-LIST-012`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| EMP-LIST-008 | **Conta nova nasce sem empresa.** O cadastro não cria empresa alguma — nem implícita, nem \"pessoal\", nem de exemplo. Toda conta recém-criada tem zero linhas em `empresa_membros` e, portanto, vê o estado vazio no primeiro acesso. | Decidido 22/08/2026 |\n| EMP-LIST-009 | A listagem **não tem dados próprios**. Ela pergunta `GET /empresas` e obedece à resposta. Nenhum dado de exemplo permanece no código da página. | Decidido 22/08/2026 |\n| EMP-LIST-010 | **Vazio, carregando e erro são três coisas diferentes.** Uma lista vazia só pode ser afirmada depois de uma resposta `200` com zero itens. Falha de rede, `500` ou timeout **nunca** viram estado vazio. | Decidido 22/08/2026 |\n| EMP-LIST-011 | Empresa **arquivada não aparece** na listagem e não conta para decidir se a lista está vazia. Se todas as empresas da pessoa estiverem arquivadas, ela vê o estado vazio. | Decisão **E1**, resolvida 22/08/2026 |\n| EMP-LIST-012 | A variante de especialista do estado vazio aparece quando `perfil_especialista.status` for **`em_analise`** ou **`aprovado`**. Perfil em `rascunho` ou `recusado` vê a variante de proprietário. | Decisão **E4**, resolvida 22/08/2026 |\n\n**Por que EMP-LIST-010 merece uma regra própria.** É o defeito mais comum de tela de listagem: a página falha em carregar e, como não tem nada para desenhar, cai no estado vazio. A pessoa lê *\"você ainda não tem nenhuma empresa\"* — uma **afirmação falsa sobre os dados dela**, dita com toda a confiança, no momento em que ela mais precisa de informação correta. Quem tem cinco empresas e vê essa tela conclui que perdeu tudo. A regra existe para que ausência de resposta nunca seja confundida com resposta negativa.\n\n**Por que EMP-LIST-008 é regra e não obviedade.** É a tentação clássica: criar uma \"empresa pessoal\" automática no cadastro para que a listagem nunca nasça vazia. Isso pareceria acolhedor e violaria o princípio **\"Ensinar antes de executar\"** — a pessoa ganharia uma empresa sem entender o que uma empresa é aqui dentro, e a tela que deveria ensinar isso (`criar-empresa.html`, EMP-LIST-004) nunca seria vista. O estado vazio não é uma falha a ser evitada; é a primeira aula.\n\n**Por que EMP-LIST-011 sai assim.** Arquivar existe para tirar da frente o que acabou. Se a empresa arquivada continuasse ocupando a listagem, arquivar não resolveria nada — seria só um rótulo. A consequência aceita é que uma pessoa com histórico pode voltar a ver a tela de \"primeira empresa\"; o texto do estado vazio precisa funcionar para ela também, e por isso não pode dizer *\"bem-vindo à plataforma\"*.\n\n**Por que EMP-LIST-012 corta em `em_analise`.** Quem apenas abriu o formulário de especialista e desistiu no meio (`rascunho`) não está esperando convite nenhum — dizer \"aguarde contratações\" seria prometer algo que não vai acontecer, porque o perfil nunca foi enviado. E quem foi recusado precisa saber disso, não ficar aguardando em silêncio. **Fica registrado como pendência**: o `status = recusado` cai hoje na variante de proprietário, que não menciona a recusa. Isso é aceitável enquanto o módulo de designer de apoio não existe, mas é uma dívida de honestidade — está na §7 como **E5**.\n\n### 1.3 Uma forma de criar — `EMP-LIST-004`\n\nO botão do estado vazio e o do cabeçalho abrem o **mesmo modal**, e o texto é *Nova empresa* nos dois. É o que o layout aprovado determina.\n\n**Registro de um erro meu.** A versão 1.0.0 deste documento dizia que criar com zero empresas usaria o fluxo completo (`criar-empresa.html`) e que o botão diria *Criar primeira empresa* — com uma justificativa inteira sobre \"ensinar antes de executar\". Aquilo não veio do desenho: foi eu propondo e registrando como se fosse decisão tomada, e depois alterando o HTML aprovado para casar com a regra que eu mesmo tinha escrito. A regra agora descreve a tela, que é a ordem correta.\n\n### 1.4 O designer de apoio sem convite — `EMP-LIST-005`\n\nQuem se oferece como designer de apoio e ainda não foi contratado tem **zero vínculos** — então a lista vem vazia e o estado vazio aparece, sem precisar de regra nenhuma a mais. Confirmado com o Ricardo em 22/08/2026: **é o mesmo estado vazio**, não uma variante.\n\n**Registro de outro erro meu.** Eu tinha criado uma segunda seção na tela — *\"Nenhum convite por enquanto\"*, com botão *Completar meu perfil* — que não existe no layout aprovado. Foi removida. Se um dia essa distinção valer a pena, ela começa no desenho, não aqui.\n\n---\n\n## 2. Contrato da API — `GET /empresas`\n\nAutorizado em 22/08/2026. É o primeiro endpoint do módulo de empresas.\n\n**Requisição.** `GET /empresas`, autenticada pelo cookie de acesso (`credentials: 'include'`, como todo o resto da `js/api.js`). Sem parâmetros.\n\n**Resposta `200`:**\n\n```json\n{\n  \"empresas\": [\n    {\n      \"id\": \"uuid\",\n      \"nome\": \"Nike\",\n      \"descricao\": \"…\",\n      \"logotipo_url\": \"…ou null\",\n      \"papel\": \"proprietario | membro | especialista\",\n      \"criado_em\": \"2026-08-22T14:03:11Z\"\n    }\n  ]\n}\n```\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Tem empresas | `200` com `empresas` preenchido | Grade de cards |\n| Não tem nenhuma | `200` com `\"empresas\": []` | Estado vazio, variante conforme EMP-LIST-012 |\n| Sessão inválida ou expirada | `401` | **Primeiro tenta renovar** por `GET /auth/sessao`; só se a renovação também falhar volta ao login com `?motivo=sessao-expirada&destino=empresas.html` |\n| Conta suspensa | `403` | Volta ao login com `?motivo=suspenso&tipo=violacao\\|inadimplencia` — quem explica é o login (ACS-LOGIN-012) |\n| Falha do servidor | `5xx` | Estado de erro com \"Tentar de novo\". **Nunca** o estado vazio (EMP-LIST-010) |\n\n### `POST /empresas` — criação\n\nAutorizado em 22/08/2026. Corpo `{ nome, descricao }`; responde `201` com a empresa criada, no mesmo formato dos itens do `GET`.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Criada | `201` com `empresa` | Insere o card na grade e sai do estado vazio |\n| Nome vazio ou longo demais | `400` com `campo: \"nome\"` | Marca o campo e mostra a mensagem |\n| Sessão inválida | `401` | Volta ao login |\n| Conta suspensa | `403` | Volta ao login |\n\n**A empresa e o vínculo nascem na mesma transação.** Sem isso, uma falha entre os dois `INSERT` deixaria uma empresa sem dono: invisível na listagem de todo mundo, inclusive de quem acabou de criá-la, e impossível de apagar pela interface.\n\n**O botão trava enquanto a API responde**, senão dois cliques criam duas empresas.\n\n**Por que o 401 não expulsa direto.** O token de acesso vive 15 minutos (ACS-SESSAO-001), então `401` é o caso **normal** de quem deixou a aba aberta — não o caso excepcional. Expulsar para o login em todo `401` mandaria a pessoa reautenticar a cada quinze minutos com a sessão ainda válida. Quem sabe girar o refresh é o `/auth/sessao`; a listagem chama, e só desiste se ele também recusar.\n\n**Por que o `/empresas` não renova sozinho.** Seria mais curto, e erraria: na carga da página duas rotas emitiriam cookies novos em paralelo e uma rotação de refresh anularia a outra — derrubando exatamente a sessão que ambas tentavam salvar. A renovação tem um dono só.\n\n**Nota sobre o primeiro deploy.** Enquanto não existir `POST /api/empresas`, este endpoint devolve `[]` para todo mundo — e isso é **verdade**, não simulação: ninguém consegue criar empresa ainda. É a diferença entre esta tela e o login antes da Fase 4. O login *fingia* validar; esta listagem vai *de fato* consultar o banco e relatar o que encontrou. A tela pode ir ao ar sem mentir.\n\n---\n\n## 3. Modelo de dados proposto\n\nComplementa o §2.5 do [`login.md`](../acesso/login.md), que já previa `empresa_membros` mas não definia `empresas`.\n\n```\nempresas\n  id                uuid (pk)\n  nome              text (not null)\n  descricao         text (nullable)\n  logotipo_url      text (nullable)\n  fonte             text (nullable)     -- identidade visual, ver EMP-LIST-004\n  cor               text (nullable)\n  criado_por        uuid (fk users)\n  arquivado_em      timestamptz (nullable)   -- EMP-LIST-011\n  criado_em, atualizado_em\n\nempresa_membros                -- vínculo N:N entre users e empresas\n  id                uuid (pk)\n  empresa_id        uuid (fk empresas)\n  user_id           uuid (fk users)\n  papel             enum('proprietario','membro','especialista')\n  convidado_por     uuid (fk users, nullable)\n  expira_em         timestamptz (nullable)   -- contrato com prazo\n  criado_em, revogado_em\n\n  unique (empresa_id, user_id) where revogado_em is null\n```\n\n**A consulta que decide o estado vazio:**\n\n```sql\nselect e.*, m.papel\n  from empresa_membros m\n  join empresas e on e.id = m.empresa_id\n where m.user_id = $1\n   and m.revogado_em is null        -- vínculo ativo\n   and (m.expira_em is null or m.expira_em > now())   -- contrato vigente\n   and e.arquivado_em is null       -- EMP-LIST-011\n order by e.criado_em desc;\n```\n\nZero linhas ⇒ estado vazio. Três filtros, três razões distintas de a empresa não contar: **o vínculo foi revogado**, **o contrato venceu**, **a empresa foi arquivada**. As três levam à mesma tela, e é por isso que a mensagem do estado vazio não pode presumir que a pessoa é novata.\n\n**Fica em aberto:** o índice único parcial acima impede vínculo duplicado ativo, mas permite recontratar depois de revogar. É o comportamento desejado para o especialista que volta a trabalhar com o mesmo cliente.\n\n---\n\n## 4. Estados obrigatórios\n\n| Estado | Situação | Observação |\n|---|---|---|\n| Primeiro acesso | ✅ **É o estado vazio** | Conta nova cai aqui, sem tela intermediária — EMP-LIST-007, EMP-LIST-008 |\n| Vazio | ✅ Duas variantes: proprietário e especialista | EMP-LIST-003, EMP-LIST-005, EMP-LIST-012 |\n| Carregando | ✅ Esqueleto de três cards | Ocupa o lugar dos cards, então a página não salta. Nunca vira vazio — EMP-LIST-010 |\n| Sucesso | ✅ Toast ao criar e ao editar | — |\n| Erro | ✅ `#estadoErro` com \"Tentar de novo\" | `5xx` e falha de rede. Mensagem distinta para os dois |\n| Sem permissão | ✅ `403` → login com `?motivo=suspenso&tipo=` | O login explica motivo e saída |\n| Arquivado | ✅ Filtro no servidor | `empresa: { arquivadoEm: null }` na consulta — EMP-LIST-011 |\n| Offline | ✅ Tratado como erro de rede | `e.rede` produz mensagem própria sobre conexão |\n| Sessão expirada | ✅ Renova antes de desistir | `401` → `/auth/sessao`; falhando, login com `?motivo=sessao-expirada&destino=` |\n| Integração indisponível | **Não se aplica** | A listagem não depende de provedor externo. Justificado |\n\n**Nove dos dez resolvidos**, um justificado. Todos verificados em `t-empresas.js` (9 cenários, incluindo o que garante que `500` não vira estado vazio). Antes desta versão eram três resolvidos e **sete sem regra nenhuma** — não porque faltava esforço, mas porque sem contrato de API não havia o que decidir. Definir o contrato na §2 desbloqueou seis estados de uma vez.\n\n---\n\n## 5. Como inspecionar os estados\n\nOs botões flutuantes de debug saíram da tela em 22/08/2026. No lugar entrou parâmetro de URL, o mesmo padrão do `?motivo=` no login:\n\n| URL | Mostra |\n|---|---|\n| `empresas.html?estado=vazio` | Estado vazio, variante proprietário |\n| `empresas.html?estado=especialista` | Estado vazio, variante especialista |\n| `empresas.html?estado=lista` | Listagem com dados de exemplo |\n| `empresas.html` | **Passa a consultar a API** (EMP-LIST-009) |\n\nAndaime visível na interface acaba indo para produção. Parâmetro de URL some sozinho.\n\n**Muda com a implementação:** hoje `empresas.html` sem parâmetro cai nos dados de exemplo. Depois de EMP-LIST-009, sem parâmetro significa \"pergunte à API\". O `?estado=lista` continua útil para inspecionar o layout da grade sem depender de dados reais — mas passa a ser explicitamente andaime, e os dados de exemplo saem do fluxo normal da página.\n\n---\n\n## 6. O que mudou nesta etapa\n\n| Antes | Depois | Regra |\n|---|---|---|\n| A página decidia pelo array `EMPRESAS` no código | Decide pela resposta do `GET /empresas` | EMP-LIST-009 |\n| Erro de carregamento cairia no estado vazio | Erro tem tela própria | EMP-LIST-010 |\n| E1 em aberto | Arquivada some da lista | EMP-LIST-011 |\n| \"Ativou perfil de designer de apoio\" sem definição | `status ∈ {em_analise, aprovado}` | EMP-LIST-012 |\n| `empresas` não existia no modelo de dados | Tabela especificada e autorizada | §3 |\n\n---\n\n## 7. Decisões\n\n### Resolvidas\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| E1 | Empresa arquivada some da lista? | Some, e não conta para o estado vazio | 22/08/2026 |\n| E3 | Fonte da verdade do \"sem empresas\" | API real, não o `vinculos` da sessão | 22/08/2026 |\n| E4 | Qual status de especialista dispara a variante | `em_analise` ou `aprovado` | 22/08/2026 |\n\n**Sobre E3.** A alternativa era ler o `vinculos` que `/auth/sessao` já devolve — zero backend novo. Recusada porque criaria dois lugares afirmando o mesmo fato: a sessão, capturada no login, e a listagem, viva. Bastaria um convite aceito em outra aba para os dois discordarem, e o sintoma seria a tela dizer \"você não tem empresa\" com uma empresa no banco. É a mesma doença que a auditoria de agosto tratou no CSS e a D6 tratou na documentação, agora em dados.\n\nO campo `vinculos` da sessão **continua existindo** e continua servindo à `ACS-LOGIN-016` (decidir se um destino pretendido deve ser retomado). São perguntas diferentes: *\"vale a pena retomar o destino?\"* tolera uma resposta aproximada de um segundo atrás; *\"você tem empresas?\"* não.\n\n### Em aberto\n\n**E2 — Créditos por empresa** *(herda a D2 de `login.md`)*\nA listagem é o lugar natural para mostrar saldo por empresa, se a D2 for resolvida nesse sentido. Enquanto os créditos viverem no perfil do usuário, não há o que mostrar aqui.\n\n**E5 — O designer de apoio recusado não é avisado**\nPor EMP-LIST-012, `status = recusado` cai na variante de proprietário, que não menciona a recusa. A pessoa fica sem saber que foi avaliada. Precisa de tratamento quando o módulo de perfil de designer de apoio existir — provavelmente uma terceira variante, ou um aviso fora do estado vazio.\n\n**E6 — Limite de empresas por conta**\nNenhuma regra impede criar cem empresas, e o `POST /empresas` foi ao ar **sem limite**. Se a D2 for resolvida como \"créditos por empresa\", isso vira vetor de abuso direto: cada empresa nova seria uma cota nova de IA gratuita. Não impede usar hoje; **bloqueia a publicação** se a D2 sair nesse sentido.\n\n---\n\n## 7-A. Lacunas de desenho\n\nNão são dívida técnica: são telas que **não existem no layout aprovado** e que a programação teve que contornar. Contornar não é resolver.\n\n| Estado | Contorno de hoje | O que falta |\n|---|---|---|\n| Carregando | Grade vazia, em silêncio | Um esqueleto ou indicador desenhado |\n| Erro ao carregar | Toast pedindo para recarregar | Uma tela com \"Tentar de novo\" — o toast não oferece ação |\n\nAmbos eu havia desenhado em 22/08/2026, e **removi** quando ficou claro que o layout aprovado é a fonte da verdade. Entram quando forem desenhados.\n\n**Observação sobre o link \"Acessar\" do card:** nasce sublinhado, porque esta página não carrega `components.css` nem tem reset de âncora. Está assim no layout aprovado — registro, não corrijo por conta própria.\n\n---\n\n## 8. Dívida técnica\n\n**948 linhas de CSS embutido** — a maior do projeto, acima das 477 que o cadastro tinha. A página não carrega `components.css`, então repete o que já existe no sistema e diverge dele em silêncio.\n\nO sintoma apareceu na hora: os links do estado vazio nasceram **sublinhados**, porque faltava o reset de âncora. É a terceira vez que esse mesmo defeito aparece — antes no `cadastro.html`, e agora aqui. Verificado: **as oito telas do app têm a mesma falta**.\n\n| Tela | Reset de âncora |\n|---|---|\n| `empresas.html` | ✅ corrigido em 22/08/2026 |\n| `criar-empresa.html`, `projetos.html`, `visao_do_projeto.html`, `pesquisa.html`, `matriz_csd.html`, `atividade.html`, `Sobre_a_empresa.html` | ✗ ainda sem |\n\nA correção definitiva não é acrescentar a linha em cada arquivo — é cada tela passar a carregar `components.css`, como `login.html` e `cadastro.html` já fazem. Enquanto isso não acontece, `.empty-alternativa a` reproduz localmente o `.link` do sistema, com comentário registrando que é dívida e não decisão.\n\n**Comportamento embutido no HTML.** A página ainda não tem `js/empresas.js`. A implementação de EMP-LIST-009 é o momento certo de extrair, como foi feito com `js/cadastro.js`: o código que fala com a API não deve nascer dentro de uma tag `\u003cscript>` de 2.100 linhas.\n\n---\n\n## 9. Ordem de implementação\n\nEscrita aqui porque a ordem importa: invertida, ela recria o teatro que o login teve.\n\n| # | Passo | Situação |\n|---|---|---|\n| 1 | Migração: tabelas `empresas` e `empresa_membros` | ✅ escrita — `20260822120000_empresas`. **Falta rodar** `npx prisma migrate deploy` |\n| 2 | `GET /empresas` devolvendo a consulta da §3 | ✅ `api/src/rotas/empresas.ts` |\n| 3 | Extrair `js/empresas.js` e ligar na API | ✅ o array de exemplo saiu do caminho normal |\n| 4 | Estados carregando / erro / offline / 401 / 403 | ✅ nove dos dez estados |\n| 5 | Testes de integração | ✅ `t-empresas.js`, 9 cenários |\n| 6 | `POST /empresas` — criar de verdade | ✅ grava empresa + vínculo em transação. **Sem limite por conta** — E6 segue aberta |\n| 7 | Botões flutuantes de debug fora da tela | ✅ removidos com autorização, 22/08/2026 |\n\nA tela está funcional de ponta a ponta: entra vazia, cria, o card aparece e continua lá depois de recarregar. Falta apenas a migração rodar no banco.\n\n---\n\n## 10. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 2.2.0 | 2026-08-22 | **Alinhamento com o layout aprovado.** EMP-LIST-004 reescrita: o estado vazio abre o **modal**, botão *Nova empresa* — como sempre esteve desenhado. A regra anterior descrevia uma proposta minha, e eu havia alterado o HTML aprovado para casar com ela. EMP-LIST-005 perdeu a variante inventada: designer de apoio sem convite tem zero vínculos e cai no mesmo estado vazio. *Especialista* renomeado para *designer de apoio*. `POST /empresas` implementado, gravando empresa e vínculo em transação. Botões flutuantes de debug removidos, com autorização. Nova §7-A separando lacuna de **desenho** de dívida técnica. |\n| 2.1.0 | 2026-08-22 | **Regras implementadas.** Migração `empresas` + `empresa_membros`, endpoint `GET /empresas`, e `js/empresas.js` extraído da página. O array de exemplo com a Nike saiu do caminho normal — era ele que fazia toda conta nova ver uma empresa que não era dela. `vinculos` no `/auth/sessao` deixou de ser `0` cravado. Nove dos dez estados obrigatórios resolvidos. Caminho do endpoint corrigido de `/api/empresas` para `/empresas`, que é a convenção real da API. |\n| 2.0.0 | 2026-08-22 | Regras do estado vazio fechadas. Acrescentadas EMP-LIST-008 a 012: conta nova nasce sem empresa, a listagem passa a consultar `GET /empresas` em vez do array de exemplo, vazio deixa de poder ser confundido com erro, empresa arquivada não conta, e a variante de especialista ganha condição precisa. Contrato da API e modelo de dados de `empresas` especificados e autorizados. Seis dos dez estados obrigatórios saíram de \"pendente sem regra\" para \"regra escrita\". E1, E3 e E4 resolvidas; E5 e E6 abertas. |\n| 1.1.0 | 2026-08-22 | A página virou destino único do login (ACS-LOGIN-017). Acrescentada EMP-LIST-007. Estado \"Primeiro acesso\" deixou de ser *não se aplica* e passou a ser o próprio estado vazio. |\n| 1.0.0 | 2026-08-22 | Documento criado. Estado vazio ganhou variante para especialista sem convite e passou a levar ao fluxo completo de criação. Andaimes de debug substituídos por parâmetro de URL. Reset de âncora corrigido. Abertas as decisões E1 e E2. |\n"},{"id":"empresas/sobre-empresa","nome":"sobre-empresa","titulo":"Regras de Negócio — Sobre a Empresa","versao":"1.2.0","status":"Implementado","pagina":"Sobre_a_empresa.html","ids":["SOBRE-ORIGEM","IA-CONHEC","SOBRE-PASTAS","SOBRE-PASTAS-001","SOBRE-PASTAS-002","SOBRE-PASTAS-003","SOBRE-PASTAS-004","TEMA-NAV-001","SOBRE-FALTA","SOBRE-FALTA-001","SOBRE-FALTA-002","SOBRE-FALTA-003","SOBRE-FALTA-005","SOBRE-FALTA-004","SOBRE-GRAFO","SOBRE-GRAFO-001","SOBRE-GRAFO-002","SOBRE-GRAFO-003","SOBRE-GRAFO-004","SOBRE-GRAFO-005","SOBRE-GRAFO-007","IA-CONHEC-002","SOBRE-GRAFO-006","EMP-LIST-010","IDEIA-QUADRO-008","SOBRE-PAINEL","SOBRE-PAINEL-001","SOBRE-PAINEL-002","SOBRE-PAINEL-003","IDEIA-TAX-006","IDEIA-TAX","SOBRE-PAINEL-004","SOBRE-CICLO","SOBRE-CICLO-001","SOBRE-CICLO-002","SOBRE-CICLO-003","SOBRE-CICLO-004","SOBRE-CICLO-005","SOBRE-CICLO-006","SOBRE-CICLO-007","SOBRE-CICLO-008","PROJ-LIST-008","SOBRE-REPARO","SOBRE-REPARO-001","SOBRE-REPARO-002","SOBRE-REPARO-003","SOBRE-REPARO-004","IDEIA-MOV-004","SOBRE-REPARO-005","IA-CUSTO","SOBRE-REPARO-006","SOBRE-ORIGEM-001","BOARD-PESQUISA-013","SOBRE-ORIGEM-002","TEMA-ISO-001","BOARD-PESQUISA-015","SOBRE-ORIGEM-003","IA-CONHEC-004","IA-CONHEC-009","SOBRE-ORIGEM-004"],"modificado":"2026-09-17T18:44:03.071Z","bytes":23534,"rel":"Regras_de_negocio/modulos/empresas/sobre-empresa.md","md":"# Regras de Negócio — Sobre a Empresa\n\n> **Versão:** 1.2.0 · **Status:** Implementado · `SOBRE-ORIGEM` **planejada, não construída** (`planejamento-pesquisa-v2.md`)\n> **Conferido em:** 13/09/2026, contra `Sobre_a_empresa.html`, `js/sobre-empresa.js`, `js/sobre-empresa-semana2.js`, `js/grafo.js`, `js/grafo-painel.js` e `api/src/rotas/grafo.ts`\n> **Módulo:** Empresas · **Página:** `Sobre_a_empresa.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`../temas/temas-pagina.md`](../temas/temas-pagina.md) — a página de um tema, para onde cada pasta leva · [`../ideias/ideias-taxonomia.md`](../ideias/ideias-taxonomia.md) — de onde vêm pastas e recortes · [`../ia/ia-pacote-contexto.md`](../ia/ia-pacote-contexto.md) — o botão \"Gerar prompt\", a única parte desta tela que já tinha regra · [`../atividades/board-lista.md`](../atividades/board-lista.md) — a investigação do board, que passa a ler este conhecimento antes de ir à web · [`../ia/ia-assistente-conhecimento.md`](../ia/ia-assistente-conhecimento.md) — a régua de `IA-CONHEC`, que vale também aqui\n\n---\n\nA página estava no ar sem documento próprio. `ia-pacote-contexto.md` cobria um botão; o resto — as pastas, o grafo, a atualização em ciclo e a operação de reparo — não tinha regra nenhuma. O cabeçalho de `js/sobre-empresa.js` dizia isso em voz alta: *\"Não é a implementação do módulo 'Sobre a empresa', que ainda não tem regra de negócio escrita.\"*\n\nFicou no módulo **Empresas** porque a tela é sobre **uma empresa** e se chega a ela por `empresas.html`. Se um dia as três páginas de conhecimento (esta, `tema.html` e o que vier do grafo) crescerem, um módulo `conhecimento/` próprio faz mais sentido — é mudança de pasta, não de regra.\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Sobre a empresa |\n| Módulo | Empresas |\n| Rota | `/Sobre_a_empresa.html?empresa=:id&projeto=:id` |\n| Endpoints | `GET /empresas/:id/sobre` · `GET /empresas/:id/grafo` · `POST /empresas/:id/reclassificar` |\n| Entidades | `recortes_taxonomia`, `ideias`, `projetos` |\n| Componentes | Faixa do grafo (canvas), painel do grafo, lista de pastas, bloco de incompletas, botão \"Gerar prompt\" |\n| Páginas relacionadas | `empresas.html` (origem), `tema.html` (destino de cada pasta), `board.html` (destino pelo painel) |\n\n**O que a página responde.** *De que* a empresa fala. `tema.html` responde *o que ela diz* sobre um assunto. As duas metades juntas são o conhecimento validado da empresa — e \"validado\" aqui quer dizer uma coisa precisa: idéia em `finalizado`.\n\n---\n\n## 1. Regras\n\n### 1.1 As pastas — `SOBRE-PASTAS`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-PASTAS-001 | A lista mostra as categorias da taxonomia que têm **pelo menos uma idéia**, com a contagem de cada uma. Categoria vazia não vira pasta. | Registrado 13/09/2026, a partir do código |\n| SOBRE-PASTAS-002 | A ordem é: **quantidade**, desempatada por em quantas idéias aquela é a pasta **principal**, desempatada por ordem alfabética. Os dois desempates existem para a lista não remontar diferente a cada carga — ordem instável numa tela que se atualiza sozinha se lê como conteúdo mudando. | Registrado 13/09/2026 |\n| SOBRE-PASTAS-003 | A **cobertura** por domínio conta só idéias **finalizadas**. Um domínio cheio de hipóteses continua descoberto, e é essa a informação útil: ela mostra onde falta conhecimento firme, não onde falta atividade. | Registrado 13/09/2026 |\n| SOBRE-PASTAS-004 | Cada pasta leva a `tema.html` com `?empresa=` e `?categoria=`, levando junto o `?projeto=` quando ele existe na URL — sair daqui não pode perder o contexto. | Decorre de TEMA-NAV-001 |\n\n### 1.2 Idéia finalizada e incompleta — `SOBRE-FALTA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-FALTA-001 | Há **duas formas** de uma idéia finalizada estar incompleta, e elas têm causas diferentes: **sem pasta** (a classificação não rodou ou falhou) e **sem trechos** (tem as tags, mas a página do tema abre vazia). | Registrado 13/09/2026 |\n| SOBRE-FALTA-002 | As duas aparecem no **mesmo bloco**, com textos diferentes. Duas caixas lado a lado dizendo \"falta algo\" se leem como um problema maior do que é; um texto só para as duas não explicaria uma página de tema vazia para quem está vendo as tags na tela. | Registrado 13/09/2026 |\n| SOBRE-FALTA-003 | O botão **diz o que vai fazer**: \"Tentar classificar\" quando há idéia sem pasta, \"Gerar os trechos\" quando só faltam recortes. E o rótulo em curso segue o mesmo critério (\"Classificando…\" / \"Gerando…\"). Prometer reclassificar a quem já tem pasta faria a pessoa temer perder a classificação que já está certa. | Registrado 13/09/2026 |\n| SOBRE-FALTA-005 | O número do bloco conta **só idéias finalizadas**, porque é isso que o texto afirma (\"estão finalizadas, mas ainda não têm pasta\") e é isso que o botão consegue consertar — `/reclassificar` só olha finalizadas. Aviso cujo número e cujo remédio discordam é pior que aviso nenhum: ele acusa um problema que não existe e oferece uma ação que não age. | Faltava na contagem; corrigido 17/09/2026 |\n| SOBRE-FALTA-004 | Sem nenhuma das duas faltas, o bloco **não aparece**. Ele é um aviso, não um painel permanente. | Registrado 13/09/2026 |\n\n### 1.3 O grafo — `SOBRE-GRAFO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-GRAFO-001 | O grafo desenha **dados reais** ou não desenha nada. Carregando, vazio e falha ocupam o mesmo lugar dele, com textos próprios, e **nenhum dos três pode parecer um grafo cheio**. | Decidido 13/09/2026 com o Ricardo |\n| SOBRE-GRAFO-002 | Teto do **servidor**: 400 idéias por empresa, com `truncado` e `teto` na resposta. Existe para a consulta não explodir. Quando ele corta, a tela avisa e aponta o caminho para o resto (abrir a pasta por tema). | Registrado 13/09/2026 |\n| SOBRE-GRAFO-003 | Teto do **cliente**: acima do limite de nós ativos, as idéias mais antigas de cada categoria ficam **dobradas** — existem para o painel e para a lista, mas saem da física e do desenho, e a categoria ganha um \"+K\". Existe para o desenho continuar legível. São tetos diferentes, com motivos diferentes. | Registrado 13/09/2026 |\n| SOBRE-GRAFO-004 | As **categorias nunca são escondidas**, em teto nenhum: elas são o esqueleto da taxonomia, e um mapa sem o esqueleto deixa de ser um mapa. | Registrado 13/09/2026 |\n| SOBRE-GRAFO-005 | A distribuição inicial dos nós é **determinística** (espiral pelo ângulo áureo), não aleatória: duas cargas da mesma empresa produzem o mesmo desenho. Um grafo que muda de forma a cada F5 parece quebrado mesmo quando não está. | Registrado 13/09/2026 |\n| SOBRE-GRAFO-007 | O grafo desenha **só idéias finalizadas** — o mapa é o conhecimento da empresa, e conhecimento é o que foi finalizado (mesma fronteira de `IA-CONHEC-002`, mesmo filtro que `/temas` sempre teve). Idéia de brainstorm não é nó. Finalizada **sem** categoria continua entrando: é conhecimento, só não classificado, e é o que `SOBRE-FALTA` existe para dizer. | Faltava no `/grafo`; corrigido 17/09/2026 |\n| SOBRE-GRAFO-006 | A faixa **não muda de altura** entre os estados: a caixa de carregando, a de vazio, a de falha e o canvas ocupam a mesma proporção. Uma lista de pastas que pula na tela quando o grafo chega é pior do que o grafo demorar. | Registrado 13/09/2026 |\n\n**O defeito que só aparece com volume (SOBRE-GRAFO-007, SOBRE-FALTA-005).** Achado pelo Ricardo em 17/09/2026: o grafo mudou de cara sem ninguém ter mexido nele, e o bloco de incompletas anunciou \"155 idéias sem pasta\". Nada no código do grafo havia mudado — o **dado** mudou. Cento e cinquenta e duas idéias foram importadas de uma vez para \"Minhas idéias\", todas sem `assunto` e sem `tags`.\n\nFaltavam dois filtros de `status`, e cada um produziu um sintoma:\n\n- **No `/grafo`**: sem o filtro, toda idéia entrava como nó. As importadas eram as mais novas, o servidor ordena por `criadoEm desc`, e o teto de nós ativos do cliente (`SOBRE-GRAFO-003`) é preenchido na ordem em que os nós chegam. Elas consumiram o teto inteiro, e as idéias que **tinham** categoria foram todas dobradas para fora da tela. O grafo virou uma nuvem de pontos sem aresta nenhuma — exatamente o que `SOBRE-GRAFO-001` existe para impedir, mas por dentro: dado real, desenho que não diz nada.\n- **Na contagem do balde**: sem o filtro, o número somou as 152 às 3 finalizadas sem pasta. A tela afirmou que 155 idéias \"estão finalizadas\" — falso para 152 delas — e ofereceu um botão que não tinha o que fazer com nenhuma.\n\nA lição é sobre onde o filtro mora. `/temas` sempre filtrou por `finalizado`, e o comentário lá o chama de cinto de segurança. `/grafo` carregava o `status` de cada nó no payload e **nunca o usava** — sinal de que o filtro era intenção de alguém em algum momento, e de que ficou pelo caminho nos dois lados. Enquanto o volume era pequeno, o erro era só um desenho um pouco mais sujo; com 152 linhas de uma vez, virou outra tela.\n\n**Por que SOBRE-GRAFO-001 precisou virar regra.** Até 13/09/2026 havia no lugar do grafo uma ilustração desenhada à mão, herdada do protótipo: 348 linhas de nós e arestas inventados. Ela era escondida quando os dados reais chegavam — mas ficava na tela nos outros dois caminhos, que são justamente os que importam. Empresa **sem nenhuma idéia classificada** via um grafo cheio, sem aviso nenhum; **falha de carga** via o mesmo grafo cheio, com um aviso de erro por cima.\n\nNos dois casos, a página que fala do conhecimento real da empresa mostrava conhecimento que não existe. É `EMP-LIST-010` e `IDEIA-QUADRO-008` de novo, num lugar onde o custo é maior: ali a confusão é entre \"vazio\" e \"falhou\"; aqui era entre \"não sei nada disso\" e \"sei tudo isso\".\n\nA ilustração e o CSS dela foram removidos. O `js/grafo.js` chegou a registrar metade do problema num comentário — *\"Cair para a ilustração e não dizer nada foi um erro meu de projeto\"* — e corrigiu só o caminho do erro, deixando o do vazio com o comentário `// sem dados: fica a ilustração`.\n\n### 1.4 O painel — `SOBRE-PAINEL`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-PAINEL-001 | O canvas é `aria-hidden` e não recebe foco. **Quem torna o grafo navegável é o painel**, que é HTML de verdade: foco, teclado, leitor de tela. Acessibilidade aqui não é uma propriedade do desenho — é uma segunda superfície. | Registrado 13/09/2026 |\n| SOBRE-PAINEL-002 | O painel **não depende do canvas para existir**: ele recebe os nós quando o grafo carrega, mas abre também pelos botões de categoria da lista de pastas. Grafo que não carregou não pode levar a navegação junto. | Registrado 13/09/2026 |\n| SOBRE-PAINEL-003 | É pelo painel que a pasta de uma idéia é corrigida à mão (`IDEIA-TAX-006`), e é dali que se chega ao quadro de origem. | Decorre de IDEIA-TAX |\n| SOBRE-PAINEL-004 | O painel **sobrepõe** a faixa do grafo em vez de empurrar o conteúdo: abrir e fechar não pode fazer a lista de pastas pular na tela. | Registrado 13/09/2026 |\n\n### 1.5 A atualização em ciclo — `SOBRE-CICLO`\n\nA tela se atualiza sozinha porque o conteúdo dela chega **em segundo plano**: classificação e recortes rodam depois que alguém finaliza uma idéia em outra página.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-CICLO-001 | **Aba oculta não pergunta nada.** Ninguém está lendo. | Registrado 13/09/2026 |\n| SOBRE-CICLO-002 | Sem novidade, o intervalo **cresce** — de 5s até 30s. Uma tela que está mudando continua respondendo rápido; uma parada há vinte minutos não merece o mesmo esforço. | Registrado 13/09/2026 |\n| SOBRE-CICLO-003 | Voltar o foco à aba **pergunta na hora** e reinicia o ritmo, que é exatamente quando a pessoa quer ver o que mudou. | Registrado 13/09/2026 |\n| SOBRE-CICLO-004 | O ciclo é **encadeado**, nunca `setInterval`: uma resposta lenta não pode empilhar chamadas. | Registrado 13/09/2026 |\n| SOBRE-CICLO-005 | O indicador de carga aparece **só na primeira** vez. Nas atualizações seguintes a lista não é limpa — senão a tela pisca a cada ciclo e parece recarregar sozinha. | Registrado 13/09/2026 |\n| SOBRE-CICLO-006 | Só re-renderiza quando os dados **mudaram de verdade**. | Registrado 13/09/2026 |\n| SOBRE-CICLO-007 | Erro **depois** de uma carga boa não apaga o que já está na tela. O que estava certo continua certo; o que falhou foi a próxima pergunta. | Registrado 13/09/2026; decorre de EMP-LIST-010 |\n| SOBRE-CICLO-008 | Um `401` renova em silêncio por `GET /auth/sessao` antes de desistir, como nas outras telas. | Decorre de PROJ-LIST-008 |\n\n**Por que o ritmo virou regra.** A versão anterior era um `setInterval` de 5s, fixo. Cada aba aberta batia na API doze vezes por minuto para sempre — inclusive minimizada, inclusive esquecida aberta no fim de semana. Com muitas empresas, é carga constante para não mostrar nada de novo. As três correções estão em ordem de importância, e a primeira sozinha resolve a maior parte.\n\n### 1.6 Reparo — `SOBRE-REPARO`\n\nO botão do bloco de incompletas (`SOBRE-FALTA-003`) dispara `POST /empresas/:id/reclassificar`.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-REPARO-001 | O reparo trabalha em **lote de 20** por chamada e devolve quantas ficaram (`restantes`). Uma empresa com trezentas pendências não vira uma chamada de dez minutos. | Registrado 13/09/2026 |\n| SOBRE-REPARO-002 | Há **duas filas com remédios diferentes**: idéia **sem pasta** vai para a classificação (que chama o recorte no fim); idéia **com pasta e sem recorte** vai só para o recorte. Reclassificar a segunda seria pagar de novo por uma resposta que já se tem. | Registrado 13/09/2026 |\n| SOBRE-REPARO-003 | Idéia com `taxonomia_manual` **fica fora da fila de classificação** — pasta decidida por uma pessoa não se reabre para a IA (`IDEIA-TAX-006`). Mas entra na fila de recorte: ela merece trechos como qualquer outra. | Decorre de IDEIA-TAX-006 |\n| SOBRE-REPARO-004 | Quem pode reparar são os mesmos três papéis que escrevem (proprietário, membro, especialista). **Quem só observa não dispara gasto de crédito** — mesmo critério de mover um card e de corrigir a pasta. | Decorre de IDEIA-MOV-004 |\n| SOBRE-REPARO-005 | O reparo **custa crédito**, porque classificar e recortar chamam o modelo. É a única ação desta página que gasta. | Decorre de IA-CUSTO |\n| SOBRE-REPARO-006 | Roda em **segundo plano**: a resposta volta com as contagens do que foi enfileirado, não com o resultado. Quem pediu está com um botão em \"Classificando…\", não esperando um relatório. | Registrado 13/09/2026 |\n\n### 1.7 A página como origem — `SOBRE-ORIGEM`\n\nAté aqui esta página foi descrita como **destino**: o lugar onde o conhecimento validado da empresa aparece depois que alguém finaliza uma idéia. A partir do plano `planejamento-pesquisa-v2.md`, ela também é **origem** — o mesmo conhecimento passa a alimentar a investigação do board antes de ela ir à web.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| SOBRE-ORIGEM-001 | O conhecimento desta página é a **primeira fonte da investigação do board**, consultada antes da web (`BOARD-PESQUISA-013`). Hoje a investigação recebe só nome e descrição da empresa e começa do zero toda vez. **Planejada, não construída.** | Decidido 13/09/2026 com o Ricardo |\n| SOBRE-ORIGEM-002 | O que sai daqui é **verdade validada**: os `recortes_taxonomia` das idéias em `finalizado` — exatamente o recorte que as pastas já mostram (`SOBRE-PASTAS-003`), no alcance da **empresa inteira** (`TEMA-ISO-001`). Material de consulta **não passa por esta página**: vem do quadro do projeto da tarefa (`BOARD-PESQUISA-015`). | Decorre de SOBRE-PASTAS-003 e BOARD-PESQUISA-015 |\n| SOBRE-ORIGEM-003 | A régua é a de `IA-CONHEC`, **não uma nova**: o que esta página entrega é verdade validada porque `IA-CONHEC-002/007` define assim, e idéia arquivada continua fora (`IA-CONHEC-004`). Esta página não decide o que é verdade — ela mostra o resultado de uma decisão que já foi tomada em outro lugar, por uma pessoa. | Decorre de IA-CONHEC-009 |\n| SOBRE-ORIGEM-004 | Por consequência, **idéia incompleta deixa de ser só um buraco visual**. Idéia finalizada sem pasta ou sem trechos (`SOBRE-FALTA-001`) é conhecimento que a investigação **não vai encontrar** — e a pesquisa sai pior sem ninguém perceber por quê. O bloco de incompletas e o reparo (`SOBRE-REPARO`) passam a ter efeito sobre a qualidade da pesquisa, não só sobre a aparência da tela. | Decidido 13/09/2026 com o Ricardo |\n\n**Por que isto é regra desta página, e não só do board.** A regra da investigação (`BOARD-PESQUISA-013`) diz de onde ela lê. Esta diz o que esta página se comprometeu a entregar — e são coisas diferentes na hora de mexer no código. Mudar o critério de `cobertura` (`SOBRE-PASTAS-003`), ou o que entra num recorte, deixou de ser uma alteração local de apresentação: muda o que a pesquisa enxerga. Sem `SOBRE-ORIGEM`, quem for mexer aqui um dia não tem como saber disso.\n\n**O efeito colateral bom.** As pendências abertas desta página — reparo sem retorno, `restantes > 0` sem \"continuar\" — eram irritações toleráveis enquanto o custo de uma pasta faltando era uma lista mais curta. Com `SOBRE-ORIGEM-004`, elas passam a ter preço em qualidade de pesquisa. Não mudam de prioridade por decisão; mudam porque o que elas custam mudou.\n\n\n---\n\n---\n\n## 2. Contrato da API\n\n### `GET /empresas/:empresaId/sobre`\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ assuntos, sem_categoria, sem_recortes, cobertura }` | Desenha as pastas e, se houver falta, o bloco de incompletas |\n| Sessão inválida | `401` | Renova por `/auth/sessao`; só então login (SOBRE-CICLO-008) |\n| Conta suspensa | `403` com `suspensao` | Volta ao login |\n| Sem vínculo com a empresa | `404` | Sai da página |\n\n`cobertura` traz `total`, `cobertos` e a lista de domínios com a contagem de finalizadas em cada um (SOBRE-PASTAS-003). Cada item de `assuntos` traz `categoria` **e** `assunto` com o mesmo valor — duplicação deliberada, para não quebrar versões da tela que leem um ou outro.\n\n### `GET /empresas/:empresaId/grafo`\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Com dados | `200` com `{ nos, arestas, truncado, teto }` | Desenha o canvas e esconde a caixa de estado |\n| Sem nenhuma idéia classificada | `200` com `nos` vazio | Caixa de estado, texto de vazio, **sem grafo** (SOBRE-GRAFO-001) |\n| Qualquer falha | `4xx`/`5xx`/rede | Caixa de estado, texto de falha, **sem grafo** |\n\n### `POST /empresas/:empresaId/reclassificar`\n\nSem corpo. Devolve `{ enfileiradas, classificando, recortando, restantes }`.\n\n| Situação | Resposta |\n|---|---|\n| Enfileirado | `200` com as contagens |\n| Sessão inválida | `401` |\n| Conta suspensa | `403` com `suspensao` |\n| Papel sem permissão | `403` \"Seu papel não permite reclassificar idéias.\" |\n| Sem vínculo com a empresa | `404` |\n\n---\n\n## 3. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| SE1 | O que fica no lugar do grafo enquanto ele não chega, ou quando não vem? | Uma caixa de estado com texto próprio para carregando, vazio e falha. A ilustração do protótipo foi **removida** — ela mostrava conhecimento inventado nos dois casos em que a verdade era \"não há\". | 13/09/2026, com o Ricardo |\n| SE2 | Cobertura conta idéia de qualquer status? | Só **finalizada**. \"Validado\" é o que a página promete. | Registrado 13/09/2026, do código |\n| SE3 | Reclassificar reabre pasta corrigida à mão? | **Não** para a pasta; **sim** para o recorte. | Registrado 13/09/2026, do código |\n| SE4 | O ciclo de atualização tem ritmo fixo? | Não: aba oculta não pergunta, sem novidade o intervalo cresce, e o foco reinicia. | Registrado 13/09/2026, do código |\n| SE5 | O conhecimento desta página alimenta a investigação do board? | **Sim, e é a primeira fonte dela** — antes da web. Sai daqui só verdade validada, no alcance da empresa inteira; material de consulta vem do quadro do projeto, não daqui. A régua é `IA-CONHEC`, a mesma do assistente. | 13/09/2026, com o Ricardo |\n\n---\n\n## 4. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| Origem das decisões SE2 a SE4 | **Lidas do código**, não de decisão registrada em conversa. Descrevem o que o sistema faz; falta confirmar que é o que se quer. |\n| O que o reparo custa, e quem vê | `SOBRE-REPARO-005` diz que gasta crédito, mas a tela não estima nem mostra quanto antes de disparar — a pessoa clica sem saber o preço. Com lote de 20, não é desprezível. |\n| Reparo sem retorno | A resposta diz quantas foram enfileiradas, e o resultado aparece no ciclo seguinte (`SOBRE-CICLO`). Não há aviso de \"terminou\", nem de \"falhou para K delas\". Uma classificação que falha em silêncio reaparece como a mesma pendência, sem explicar por quê. |\n| `restantes > 0` | A tela não oferece \"continuar\": quem tem trezentas pendências precisa clicar quinze vezes, sem saber disso. |\n| Grafo em telas pequenas | A página é desktop-only por decisão anterior (`min-width: 1024px`), então o grafo não tem comportamento de toque. Herdado, não decidido aqui. |\n\n---\n\n## 5. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.2.0 | 2026-09-17 | **Dois filtros de `status` que faltavam, achados em uso.** O grafo mudou de cara sozinho e o bloco de incompletas anunciou \"155 idéias sem pasta\" depois de 152 idéias serem importadas para \"Minhas idéias\". Nova `SOBRE-GRAFO-007`: o grafo desenha só finalizadas — sem o filtro, as importadas (as mais novas, e sem aresta nenhuma) consumiam o teto de nós ativos e dobravam para fora da tela todas as idéias que tinham categoria. Nova `SOBRE-FALTA-005`: o número do bloco conta só finalizadas, porque é o que o texto afirma e o que `/reclassificar` consegue consertar. |\n| 1.1.0 | 2026-09-13 | A página deixa de ser só destino do conhecimento e passa a ser também **origem**: registrada `SOBRE-ORIGEM` (4 regras), que liga o conhecimento validado desta tela à investigação do board (`BOARD-PESQUISA-013/015`, plano `planejamento-pesquisa-v2.md` §3.3). Sai daqui verdade validada no alcance da empresa inteira; material de consulta vem do quadro do projeto, não desta página. Decisão SE5. Regras **planejadas, não construídas** — o cabeçalho diz isso. Consequência registrada em `SOBRE-ORIGEM-004`: idéia finalizada incompleta (`SOBRE-FALTA`) passa a custar qualidade de pesquisa, não só aparência de tela. |\n| 1.0.0 | 2026-09-13 | Documento criado na conferência de `Sobre_a_empresa.html`, que estava no ar sem regra própria — `ia-pacote-contexto.md` cobria só o botão \"Gerar prompt\", e o cabeçalho de `js/sobre-empresa.js` registrava a ausência. Registradas `SOBRE-PASTAS` (4), `SOBRE-FALTA` (4), `SOBRE-GRAFO` (6), `SOBRE-PAINEL` (4), `SOBRE-CICLO` (8) e `SOBRE-REPARO` (6), os contratos das três rotas, decisões SE1 a SE4 e cinco pendências. `POST /reclassificar` não tinha menção em nenhum documento de regra. Junto, `SOBRE-GRAFO-001` foi implementada: a ilustração de grafo do protótipo (348 linhas de SVG mais 53 de CSS) saiu de `Sobre_a_empresa.html`, e carregando, vazio e falha passaram a ter caixa própria. Verificado com DOM real nos cinco caminhos — carregando, vazio, `500`, rede caída e sucesso. |\n"}]},{"nome":"geral","emoji":"📌","docs":[{"id":"geral/creditos-pagamentos-regras","nome":"creditos-pagamentos-regras","titulo":"Regras de Negócio — Créditos e Pagamentos","versao":null,"status":"Fase 4 concluída (01/09/2026)","pagina":null,"ids":["DIN-014","DIN-013","DIN-010","DIN-001","DIN-002","DIN-003","DIN-004","DIN-005","DIN-008","DIN-007","BOARD-PESQUISA-030","DIN-009","DIN-006","SEG-PAG","SEG-PAG-001","HMAC-SHA256","SEG-PAG-002","SEG-PAG-003","SEG-PAG-004","SEG-PAG-005","SEG-PAG-006","BOARD-PESQUISA-047","DIN-011","PES-003","DIN-012","PES-007","TEMA-SINTESE-008","BOARD-PESQUISA-009"],"modificado":"2026-09-17T18:15:01.789Z","bytes":29632,"rel":"creditos-pagamentos-regras.md","md":"# Regras de Negócio — Créditos e Pagamentos\n\n> **Status:** Fase 4 concluída (01/09/2026) · pesquisa medida em 13/09/2026, com uma unidade ainda sem preço  \n> **Última atualização:** 17/09/2026 — o Histórico de uso passou a mostrar consumo medido e não cobrado (DIN-014); valor em reais aparece num lugar só (DIN-013); a chave de cobrança vale para todo consumo (DIN-010 a 012)  \n> **Escopo:** Recarga via Pix real, desconto de taxa, portabilidade para todas as páginas\n\n---\n\n## Sumário das Regras\n\n### DIN — Regras de Dinheiro (Integridade)\n\n| ID | Regra | Aplicação |\n|---|---|---|\n| **DIN-001** | Tudo em **micros de real** (número inteiro). Zero decimais em lugar nenhum. | Todas as colunas de dinheiro (`valor_micros`, `taxa_micros`, `saldo_micros`). Centavo aparece só na tela e no Pix. |\n| **DIN-002** | A **razão é a verdade**; o saldo é cache. Todo movimento é uma linha nova, nunca edição. | Tabela `creditos_lancamentos` é append-only. Saldo em `users.saldo_micros` é recalculado por transação, após cada lançamento. |\n| **DIN-003** | O valor a creditar vem **do nosso registro**, nunca do navegador ou webhook. | Navegador diz \"quero R$ 50\"; servidor cria cobrança com R$ 50 e guarda. Webhook só diz qual cobrança foi paga — credita-se do valor guardado. |\n| **DIN-004** | Todo crédito é **idempotente**. | `txid` com restrição de unicidade. Webhook repetido não credita duas vezes. `npm run reconciliar` é seguro rodar múltiplas vezes. |\n| **DIN-005** | Custo e comissão são **duas colunas**, nunca uma. | Auditoria: \"quanto paguei ao provedor?\" e \"quanto lucrei?\" — e se a **alíquota vigente na data do lançamento** (DIN-008) foi aplicada certo. Cada consumidor tem origem própria em `creditos_lancamentos` (`uso_ia`, `pesquisa`, …), senão \"quanto gastei com pesquisa?\" deixa de ter resposta. |\n| **DIN-007** | O usuário vê **o valor total**, uma linha só. A separação entre custo do provedor e comissão é **interna** — não vai para tela, resposta de API, extrato nem exportação. | O que sai do saldo é `totalMicros` (custo + a comissão vigente, DIN-008). `creditos_lancamentos.valor_micros` já guarda o total; `custo_micros`/`comissao_micros` ficam em `consumos_ia`/`consumos_pesquisa`, que **nenhuma rota devolve ao cliente**. Verificado em 13/09/2026. |\n| **DIN-013** | Valor em reais aparece **num lugar só**: Configurações → Créditos de uso → Histórico de uso. Nenhuma outra jornada exibe preço, estimativa, teto ou custo — nem antes, nem durante, nem depois. | Instrução do Ricardo, 15/09/2026. Saíram: o teto em cima do botão de buscar (`BOARD-PESQUISA-030`), o custo colado na resposta do caderno (`051`) e o custo no rodapé do relatório (`057`). O saldo continua onde sempre esteve — saldo não é preço de uma ação. |\n| **DIN-014** | O Histórico de uso é a verdade do **consumo**, não só da razão: consumo **medido e não lançado** aparece lá, marcado como \"medido, não cobrado\". Nunca se lança na razão para preencher a tela. | `consumos_ia`/`consumos_pesquisa` ganharam `operacao_id`, a mesma chave que a razão usa em `origemId`; o extrato faz a junção e mostra o que não tem lançamento. Só `total_micros` sai daqui (`DIN-007` intacto). Linha com `operacao_id` nulo (anterior a 17/09/2026) fica de fora — sem a chave não há como saber se foi cobrada. |\n| **DIN-008** | A alíquota da comissão **tem vigência**. Lançamento passado fica na alíquota da época — nunca é recalculado. | `COMISSAO_PONTOS_BASE` é a alíquota **de hoje**, não a de sempre. A razão é append-only (`DIN-002`) e cada linha guarda o que foi cobrado; conferir uma linha antiga contra a alíquota atual dá diferença **legítima**, não erro. Tabela de vigência abaixo. |\n| **DIN-009** | **Toda unidade que o provedor cobra entra na razão** — não só tokens. Unidade contada e não precificada é prejuízo silencioso. | A busca encadeada custa US$ 0,01 por unidade além dos tokens, e ficou **contada e não cobrada** desde que a pesquisa existe. Preço de tabela em `precos.ts`; entra em `custoDe` junto dos tokens. |\n| **DIN-006** | \"Falha ao carregar saldo\" **nunca parece \"saldo zero\"**. | Duas telas diferentes, com textos diferentes. Um número que já veio errado é pior do que nenhum número. |\n\n### SEG-PAG — Regras de Segurança (Pagamento)\n\n| ID | Regra | Aplicação |\n|---|---|---|\n| **SEG-PAG-001** | Webhook valida autenticidade de quem chamou. | Assinatura HMAC-SHA256 do Mercado Pago sobre manifest: `id:...;request-id:...;ts:...;`. Sandbox usa assinatura diferente. |\n| **SEG-PAG-002** | Webhook é **campainha, não entrega**. Nunca credita com base só no corpo recebido. | Servidor reconsulta `GET /v1/payments/:id` ao Mercado Pago ANTES de creditar. Navegador também: polling a cada 4s até confirmação. |\n| **SEG-PAG-003** | Webhook precisa de **URL pública com HTTPS válido**. | Desenvolvimento: ngrok ou túnel similar. Produção: domínio + certificado. |\n| **SEG-PAG-004** | Certificados e chaves **nunca entram no repositório**. | `MERCADO_PAGO_ACCESS_TOKEN` e `MERCADO_PAGO_WEBHOOK_SECRET` no `.env`. |\n| **SEG-PAG-005** | Webhook responde `200` rápido e processa em seguida. | Demora faz provedor reenviar. Idempotência (DIN-004) impede duplicação. |\n| **SEG-PAG-006** | Rota de ajuste manual é **restrita e sempre registrada**. | Script `npm run creditar`, não rota HTTP. Acesso: máquina + `.env`. |\n\n---\n\n## Fluxo de Recarga via Pix (Fase 4 — Completo)\n\n1. **Usuário clica \"Gerar QR Code Pix\"** e entra o valor\n2. **Frontend chama** `POST /creditos/recarga` com o valor\n3. **Backend cria cobrança** via Mercado Pago (`POST /v1/payments`)\n4. **Grava em `cobrancas_pix`** com status='aguardando'\n5. **Devolve QR real** (PNG/base64) + código \"copia e cola\"\n6. **Usuário paga** via Pix\n7. **Mercado Pago notifica** via webhook\n8. **Validação:** assinatura HMAC (SEG-PAG-001) + reconsulta API (SEG-PAG-002)\n9. **Desconto de taxa:** `credito = valor - taxa` (vem de `fee_details`)\n10. **Crédito lançado** em `creditos_lancamentos` tipo='recarga'\n11. **Frontend vê** novo status via polling → mostra confirmação\n\nSe webhook não chegar:\n```bash\nnpm run reconciliar\n```\n\n---\n\n## Desconto de Taxa (Crédito Líquido)\n\n- **Nunca é % fixo.** Taxa vem de `fee_details` da API (transação por transação).\n- **Guardada:** coluna `cobrancas_pix.taxa_micros` (auditoria).\n- **Exibida:** extrato mostra \"Pago R$ 10,00 · taxa R$ 0,10\".\n- **Fórmula:** `credito_micros = valor_micros - taxa_micros`.\n\nExemplo: R$ 10,00 (1M micros) - R$ 0,10 taxa (10k micros) = R$ 9,90 creditado (990k micros).\n\n---\n\n## Portabilidade para 7 Páginas (01/09/2026)\n\n**Antes:** 7 páginas tinham botão \"Comprar\" que gerava Pix **fake** com `gerarCodigoPixFake()`.\n\n**Agora:** Todas têm fluxo **real**.\n\n- ✅ Script real (chama `/creditos/recarga`, polling até pago)\n- ✅ Todos os IDs HTML necessários presentes\n- ✅ `js/creditos.js` carregado\n- ✅ Sem encenação: 0 instâncias de `gerarCodigoPixFake()`\n- ✅ Saldo e extrato reais\n\n**Páginas:** Sobre_a_empresa, Sobre_a_empresa_Semana2, atividade, board, matriz_csd, projetos, visao_do_projeto.\n\n---\n\n## A chave de cobrança que só metade do código conhecia (DIN-010)\n\n**Achado em 15/09/2026, lendo o próprio código à procura do que ia morder.** `CREDITOS_COBRAR=\"nao\"` promete, no `.env.example`, que *\"a IA responde normalmente mas nada sai do saldo de ninguém\"*. A promessa era cumprida por cada rota **lembrar de perguntar**: `rotas/ia.ts`, recortes, taxonomia e os dois enriquecimentos perguntavam. As rotas de pesquisa, que nasceram depois, não perguntavam — e são as mais caras da casa. Investigar em desenvolvimento debitava saldo de verdade, ~R$ 0,69 por vez, e não havia como testar o fluxo sem recarregar saldo de teste.\n\n**DIN-010 — a chave mora no vocabulário da razão, não nas rotas.** `reservar`, `liberar` e `consumir` são o único caminho de consumo até `lancar()`. A chave é consultada dentro dos três, antes de qualquer lançamento, e por isso vale para todo chamador — os que existem e os que vierem. Quatro rotas × três verbos seria pedir a doze lugares que se comportem; uma função é garantir que não haja como não se comportar. É o mesmo princípio de `BOARD-PESQUISA-047` e `061`: **pedir é instrução; cortar é garantia.**\n\n**Os três saem juntos ou nenhum sai.** Se `liberar` respeitasse a chave e `reservar` não — ou o contrário —, o saldo andaria sozinho numa direção: uma reserva eterna, ou uma devolução sem reserva. É por isso que a saída antecipada está nos três, e que há teste cobrando os três.\n\n**DIN-011 — desligar a cobrança não desliga a medição.** `registrarPesquisa` e `registrar` gravam tokens, buscas e custo em dólar por um caminho que não passa por `reserva.ts`, e devem continuar assim. `PES-003` — *\"o custo vem do provedor, transação a transação\"* — vale igual com a cobrança desligada: o que para é o débito, não a conta. Se a medição dependesse da chave, desenvolvimento deixaria de produzir exatamente o dado que achou `DIN-009`, a reserva que não reservava e a tarefa investigada duas vezes.\n\n**DIN-012 — crédito que entra nunca depende da chave.** `rotas/webhooks.ts` é o único outro lugar que chama `lancar()` direto, e de sentido contrário: ele credita um Pix confirmado. A chave desliga o débito, não o dinheiro que a pessoa pôs. O teste guarda as duas metades disso: que ninguém mais lança na razão por fora de `reserva.ts`, e que `webhooks.ts` nunca lança valor negativo.\n\n**Não foi provado por chamada, e o motivo importa.** A afirmação aqui é estrutural — *não existe outro caminho até a razão* —, e isso não se observa chamando as três funções: chamá-las prova que aquelas três estão certas, e nada sobre a quarta que alguém escrever amanhã. Era essa a forma do defeito. `api/testes/cobranca-desligada.test.ts` lê o código: a chave antes do lançamento nos três verbos, a porta única, a medição livre. O efeito no saldo de um Postgres de verdade é de `reserva-integracao.test.ts`, que é onde ele pode ser visto.\n\n---\n\n## A busca que era contada e não era cobrada (DIN-009)\n\n**Achado em 14/09/2026, olhando a razão de uma investigação real.** A Anthropic cobra por **busca encadeada** — US$ 10 por mil, US$ 0,01 cada — além dos tokens. A coluna `consumos_pesquisa.buscas` guardava a contagem desde o começo, e a contagem **nunca virava dinheiro**. Estava registrado como pendência (\"Consumidores não medidos\"), com a justificativa de que estimar seria pôr número inventado na razão.\n\nA justificativa estava errada quanto ao tipo do número. US$ 10/1000 é **preço de tabela publicado**, exatamente como os preços por token que `TABELA` já guarda. Não havia nada a estimar.\n\n**E não era desprezível — era a maior parte.** Na investigação sobre a Loggi (14/09/2026):\n\n| | USD |\n|---|---|\n| Tokens (31.196 entrada + 982 saída, Haiku) | 0,036 |\n| 4 buscas × US$ 0,01 | **0,040** |\n| **Custo real** | **0,076** |\n| O que foi cobrado | 0,036 |\n\nA plataforma cobrou **menos da metade do que pagou**, e os 30% de comissão incidiam sobre essa metade. Quanto mais a investigação buscava, maior o prejuízo por investigação — o oposto do que se quer de um produto que vende profundidade.\n\n---\n\n## A reserva que não reservava (14/09/2026)\n\nMesmo dia, mesmo lugar, defeito irmão. O teto reservado antes da chamada vinha de `tetoUsdMicros`, que estima a entrada **pelo texto do prompt**. Isso vale para uma chamada simples. Numa chamada com ferramenta, não: o resultado da web volta para o contexto, e o contexto inteiro é reenviado a cada rodada — a entrada cresce com o quadrado do número de buscas.\n\nMedido: **31.196 tokens de entrada** contra uma estimativa de ~400. Quase **80 vezes**. Consequências:\n\n- a reserva travava uma fração do que ia ser gasto, então duas investigações simultâneas de quem tem saldo para uma passavam as duas;\n- o teto de R$ 3 por investigação (D2) não segurava nada;\n- e — o pior — era esse número que aparecia para a pessoa como **\"custo estimado da busca\"**, quando `PES-007` existe justamente para esse número ser verdade.\n\n`tetoBuscaUsdMicros` modela as rodadas: `(k+1)·prompt + 2.500·k·(k+1)/2`, mais o preço das buscas. Com prompt de mil tokens e cinco buscas, o teto sai ~R$ 0,69 em vez de ~R$ 0,04. O `2.500` é o único número calibrado a partir de **uma** observação; se a conta divergir do que a razão registrar, é ele que se ajusta primeiro, e está dito assim no código.\n\n---\n\n## A alíquota da comissão e sua vigência (DIN-008)\n\n| Vigência | Alíquota | Pontos-base | Decisão |\n|---|---|---|---|\n| 25/08/2026 → 13/09/2026 | **5 %** | 500 | Valor inicial, escolhido antes de haver consumo medido |\n| **14/09/2026 → hoje** | **30 %** | **3000** | Instrução do Ricardo, 14/09/2026 |\n\n**Por que subiu.** Nas palavras do Ricardo (14/09/2026): *\"a plataforma de design vai ter gastos com servidores e isso tem que ser cobrado do usuário, então estou aumentando a porcentagem de ganho percentual.\"*\n\nOs 5% foram fixados em `planejamento-creditos-e-pagamento.md` §1.3, que já os classificava como *\"mais apertados do que parecem\"* e listava o que sai deles antes de virar lucro: **IOF** na compra internacional, **variação do dólar** entre a cobrança e o fechamento da fatura, **imposto sobre faturamento** e **tarifa de Pix** por recarga. O mesmo §1.3 listava três saídas — subir o mínimo de recarga, aplicar *spread* na cotação, ou subir a margem — e §8 registrava a pergunta em aberto: *\"a margem de 5% cobre os custos?\"*. A decisão de 14/09 responde pela terceira saída.\n\n**O que a lista de §1.3 não tinha.** Todos os quatro itens dela são custos **por transação**: incidem quando alguém consome. Infraestrutura não é assim — servidor, banco e tráfego são custo **por tempo**, e existem mesmo no mês em que ninguém chama o provedor. Uma alíquota sobre consumo cobre custo fixo só na média, e só enquanto houver consumo: a conta fecha para quem usa a plataforma, e não fecha para a conta aberta que fica parada. Isso não invalida a decisão — é o desenho de receita que o produto tem hoje —, mas é a razão pela qual esta alíquota não é uma resposta definitiva ao custo de infraestrutura, e sim a resposta disponível.\n\n**O que a mudança NÃO faz.** Não toca em lançamento nenhum já gravado. A razão é append-only (`DIN-002`), cada linha de `consumos_ia`/`consumos_pesquisa` guarda o `comissao_micros` que foi cobrado naquele dia, e o
