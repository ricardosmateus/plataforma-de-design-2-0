saldo de quem já recarregou continua valendo o que vale. O que muda é o preço do **próximo** consumo.\n\n**Onde a alíquota mora.** Num lugar só: `COMISSAO_PONTOS_BASE` em `api/src/creditos/dinheiro.ts`, em pontos-base inteiros (30% = 3000), porque escrever `0.30` reintroduziria ponto flutuante justamente na conta que gera a receita. Nenhuma rota, tela ou documento repete o número como literal — `dinheiro.test.ts` trava o valor com um teste, para mexer nele ser sempre uma decisão consciente e nunca um descuido.\n\n**Efeito prático, para dimensionar.** Cem classificações de idéia que custavam R$ 0,9485 ao provedor saíam por R$ 1,00 e passam a sair por R$ 1,23. Uma investigação da Fase 1 do plano de pesquisa, estimada em ~US$ 0,18, sai de ~R$ 1,00 para ~R$ 1,25.\n\n---\n\n## A comissão, e por que ela não aparece (DIN-007)\n\n**Conferido em 13/09/2026, a pedido do Ricardo.** A pergunta era se a estimativa de custo que o plano de pesquisa promete mostrar antes de gastar (`PES-007`) inclui a nossa margem. A resposta tem duas partes.\n\n**O que já está certo.** Em todo lugar onde a plataforma mostra dinheiro consumido, ela já mostra o **total com comissão**, e o desmembramento não sai daqui:\n\n| Camada | O que guarda | O que entrega ao cliente |\n|---|---|---|\n| `comissaoSobre()` (`dinheiro.ts`) | `custoMicros`, `comissaoMicros`, `totalMicros` | — |\n| `reservar` / `consumir` (`reserva.ts`) | movimenta `totalMicros` | — |\n| `creditos_lancamentos` | `valor_micros` = **o total** | `valor_micros`, `valor_formatado` |\n| `consumos_ia` / `consumos_pesquisa` | custo e comissão em colunas separadas | **nada** — nenhuma rota lê essas colunas para o cliente |\n| `GET /creditos/extrato` | — | total, saldo depois, e a descrição \"Uso da plataforma — *operação*\" |\n\nA única soma de `consumos_pesquisa` que existe numa rota é `gastoDaSessao()`, e ela soma `totalMicros` para checar o teto — não devolve o detalhe.\n\n**O que ainda não existe.** A estimativa de `PES-007` **não está construída**: `planejar` devolve hoje `custo_estimado_micros: null`, de propósito, com a justificativa no próprio código de que devolver número inventado seria pior que devolver nulo. Então a pergunta \"a estimativa considera a comissão?\" ainda não tem implementação para responder — ela é uma decisão a tomar **agora**, antes de construir, e a resposta é `DIN-007`: um número só, o total.\n\n**Por que isto precisou virar regra, se o comportamento já estava certo.** Porque estava certo **por acaso**, sustentado por nenhuma rota ter tido motivo para ler aquelas colunas ainda. O modelo de dados convida ao contrário: `consumos_pesquisa` tem `custo_micros` e `comissao_micros` lado a lado, e qualquer tela futura de \"detalhe do consumo\", qualquer exportação de extrato em CSV, qualquer painel de custo por projeto nasce a um `select` de distância de expor a margem. `DIN-005` manda separar as colunas e explica o porquê — **auditoria** —, mas nunca disse que a separação é só nossa. Era a metade que faltava.\n\n**O precedente perigoso está na mesma tela.** O extrato **mostra** de propósito o desmembramento de uma recarga por Pix: *\"Pago R$ 10,00 · taxa R$ 0,10 · creditado R$ 9,90\"*. Está certo — sem isso a pessoa vê R$ 9,90 entrando de um pagamento de R$ 10,00 e conclui que a plataforma ficou com a diferença; a taxa é de terceiro e mostrá-la nos defende. Mas as duas coisas são visualmente irmãs e moram no mesmo componente, e a diferença entre elas não é óbvia para quem for mexer ali daqui a seis meses: **taxa de PSP é dinheiro que não é nosso e se explica; comissão é o preço do serviço e não se desmembra.** `DIN-007` existe para essa distinção não depender de alguém lembrar.\n\n**O que DIN-007 não proíbe.** Não proíbe dizer que a plataforma tem margem — isso é modelo de negócio, e está descrito em `O_que_e_q_plataforma_de_design.md`. O que ela proíbe é apresentar **um consumo específico** decomposto em \"provedor X + plataforma Y\", que é o formato que convida a pessoa a comparar o nosso preço com a tabela do fornecedor a cada uso.\n\n---\n\n## O gasto medido que ninguém via (DIN-014)\n\nAchado pelo Ricardo em 17/09/2026, com uma pesquisa real (\"Amazon Logistch\"): a busca correu, entregou, e **nada apareceu** no Histórico de uso.\n\n**A causa imediata** era `CREDITOS_COBRAR=nao` no `.env`. `consumir()` sai na primeira linha quando a chave está desligada, antes de chamar `lancar()` — nenhuma linha entra em `creditos_lancamentos`, e o Histórico lê exatamente essa tabela. A tela não estava errada: ela estava dizendo a verdade sobre a razão.\n\n**A causa de fundo é outra, e é nossa.** Isso sempre foi assim, e sempre foi inofensivo, porque o custo também aparecia no relatório e na resposta do caderno. `DIN-013` tirou esses dois e fez do Histórico o único lugar onde valor aparece. As duas decisões juntas produziram o que nenhuma delas pretendia: um gasto **medido, gravado e invisível em todo o produto**. Nem `DIN-011` nem `DIN-013` erraram sozinhas — o defeito nasceu do encontro delas, e por isso não estava escrito em lugar nenhum.\n\n**O que NÃO foi feito.** A correção óbvia seria lançar na razão mesmo com a cobrança desligada, ou lançar um valor zero com uma marca. As duas mentem: a primeira sobre o saldo, a segunda sobre o custo. `DIN-002` diz que a razão é a verdade do saldo, e uma linha inventada para preencher uma tela é exatamente o tipo de escrita que a conferência de `DIN-002` existe para pegar.\n\n**O que foi feito.** A tela passou a responder pelo **consumo**, que é o que ela promete, em vez de só pela razão. Para isso faltava uma chave: `consumir()` já gerava um `operacaoId` e o gravava na razão como `origemId`, mas as tabelas de medição nunca o guardavam — então uma linha medida não sabia dizer se tinha sido cobrada. A coluna `operacao_id` entrou nas duas tabelas (aditiva, anulável, indexada), o `operacaoId` passou a ser gravado em toda medição, e o extrato junta as duas listas: o que tem lançamento aparece como sempre, o que não tem aparece marcado.\n\n**Por que a linha antiga fica de fora.** Consumo anterior a 17/09/2026 não tem a chave, então não há como saber se foi cobrado. Mostrá-lo como \"não cobrado\" arriscaria exibir **duas vezes** o mesmo gasto que já está lá como lançamento. Entre não mostrar um gasto antigo e contá-lo duas vezes, não mostrar é o erro mais barato — e é o único que não corrompe a leitura de quem audita.\n\n**O que a marca diz, e como.** Sem sinal e em cor de apoio: a linha não mexeu no saldo, e um \"− R$ 0,43\" igual aos outros mandaria a pessoa procurar no saldo uma diferença que não existe. `saldo_depois` vem nulo pelo mesmo motivo — repetir o saldo atual daria a impressão de que a linha passou por ele.\n\n---\n\n## Um lugar só para o valor (DIN-013)\n\nInstrução do Ricardo, 15/09/2026: *\"o usuário, a partir do momento em que clica em pesquisar, só vai saber o valor após o término da pesquisa, e essa informação deve aparecer apenas na modal Configurações / Créditos de uso / Histórico de uso; o restante podemos tirar — não devemos exibir valores dentro de outras jornadas.\"*\n\n**O que saiu, e de onde.** Três lugares mostravam o mesmo dinheiro em três momentos diferentes da mesma jornada: o teto *\"Buscar custa até R$ X\"* em cima do botão de buscar, o custo colado no fim de cada resposta do caderno, e o custo no rodapé do relatório baixado. Nenhum dos três foi substituído por outro número — todos foram retirados.\n\n**Por que isto não briga com DIN-007.** DIN-007 responde *como* o valor é mostrado quando é mostrado: um total, uma linha, sem desmembrar custo e comissão. DIN-013 responde *onde*. As duas juntas dizem: um número, num lugar. Nada em DIN-007 exigia que o número aparecesse em toda tela que gasta.\n\n**Por que o preço antes de gastar não estava ajudando.** Ele nasceu como proteção — ninguém deve gastar sem saber quanto. Mas o teto aparecia depois de a pessoa já ter clicado em \"Pesquisar\", ou seja, **depois da decisão**: era um número que não mudava nada, custava atenção, e ainda gerava a expectativa errada, porque o teto quase nunca é o que sai do saldo. O mesmo vale para o custo colado na resposta do caderno: a pergunta já tinha sido feita e paga.\n\n**O que continua protegendo o gasto.** O **teto por investigação** (R$ 3) continua no servidor, e é ele que impede uma conversa longa de virar gasto sem ninguém notar — não o texto na tela. A medição continua igual (`DIN-011`): tudo que é consumido é gravado, e é isso que alimenta o Histórico de uso. Tirar o número da tela não tirou nada da razão.\n\n**O que NÃO é preço, e por isso ficou.** O **saldo** continua visível onde sempre esteve: saldo é quanto a pessoa tem, não quanto uma ação custa. E o relatório continua dizendo o **tamanho** do que foi apurado — quantas fontes lidas, quantas afirmações, quantas não ficaram —, que é o que se audita ali dentro.\n\n---\n\n## Checklist de Integridade\n\n- [x] **DIN-001** — Tudo em micros (sem float)\n- [x] **DIN-002** — Razão append-only, saldo é cache\n- [x] **DIN-003** — Valor vem do registro, não do webhook\n- [x] **DIN-004** — Idempotência (txid único)\n- [x] **DIN-005** — Custo e comissão separados · pesquisa entrou em 13/09/2026 com origem própria; busca encadeada precificada em 14/09/2026 (DIN-009)\n- [x] **DIN-006** — Falha ≠ saldo zero\n- [x] **DIN-008** — Alíquota com vigência; lançamento passado não é recalculado · 30% desde 14/09/2026\n- [x] **DIN-009** — Busca encadeada precificada · 14/09/2026; fecha \"Consumidores não medidos\"\n- [x] **DIN-007** — Usuário vê o total; custo e comissão não saem em rota nenhuma · conferido em 13/09/2026 (extrato, reserva, consumo e sessão de pesquisa)\n- [x] **DIN-010** — `CREDITOS_COBRAR` vale para TODO consumo, porque mora dentro de `reservar`/`liberar`/`consumir` · 15/09/2026\n- [x] **DIN-011** — Desligar a cobrança não desliga a medição (PES-003 continua valendo) · 15/09/2026\n- [x] **DIN-012** — Crédito que entra nunca depende da chave; só `webhooks.ts` lança por fora, e só positivo · 15/09/2026\n- [x] **DIN-013** — Valor em reais aparece só em Configurações → Créditos de uso → Histórico de uso · 15/09/2026\n- [ ] **DIN-014** — Consumo medido e não lançado aparece no Histórico, marcado · 17/09/2026 · **falta rodar `npm run gerar` e `npm run migrar:dev`**\n- [x] **SEG-PAG-001** — Assinatura validada\n- [x] **SEG-PAG-002** — Reconsulta ao PSP\n- [x] **SEG-PAG-003** — URL pública + HTTPS (ngrok em dev)\n- [x] **SEG-PAG-004** — Chaves no `.env`\n- [x] **SEG-PAG-005** — Webhook responde 200 rápido\n- [x] **SEG-PAG-006** — Ajuste manual = script terminal\n\n---\n\n## Consumidores não medidos\n\nDIN-005 exige que cada consumidor tenha origem própria em `creditos_lancamentos`, \"senão *quanto gastei com pesquisa?* deixa de ter resposta\". O enum `OrigemLancamento` tem o valor `pesquisa` reservado desde a Fase 4. Ele **nunca foi usado**.\n\n| Consumidor | Mede? | Situação |\n|---|---|---|\n| Assistente de IA | Sim | `TipoConsumoIa.assistente` |\n| Classificação de idéia | Sim | `TipoConsumoIa.classificacao` |\n| Síntese de tema | Sim | `TipoConsumoIa.sintese_tema` (`TEMA-SINTESE-008`) |\n| **Pesquisa externa** | Sim, em parte | Tokens medidos e debitados desde 13/09/2026; busca encadeada gravada como unidade, **sem preço** |\n\n### ~~A pesquisa externa não é medida nem debitada~~ — resolvido em 13/09/2026\n\n> **Corrigido no mesmo dia.** `rotas/pesquisa.ts` agora reserva pelo pior caso antes da chamada, libera o teto e consome o custo real depois, e grava a linha em `consumos_pesquisa` pelo novo `creditos/registro-pesquisa.ts`. Os lançamentos entram com origem `pesquisa` e descrição \"Uso da plataforma — pesquisa de concorrentes\", que é o que aparece em Configurações › Créditos de uso.\n>\n> **O que ainda não entra na conta:** a Anthropic cobra por busca encadeada (`web_search_requests`, até cinco por pergunta) e esse preço não está registrado em lugar nenhum deste repositório. As buscas ficam gravadas como unidade em `consumos_pesquisa.buscas`, sem virar dinheiro — então **o total cobrado é menor que o custo real**. Quando o preço existir, recalcular o passado é uma consulta, porque a unidade está guardada. Inventar um número agora o poria na razão com cara de fato.\n>\n> O diagnóstico original fica abaixo, como registro do que o defeito era.\n\n#### O defeito, como estava\n\nAberto em 13/09/2026, a partir de uma observação do Ricardo: o histórico em Configurações › Créditos de uso não mostrava nenhuma pesquisa. Ele está certo — não há o que mostrar.\n\n`api/src/rotas/pesquisa.ts` chama o provedor externo e grava consulta, fontes e entidades numa transação, mas **nunca** chama `reservar`, `consumir` nem `razao.lancar()`. As únicas menções a crédito nesse arquivo são comentários.\n\nA tabela `ConsumoPesquisa` existe no schema — `usuario_id`, `sessao_id`, `consulta_id`, `nivel`, `provedor`, `resultado`, `total_micros` e contadores de token — e **nada escreve nela**. A partir daí, em cadeia:\n\n1. `gastoDaSessao()` soma exatamente essa tabela, então devolve **sempre zero**;\n2. `estimativaMicros = 0` está fixo no código, com o comentário de que é \"deliberado e temporário\" enquanto a tabela de preço por nível não existir;\n3. logo `cabeNoTeto(0, 0, teto)` é sempre verdadeiro e **o `402` nunca dispara**;\n4. nenhum lançamento com origem `pesquisa` é criado, e o extrato não tem o que listar.\n\n**O que isso significa hoje:** a pesquisa é gratuita e ilimitada para quem a usa, o custo do provedor não aparece em lugar nenhum da plataforma, e o teto por sessão — que a interface mostra e o usuário pode ajustar — não tem efeito nenhum.\n\n**Por que isto não é só um item de backlog.** DIN-002 diz que a razão é a verdade. Um consumidor que gasta dinheiro real e não passa pela razão não torna a razão incompleta: torna-a **errada**, porque ela afirma, pela própria estrutura, ser o registro de tudo. E o defeito é do tipo que não aparece sozinho — nada quebra, nenhum erro é registrado, e a única forma de descobrir foi alguém abrir o histórico procurando uma pesquisa que tinha feito.\n\nVer `Regras_de_negocio/modulos/atividades/board-lista.md` — `BOARD-PESQUISA-009` e a pendência crítica da §5.\n\n**Decisão relacionada, ainda sem resposta.** A **D2** (crédito por usuário ou por empresa) estava registrada como bloqueadora de publicação. A pesquisa entrou no ar em 06/09 sem esperá-la (decisão A34 em `board-lista.md`). A pergunta continua aberta, e agora sem nada travando enquanto isso.\n\n---\n\n## Próximas Fases\n\n**Fase 5:** Reconciliação automática + dashboard  \n**Fase 6:** Marketplace (depende de decisão jurídica)\n"},{"id":"geral/grafo-conhecimento-v2","nome":"grafo-conhecimento-v2","titulo":"Planejamento — Grafo de Conhecimento da Empresa (v2 – Agosto 2026)","versao":null,"status":null,"pagina":null,"ids":["IDEIA-TAX-001","IDEIA-MOV-017"],"modificado":"2026-09-13T11:04:03.180Z","bytes":3515,"rel":"Regras_de_negocio/modulos/grafo-conhecimento-v2.md","md":"# Planejamento — Grafo de Conhecimento da Empresa (v2 – Agosto 2026)\n\n> Revisão da visão de 05/08/2026 contra o estado atual do backend.\n> Data: 29/08/2026\n>\n> **Nota de 13/09/2026.** Este é um documento de **planejamento**, não de regra: não tem versionamento nem identificadores, e por isso não pode ser citado pelo código. As regras que nasceram dele foram registradas, com ID, nos documentos do módulo de idéias:\n>\n> - **Regra 1 e Regra 3** (só idéia finalizada tem taxonomia; um assunto, N tags) → [`ideias/ideias-taxonomia.md`](ideias/ideias-taxonomia.md), IDEIA-TAX-001 a 009\n> - **Regra 2** (sair de \"finalizado\" apaga assunto e tags) → [`ideias/ideias-movimentacao.md`](ideias/ideias-movimentacao.md), IDEIA-MOV-017 a 019\n>\n> Em caso de divergência, valem os documentos do módulo. Este fica como o registro do raciocínio que levou até eles.\n\n## Mudança de premissa fundamental\n\n**De 05/08:** \"Hoje a plataforma é estática, sem backend. O agente de taxonomia = 70–80% do esforço.\"\n\n**De 29/08:** Backend existe. `api/src/ia/` (875 linhas) já fala com Anthropic, extrai JSON, valida entrada. O agente deixa de ser um subsistema novo e vira mais um consumidor de `provedor.ts`. O custo caiu de \"meses\" para \"semanas\".\n\n---\n\n## Visão revisada\n\n`Sobre_a_empresa.html` deixa de ser um protótipo e passa a ser o **cérebro vivo da empresa**.\n\n### Três projeções do mesmo dado\n\n| Projeção | Estrutura | Serve para |\n|---|---|---|\n| **Pastas** | Hierarquia (1 assunto por ideia) | Organizar / encontrar |\n| **Grafo** | Rede (N tags por ideia) | Explorar / descobrir conexões |\n| **HTML abaixo** | Lista navegável | Acessibilidade + scroll + CTRL+F |\n\n**Uma única fonte de verdade:** `Ideia.assunto` (categoria principal) + `Ideia.tags` (categorias secundárias), ambas preenchidas quando `status === \"finalizado\"`.\n\n### Fluxo de entrada\n\n1. Ideia criada → status \"ideias\" (rascunho)\n2. Ideia → status \"andamento\" (em progresso)\n3. Ideia → status \"finalizado\" (validada) → Claude classifica: assunto + tags → Pasta aparece em \"Sobre a Empresa\"\n\n### Fluxo de saída (regra crítica)\n\nIdeia em \"finalizado\" → usuario move para \"andamento\" OU \"ideias\" → assunto := null, tags := [] → DESAPARECE de \"Sobre a Empresa\"\n\n**Por quê?** Conhecimento não validado não influencia decisões. Escala com confiança — ninguém usa um mapa que muda toda hora.\n\n---\n\n## Regras de ouro\n\n### Regra 1: Apenas \"finalizado\" aparece\nUma ideia em \"ideias\" ou \"andamento\" **nunca** tem `assunto` e `tags` preenchidos.\n\n### Regra 2: Transição para fora de \"finalizado\" limpa\nQuando status sai de \"finalizado\", assunto → null, tags → []\n\n### Regra 3: Só um assunto, múltiplas tags\nAssunto = pasta (1), Tags = temas transversais (N)\n\n### Regra 4: Normalização v1→v2\n\"Interface\" (v1) → \"UI\" (v2) antes de exibir\n\n---\n\n## Caminho incremental (8 semanas)\n\n- **Semana 1:** Migration Prisma + API\n- **Semana 2:** Pastas dinâmicas\n- **Semana 3:** Skill de taxonomia\n- **Semana 4:** Grafo (canvas force-directed)\n- **Semana 5:** Painel de contexto\n- **Semana 6:** Otimizações de escala\n- **Semana 7:** Acessibilidade + Fallback\n- **Semana 8:** Validação e docs\n\n---\n\n## Frase-chave\n\n> \"Não estamos construindo um Obsidian dentro da plataforma. Estamos tornando o conhecimento validado navegável de três formas — pastas, grafo, HTML — a partir da mesma taxonomia que a IA propõe e o usuário confirma. Escala com confiança: se sair de 'finalizado', sai do mapa.\"\n"}]},{"nome":"ia","emoji":"🤖","docs":[{"id":"ia/ia-assistente-conhecimento","nome":"ia-assistente-conhecimento","titulo":"Regras de Negócio — Assistente de IA: o que ele sabe e o que pode afirmar","versao":"1.5.0","status":"Regras definidas; implementado (provedor pendente)","pagina":"visao_do_projeto.html","ids":["IA-CONHEC","IA-CONHEC-009","IA-ACAO","IA-CONHEC-001","IA-CONHEC-002","IA-CONHEC-003","IA-CONHEC-004","IDEIA-EXCL-001","IA-CONHEC-005","IA-CONHEC-007","IA-CONHEC-008","IA-CONHEC-006","BOARD-PESQUISA-014","IA-CONHEC-010","IA-ISO","BOARD-PESQUISA-015","IA-GARANT-003","TEMA-ISO-001","IA-GARANT","IA-GARANT-001","IA-GARANT-002","IA-GARANT-004","IA-ISO-004","IA-GARANT-005","IA-VAZIO","IA-VAZIO-001","IA-VAZIO-002","IA-VAZIO-003","IA-VAZIO-005","IA-VAZIO-004","IA-VAZIO-006","IA-VAZIO-007","IA-VAZIO-008","IA-VAZIO-009","IA-GERAL-003","EMP-LIST-010","IA-GERAL","IA-GERAL-001","IA-GERAL-002","IA-GERAL-004","IA-GERAL-005","BOARD-PESQUISA","IA-ACAO-001","IA-ACAO-002","IA-ACAO-003","IA-ACAO-004","IA-ACAO-005","IDEIA-CRIA-001","IDEIA-DUPL-009","IA-ACAO-006","IA-ACAO-010","IA-ACAO-007","IDEIA-MOV-004","IDEIA-CRIA","IA-ACAO-008","IDEIA-CRIA-003","IA-ACAO-009"],"modificado":"2026-09-17T17:21:38.630Z","bytes":32043,"rel":"Regras_de_negocio/modulos/ia/ia-assistente-conhecimento.md","md":"# Regras de Negócio — Assistente de IA: o que ele sabe e o que pode afirmar\n\n> **Versão:** 1.5.0 · **Status:** Regras definidas; implementado (provedor pendente)\n> **Módulo:** Assistente de IA · **Página:** `visao_do_projeto.html` (painel lateral)\n> **Alcance de `IA-CONHEC`:** toda leitura de conhecimento interno por IA na plataforma — não só o painel lateral. Ver `IA-CONHEC-009`.\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`ia-assistente-isolamento.md`](ia-assistente-isolamento.md) · [`ia-assistente-conversa.md`](ia-assistente-conversa.md) · [`../ideias/ideias-quadro.md`](../ideias/ideias-quadro.md) — de onde vem o conhecimento · [`../ideias/ideias-criacao.md`](../ideias/ideias-criacao.md) e [`../ideias/ideias-movimentacao.md`](../ideias/ideias-movimentacao.md) — a validação que `IA-ACAO` reproduz na confirmação · [`../atividades/board-lista.md`](../atividades/board-lista.md) — a investigação do board, segunda superfície a herdar `IA-CONHEC` · [`../empresas/sobre-empresa.md`](../empresas/sobre-empresa.md) — de onde a investigação lê a verdade validada\n\n---\n\n## Origem destas regras\n\nInstrução do Ricardo, 25/08/2026:\n\n> \"o assistente deve apenas consultar informações internas da empresa selecionada, ele deve ter a limitação de trazer informações que não foram validadas dentro do projeto, ou seja, o assistente tem que levar como verdade apenas as idéias que estiverem na coluna 'Finalizado' e o restante das idéias devem servir para consulta, mas ele não pode considerar uma verdade para o projeto.\"\n\nO documento traduz isso em mecanismo. A parte difícil não é enunciar a regra — é fazer com que ela **não dependa da boa vontade do modelo**.\n\n---\n\n## 1. Regras\n\n### 1.1 Os dois estados do conhecimento — `IA-CONHEC`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONHEC-001 | O conhecimento do assistente tem **exatamente duas categorias**: *verdade validada* e *material de consulta*. Não existe terceira, nem zona cinzenta. | Instrução do Ricardo, 25/08/2026 |\n| IA-CONHEC-002 | **Verdade validada** é toda idéia ativa em `Finalizado`. Só ela pode ser afirmada como fato do projeto. | Instrução do Ricardo, 25/08/2026 |\n| IA-CONHEC-003 | **Material de consulta** são as idéias ativas em `Minhas idéias` e `Em andamento`. O assistente pode lê-las, citá-las e raciocinar sobre elas, mas **nunca** apresentá-las como fato estabelecido. | Instrução do Ricardo, 25/08/2026 |\n| IA-CONHEC-004 | Idéia arquivada **não entra no contexto** em categoria nenhuma. Foi descartada; ressuscitá-la no raciocínio da IA desfaria a decisão de quem a arquivou. | Decorre de IDEIA-EXCL-001 |\n| IA-CONHEC-005 | Toda afirmação apoiada em material de consulta é apresentada **marcada como não validada**, na própria resposta — não em nota de rodapé, nem só no tom. | Decisão A1 |\n| IA-CONHEC-007 | **Finalizar uma atividade valida tudo que ela produziu.** Quando a idéia vai para `Finalizado`, as tarefas, os quadros e os post-its dentro dela passam a ser **verdade validada** junto com ela — não só o título e a descrição. | Instrução do Ricardo, 06/09/2026 |\n| IA-CONHEC-008 | Tarefa concluída dentro de atividade **ainda não finalizada** é **material de consulta** (IA-CONHEC-003). A tarefa acabou; a atividade não — e é finalizar a atividade que declara o conteúdo validado. | Decorre de IA-CONHEC-007 |\n| IA-CONHEC-006 | O assistente **só lê por conta própria**. Ele não cria, edita, move ou arquiva idéia sem que a pessoa tenha pedido *e* confirmado — ver `IA-ACAO` (§1.5). Alterar o quadro sem os dois continua sendo ato exclusivamente humano. | Instrução do Ricardo (\"apenas consultar\"), 25/08/2026 · revisto pela decisão A18 |\n| IA-CONHEC-009 | `IA-CONHEC` **não é regra do painel lateral**: é a régua de todo consumo de conhecimento interno por IA na plataforma. Vale para o assistente de `visao_do_projeto.html` e para a investigação do board (`BOARD-PESQUISA-014`). Superfície nova que leia idéias **herda** estas duas categorias — não inventa a sua. | Decidido 13/09/2026 com o Ricardo |\n| IA-CONHEC-010 | O **alcance** de cada categoria é da superfície; a régua não. O assistente lê as duas dentro de um projeto (`IA-ISO`); a investigação lê verdade validada da **empresa inteira** e material de consulta **só do projeto da tarefa** (`BOARD-PESQUISA-015`). O que nunca muda de superfície para superfície é *o que é verdade e o que é consulta*. | Decorre de IA-CONHEC-009 |\n\n**Por que IA-CONHEC-007 não move a fronteira.** A leitura apressada é que isto abre uma exceção em IA-CONHEC-002. Não abre: o corte continua sendo a idéia em `Finalizado`, movida por uma pessoa. O que mudou foi a **extensão** do que aquele ato alcança. Antes, finalizar validava dois campos de texto — título e descrição — e deixava de fora todo o trabalho feito para chegar até eles. Isso nunca fez sentido: ninguém finaliza uma atividade achando que só o resumo dela vale.\n\nNas palavras do Ricardo (06/09/2026): *\"quando o usuário finalizar uma atividade, isso já é um validador por parte do usuário — tudo que está dentro da atividade finalizada deve ser considerado verdade, inclusive os post-its.\"*\n\n**Por que IA-CONHEC-008 existe.** Sem ela, \"tarefa concluída\" viraria um segundo caminho para verdade, paralelo ao de `Finalizado` — e aí sim IA-CONHEC-002 teria uma exceção. Concluir uma tarefa diz \"este trabalho acabou\"; finalizar a atividade diz \"o que saiu daqui vale\". São afirmações diferentes, feitas em momentos diferentes, e só a segunda é uma validação.\n\n**Onde a garantia mora.** Não na instrução ao modelo. `verificacao.ts` recebe, para cada tarefa que foi ao contexto, o `validada` calculado pela **mesma** `ehVerdadeValidada` que decide a categoria de uma idéia. Uma tarefa de atividade aberta citada como \"validada\" é rebaixada e marcada, exatamente como uma hipótese seria (IA-GARANT-003). O modelo não tem como promover nada por conta própria.\n\n**Por que a distinção precisa ser binária (IA-CONHEC-001).** A tentação é criar graus — \"quase validada\", \"em discussão avançada\". Qualquer escala intermediária transfere para o modelo a decisão de onde fica o corte, e é exatamente essa decisão que o Ricardo tomou ao definir a coluna `Finalizado` como fronteira. Duas categorias são verificáveis por código; um espectro não é.\n\n**Por que o alcance precisou ser dito em voz alta (IA-CONHEC-009).** Estas regras nasceram para um painel lateral, e por dez meses foi só isso que existia. Quando a investigação do board foi desenhada (13/09/2026), a primeira versão do plano escreveu uma régua **própria** para ela — mais restrita, lendo só idéias finalizadas. Não era mais segura: era cega. Duas réguas para a mesma pergunta (\"isto é fato do projeto?\") divergem na primeira vez que alguém mexe numa delas, e a divergência só aparece quando um usuário recebe respostas incompatíveis de duas telas da mesma plataforma. A correção foi apagar a régua nova, não afiná-la.\n\n**O que IA-CONHEC-010 impede.** A leitura errada de IA-CONHEC-009 seria \"toda superfície lê exatamente o mesmo conjunto de idéias\". Não é isso. `TEMA-ISO-001` já diz que conhecimento validado é da empresa, e `IA-ISO` já diz que hipótese não atravessa projeto. A régua define **as categorias**; o alcance de cada uma é decisão de quem projeta a superfície, e precisa ser justificado ali — como `BOARD-PESQUISA-015` justifica o dela.\n\n### 1.2 As três camadas de garantia — `IA-GARANT`\n\nPedir ao modelo \"não trate hipótese como verdade\" é a implementação mais frágil possível: funciona quase sempre, e falha justamente quando o texto da idéia é convincente. As regras abaixo existem para que a garantia não dependa disso.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-GARANT-001 | **Separação na origem.** O contexto enviado ao modelo traz dois blocos distintos e rotulados — verdades validadas e hipóteses não validadas. As duas categorias **nunca** chegam misturadas numa lista só com um campo `status` no meio. | Decisão A2 |\n| IA-GARANT-002 | **Resposta com procedência.** Além do texto, o assistente devolve os **ids das idéias que usou** e em que categoria as usou. | Decisão A2 |\n| IA-GARANT-003 | **Verificação no servidor.** Antes de a resposta chegar à tela, o servidor confere o status real de cada idéia citada. Uma idéia citada como validada que não esteja em `Finalizado` é rebaixada e marcada. | Decisão A2 |\n| IA-GARANT-004 | Idéia citada cujo id **não pertence ao projeto** invalida a resposta inteira — ela não é exibida. É sinal de vazamento ou de invenção, e nenhum dos dois pode chegar ao usuário. | Decorre de IA-ISO-004 |\n| IA-GARANT-005 | O servidor nunca \"conserta\" o texto da resposta reescrevendo-o. Ele marca, rebaixa ou recusa — mas não edita o que o modelo disse. | Decisão A3 |\n\n**Por que a camada 3 é a que realmente vale.** É o mesmo princípio que já governa todas as rotas da plataforma: *a tela decide o que mostrar, o servidor decide o que vale*. Sem IA-GARANT-003, a regra do Ricardo seria uma instrução dentro do prompt — ou seja, uma sugestão. Com ela, vira uma checagem determinística sobre dado que o servidor já tem em mãos. IA-GARANT-002 não é enfeite: é o que torna a camada 3 possível.\n\n**Por que o servidor não reescreve (IA-GARANT-005).** Um servidor que corrige a resposta do modelo passa a ser autor dela, e ninguém consegue mais auditar o que veio de onde. Marcar preserva a distinção entre o que a IA disse e o que o sistema verificou.\n\n### 1.3 Quando não há verdade nenhuma — `IA-VAZIO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-VAZIO-001 | Projeto sem nenhuma idéia em `Finalizado` **não tem verdade validada**. O assistente diz isso com todas as letras quando perguntado sobre fatos do projeto. | Decisão A4 |\n| IA-VAZIO-002 | Nesse caso ele **pode** usar o material de consulta, sempre marcado — o que não pode é preencher o silêncio com plausibilidade. | Decorre de IA-CONHEC-003 |\n| IA-VAZIO-003 | Projeto sem idéia alguma: o assistente informa que o quadro está vazio — e, em vez de parar aí, **assume a iniciativa** (IA-VAZIO-005). | Decisão A16 |\n| IA-VAZIO-004 | \"Não sei\" e \"isto ainda não foi validado\" continuam sendo **respostas aceitáveis** quando a pergunta é sobre um fato do projeto que não existe. Não são falhas do produto. | Decisão A4 |\n\n### 1.3.1 Projeto em branco: o assistente guia — `IA-VAZIO` (cont.)\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-VAZIO-005 | Sem nada em `Finalizado`, o assistente **toma a iniciativa**: oferece próximos passos concretos para quem está começando — pesquisar concorrentes, mapear o público, formular as primeiras hipóteses — em vez de apenas declarar ausência. | Instrução do Ricardo, 25/08/2026 |\n| IA-VAZIO-006 | **Sugerir um caminho não é afirmar um fato.** \"Vale começar mapeando seus concorrentes\" é orientação e sempre pode. \"Seus concorrentes são X e Y\" é afirmação sobre o negócio e continua proibida sem estar em `Finalizado`. | Decisão A16 |\n| IA-VAZIO-007 | As sugestões se apoiam **só no que a plataforma sabe de verdade**: nome da empresa, descrição que a própria conta escreveu, e tipo do projeto. O assistente não deduz o ramo, o porte, o mercado ou os concorrentes a partir do nome. | Decisão A17 |\n| IA-VAZIO-008 | Exemplos ilustrativos são permitidos, desde que apresentados como **ponto de partida a validar**, nunca como conhecimento sobre aquela empresa. | Decorre de IA-VAZIO-006 |\n| IA-VAZIO-009 | Nada do que o assistente sugerir vira verdade do projeto por ter sido sugerido, nem por o usuário gostar. Só vira ao ser registrado como idéia e movido para `Finalizado`, por uma pessoa. | Decorre de IA-GERAL-003 |\n\n**Por que a primeira versão desta regra estava errada.** Ela tratava o projeto vazio apenas como **ausência**, e mandava o assistente dizer que não sabia. Só que esse é justamente o momento em que a pessoa mais precisa de ajuda — ela abriu um projeto em branco porque não sabe por onde começar. Um assistente que responde \"não há nada validado\" e para por aí é tecnicamente honesto e praticamente inútil, e contraria a missão da plataforma, que é **guiar** durante o planejamento (`O_que_e_q_plataforma_de_design.md`: \"faz perguntas, sugere metodologias, identifica informações ausentes\").\n\n**O que a correção NÃO afrouxa.** A fronteira continua exatamente onde estava. O que mudou é o reconhecimento de que ela separa *afirmação* de *sugestão* — e não *falar* de *calar*. O assistente ganhou permissão para propor caminhos; não ganhou permissão nenhuma para inventar fatos.\n\n**Por que IA-VAZIO-007 é a regra mais importante deste bloco.** É onde o ajuste desandaria. Uma empresa cadastrada como \"Nike\" pode ser uma loja de bairro que escolheu esse nome — e o modelo tem conhecimento de mundo farto sobre a Nike de verdade. Deduzir mercado, porte ou concorrentes a partir do nome produziria afirmações confiantes sobre um negócio que o assistente não conhece, com aparência de informação interna. A base das sugestões é o que a conta escreveu, não o que o nome sugere.\n\n**Por que isto merece regras próprias.** É o estado mais comum no começo da vida de um projeto — e é onde a pressão para inventar é maior. A honestidade de *carregando / vazio / erro* (EMP-LIST-010) continua valendo sobre conhecimento: **falta de informação nunca vira informação plausível**. O que estas regras acrescentam é que falta de informação também não precisa virar silêncio.\n\n### 1.4 Conhecimento geral — `IA-GERAL`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-GERAL-001 | O assistente **pode** explicar conceitos, metodologias e práticas de mercado que não vêm do quadro — ensinar faz parte da missão da plataforma. | Decisão A5 |\n| IA-GERAL-002 | Conhecimento geral **nunca** é apresentado no mesmo tom que informação do projeto. A resposta deixa claro o que veio do quadro e o que é conhecimento externo. | Decisão A5 |\n| IA-GERAL-003 | Conhecimento geral **não vira verdade do projeto** por ser útil, nem por o usuário concordar com ele. Só entra como verdade se virar idéia e for para `Finalizado` — pela mão de uma pessoa. | Decorre de IA-CONHEC-002 |\n| IA-GERAL-004 | O **assistente** não busca informação externa em tempo real (web, bases de terceiros) nesta versão. A regra é do painel lateral, não da plataforma — ver `IA-GERAL-005`. | Decisão A5 |\n| IA-GERAL-005 | A **investigação do board busca na web por desenho** (`BOARD-PESQUISA`), e isso não contradiz `IA-GERAL-004`: são superfícies diferentes, com propósitos diferentes. Quando as duas origens se encontram na mesma resposta, vale `IA-GERAL-002` — o que veio da web nunca aparece no mesmo tom do que a empresa validou — e cada afirmação vinda da web traz a **fonte** de onde saiu. | Decidido 13/09/2026 com o Ricardo |\n\n**Por que IA-GERAL-003 existe.** É o caminho pelo qual a regra do Ricardo vazaria sem ninguém perceber: o assistente sugere uma prática de mercado, a conversa segue, e três mensagens depois ele se refere àquilo como se fosse decisão do projeto. A fronteira precisa valer **dentro da mesma conversa**, não só na primeira resposta.\n\n**Por que IA-GERAL-004 não proíbe a pesquisa do board.** A frase original dizia \"o assistente não busca informação externa\", e o board sempre buscou — a regra nunca se aplicou a ele, mas o texto não dizia isso, e lida fora de contexto parecia proibir metade do produto. O corte real não é *pode ou não pode ir à web*: é **como o resultado é apresentado**. Uma frase vinda do Google e uma idéia em `Finalizado` não podem chegar ao usuário com o mesmo peso, venham elas do painel ou da investigação — e é `IA-GERAL-002`, não `IA-GERAL-004`, que garante isso.\n\n### 1.5 Ações no quadro — `IA-ACAO`\n\nOrigem: pedido do Ricardo, 26/08/2026, ao corrigir o comportamento de IA-CONHEC-006 — o assistente estava recusando (com erro de formato, não com resposta clara) qualquer pedido para criar uma idéia. A resposta não é \"deixar a IA criar sozinha\": é dar à pessoa um jeito explícito de autorizar a ação, sem tirar dela a decisão.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-ACAO-001 | O assistente **nunca decide, por conta própria**, criar, editar ou mover uma idéia. Arquivar e excluir continuam totalmente fora do alcance dele, propostos ou não. | Decisão A18 |\n| IA-ACAO-002 | Se a pessoa pedir, **nesta mensagem**, para criar, editar ou mover uma idéia, o assistente pode **propor** a ação — nunca afirmar que já fez, porque ele não fez. A proposta viaja junto da resposta, estruturada, e o servidor confere antes de deixá-la visível como algo que se pode confirmar. | Decisão A18 |\n| IA-ACAO-003 | Sem pedido explícito na mensagem atual, o assistente não propõe ação nenhuma — mesmo que a conversa venha discutindo o assunto há várias trocas. Sugerir conteúdo em texto livre (\"você podia ter uma idéia sobre X\") continua sempre permitido; propor a ação estruturada, não. | Decisão A18 |\n| IA-ACAO-004 | A ação só vira escrita real no quadro depois de um **clique explícito de confirmação** da pessoa, numa tela que mostra o que vai ser criado/editado/movido antes do clique. Não existe caminho em que responder \"sim\" em texto livre no chat execute a ação — só o controle dedicado conta. | Decisão A18 |\n| IA-ACAO-005 | A confirmação **não confia** no que foi verificado no momento em que a proposta chegou. Ela roda a mesma validação de conteúdo da criação/edição manual de idéias (IDEIA-CRIA-001/002) de novo, **incluindo a checagem de duplicidade** (IDEIA-DUPL-009), e confere de novo se a idéia referenciada ainda existe e pertence ao projeto — tempo pode ter passado entre a proposta e o clique. | Decorre de IA-GARANT-003; duplicidade em 16/09/2026 |\n| IA-ACAO-006 | Uma proposta só pode ser respondida **uma vez** — confirmada ou descartada. Depois disso ela é estado passado, não uma decisão em aberto; um segundo clique não repete nem desfaz nada. | Decisão A18 |\n| IA-ACAO-010 | O aviso de duplicidade (IDEIA-DUPL-009) **não é uma resposta** para efeito de IA-ACAO-006: nada foi gravado, nada foi descartado, e a proposta continua `pendente`. O clique seguinte em \"Criar mesmo assim\" é a primeira resposta de verdade. | Registrado 16/09/2026 |\n| IA-ACAO-007 | Confirmar uma ação exige o **mesmo papel** que criar/editar/mover uma idéia manualmente (IDEIA-CRIA-001, IDEIA-MOV-004) — um especialista, por exemplo, pode confirmar; quem só lê, não. Descartar não escreve nada no quadro, então qualquer pessoa que enxerga a conversa pode descartar a própria proposta. | Decorre de IDEIA-CRIA/MOV |\n| IA-ACAO-008 | Idéia criada a partir de uma proposta confirmada nasce em `Minhas idéias`, nunca direto em `Finalizado` — mesma regra de IDEIA-CRIA-003. Se o assistente pudesse fazer nascer uma idéia já validada, a fronteira de IA-CONHEC-002 seria contornada pela porta dos fundos. | Decorre de IDEIA-CRIA-003 |\n| IA-ACAO-009 | O assistente **nunca afirma, em texto**, que já criou, editou ou moveu uma idéia — nenhuma variação de \"já fiz isso\" — a menos que a própria resposta traga `acao_proposta` preenchido. Vale mesmo quando a pessoa só confirma em texto livre (\"ok\", \"sim\", \"pode\") depois de uma sugestão: a resposta deve propor a mesma ação de novo, para que um controle de confirmação apareça, e nunca alegar que a ação já aconteceu. O servidor varre o texto por esse padrão de alegação falsa e, quando encontra uma sem proposta real por trás, marca a resposta para a tela avisar — sem reescrever o texto do modelo (IA-GARANT-005). | Decisão A19 |\n\n**Por que a confirmação vive numa rota própria, e não num \"sim\" no chat (IA-ACAO-004).** Interpretar linguagem natural como autorização para escrever é abrir uma classe de erro inteira: \"sim, mas não isso\", um \"sim\" respondendo outra pergunta da conversa, uma ambiguidade que o modelo resolve errado. Um botão que mostra exatamente o que vai acontecer, e só existe enquanto a proposta for a mais recente coisa pendente, não tem essa ambiguidade — a pessoa vê o que vai confirmar antes de confirmar.\n\n**Por que o aviso de duplicidade não queima a proposta (IA-ACAO-010).** Ler IA-ACAO-006 de forma apressada levaria a marcar a sugestão como respondida assim que o aviso aparece — e aí o aviso custaria a proposta: a pessoa teria pago, com a sugestão inteira, o preço de ter sido avisada, e precisaria pedir de novo ao assistente só para poder decidir \"sim, mesmo assim\". O que IA-ACAO-006 protege é contra executar duas vezes ou desfazer por engano; um aviso que não escreveu nada não é nenhuma dessas coisas. Por isso o servidor devolve a parecida e deixa `acaoStatus` intocado.\n\n**Por que a confirmação revalida tudo (IA-ACAO-005).** É o mesmo raciocínio de IA-GARANT-003 aplicado à escrita em vez de à leitura: a proposta que chegou na resposta é o que o MODELO disse que queria fazer, não uma garantia de que ainda é seguro fazer. A idéia referenciada pode ter sido arquivada por outra pessoa nesse meio-tempo; o título pode ter deixado de caber no limite se algo mudou. O servidor não herda confiança da resposta anterior — confere de novo, na hora de escrever de verdade.\n\n**O que isto NÃO é.** Não é a IA ganhando autonomia sobre o quadro. As três camadas de IA-GARANT continuam valendo integralmente para o texto da resposta; o que existe agora é um QUARTO mecanismo, específico para ação, que soma confirmação humana explícita a tudo o que já existia. A pessoa continua sendo a única autora de qualquer mudança real no quadro — o assistente só prepara a proposta que ela decide aceitar ou não.\n\n**Por que IA-ACAO-009 precisou existir.** IA-ACAO-002/004 já deixavam claro, no texto das instruções, que o assistente não deve afirmar que agiu sem ter agido. Isso funcionou na maioria das trocas — e falhou exatamente no caso mais comum: a pessoa responde \"ok\" depois de uma sugestão, sem repetir o pedido, e o modelo tratou isso como se fosse a confirmação de verdade, respondendo \"Card criado!\" com `acao_proposta` nula. Nada foi escrito no quadro, mas a pessoa leu que sim — o mesmo risco que IA-GARANT-003 existe para fechar do lado da leitura, agora do lado da escrita. Reforçar a instrução ajuda, mas pedir não é garantir; por isso o servidor também varre o texto da resposta atrás desse padrão específico de alegação, e marca — nunca reescreve — quando encontra uma sem proposta real por trás. É a mesma dupla camada de sempre: instrução no prompt, verificação determinística no servidor.\n\n---\n\n## 2. O que vai para o modelo\n\nEstrutura do contexto, em ordem:\n\n1. **Instruções do sistema** — as regras acima, incluindo o que fazer quando não há verdade validada.\n2. **Bloco A — Verdades validadas do projeto.** Idéias ativas em `Finalizado`, com id, título, descrição e importância.\n3. **Bloco B — Hipóteses ainda não validadas.** Idéias ativas nas outras duas colunas, mesmos campos, sob rótulo que diz explicitamente que não são fato.\n4. **Identificação do projeto e da empresa** — nome da empresa, a **descrição que a própria conta escreveu** sobre ela, e o tipo do projeto. A descrição entra porque é dado interno de verdade (IA-VAZIO-007), e é o que separa uma sugestão genérica de uma que fala daquele negócio.\n5. **Histórico da conversa** — ver `ia-assistente-conversa.md`.\n6. **A pergunta.**\n\nBlocos A e B são seções separadas e rotuladas. Se o bloco A estiver vazio, ele aparece **assim mesmo**, dizendo que está vazio — omitir a seção deixaria o modelo sem saber a diferença entre \"não há verdade validada\" e \"esqueceram de mandar\".\n\n---\n\n## 3. Contrato da resposta\n\nO modelo devolve estrutura, não só prosa:\n\n| Campo | Conteúdo |\n|---|---|\n| `resposta` | O texto para o usuário |\n| `fontes` | Lista de `{ ideia_id, categoria }`, onde categoria é `validada` ou `hipotese` |\n| `sem_verdade_validada` | `true` quando a resposta foi dada sem nenhuma idéia de `Finalizado` |\n| `acao_proposta` | `null` na grande maioria das respostas. Quando a pessoa pediu para criar/editar/mover uma idéia nesta mensagem: `{ tipo, ...campos }` — ver IA-ACAO-002 |\n| `alerta_acao_sem_proposta` | Calculado pelo servidor, não pelo modelo: `true` quando o texto da resposta alega ter criado/editado/movido algo (IA-ACAO-009) mas esta resposta não trouxe `acao_proposta` válida. A tela mostra um aviso ao lado do texto, sem alterá-lo. |\n\nO servidor então aplica IA-GARANT-003/004 sobre `fontes`, IA-ACAO-002/005 sobre `acao_proposta`, e IA-ACAO-009 sobre o próprio texto de `resposta`, antes de entregar à tela. Uma proposta que não fechar (id fora do projeto, campo fora do limite) vira `null` silenciosamente — ao contrário de uma fonte inválida, ela **não derruba a resposta inteira**: a ação é um extra sobre o texto, não a base dele.\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| A1 | A marcação de \"não validado\" é visual ou só textual? | **Visual e explícita** na resposta. Distinção que existe só no tom da frase se perde na leitura rápida — que é como se lê um chat. | 25/08/2026 |\n| A2 | Como garantir a separação verdade/consulta? | **Três camadas**: separação na origem, procedência na resposta, verificação no servidor. Nenhuma sozinha basta; a terceira é a que não depende do modelo. | 25/08/2026 |\n| A3 | O servidor corrige a resposta do modelo? | **Não.** Marca, rebaixa ou recusa — nunca reescreve. Servidor que reescreve vira coautor e destrói a auditoria. | 25/08/2026 |\n| A4 | O assistente pode dizer \"não sei\"? | **Sim, e deve.** É resposta esperada em projeto novo, não falha. | 25/08/2026 |\n| A16 | Projeto sem nada validado: o assistente cala ou guia? | **Guia.** Toma a iniciativa e oferece próximos passos concretos. A fronteira preservada não é falar/calar, é **sugerir/afirmar**: propor caminho sempre pode; afirmar fato sobre o negócio, não. Corrige a v1.0.0, que tratava o vazio só como ausência. | 25/08/2026 |\n| A17 | As sugestões podem partir do nome da empresa? | **Não.** Só do que a conta escreveu — nome, descrição, tipo do projeto. Deduzir ramo ou concorrentes a partir do nome produziria afirmação confiante sobre um negócio desconhecido, com cara de informação interna. | 25/08/2026 |\n| A5 | Conhecimento geral é permitido? | **Sim, separado e nunca como fato do projeto.** Ensinar é a missão da plataforma. Sem busca externa em tempo real nesta versão. *(Assumido a partir de \"apenas consultar informações internas\" — se você quiser o corte rígido, é uma linha de mudança.)* | 25/08/2026 |\n| A18 | O assistente pode criar/editar/mover idéia quando a pessoa pede? | **Só com confirmação explícita, num controle dedicado — nunca por conta própria.** IA-CONHEC-006 (\"só lê\") virava um erro de formato sempre que alguém pedia para criar um card, em vez de uma recusa clara. A correção não é deixar a IA decidir: é dar à pessoa um \"sim, pode\" que ela aciona de propósito, com a mesma validação de servidor que já existe para a criação manual. | 26/08/2026 |\n| A19 | O modelo às vezes disse \"Card criado!\" sem ter proposto a ação de verdade — como reagir? | **Duas camadas, não uma.** A instrução no prompt foi reforçada para proibir explicitamente o verbo no passado e orientar a repropor a mesma ação quando a pessoa só confirma em texto (\"ok\"). Mas como reforçar a instrução não garante 100% de obediência do modelo (mesmo raciocínio de IA-GARANT-003), o servidor também varre o texto da resposta atrás desse padrão e marca `alerta_acao_sem_proposta` quando encontra a alegação sem proposta real por trás — a tela avisa, o texto do modelo não é reescrito (IA-GARANT-005). | 26/08/2026 |\n\n---\n\n## 5. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| Significado da coluna `Finalizado` | A decisão I5 (`ideias-movimentacao.md`) definiu movimento livre, registrando que a coluna reflete **intenção**, não fato verificável. A partir daqui ela vira a fonte de verdade da IA, e arrastar um card passa a ter consequência real. **Mantido livre, sem confirmação**, para não acrescentar atrito a uma tela aprovada sem pedido explícito. Se um dia isso gerar validação acidental, as opções são: confirmação ao mover, ou um selo de \"validada\" separado da coluna. |\n| Nenhuma verdade é revalidada com o tempo | Uma idéia finalizada há um ano continua valendo como verdade. Não há expiração nem revisão periódica. Aceitável agora; vira problema quando um projeto acumular histórico longo. |\n| Contradição entre verdades | Duas idéias em `Finalizado` podem se contradizer, e nada detecta isso. O assistente hoje trataria as duas como fato. Fora do escopo desta versão. |\n| Custo por resposta | Depende da decisão **D2** (créditos por usuário ou por empresa), aberta desde o módulo de empresas. Ver `ia-assistente-conversa.md` §4. |\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.5.0 | 2026-09-16 | A confirmação de uma ação `criar_ideia`/`editar_ideia` passa a rodar a checagem de duplicidade (IDEIA-DUPL-009) — até aqui ela gravava direto com `db.ideia.create`, então o assistente era uma porta para criar idéia repetida sem nunca ver o aviso. IA-ACAO-005 revisto; nova IA-ACAO-010 deixando escrito que o aviso não conta como resposta para IA-ACAO-006 e a proposta continua pendente. |\n| 1.4.0 | 2026-09-13 | `IA-CONHEC` deixa de ser regra do painel lateral e passa a ser a **régua de todo consumo de conhecimento interno por IA na plataforma** (IA-CONHEC-009), com o alcance de cada categoria ficando a cargo da superfície (IA-CONHEC-010). Motivo: a investigação do board (`planejamento-pesquisa-v2.md` §3.3, `BOARD-PESQUISA-014/015`) chegou a ser desenhada com uma régua própria, mais restrita — e cega para a hipótese que ela existe para confirmar. `IA-GERAL-004` ganhou escopo explícito (é do painel, não da plataforma) e `IA-GERAL-005` registra que a investigação busca na web por desenho, com fonte e sem igualar web a verdade validada. |\n| 1.3.0 | 2026-08-26 | Corrige o modelo alegando ter criado/movido/editado uma idéia quando, na prática, respondia a uma confirmação curta (\"ok\") sem repetir a proposta estruturada — nada era escrito, mas a pessoa lia que sim. Instruções reforçadas para proibir explicitamente o verbo no passado e orientar a repropor a mesma ação (IA-ACAO-009). Novo campo `alerta_acao_sem_proposta`, calculado no servidor por varredura de texto, e novo aviso na tela quando a alegação aparece sem proposta real por trás. Decisão A19. |\n| 1.2.0 | 2026-08-26 | O assistente passa a poder PROPOR criar, editar ou mover uma idéia quando a pessoa pede — nunca decidir sozinho (IA-ACAO-001 a 008, decisão A18). IA-CONHEC-006 revisto para refletir a distinção entre \"ler por conta própria\" e \"agir com confirmação humana\". Novo campo `acao_proposta` no contrato de resposta (§3). Corrige o erro em que pedir a criação de um card quebrava com \"formato inesperado\" em vez de receber uma resposta clara. |\n| 1.1.0 | 2026-08-25 | Projeto em branco deixa de ser tratado só como ausência: o assistente passa a guiar quem está começando (IA-VAZIO-005 a 009). A fronteira foi reafirmada como *sugerir vs. afirmar*, não *falar vs. calar*. Descrição da empresa entra no contexto. Decisões A16 e A17. |\n| 1.0.0 | 2026-08-25 | Documento criado. Categorias de conhecimento (IA-CONHEC), as três camadas de garantia (IA-GARANT), o caso sem verdade validada (IA-VAZIO) e o limite do conhecimento geral (IA-GERAL). Decisões A1 a A5. |\n"},{"id":"ia/ia-assistente-conversa","nome":"ia-assistente-conversa","titulo":"Regras de Negócio — Assistente de IA: a conversa","versao":"1.8.0","status":"Implementado e verificado ao vivo","pagina":"visao_do_projeto.html","ids":["IA-CONV-NARRA","IA-CONV-CADERNO","IA-CONV-001","IA-CONV-006","IA-CONV","IA-CONV-002","IA-CONV-003","IA-CONV-004","IA-CONV-005","IA-GERAL-003","IA-CONV-007","IA-CONV-EST","IA-CONV-008","IA-CONV-009","IA-CONV-010","EMP-LIST-010","IA-CONV-011","IA-VAZIO-004","IA-CONV-FIM","IA-CONV-012","IA-CONV-013","IA-CUSTO","IA-CUSTO-001","IA-CUSTO-002","IA-CUSTO-003","IA-CUSTO-004","IA-CONV-PAINEL","IA-CONV-PAINEL-001","IA-CONV-PAINEL-002","IA-CONV-PAINEL-003","IA-CONV-PAINEL-004","BOARD-IA-002","IA-CONV-NARRA-001","IA-CONV-NARRA-002","IA-CONV-NARRA-009","IA-CONV-NARRA-010","IA-CONV-NARRA-003","IA-CONV-NARRA-004","IA-CONV-NARRA-005","IA-ACAO-009","IA-CONV-NARRA-006","IA-CONV-NARRA-007","IA-CONV-NARRA-008","IA-CONV-CADERNO-001","IA-CONV-CADERNO-002","IA-CONV-CADERNO-003","IA-GERAL-005","IA-CONV-CADERNO-004","BOARD-PESQUISA-047","IA-GARANT-003","BOARD-PESQUISA-012"],"modificado":"2026-09-17T17:57:32.098Z","bytes":34521,"rel":"Regras_de_negocio/modulos/ia/ia-assistente-conversa.md","md":"# Regras de Negócio — Assistente de IA: a conversa\n\n> **Versão:** 1.8.0 · **Status:** Implementado e verificado ao vivo · `IA-CONV-NARRA` **construída em 14/09/2026** · `IA-CONV-CADERNO` **construída em 14/09/2026**\n> **Módulo:** Assistente de IA · **Página:** `visao_do_projeto.html`, `atividade.html` e `board.html` (painel lateral, mesma conversa por projeto — `IA-CONV-001`)\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`ia-assistente-conhecimento.md`](ia-assistente-conhecimento.md) · [`ia-assistente-isolamento.md`](ia-assistente-isolamento.md)\n\n---\n\n## Estado atual da interface\n\nO painel está implementado nas duas páginas (`js/ia.js`): cabeçalho, thread de mensagens persistida, compositor com envio real, estado \"pensando\", procedência das respostas, e o gatilho que recolhe o painel de 320px para 80px (§1.5). A conversa de exemplo fixa no HTML — que falava de inadimplência e moradores vendendo em e-commerce, assunto de outro projeto — saiu (IA-CONV-006).\n\n---\n\n## 1. Regras\n\n### 1.1 A conversa — `IA-CONV`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-001 | A conversa pertence ao **par (projeto, pessoa)**. Cada pessoa tem a sua, dentro de cada projeto. | Decisão A10 |\n| IA-CONV-002 | A conversa é **persistida**. Recarregar a página, trocar de máquina ou voltar dias depois recupera o histórico. | Decisão A11 |\n| IA-CONV-003 | Ninguém vê a conversa de outra pessoa — nem o proprietário da empresa. | Decisão A10 |\n| IA-CONV-004 | O histórico da conversa entra no contexto das perguntas seguintes, **limitado às últimas trocas** (ver A12). | Decisão A12 |\n| IA-CONV-005 | A conversa **não é fonte de verdade**. Nada dito nela vira fato do projeto — só idéia em `Finalizado` vira. | Decorre de IA-GERAL-003 |\n| IA-CONV-006 | A conversa começa **vazia**, com um convite curto. O texto de exemplo que está hoje no HTML sai. | Decidido 25/08/2026 — corrige o protótipo |\n| IA-CONV-007 | Anexos não existem nesta versão. O botão de anexo sai do compositor até haver funcionalidade. | Decisão A13 |\n\n**Por que a conversa é privada por pessoa (IA-CONV-001/003).** Duas razões. A conversa carrega o raciocínio em construção de quem pergunta — inclusive dúvidas que a pessoa não formularia em público, e é justamente isso que faz o assistente útil para quem está aprendendo. E o especialista é alguém de fora: uma conversa compartilhada exporia o que o empreendedor pergunta e o que ele ainda não sabe, para um prestador contratado. Se um dia fizer sentido ter conversa de equipe, ela nasce como recurso próprio, com consentimento — não por herança silenciosa.\n\n**Por que IA-CONV-005 é regra explícita.** O assistente afirma algo, a pessoa concorda, a conversa segue. Sem esta regra, aquilo passa a funcionar como acordo do projeto sem nunca ter virado idéia nem passado por `Finalizado` — e a regra do Ricardo teria sido contornada por conversa, não por código.\n\n**Por que o texto de exemplo precisa sair (IA-CONV-006).** Ele não é neutro: fala de assunto de outro projeto. Qualquer pessoa que abra a página vê uma conversa que não aconteceu, sobre um negócio que não é o dela. Enquanto era protótipo, era cenário; com a página em uso real, vira informação falsa na tela.\n\n### 1.2 Estados obrigatórios — `IA-CONV-EST`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-008 | **Pensando** é um estado visível. Uma resposta de IA leva segundos, e silêncio sem sinal é indistinguível de travamento. | Decisão A14 |\n| IA-CONV-009 | Enquanto uma pergunta está em andamento, o envio fica bloqueado. Não há duas perguntas simultâneas na mesma conversa. | Decisão A14 |\n| IA-CONV-010 | Falha de rede ou provedor indisponível **preserva a pergunta digitada** e oferece tentar de novo. Nunca apaga o que a pessoa escreveu. | Decorre de EMP-LIST-010 |\n| IA-CONV-011 | Erro é erro, e não vira resposta. O assistente jamais responde algo genérico para disfarçar uma falha técnica. | Decorre de IA-VAZIO-004 |\n\nEstados, em ordem:\n\n| Estado | Quando | O que a tela mostra |\n|---|---|---|\n| Vazia | Conversa nova | Convite curto, compositor ativo |\n| Carregando histórico | Abrindo a página | Indicação de carga, compositor bloqueado |\n| Pronta | Histórico carregado | Mensagens e compositor ativo |\n| Pensando | Pergunta enviada | Sinal de atividade, envio bloqueado |\n| Respondida | `200` | Resposta com as marcações de procedência |\n| Sem crédito | `402` | Explica e aponta o caminho de recarga |\n| Indisponível | `503` | Falha do provedor; pergunta preservada, botão de tentar de novo |\n| Erro | Rede ou outro | Mesma coisa: pergunta preservada |\n\n**Por que \"pensando\" merece regra (IA-CONV-008).** É a diferença mais visível entre esta funcionalidade e todas as outras da plataforma. Salvar uma idéia leva milissegundos; responder leva segundos. O padrão de feedback que serve para o resto da plataforma não serve aqui.\n\n### 1.3 Fim da conversa — `IA-CONV-FIM`\n\nOrigem: pedido do Ricardo, 27/08/2026 — a conversa não deve viver mais do que a sessão da pessoa, para não acumular histórico de quem não está mais usando a ferramenta.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-012 | A conversa é apagada quando a **sessão termina**: no logout explícito (botão \"Sair da conta\") ou quando o servidor detecta, na próxima tentativa de uso, que a sessão **expirou por tempo ou inatividade** — token de refresh vencido, revogado ou inexistente. | Decisão A16 |\n| IA-CONV-013 | A apagada é **por pessoa, em todos os projetos** dela — logout é evento de conta, não de projeto (mesmo raciocínio de IA-CONV-001). Só as tabelas da conversa (`ia_conversas`/`ia_mensagens`) são tocadas; nenhum outro dado da pessoa, empresa ou projeto é afetado. | Decisão A16 |\n\n**Isto não contradiz IA-CONV-002/A11 — só delimita até quando.** A conversa continua sobrevivendo a recarregar a página, trocar de máquina ou voltar depois — desde que seja **dentro da mesma sessão**. O que muda é que a sessão deixou de ser considerada \"para sempre\": ela dura o que a sessão de acesso já durava antes disso (sem \"lembrar de mim\": até 12h de inatividade, ou até o navegador fechar, se o cookie de refresh não sobreviver a isso; com \"lembrar de mim\": até 30 dias). \"Construir contexto\" (razão de A11) continua valendo enquanto a pessoa está ativa — só não vale mais depois que ela foi embora de verdade.\n\n**Por que \"inatividade\" não ganhou um relógio próprio.** A primeira ideia foi um temporizador só para isto, independente da sessão. Não faz sentido: a sessão já tem sua própria régua de tempo (o token de refresh), e destruir a conversa antes da sessão acabar seria apagar algo que a pessoa ainda pode estar usando, só porque ficou uma tela parada por alguns minutos lendo ou pensando. \"Inatividade\", aqui, é o próprio motivo pelo qual a sessão expira sozinha — não uma segunda régua.\n\n**Por que \"fechar o navegador\" ficou de fora, por enquanto.** Foi cogitado detectar o fechamento da aba (`pagehide`) e apagar ali. Esbarra numa limitação real do navegador: não existe como distinguir \"fechei a aba\" de \"apertei F5\" nesse evento — as duas coisas disparam o mesmo sinal. Implementar isso apagaria a conversa toda vez que a pessoa recarregasse a página no meio de uma pergunta, o que é pior que o problema que a regra tenta resolver. Sem \"lembrar de mim\" marcado, fechar o navegador de qualquer forma já esvazia o cookie de sessão sozinho — a conversa só continua guardada até a sessão expirar por tempo (IA-CONV-012), não indefinidamente.\n\n**Por que o logout precisou de um ajuste separado.** O botão \"Sair da conta\" (em `empresas.html`, `projetos.html` e `visao_do_projeto.html`) só trocava de página — nunca chamava `POST /auth/logout`, então a sessão nunca era revogada no servidor. Sem esse ajuste, IA-CONV-012 nunca disparava pelo caminho do logout explícito, só pelo de expiração. Corrigido junto: o botão agora chama o logout de verdade antes de sair da página.\n\n### 1.4 Custo — `IA-CUSTO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CUSTO-001 | Toda pergunta consome crédito. Não há uso gratuito ilimitado. | Modelo de negócio da plataforma |\n| IA-CUSTO-002 | Sem saldo, a pergunta é recusada **antes** de chamar o provedor — com `402` e explicação. Nunca se gasta chamada que não será cobrável. | Decisão A15 |\n| IA-CUSTO-003 | Falha do provedor (`503`) **não consome crédito**. Cobrar por resposta que não veio é cobrar por nada. | Decisão A15 |\n| IA-CUSTO-004 | O limite de tamanho da pergunta e do contexto é do servidor, não da tela. Uma pergunta enorme é recusada com `400`, não enviada e cobrada. | Decisão A12 |\n\n### 1.5 Abrir/fechar o painel — `IA-CONV-PAINEL`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-PAINEL-001 | O painel pode ser recolhido (320px → 80px) por um gatilho no canto superior. Recolher não fecha a conversa nem perde o que foi digitado. | Interface existente |\n| IA-CONV-PAINEL-002 | Aberto ou recolhido é **preferência da pessoa, não da tela**. Navegar de uma página com o painel para outra que também tem painel preserva o estado — se estava aberto, chega aberto; se estava recolhido, chega recolhido. | Decisão A18 |\n| IA-CONV-PAINEL-003 | Sem preferência salva (primeira visita), cada tela usa o padrão do Figma para aquela tela — hoje `visao_do_projeto.html`, `matriz_csd.html` e `pesquisa.html` abrem com o painel aberto; `atividade.html` e `Sobre_a_empresa.html` abrem recolhidas. | Interface existente |\n| IA-CONV-PAINEL-004 | A preferência é salva no navegador (`localStorage`), não no servidor. Trocar de máquina ou de navegador volta ao padrão de cada tela (IA-CONV-PAINEL-003) — diferente da conversa em si (IA-CONV-002), que é do servidor. | Decisão A18 |\n\n**Por que a preferência é da pessoa, não da tela (IA-CONV-PAINEL-002).** Antes, cada página decidia sozinha se abria com o painel aberto ou recolhido, e cada navegação reiniciava essa decisão — quem fechava o assistente numa tela via ele reabrir na próxima, mesmo sem ter pedido. Isso lê como o painel ignorando a pessoa. Guardar a preferência (aberto/fechado) e aplicá-la em qualquer tela que tenha o painel resolve isso sem exigir uma tela de configuração.\n\n**Por que fica no navegador e não no servidor (IA-CONV-PAINEL-004).** É preferência de interface, não dado do projeto — não precisa seguir a pessoa entre máquinas, e gravá-la no servidor custaria uma rota só para isto. Simetricamente ao inverso: por não ser dado do projeto, não teria por que reaproveitar a persistência da conversa (IA-CONV-002/003).\n\n### 1.6 A narração da investigação — `IA-CONV-NARRA`\n\nPedido do Ricardo, 13/09/2026: o feedback da pesquisa deve aparecer **como texto dentro do assistente**, contando a etapa que está sendo realizada — como faz o Manus. Hoje ele vive em `#iaAviso`, uma linha no rodapé do compositor: \"Pesquisando… 8s\" e nada mais, por ~10 s (`planejamento-pesquisa-v2.md` L7).\n\nO painel já está na página certa: `board.html` carrega o **mesmo `js/ia.js`** e a **mesma conversa do projeto** (`BOARD-IA-002`). O que estas regras definem é com que direito a investigação escreve nela — e, principalmente, o que ela **não** vira ao escrever.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-NARRA-001 | A investigação do board **narra dentro da thread do assistente** (`#iaThread`), não no rodapé do compositor. Cada etapa concluída acrescenta uma linha à entrada da investigação em curso. | Instrução do Ricardo, 13/09/2026 |\n| IA-CONV-NARRA-002 | A narração é uma **entrada de tipo próprio**, não uma mensagem da conversa: lista separada na memória, persistência própria (`004`), fora do contexto do modelo (`003`). ~~Ela ocupa o mesmo lugar visual, e é a única coisa que compartilha com as mensagens.~~ **Revista em 16/09/2026:** ela compartilha mais do que o lugar — veste a **formatação comum da conversa** e entra na **sequência cronológica** (`009`). O que continua separado é o que importa: de onde ela vem, onde ela é gravada e para onde ela não vai. | Decidido 13/09/2026 com o Ricardo · revista 16/09/2026 |\n| IA-CONV-NARRA-009 | **A narração entra na sequência da conversa, pela hora em que aconteceu.** Um contador único carimba cada item — mensagem ou narração — quando ele entra na tela, e o desenho é uma fila só, ordenada por ele. As duas listas continuam separadas: o que se junta é o desenho. Sem isto, todas as mensagens eram desenhadas e depois todas as narrações, e **uma investigação de ontem aparecia depois de uma pergunta feita agora** — a pessoa mandava uma mensagem e a narração pulava para baixo dela. Contador, e não data: a mensagem otimista ainda não tem data, e a narração marca o tempo em outro relógio; a única pergunta que importa aqui é o que veio antes do quê. | Achado em uso pelo Ricardo · corrigido 16/09/2026 |\n| IA-CONV-NARRA-010 | **Dentro da conversa, escolha é link sublinhado — nunca botão sólido.** Vale para as saídas da narração e para confirmar/descartar uma ação proposta. Um botão sólido no meio do texto é um objeto atravessado na leitura; a conversa é texto, e a ação nasce dele. As classes vêm do sistema de design (`.link`, `.link--sublinhado`, e `.link--apoio` na opção de recusa), documentadas em `styleguide.html`. O elemento continua sendo `\u003cbutton>`: o clique acontece ali, e um `\u003ca>` sem `href` não é link para leitor de tela nenhum. | Decisão do Ricardo, 16/09/2026 |\n| IA-CONV-NARRA-003 | **Narração nunca entra no contexto** enviado ao modelo. `IA-CONV-004` manda o histórico das últimas trocas; passo de investigação fica fora dele, sempre. Sem esta regra, toda pergunta seguinte pagaria tokens para carregar \"buscando 2 de 4\" e o modelo teria que adivinhar quem disse aquilo. | Decorre de IA-CONV-004 |\n| IA-CONV-NARRA-004 | A narração tem **persistência própria** — `passos[]` da investigação (`planejamento-pesquisa-v2.md` §3.1), não `ia_mensagens`. Recarregar a página no meio remonta a narração do banco e reconecta ao que está correndo, em vez de perder uma investigação já paga. | Decorre de IA-CONV-NARRA-002 |\n| IA-CONV-NARRA-005 | Cada passo é emitido **depois de acontecer**, e o texto dele vem do **servidor**, de um vocabulário fechado — nunca do modelo. Narração é relato do que o sistema fez; deixá-la ser escrita por quem está sendo observado é abrir a porta para a investigação contar uma história melhor do que a que aconteceu. | Decorre de IA-ACAO-009 |\n| IA-CONV-NARRA-006 | **Não existe barra de progresso nem percentual.** Etapa concluída é verdade; \"68%\" seria invenção, porque não se sabe quanto falta. Tempo correndo pode, porque é fato. | Decidido 13/09/2026; já era o critério de `js/pesquisa.js` |\n| IA-CONV-NARRA-007 | Falha de etapa **é narrada como falha**, na mesma entrada, e a investigação não fica em silêncio nem finge ter terminado. `IA-CONV-011` vale aqui inteira: erro é erro, e não vira resultado. | Decorre de IA-CONV-011 |\n| IA-CONV-NARRA-008 | A narração é **privada de quem pediu**, como a conversa (`IA-CONV-003`). Outra pessoa com o mesmo board aberto vê o **quadro** que a investigação gerou — ele é da tarefa — e não vê a narração. | Decorre de IA-CONV-003 |\n\n**O que \"tipo próprio\" nunca quis dizer (IA-CONV-NARRA-002, revista).** A regra nasceu para proteger três coisas: a narração vem do servidor e não do modelo (`005`), é gravada em `passos[]` e não em `ia_mensagens` (`004`), e nunca volta ao modelo como contexto (`003`). Nada disso é aparência. Mas a frase \"é a única coisa que compartilha com as mensagens\" foi lida como licença para a narração **parecer** outra coisa — um cartão branco com sombra, dentro de uma thread que não tem cartões —, e o resultado era uma caixa flutuando no meio de uma conversa. Hoje ela veste a formatação comum. A separação que a regra existe para garantir é de **procedência e destino**, não de estilo.\n\n**O bug de ordenação, que só aparece com conversa de verdade (IA-CONV-NARRA-009).** Duas listas, um `innerHTML`: desenhar a primeira inteira e depois a segunda funciona perfeitamente enquanto só existe uma delas. Com as duas, a narração fica **sempre grudada no fim** — a pessoa faz uma pergunta, a resposta chega, e a investigação de ontem reaparece embaixo de tudo, como se tivesse acabado de acontecer. O conserto não foi juntar as listas (isso violaria `002`): foi carimbar a ordem de entrada e ordenar só no desenho.\n\n**Por que link e não botão (IA-CONV-NARRA-010).** O padrão do produto é botão sólido para ação — e é o certo em painel, modal e formulário, onde a ação é o assunto da tela. Na conversa, não: o assunto é o texto, e cada botão sólido no meio dele é um objeto que interrompe a leitura para anunciar-se. Link sublinhado carrega a mesma ação com o peso visual de uma palavra. O componente foi acrescentado ao sistema de design em vez de resolvido localmente, porque a conversa não é a única superfície onde isso vai aparecer.\n\n### 1.x O painel com dois interlocutores — `IA-CONV-CADERNO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| IA-CONV-CADERNO-001 | O compositor do assistente pode falar com **duas coisas diferentes**: o assistente do projeto, que lê o conhecimento interno da empresa, e o **caderno** de uma investigação, que só lê as fontes daquela busca. Qual dos dois recebe a pergunta é decidido por **gesto da pessoa**, nunca por adivinhação sobre o texto digitado. | Fase 3a, 14/09/2026 |\n| IA-CONV-CADERNO-002 | O modo caderno é **visível enquanto durar** e sai com um clique. Um modo que muda o destino da pergunta e não aparece na tela é o tipo de coisa que só se descobre por uma resposta estranha. | Decorre de 001 |\n| IA-CONV-CADERNO-003 | A conversa do caderno **não entra no contexto** enviado ao modelo nas perguntas ao assistente, e vice-versa. Persistência própria, mesma construção de `IA-CONV-NARRA-003`. Sem isto, um achado da web volta depois como coisa que a empresa sabe (`IA-GERAL-005`). | Decorre de IA-GERAL-005 |\n| IA-CONV-CADERNO-004 | A resposta do caderno **se identifica** na tela como vinda das fontes de uma investigação. Quem rolar a conversa depois precisa saber que aquela frase não veio do conhecimento validado da empresa. | Decorre de 003 |\n\n**Como ficou, na prática (14/09/2026).** A narração é uma lista `narracoes` em `js/ia.js`, separada de `mensagens`. Só `mensagens` é persistida e relida pelo servidor para montar o contexto; `narracoes` não é enviada a lugar nenhum e morre com a aba. `IA-CONV-NARRA-003` deixou de depender de alguém lembrar dela: para violá-la seria preciso mover a narração para dentro de `mensagens`, que é uma mudança visível em revisão — e não um esquecimento. `ferramentas/provar-fase0.mjs` confere isso com DOM real: roda uma investigação, faz uma pergunta ao assistente em seguida, e verifica que nenhuma linha da narração foi no corpo do `POST`.\n\nEla vive numa lista e não em DOM anexado por fora porque `desenhar()` reescreve o `innerHTML` inteiro da thread a cada mudança — narração pendurada por fora sumiria na primeira resposta do assistente. O que se paga por isso é um redesenho a cada passo; o que se ganha é a impossibilidade estrutural do vazamento.\n\n**O que ficou de fora da Fase 0.** Os passos internos da busca. A rota de hoje é uma chamada só: não há etapa concluída para relatar enquanto ela corre, e inventar \"buscando 2 de 4\" seria exatamente a promessa que `IA-CONV-NARRA-005` proíbe. O que a narração conta hoje são fatos: como a tarefa foi lida, quantas fontes voltaram, quantos quadros entraram no board — e o tempo correndo no meio, que é a única coisa verdadeira a mostrar durante a espera.\n\n**O painel atende a dois interlocutores, e diz qual dos dois está falando (`IA-CONV-CADERNO`).** Desde 14/09/2026 o mesmo compositor pode perguntar ao assistente do projeto **ou** às fontes de uma investigação. São coisas opostas: o assistente lê o conhecimento interno da empresa; o caderno tem um material fechado e não pode sair dele. A pergunta digitada é indistinguível — *\"e quantas lojas eles têm?\"* serve às duas —, então quem escolhe é a pessoa, por gesto, e o modo fica **visível** enquanto durar. Um roteador que adivinhasse erraria em silêncio, e ninguém teria como saber qual dos dois respondeu.\n\nA separação de contexto é a mesma de `IA-CONV-NARRA-003`, pelo mesmo motivo estrutural: a conversa do caderno tem persistência própria (`pesquisa_perguntas`) e não entra no histórico que vai ao modelo nas perguntas ao assistente. Se entrasse, um achado da web — que só vale com a fonte colada — voltaria depois como coisa que a empresa sabe, contra `IA-GERAL-005`. E a resposta do caderno se identifica na tela, para quem rolar a conversa amanhã saber que aquela frase não veio do conhecimento da empresa. As regras deste caderno vivem em `board-lista.md` (`BOARD-PESQUISA-047` a `052`), porque é da investigação que elas tratam; aqui fica o que muda no **painel**.\n\n**Por que IA-CONV-NARRA-003 é a regra que sustenta as outras.** É tentador implementar a narração como mensagens: a thread já sabe desenhar mensagem, já rola sozinha, já persiste. Custaria pouco e quebraria três regras de uma vez — `IA-CONV-004` (o histórico iria ao modelo cheio de ruído de máquina), `IA-CONV-005` (a conversa não é fonte de verdade, e um passo de investigação parece muito com um fato) e `IA-CUSTO` (tokens pagos por linha que ninguém queria no contexto). Separar o tipo é mais trabalho uma vez; misturar é um vazamento que aparece meses depois, como resposta estranha do assistente que ninguém consegue explicar.\n\n**Por que o texto do passo não vem do modelo (IA-CONV-NARRA-005).** O mesmo raciocínio de `IA-GARANT-003`: o que é determinístico não se pede a um modelo. O servidor sabe quantas buscas saíram e quantas páginas foram lidas — é contagem, não redação. Deixar o modelo narrar acrescentaria custo, latência e a chance de a narração divergir do que a razão vai cobrar.\n\n**O que isto não é.** Não é um segundo assistente, nem uma segunda conversa. É a investigação ganhando voz no painel que já existe — e é por isso que a pergunta de acompanhamento (o \"perguntar ao caderno\" da Fase 3 do plano) não vai precisar de superfície nova: ela é uma mensagem normal, logo abaixo da narração que a motivou.\n\n\n---\n\n---\n\n## 2. Contrato da API\n\n### `GET /empresas/:empresaId/projetos/:projetoId/ia/conversa`\n\nDevolve `{ mensagens: [...] }` — o histórico de quem pediu, naquele projeto. Lista vazia é resposta válida e significa conversa nova.\n\n### `POST /empresas/:empresaId/projetos/:projetoId/ia/perguntas`\n\nContrato completo em [`ia-assistente-isolamento.md`](ia-assistente-isolamento.md) §2.\n\nCada mensagem traz `id`, `autor` (`pessoa` ou `assistente`), `texto`, `criado_em` e, nas do assistente, `fontes` e `sem_verdade_validada`.\n\n---\n\n## 3. Modelo de dados\n\n```\nia_conversas\n  id            uuid (pk)\n  projeto_id    uuid (not null, fk → projetos.id, cascade)\n  usuario_id    uuid (not null, fk → users.id)\n  criado_em     timestamp (not null, default now())\n  atualizado_em timestamp (not null)\n\n  único (projeto_id, usuario_id)   -- uma conversa por pessoa por projeto\n\nia_mensagens\n  id            uuid (pk)\n  conversa_id   uuid (not null, fk → ia_conversas.id, cascade)\n  autor         enum AutorMensagem  ('pessoa' | 'assistente')\n  texto         text (not null)\n  fontes        jsonb (null)        -- [{ideia_id, categoria}], só do assistente\n  criado_em     timestamp (not null, default now())\n\n  índice (conversa_id, criado_em)\n```\n\n`fontes` guarda a procedência **como foi verificada** no momento da resposta (IA-GARANT-003). Se a idéia sair de `Finalizado` depois, a mensagem antiga continua registrando o que valia quando foi dita — reescrever o passado apagaria a única evidência de que a regra foi aplicada.\n\nSem coluna de custo por mensagem: o consumo pertence ao módulo de créditos, ainda não modelado (decisão D2).\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| A10 | A conversa é por pessoa ou compartilhada? | **Por pessoa, dentro de cada projeto.** Ela expõe o que alguém ainda não sabe, e o especialista é de fora. Conversa de equipe, se um dia existir, nasce como recurso próprio. | 25/08/2026 |\n| A11 | A conversa persiste? | **Sim.** Um assistente que esquece tudo a cada recarga não constrói contexto — e construir contexto é a missão da plataforma. | 25/08/2026 |\n| A12 | Quanto histórico entra no contexto? | **As últimas trocas**, com teto no servidor. Mandar tudo cresce custo sem limite e empurra o contexto do quadro para fora da janela. Número exato é ajuste de implementação. | 25/08/2026 |\n| A13 | Anexos no compositor? | **Não nesta versão.** O botão sai. Botão que não faz nada é pior que ausência de botão. | 25/08/2026 |\n| A14 | Como sinalizar o tempo de resposta? | **Estado \"pensando\" visível** e envio bloqueado durante a espera. Segundos de silêncio se leem como travamento. | 25/08/2026 |\n| A15 | Quando cobrar? | **Verifica saldo antes de chamar o provedor**; falha do provedor não consome. Cobrar por resposta que não veio é cobrar por nada. | 25/08/2026 |\n| A16 | A conversa apagada dura para sempre (A11) ou só enquanto a sessão dura? | **Só enquanto a sessão dura.** Apaga no logout explícito e na expiração/inatividade detectada da sessão (IA-CONV-012/013), em todos os projetos da pessoa. Não muda A11 dentro da sessão — muda o que acontece quando ela termina. \"Fechar o navegador\" como gatilho próprio ficou de fora: não há como o navegador distinguir isso de um F5 no meio da conversa. | 27/08/2026 |\n| A17 | `atividade.html` ganha uma conversa própria por idéia/atividade, ou reaproveita a do projeto? | **Reaproveita a do projeto.** `IA-CONV-001` já define a conversa pelo par (projeto, pessoa) — `atividade.html` sempre vive dentro de um projeto (`empresa`/`projeto` na URL), então é a mesma conversa de `visao_do_projeto.html`, sem estado novo nem rota nova. | 29/08/2026 |\n| A18 | O painel aberto/recolhido é por tela ou por pessoa? | **Por pessoa.** O estado viaja com quem navega, salvo no navegador (`localStorage`, não no servidor — é preferência de interface, não dado do projeto). Sem preferência salva, cada tela cai no seu próprio padrão de Figma. | 29/08/2026 |\n| A19 | `board.html` (quadro de uma tarefa) ganha conversa própria por tarefa? | **Não** — mesma resposta e mesmo motivo de A17: `IA-CONV-001` define a conversa pelo par (projeto, pessoa), e abrir o quadro de uma tarefa não muda de projeto. | 29/08/2026 |\n\n---\n\n## 5. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| **Créditos — decisão D2** | Aberta desde o módulo de empresas: crédito por usuário ou por empresa. O assistente é a **primeira funcionalidade que gasta dinheiro de verdade**, então ela deixa de ser teórica. E ativa o risco já registrado em `empresas-listagem.md` §5: criar empresa é ilimitado hoje, então \"crédito por empresa\" transformaria cada empresa nova em cota nova de IA grátis. **Bloqueia a publicação**, não o desenvolvimento. |\n| Preço por pergunta | Quanto uma pergunta custa ao Ricardo e quanto é repassado. Depende do provedor escolhido (`ia-assistente-isolamento.md` §4). |\n| Apagar a conversa manualmente | IA-CONV-012 apaga sozinha quando a sessão termina, mas não há um botão para a própria pessoa limpar o histórico durante uma sessão ativa. Provável requisito, principalmente por privacidade. Fora do escopo desta versão. |\n| Testes automatizados de IA-CONV-012/013 | A apagada mexe direto no banco (`POST /auth/logout`, `GET /auth/sessao`) — este projeto não tem hoje um jeito de testar rota contra banco de verdade (os testes existentes são todos de função pura, sem `db`). Verificado manualmente; fica pendente automatizar
