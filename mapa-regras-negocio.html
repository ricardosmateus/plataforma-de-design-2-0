m de checklist: existe para organizar o trabalho enquanto ele acontece, não para ficar registrada depois. Guardar tarefas excluídas para sempre no banco, sem nenhuma tela que as mostre, seria só peso morto — arquivar sem forma de acessar o arquivo não é arquivar, é enganar.\n\n**Por que otimismo não se aplica aqui (`ATV-TAR-EXCLUI-003`), diferente de mover (`ATV-TAR-ORDEM-004`) ou concluir.** Mover e concluir são reversíveis — dá para arrastar de volta, dá para reabrir. Excluir não tem \"desfazer\": se o card sumisse da tela antes de a API confirmar e a chamada falhasse, a pessoa veria a lista \"errada\" (a tarefa some e reaparece sozinha), o que é pior aqui do que numa reordenação, onde reaparecer no lugar de origem é natural. Esperar a confirmação custa um instante de latência; a alternativa custa confiança na tela.\n\n### 1.6 Concluir a atividade — `ATV-CONCLUIR`\n\nO botão \"Concluir atividade\", no topo da tela, é o atalho que `IDEIA-MOV-014` já previa. Esta seção descreve o botão em si — a confirmação, o que ele grava e o que a pessoa vê depois — não repete a regra de movimentação, que continua vivendo em `ideias-movimentacao.md` §1.4.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-CONCLUIR-001 | Clicar em \"Concluir atividade\" passa por confirmação antes de gravar — mesma proteção contra clique acidental já usada nas demais ações que mudam estado nesta tela. | Interface já existente (`finishModal`) |\n| ATV-CONCLUIR-002 | Confirmar move a idéia para \"Finalizado\" pela API real (`PATCH .../ideias/:id/status`), sempre pelo `id` — nunca por `localStorage` nem por título. | Decorre de `IDEIA-MOV-014/015/016` |\n| ATV-CONCLUIR-003 | Depois de confirmar, a pessoa é levada para `visao_do_projeto.html` — não fica numa tela de atividade que acabou de concluir. | Decisão A21 |\n| ATV-CONCLUIR-004 | A confirmação é anunciada por um alerta flutuante (\"Atividade concluída com sucesso.\") — mostrado em `visao_do_projeto.html`, a tela de destino, não em `atividade.html`, de onde a pessoa saiu. | Decisão A21 |\n\n**Por que o aviso aparece no destino, não na origem (`ATV-CONCLUIR-004`).** A confirmação já fecha o modal e dispara a navegação na mesma ação — não sobra tempo de tela para mostrar um alerta em `atividade.html` e a pessoa conseguir lê-lo antes do redirecionamento acontecer. O aviso é dado em `visao_do_projeto.html` porque é ali que a pessoa realmente chega e vê a idéia já na coluna \"Finalizado\" — o alerta confirma o que os olhos acabaram de ver, em vez de piscar numa tela que já está de saída.\n\n---\n\n### 1.7 Editar tarefa — `ATV-TAR-EDIT`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-TAR-EDIT-001 | Editar uma tarefa altera **título e descrição**, e só. `tipo`, `ordem` e `status` têm cada um a sua própria rota — mesmo raciocínio já registrado na §2 para a reordenação: a ação mais frequente não pode arrastar junto, por acidente, o texto que alguém escreveu. | Registrado 13/09/2026, a partir do código |\n| ATV-TAR-EDIT-002 | Quem cria, edita: proprietário, membro e especialista, a mesma régua de `ATV-TAR-CRIA-004`. Papel sem permissão recebe `403` \"Seu papel não permite editar tarefas.\" | Registrado 13/09/2026; decorre de ATV-TAR-CRIA-004 |\n| ATV-TAR-EDIT-003 | Tarefa inexistente, ou que pertence a outra idéia, devolve `404` — mesma resposta nos dois casos, por `IDEIA-ISO-003/004`. | Registrado 13/09/2026 |\n| ATV-TAR-EDIT-004 | O `tipo` é escolhido na criação e **não muda depois**. Trocar o tipo trocaria o espaço de trabalho que a tarefa abre (`BOARD-ACESSO`), deixando um quadro já preenchido apontando para o lugar errado. | Registrado 13/09/2026, a partir do código — confirmar como decisão (§5) |\n\n**Por que esta seção demorou a existir.** A rota `PUT` está no ar, e a §2 já a mencionava de passada ao justificar por que reordenar tem rota própria — mas nunca teve regra. O histórico da v1.1.0, que dizia \"editar/duplicar/excluir tarefa não foram implementados\", ficou verdadeiro para duplicar, foi corrigido para excluir na v1.3.0, e seguiu valendo por engano para editar até esta conferência.\n\n### 1.8 Sugerir a próxima tarefa — `ATV-GERAR`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-GERAR-001 | O botão **\"Gerar com ajuda da IA\"**, no modal \"Nova tarefa\", preenche Título, Descrição e Tipo com uma proposta. O modal **continua aberto** e tudo é editável: nada é gravado até o Salvar. É o padrão de proposta/confirmação de `IA-ACAO` — **resolve P4** (§5). | Registrado 13/09/2026, a partir de `js/orquestrador-gateway.js` |\n| ATV-GERAR-002 | A proposta é montada **no cliente**, por heurística determinística, em cima do que já está gravado. **Não há chamada a modelo**: não consome crédito (`IA-CUSTO` não se aplica) e não passa pelas garantias de `IA-GARANT`/`IA-CONHEC`, que valem para o que o assistente afirma. | Registrado 13/09/2026 |\n| ATV-GERAR-003 | O botão **mantém o nome \"Gerar com ajuda da IA\"**. Consequência aceita: o rótulo promete mais do que a implementação entrega hoje. Fica registrado para ninguém procurar consumo de crédito que não existe, nem tratar a proposta como saída de modelo. | Decidido 13/09/2026 com o Ricardo |\n| ATV-GERAR-004 | A proposta lê **apenas tarefas concluídas** e as entidades já nomeadas no projeto. Tarefa pendente não entra: ela ainda não tem o que ensinar, e ler o quadro dela devolveria as perguntas que ela mesma vai responder — a proposta competiria com trabalho já em curso. | Registrado 13/09/2026, a partir do código |\n| ATV-GERAR-005 | Descrição de tarefa do tipo `pesquisa` é escrita **como pergunta**. `board.html` classifica a descrição antes de executar e recusa o nível \"conhecimento\" — o que se responde por raciocínio em vez de por fonte. Uma descrição reflexiva nasceria impossível de executar, e a pessoa só descobriria ao abrir o quadro. | Registrado 13/09/2026; decorre do roteador de pesquisa |\n| ATV-GERAR-006 | Evolução prevista: quando `/orquestrador/proxima-tarefa` existir, a heurística sai do cliente e a rota passa a receber o contexto e devolver `{ titulo, descricao, tipo, porque }`. ATV-GERAR-001 não muda — muda quem monta a proposta, e só então ATV-GERAR-002 deixa de valer. | Registrado 13/09/2026, do ponto de ligação marcado no próprio código |\n\n**Onde esta lógica mora, e por que isso é um problema.** As 722 linhas de `js/orquestrador-gateway.js` são governadas por `Skills/orquestrador-atividades.skill`, não por este documento — foi assim que um botão visível numa tela em produção chegou até aqui sem nenhuma regra. É o segundo caso do mesmo padrão: a taxonomia das idéias veio por `categorizacao-taxonomia.skill` e também nasceu sem ID (ver `../ideias/ideias-taxonomia.md`). Arquivo de Skill descreve **como** fazer; ele não substitui a regra que diz **o que** o produto faz.\n\n**Por que ATV-GERAR-002 precisa estar escrita.** Sem ela, a leitura natural de ATV-GERAR-001 é que existe uma chamada de IA no caminho — e a partir daí alguém procura o custo em `IA-CUSTO`, espera as garantias de `IA-GARANT`, ou investiga por que o crédito não baixou. A regra existe para encurtar essa investigação para zero.\n\n---\n\n## 2. Contrato da API\n\nTodas as rotas abaixo seguem a mesma corrente de isolamento já usada em idéias (`empresa → projeto → idéia`, `IDEIA-ISO-003`), e o mesmo padrão de autenticação por cookie das demais rotas.\n\n### `GET /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas`\n\nDevolve `{ tarefas: [...] }`, em ordem. **Encontra ou cria**: se a idéia ainda não tem nenhuma tarefa, esta chamada cria a tarefa-semente a partir do título/descrição da idéia (`ATV-ACESSO-002`) antes de responder — mesmo padrão já usado em `acharOuCriarConversa` (`ia.ts`), para não precisar de uma rota `POST` separada só para o primeiro acesso.\n\n### `POST /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas`\n\n**Corpo:** `{ \"titulo\": string, \"descricao\": string }`. Cria com `status: \"pendente\"` e `ordem` = maior ordem existente + 1 (`ATV-TAR-CRIA-002`).\n\n### `PATCH /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId/ordem`\n\n**Corpo:** `{ \"ordem\": number }` (ou a posição/vizinho de destino — detalhe de implementação). Rota dedicada, e não o `PUT` de edição — mesmo raciocínio já registrado para `IDEIA-MOV` (§2 de `ideias-movimentacao.md`): reordenar é a ação mais frequente da tela, e uma rota própria evita que uma reordenação sobrescreva, por acidente, título ou descrição.\n\n### `PATCH /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId/status`\n\n**Corpo:** `{ \"status\": \"pendente\" | \"concluida\" }`. Só muda esse campo (`ATV-TAR-CONCLUIR-001`).\n\n### `PUT /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId`\n\n**Corpo:** `{ \"titulo\": string, \"descricao\": string }`. Grava só esses dois campos (`ATV-TAR-EDIT-001`); `tipo`, `ordem` e `status` ficam como estão. Devolve `{ tarefa }`.\n\n### `DELETE /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId`\n\nApaga a linha de verdade (`ATV-TAR-EXCLUI-001`) e devolve `{ ok: true }`. Uma segunda chamada sobre a mesma tarefa devolve `404` — já não existe, não é um sucesso silencioso.\n\n| Situação (comum às seis rotas) | Resposta |\n|---|---|\n| Sessão inválida | `401` |\n| Papel não permite | `403` |\n| Qualquer elo da corrente falha, ou tarefa não pertence à idéia informada | `404` |\n\n---\n\n## 3. Modelo de dados (rascunho)\n\n```\ntarefas\n  id            uuid (pk)\n  ideia_id      uuid (not null, fk → ideias.id, cascade)\n  titulo        text (not null, até 60)\n  descricao     text (not null, até 280)\n  status        enum ('pendente' | 'concluida')\n  ordem         int (not null)\n  criado_em     timestamp (default now())\n  atualizado_em timestamp\n```\n\nSem tabela `atividades` — ver §0. `ordem` é um inteiro simples, renumerado a cada reordenação; a lista de tarefas de uma idéia é pequena o bastante para isso ser barato (mesmo espírito do resto do projeto: sem indexação fracionária ou biblioteca nova para um problema pequeno).\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| A17 | O que \"Acessar\" faz numa idéia, e o que nasce na primeira vez? | Move a idéia para \"Em andamento\" e abre a atividade; na primeira vez, cria uma tarefa a partir do título/descrição da idéia. Não há tabela `atividades` — a atividade é a idéia. | 28/08/2026 |\n| A18 | Tarefa nova tem os mesmos limites de campo de uma idéia? | Sim — 60/280 caracteres, mesma régua de `IDEIA-CRIA-001/002`, por consistência entre módulos. | 28/08/2026 |\n| A19 | Reordenar tarefas — só arrastar, ou também teclado? | Os dois, pela mesma função — mesmo padrão já decidido para idéias (`IDEIA-MOV-CAMINHOS`), pela mesma razão de acessibilidade. | 28/08/2026 |\n| A20 | Concluir todas as tarefas conclui a atividade sozinha? | Não. Só o botão \"Concluir atividade\" move a idéia para \"Finalizado\" (`IDEIA-MOV-014`) — concluir tarefas nunca decide isso por conta própria. | 28/08/2026 |\n| A21 | Depois de concluir a atividade, para onde a pessoa vai, e onde ela vê a confirmação? | Vai para `visao_do_projeto.html`; o alerta flutuante de confirmação aparece lá, não em `atividade.html`, sinalizado por `?atividade_concluida=1` na URL de redirecionamento e limpo da URL (`history.replaceState`) depois de mostrado, para um recarregamento da página não repetir o aviso. | 29/08/2026 |\n| A22 | Excluir tarefa apaga de verdade ou arquiva como idéia? E quem pode excluir? | Apaga de verdade — `Tarefa` não tem `arquivado_em`, de propósito (ver nota em `ATV-TAR-EXCLUI-001`). Quem pode excluir são os mesmos três papéis que já podem criar/reordenar/concluir tarefa (`ATV-TAR-CRIA-004`), por consistência — não haveria razão para restringir só a exclusão. | 29/08/2026 |\n| A23 | O painel do assistente nesta tela reaproveita a conversa do projeto ou precisa de uma dimensão nova (P8)? | Reaproveita — `IA-CONV-001` já define a conversa pelo par (projeto, pessoa), não por idéia/atividade. `atividade.html` já vive dentro do contexto de um projeto (`empresa`/`projeto` na URL), então é a mesma conversa que aparece em `visao_do_projeto.html`, não uma nova. | 29/08/2026 |\n| A24 a A29 | Decisões do quadro de trabalho da tarefa (`board.html`). | Ver [`board-lista.md`](board-lista.md) §4 — a numeração é contínua com esta tabela porque `board.html` é do mesmo módulo. | 29/08/2026 |\n\n---\n\n## 5. Pendências abertas (herdadas de `atividade-analise-pre-implementacao.md`, ainda sem resposta)\n\n| Item | Situação |\n|---|---|\n| P2 — Concluir atividade com tarefas pendentes | Ainda não decidido se bloqueia, avisa ou ignora. |\n| ~~P3 — Tipos de tarefa~~ | **Resolvido em 29/08/2026** — `BOARD-ACESSO-001/002` ([`board-lista.md`](board-lista.md), decisão A24): a tarefa ganhou o campo `tipo` (`pesquisa` / `matriz_csd` / `sem_tela`, padrão `sem_tela`), escolhido na criação, e o \"Acessar tarefa\" roteia por ele — não mais comparando o texto do título. O catálogo é **fechado**: um tipo novo entra por migração, não por texto livre. |\n| ~~P4 — \"Gerar tarefas com IA\"~~ | **Resolvido em 13/09/2026** — `ATV-GERAR` (§1.8). Segue sim o padrão de proposta/confirmação: o modal fica aberto, a proposta é editável e nada grava até o Salvar. A decisão já estava tomada em `js/orquestrador-gateway.js` desde 06/09; faltava registrar. Fica aberto, no lugar dela, o **ponto de ligação com o backend** (ATV-GERAR-006): enquanto `/orquestrador/proxima-tarefa` não existir, a proposta é heurística no cliente, sem modelo. |\n| P5 — Editar/excluir a atividade (idéia) a partir desta tela | Modais já existem no protótipo, sem gatilho na interface — ainda não decidido se o escopo inclui isso. |\n| ~~P8 — Conversa do assistente nesta tela~~ | **Resolvido em 29/08/2026** — Decisão A23: reaproveita a conversa do projeto (`IA-CONV-001`). `js/ia.js` foi religado a esta tela (mesmo módulo de `visao_do_projeto.html`), com o mesmo `window.EmpresaAtual`/`window.ProjetoAtual` resolvidos em `js/atividade.js`. |\n| P9 | Confirmado — mesmos três papéis de idéias (`ATV-TAR-CRIA-004`). \"Excluir\" **resolvido** (`ATV-TAR-EXCLUI-004`, Decisão A22, 29/08/2026) e \"editar\" **resolvido** (`ATV-TAR-EDIT-002`, 13/09/2026): os dois seguem a mesma régua. Falta só duplicar (P10). |\n| P10 — Duplicar tarefa | Ainda não decidido se é um clique só ou passa por revisão antes de gravar. Segue só-na-tela, sem persistência. |\n| Imutabilidade do `tipo` (ATV-TAR-EDIT-004) | Foi **lida do código**, não de uma decisão registrada: o `PUT` simplesmente não toca no campo. A regra e o motivo estão escritos; falta confirmar que é intencional e não omissão. Se um dia precisar mudar, exige decidir o que fazer com o quadro já preenchido. Levantada em 13/09/2026. |\n| ~~Excluir tarefa~~ | **Resolvido em 29/08/2026** — `ATV-TAR-EXCLUI` (§1.5): apaga a linha de verdade (sem arquivamento), com confirmação prévia e só some da tela depois que a API confirma. |\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.7.0 | 2026-09-13 | Conferência de `atividade.html` contra o código. Duas seções novas: **§1.7 `ATV-TAR-EDIT`** — a rota `PUT` estava no ar desde antes, citada de passada na §2, e nunca teve regra; a linha do histórico da v1.1.0 que a dava por não implementada seguia valendo por engano. E **§1.8 `ATV-GERAR`** — o botão \"Gerar com ajuda da IA\" é servido por `js/orquestrador-gateway.js` (722 linhas, governadas por `Skills/orquestrador-atividades.skill`) sem nenhuma regra até aqui; fica registrado que a proposta é heurística **no cliente**, sem chamada a modelo, sem consumo de crédito e fora das garantias de `IA-GARANT`. Nome do botão mantido por decisão do Ricardo, com a consequência aceita escrita em ATV-GERAR-003. Contrato do `PUT` acrescentado à §2 e o título dela corrigido — dizia \"rascunho, nada implementado ainda\" com as seis rotas no ar. P4 resolvida, P9 atualizada, duas pendências novas. |\n| 1.6.0 | 2026-08-29 | Acompanha a decisão A31 ([`board-lista.md`](board-lista.md) v1.2.0): **toda tarefa passa a ter um espaço de trabalho**. O tipo `sem_tela` saiu do catálogo — ele era o padrão, e por isso as tarefas criadas antes do campo `tipo` existir ficaram sem o botão \"Acessar tarefa\" e sem como ganhar um. O padrão virou `pesquisa`, inclusive para a **tarefa-semente** de `ATV-ACESSO-002`, agora explícito em `tarefas.ts` (antes herdava o default do banco). O seletor do modal \"Nova tarefa\" virou \"Que tipo de tarefa é esta\", com os dois tipos reais. |\n| 1.5.0 | 2026-08-29 | Resolve **P3** (§5) e liga esta tela ao novo `board.html`: a tarefa ganhou o campo `tipo` e o \"Acessar tarefa\" passou a rotear por ele em `js/atividade.js`, em vez de comparar o texto do título com \"Matriz CSD\" — o mesmo defeito que `IDEIA-MOV-015` já corrigira em outro lugar. Tarefa `sem_tela` não mostra mais o botão (antes ele aparecia sempre e, fora do caso \"Matriz CSD\", não fazia nada). O modal \"Nova tarefa\" ganhou o campo \"Onde esta tarefa acontece\". As regras do quadro em si estão em [`board-lista.md`](board-lista.md) v1.0.0. |\n| 1.4.0 | 2026-08-29 | O painel \"Assistente de IA\" desta tela, que não funcionava (conversa fixa em HTML, sem `js/ia.js` incluído), agora é o mesmo assistente de `visao_do_projeto.html`: `js/ia.js` passou a ser incluído em `atividade.html`, a marcação do painel (`assistant-thread`, `composer-actions`) ganhou os ids `iaThread`/`iaAviso`/`iaEnviar` que o módulo exige, o CSS de `.ia-*`/`.composer-aviso`/estados `:disabled` (ausente neste arquivo) foi copiado de `visao_do_projeto.html`, e `js/atividade.js` passou a gravar `window.EmpresaAtual`/`window.ProjetoAtual` e chamar `IaAssistente.carregar()` depois de resolver empresa e projeto — mesma sequência de `js/ideias.js`. Resolve P8 (Decisão A23): a conversa é a mesma do projeto (`IA-CONV-001`), não uma dimensão nova por atividade. Verificado ao vivo: painel carrega o convite/histórico existente, uma pergunta feita em `atividade.html` recebe resposta real da API, e ao recarregar a página a mesma conversa aparece — confirmando que é a conversa do projeto, compartilhada com `visao_do_projeto.html`. |\n| 1.3.0 | 2026-08-29 | Nova seção `ATV-TAR-EXCLUI` (§1.5), implementando de verdade a exclusão de tarefa: rota `DELETE .../tarefas/:tarefaId` em `api/src/rotas/tarefas.ts` (apaga a linha, sem arquivamento — decisão A22), `AtividadeAcoes.excluir` em `js/atividade.js`, e o handler de `confirmTaskDeleteBtn` em `atividade.html` reescrito para chamar a API real e só remover o card depois da confirmação (antes era só DOM, `task.remove()` sem persistência). Resolve a metade \"excluir\" de P9 e a pendência \"Excluir tarefa\" (§5) — duplicar (P10) continua aberto. `ATV-CONCLUIR` renumerada de §1.5 para §1.6 para abrir espaço. Verificado ao vivo: tarefa criada, excluída, e confirmada ausente depois de recarregar a página (exclusão real, não só visual). |\n| 1.2.0 | 2026-08-29 | Nova seção `ATV-CONCLUIR` (§1.5), descrevendo o botão \"Concluir atividade\" em si: confirmação, gravação pela API real (`IDEIA-MOV-014/015/016`), redirecionamento para `visao_do_projeto.html` e o alerta flutuante de confirmação — que agora aparece na tela de destino, não na de origem (`ATV-CONCLUIR-004`, Decisão A21). Implementado em `js/atividade.js` (`concluirAtividade` acrescenta `?atividade_concluida=1` à URL de retorno) e `visao_do_projeto.html` (lê o parâmetro, mostra o alerta e limpa a URL). Verificado ao vivo: idéia movida para \"Finalizado\", alerta exibido, URL limpa. |\n| 1.1.1 | 2026-08-28 | Verificado ao vivo (Acessar, criar, reordenar, concluir/reabrir tarefa, Concluir atividade — todos persistindo de verdade). Corrigido um bug encontrado na verificação: o selo de status (`.task-status`) que os botões \"Concluir tarefa\"/\"Reabrir tarefa\" atualizam na hora não estava trocando o rótulo visível (\"Tarefa\"/\"Concluída\") nem a classe `task-status--labeled`, então o selo virava um círculo sem texto até a página ser recarregada. |\n| 1.1.0 | 2026-08-28 | **Implementado.** Tabela `tarefas` (schema + migração manual `20260828000000_tarefas`), rotas `GET`/`POST`/`PATCH .../ordem`/`PATCH .../status` em `api/src/rotas/tarefas.ts` (registradas em `servidor.ts`), e `atividade.html` reescrita para consumir a API real via `js/atividade.js` (novo arquivo): título dinâmico da idéia, lista de tarefas carregada por \"encontra ou cria\", criação persistida (corrige o bug do protótipo que não anexava o card criado), arrastar/setas persistindo `ordem` com reversão em falha, concluir/reabrir tarefa persistindo `status` sem navegar para fora da tela (corrige o redirect indevido), e \"Concluir atividade\" agora move a idéia de verdade (`IDEIA-MOV-014/015`) em vez de só navegar. As duas pontes por `localStorage` (`tarefa-1-status`, `nova-tarefa`) foram removidas. Editar/duplicar/excluir tarefa **não** foram implementados — continuam só-na-tela, sem persistência, porque não fazem parte das regras desta versão (P9/P10/\"Excluir tarefa\" seguem abertas, §5). O botão \"Acessar\" em `visao_do_projeto.html` também foi religado: hoje ele move a idéia e abre `atividade.html` quando o card já está em \"Em andamento\"; o caso \"Finalizado\" manteve o comportamento anterior (P3 segue aberta). |\n| 1.0.0 | 2026-08-28 | Documento criado, a partir de `atividade-analise-pre-implementacao.md`. Define o que é a atividade (§0 — sem tabela própria, é a idéia), como ela nasce (`ATV-ACESSO`), como se adiciona tarefa (`ATV-TAR-CRIA`), como se prioriza por ordem (`ATV-TAR-ORDEM`) e como se conclui uma tarefa (`ATV-TAR-CONCLUIR`). Contrato de API e modelo de dados em rascunho. Decisões A17 a A20. |\n"},{"id":"atividades/board-analise-pre-implementacao","nome":"board-analise-pre-implementacao","titulo":"Análise pré-implementação — board.html","versao":null,"status":"Levantamento feito e **respondido**. As regras oficiais vivem agora em [`board-lista.md`](board-lista.md) (v1.0.0, implementado): Q1 a Q3, Q6, Q7 e Q9 foram decididas (decisões A24 a A29); Q4, Q5 e Q8 continuam abertas e estão registradas em `board-lista.md` §5. Este documento fica como o registro de por onde se começou.","pagina":"board.html","ids":["IDEIA-MOV-015","ATV-ACESSO","ATV-TAR-EXCLUI","IA-CONV-006","IA-CONV-PAINEL","IDEIA-CRIA-003","IDEIA-MOV-014","ATV-TAR-CRIA-004","IA-CONV-001","IA-ACAO","IA-CONV"],"modificado":"2026-09-13T11:18:47.114Z","bytes":19264,"rel":"Regras_de_negocio/modulos/atividades/board-analise-pre-implementacao.md","md":"# Análise pré-implementação — `board.html`\n\n> **Módulo:** Atividades (a tela ainda não tem regra oficial — este documento é o levantamento antes dela)\n> **Página:** `board.html` (renomeado de `pesquisa.html` em 29/08/2026 — mesmo arquivo, mesmo conteúdo, só o nome mudou)\n> **Status:** Levantamento feito e **respondido**. As regras oficiais vivem agora em [`board-lista.md`](board-lista.md) (v1.0.0, implementado): Q1 a Q3, Q6, Q7 e Q9 foram decididas (decisões A24 a A29); Q4, Q5 e Q8 continuam abertas e estão registradas em `board-lista.md` §5. Este documento fica como o registro de por onde se começou.\n> **Gerado sob:** `Skills/regra_de_negocio.skill` — fase de análise, antes do planejamento\n> **Documentos irmãos:** [`atividade-analise-pre-implementacao.md`](atividade-analise-pre-implementacao.md) — já cita esta página (como `pesquisa.html`) como o destino pretendido de \"Acessar tarefa\" para tarefas do tipo Pesquisa · [`atividade-lista.md`](atividade-lista.md) — pendência P3 (tipos de tarefa / roteamento do \"Acessar tarefa\") e P8 (assistente, já resolvida lá para `atividade.html`, mas não para esta tela) · [`ia-assistente-conversa.md`](../ia/ia-assistente-conversa.md) — pendência de créditos (decisão D2), diretamente relevante ao que esta tela finge fazer\n\nEste documento existe para reunir, num só lugar, o que `board.html` faz hoje, comparar com o que os outros módulos já decidiram, e levantar as perguntas que faltam responder antes de escrever as regras `BOARD-xxx` de verdade e planejar a implementação — mesmo papel que `atividade-analise-pre-implementacao.md` cumpriu para `atividade.html` antes de virar `atividade-lista.md`.\n\n---\n\n## 1. Onde a página se encaixa hoje\n\n`board.html` não é uma tela desconectada do resto — ela já é citada, pelo nome antigo (`pesquisa.html`), em dois lugares:\n\n- **`atividade-analise-pre-implementacao.md` §2 e §6 (P3):** registra que \"Acessar tarefa\" em `atividade.html` levava a `pesquisa.html` para qualquer tarefa, exceto a de título \"Matriz CSD\" (que ia para `matriz_csd.html`) — e que essa escolha comparava **texto do título**, não um tipo estável, o mesmo defeito que `IDEIA-MOV-015` já teve que corrigir em outro lugar. P3 pergunta explicitamente: os \"tipos\" de tarefa (Pesquisa/Entregáveis/Dinâmicas, vistos no modal \"Nova tarefa\" de `atividade.html`) são uma lista fixa, e cada tipo tem página própria?\n- **`atividade-lista.md` §5, P3:** essa pergunta segue **aberta** — \"ainda não decidido... nem como isso decide para qual página o 'Acessar tarefa' leva (hoje compara o texto do título — bug conhecido, não corrigido por este documento)\".\n\n**O que mudou desde aquela análise:** quando `atividade.html` foi reescrita para falar com a API de verdade (`atividade-lista.md` v1.1.0 em diante), a ponte com `pesquisa.html`/`board.html` **não foi refeita** — ela simplesmente não existe mais no código atual. Hoje, `atividade.html` só navega para `matriz_csd.html`, e só quando o título do card é literalmente `\"Matriz CSD\"` (ver `atividade.html`, comentário: *\"A ponte com pesquisa.html continua pendente (P3, atividade-lista.md §5): aquela tela ainda não fala com a API de tarefas.\"*). Clicar em \"Acessar tarefa\" em qualquer outro card (por exemplo \"Meio de transporte\" ou \"Pesquisar sobre Tuk Tuk\") **não faz nada**.\n\n**Conclusão:** `board.html` continua sendo o módulo que `atividade-analise-pre-implementacao.md` já esperava e citava por nome (como `pesquisa.html`) — só que hoje está **órfã**: nenhuma tela do produto navega até ela. É alcançável apenas digitando a URL diretamente.\n\n---\n\n## 2. Estado atual da interface — o que existe e o que é ilusão\n\nMesmo diagnóstico que já valeu para `atividade.html` e `visao_do_projeto.html` antes de serem implementadas: a tela está **inteiramente pronta visualmente e inteiramente falsa por baixo**. Nenhum `\u003cscript src=\"js/api.js\">`, nenhuma leitura de `?empresa=`/`?projeto=`/`?ideia=` da URL — o arquivo inteiro não tem uma única chamada de rede.\n\n| Aspecto | Situação hoje |\n|---|---|\n| Autenticação / sessão | **Nenhuma.** Sem `js/api.js`, sem verificação de login, sem redirecionamento sem sessão. |\n| Empresa / projeto / idéia / tarefa | **Fixos no HTML.** O painel explicativo mostra sempre \"Meio de transporte das encomendas\" com uma descrição própria (\"Pesquisar todos os meios de transporte...\") que **nem bate** com a descrição real dessa mesma tarefa em `atividade.html` (\"Verificar qual o melhor meio para transportar as encomendas\") — são textos diferentes, confirmando que não vêm da mesma fonte. |\n| Título da aba (`\u003ctitle>`) | Corrigido nesta renomeação: era `\"Tarefas · Matriz CSD · Plataforma de Design\"` — copiado de `matriz_csd.html` e nunca ajustado (mesmo título das duas páginas era um sinal claro de que uma nasceu duplicando a outra). Agora `\"Pesquisa · Plataforma de Design\"`. |\n| Quadro / canvas infinito | **Funciona de verdade, mas só na tela.** Pan/zoom, criar \"Novo quadro\" com N colunas e títulos livres, adicionar \"registro\" (post-it) em uma coluna, arrastar entre colunas, editar e excluir registro — tudo isso mexe no DOM e não persiste em lugar nenhum. Recarregar a página apaga tudo. |\n| Botão \"Voltar\" | Mostra uma animação de \"Salvando...\" por 1,4s (puramente visual — não grava nada, não é autosave de verdade) e então navega para `atividade.html` **sem `?empresa=`/`?projeto=`/`?ideia=`** — perde o contexto que a própria `atividade.html` exige para não redirecionar para fora (`ATV-ACESSO`). |\n| \"Pesquisar\" (botão principal) | Intenção aparente: uma pesquisa assistida por IA que, ao terminar, geraria automaticamente um quadro \"Resultado da Pesquisa\" com colunas fixas (função `criarQuadroResultado()`, já escrita e pronta para ser chamada). **Hoje nunca dispara.** O saldo de créditos mostrado é **fixo no HTML** (`class=\"cr-saldo is-zerado\"`, `0 de 100`) — clicar em \"Pesquisar\" sempre abre o modal \"Créditos insuficientes\", nunca inicia pesquisa nenhuma. Não existe rota de servidor para isso. |\n| \"Adicionar crédito\" → compra via Pix | Abre um formulário que gera um QR code (`\u003ccanvas>`) e um \"código copia e cola\" **inteiramente local** (nenhuma chamada de rede). Não existe rota de créditos ou pagamento em `api/src/rotas/` (só `auth`, `empresas`, `ia`, `ideias`, `projetos`, `tarefas`) — isto não é um bug desta tela, é a **decisão D2 ainda em aberto** (`ia-assistente-conversa.md` §5: \"crédito por usuário ou por empresa... bloqueia a publicação\"), repetida aqui como peça visual antes de existir sistema de créditos de verdade em qualquer lugar do produto. |\n| \"Solicitar ajuda do Designer\" | Botão sem nenhum ouvinte de clique — não faz nada. |\n| \"Editar tarefa\" | Abre modal com título/descrição preenchidos, e \"Salvar\" só reescreve o texto na tela (`explainerTitle`/`.explainer-text`). Não chama API — e hoje **não existe** rota de edição de tarefa no backend (`api/src/rotas/tarefas.ts` tem `GET`/`POST`/`PATCH .../ordem`/`PATCH .../status`/`DELETE`, mas não `PUT`/`PATCH` para título e descrição). |\n| \"Excluir tarefa\" | Confirma, mostra \"Tarefa excluída. Redirecionando...\" e manda para `atividade.html` (de novo sem os parâmetros da URL) — **sem chamar a API**. Diferente do caso de \"Editar\", aqui a rota **já existe** (`DELETE .../tarefas/:tarefaId`, `ATV-TAR-EXCLUI`, implementada nesta mesma sessão) — só não está ligada nesta tela. |\n| \"Finalizar tarefa\" | Confirma, marca o selo como \"Concluído\" na tela, grava duas chaves de `localStorage` (`tarefa-1-status` e `idea-finalizada`, ver §3) e redireciona para `visao_do_projeto.html`. Nenhuma chamada à API de tarefas (`PATCH .../status`, que já existe e já é usada por `atividade.html`). |\n| Assistente de IA (painel lateral) | Mesma casca de `visao_do_projeto.html`/`atividade.html` antes de `js/ia.js` ser ligado: **conversa de exemplo fixa** no HTML (o mesmo texto sobre inadimplência e moradores vendendo em e-commerce, que `IA-CONV-006` já mandou tirar de `visao_do_projeto.html` e `atividade.html`, mas que segue aqui). Sem `\u003cscript src=\"js/ia.js\">`, sem `iaThread`/`iaEnviar`/`iaAviso` — não há como religar sem antes decidir P8 abaixo (esta tela representa uma idéia/atividade específica, ou o assistente aqui seria o mesmo do projeto?). |\n| Painel \"abrir/fechar\" do assistente | **Já funciona de verdade.** Esta tela recebeu, na mesma leva que `atividade.html`, `matriz_csd.html`, `Sobre_a_empresa.html` e `visao_do_projeto.html`, a persistência de aberto/fechado via `localStorage` (`IA-CONV-PAINEL`, `ia-assistente-conversa.md` v1.3.0) — isso é real e não depende de nada resolvido neste documento. |\n| Navegação / menu lateral | A trilha lateral (Início/Empresas/Projetos/Sobre a empresa) navega para fora, mas **nenhum item leva até `board.html`** — mesmo diagnóstico de `atividade.html` antes de existir \"Acessar\". Hoje só é alcançável digitando a URL. |\n| \"Ver empty state\" | Controle deixado no canto inferior direito, com o próprio comentário do código avisando: *\"não faz parte do design\"*. É uma ferramenta de pré-visualização para quem construiu a tela, não um recurso do produto — precisa sair antes de qualquer implementação real. |\n\n---\n\n## 3. Um sinal a **não** seguir: `idea-finalizada`, de novo\n\nIgual ao que `atividade-analise-pre-implementacao.md` §3 já registrou sobre este mesmo comportamento (na época descrito a partir de `pesquisa.html`, o nome antigo deste arquivo): ao confirmar \"Finalizar tarefa\" aqui, o código grava `idea-finalizada` no `localStorage` com título/descrição/importância — como se fosse **criar uma idéia nova** direto na coluna \"Finalizado\" de `visao_do_projeto.html`.\n\nDuas coisas continuam valendo, sem mudança desde a análise anterior:\n\n1. **Essa chave nunca é lida em `visao_do_projeto.html`** — é código morto, nunca ficou conectada.\n2. **Se fosse implementada como está, contradiria `IDEIA-CRIA-003`** (\"toda idéia nasce em 'Minhas idéias'... não é possível criar já em outra coluna\") e ignoraria o caminho que já foi decidido para este exato cenário: `IDEIA-MOV-014/015/016` (`ideias-movimentacao.md` §1.4) — **mover a idéia existente, pelo `id`**, para \"Finalizado\", nunca criar uma nova.\n\nEste documento repete o registro porque `board.html` é hoje o único lugar do código onde esse padrão rejeitado ainda está escrito — vale apagar, não reaproveitar, ao construir de verdade.\n\n---\n\n## 4. O que já está decidido e não deveria ser reaberto aqui\n\n- **`IDEIA-MOV-014/015/016`** — concluir a atividade (ou, por extensão, a tarefa que a representa) move a idéia **existente**, pelo `id`, para \"Finalizado\"; a mudança é persistida pela API. Isso já invalida o par `tarefa-1-status`/`idea-finalizada` como estavam.\n- **`IDEIA-CRIA-003`** — nenhuma idéia nasce fora de \"Minhas idéias\" (ver §3).\n- **`ATV-TAR-EXCLUI`** (`atividade-lista.md` §1.5) — excluir tarefa já tem rota real (`DELETE .../tarefas/:tarefaId`), papéis definidos (proprietário/membro/especialista) e é \"apaga de verdade\", sem arquivamento. O botão \"Excluir tarefa\" desta tela deveria chamar essa mesma rota, não reinventar.\n- **`ATV-TAR-CRIA-004`** — os três papéis que podem escrever numa tarefa (criar/reordenar/concluir/excluir) já estão definidos; qualquer ação de escrita nesta tela (editar, finalizar, excluir) deveria seguir a mesma régua, não uma nova.\n- **`IA-CONV-001`/`IA-CONV-PAINEL`** — a conversa do assistente é por (projeto, pessoa), e o painel aberto/fechado já é preferência salva por pessoa, entre telas. Isso já resolve **metade** de P8 abaixo (o \"abrir/fechar\" já funciona aqui) — falta só religar a conversa em si.\n- **Decisão D2 (créditos, em aberto)** — não é deste documento decidir crédito por usuário ou por empresa; é só registrar que o \"Pesquisar\"/\"Adicionar crédito\" desta tela é a **segunda** peça de produto (depois do assistente) que depende dessa decisão para deixar de ser encenação.\n\n---\n\n## 5. Perguntas em aberto — precisam de decisão antes do planejamento\n\n| # | Pergunta | Por que importa |\n|---|---|---|\n| Q1 | `board.html` é a tela de destino de **todo** tipo de tarefa \"Pesquisa\", ou é mais genérica — um quadro de canvas livre que qualquer tarefa (de qualquer tipo) pode abrir para organizar anotações? O canvas aqui não tem colunas fixas (diferente de `matriz_csd.html`), então parece mais um \"quadro em branco\" do que uma ferramenta exclusiva de pesquisa. | Decide se o nome/identidade do produto para esta tela é \"tela de tarefa tipo Pesquisa\" ou \"quadro genérico anexado a uma tarefa\" — muda o texto da interface e o que P3 (`atividade-lista.md`) precisa decidir junto. |\n| Q2 | Como `atividade.html` volta a levar até aqui? Precisa decidir P3 (`atividade-lista.md` §5) primeiro: tarefa ganha um campo `tipo` estável (não mais comparação de título), e esse tipo decide entre `matriz_csd.html`, `board.html`, ou nenhum (tarefa sem tela própria)? | Sem isso, `board.html` continua inalcançável por navegação normal, só por URL direta. |\n| Q3 | O quadro (colunas + registros) criado aqui pertence à **tarefa**, ou à **idéia/atividade** inteira? Se pertence à tarefa, o modelo de dados precisa de uma tabela nova (`quadros`/`registros`) ligada a `tarefas.id`; se for por atividade, mais gente pode ver o mesmo quadro ao entrar por tarefas diferentes. | Define o modelo de dados e se dois membros da mesma atividade veem o mesmo quadro ou quadros separados por tarefa. |\n| Q4 | \"Pesquisar\" deveria mesmo ser uma chamada de IA que gera um quadro pronto (como o código sugere, `criarQuadroResultado()`), seguindo o padrão de proposta/confirmação já usado em outros lugares (`IA-ACAO`) — a IA nunca grava sozinha, só propõe — ou é outro fluxo, mais parecido com uma busca? | Muda o contrato de API: uma pergunta ao assistente de projeto (`POST .../ia/perguntas`) é isolada por (projeto, pessoa); gerar um quadro de pesquisa por tarefa seria uma capacidade nova, fora do que `IA-CONV`/`IA-ACAO` cobrem hoje. |\n| Q5 | O sistema de créditos (decisão D2, ainda aberta) é o mesmo que vai valer para o assistente de conversa, ou \"Pesquisar\" tem um custo/medidor próprio, separado? | Muda se esta tela pode esperar a decisão D2 ser tomada em outro lugar, ou se precisa da sua própria decisão de cobrança. |\n| Q6 | O assistente desta tela é o mesmo do projeto (reaproveita `IA-CONV-001`, como `atividade.html` já faz — `A17`, `ia-assistente-conversa.md`), ou, por esta tela representar uma tarefa específica, faz sentido ver a conversa filtrada/ligada a essa tarefa? | Se for a mesma conversa do projeto, religar é mecânico (mesmo padrão de `js/ideias.js`/`js/atividade.js`: `window.EmpresaAtual`/`ProjetoAtual` + `IaAssistente.carregar()`). Se precisar de recorte por tarefa, é modelo de dados novo. |\n| Q7 | \"Editar tarefa\" e \"Excluir tarefa\" aqui devem só chamar as rotas que **já existem** (`DELETE` já existe; edição de título/descrição ainda não existe em lugar nenhum do backend) — ou faz mais sentido que edição/exclusão de tarefa aconteçam **só** em `atividade.html` (que já lista todas as tarefas), e esta tela nem tenha esses botões? | Evita manter duas implementações da mesma ação de escrita em duas telas — o mesmo raciocínio que já vale para \"Concluir tarefa\" (`atividade.html`) vs. \"Concluir atividade\" (mesmo texto, ações diferentes, já registrado como defeito no protótipo de `atividade.html`). |\n| Q8 | \"Solicitar ajuda do Designer\" — o que essa ação deveria fazer de verdade? Abrir um canal de contato, criar um pedido/ticket, marcar a tarefa de algum jeito? Hoje é um botão morto. | Sem saber a intenção, não dá para decidir se é uma funcionalidade nova (com modelo de dados própria) ou se sai da tela. |\n| Q9 | O quadro (Novo quadro/Novo registro) persiste no servidor, ou fica só na sessão do navegador — mesma pendência já aceita para a ordem das idéias (`ideias-movimentacao.md` §4) e para a ordem das tarefas? | Se não persistir, a tela existe só como rascunho de uma visita — o trabalho de organizar a pesquisa desaparece ao sair. |\n\n---\n\n## 6. Defeitos do protótipo a corrigir ao construir (não são decisões, são bugs)\n\n- \"Voltar\", \"Finalizar tarefa\" e \"Excluir tarefa\" navegam para `atividade.html` **sem** `?empresa=`/`?projeto=`/`?ideia=` — hoje isso faria `atividade.html` (já implementada) redirecionar para fora por falta de contexto (`ATV-ACESSO`).\n- Descrição da tarefa mostrada aqui (\"Pesquisar todos os meios de transporte...\") não bate com a descrição real da mesma tarefa em `atividade.html` (\"Verificar qual o melhor meio para transportar as encomendas\") — sinal de que nunca vieram da mesma fonte.\n- \"Finalizar tarefa\" grava `idea-finalizada`, um padrão já identificado e rejeitado (§3) — criaria idéia nova em vez de mover a existente.\n- Conversa de exemplo fixa do assistente (mesmo texto de `IA-CONV-006`) ainda não removida aqui.\n- \"Solicitar ajuda do Designer\" sem nenhum comportamento.\n- \"Ver empty state\" é controle de pré-visualização de quem construiu a tela, não deveria chegar a produção.\n- `\u003ctitle>` da aba estava copiado de `matriz_csd.html` (já corrigido nesta renomeação).\n\n---\n\n## 7. Classificação (conforme `Skills/regra_de_negocio.skill`)\n\n**Impacto desconhecido / módulo novo.** Não há regra existente sendo contradita pelo que a tela tenta fazer — as regras já escritas em outros módulos (`IDEIA-MOV-014/015/016`, `IDEIA-CRIA-003`, `ATV-TAR-EXCLUI`, `IA-CONV-001`, `IA-CONV-PAINEL`) são compatíveis, só ainda não foram ligadas aqui. Um trecho específico do protótipo (`idea-finalizada`, §3) **contradiz** `IDEIA-CRIA-003` e não deveria ser reaproveitado. O que falta não é resolver conflito — é decidir as perguntas da §5 para poder escrever as regras `BOARD-xxx` de verdade.\n\n---\n\n## 8. Próximo passo sugerido\n\nResponder Q1–Q9 (ou marcar as que preferir decidir só na hora do planejamento) — em especial Q1/Q2, porque sem elas nem o nome definitivo da funcionalidade nem o caminho de navegação até a tela têm resposta. A partir das respostas, o passo seguinte é o planejamento formal (arquivos afetados, contrato de API, modelo de dados definitivo, critérios de aceite) e então a regra oficial `board-lista.md` (ou o nome que fizer sentido depois de Q1), como já aconteceu com `atividade.html` → `atividade-lista.md`.\n\n---\n\n## 9. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.0.0 | 2026-08-29 | Documento criado. `pesquisa.html` renomeado para `board.html` (mesmo conteúdo — arquivo não tinha nenhuma referência funcional ao próprio nome, e nenhuma outra página linka para ele hoje, então o rename não quebrou nada). `\u003ctitle>` da aba corrigido (estava copiado de `matriz_csd.html`). Levantamento completo do estado atual (§2), do padrão já rejeitado `idea-finalizada` (§3), do que já está decidido e não deveria ser reaberto (§4), e nove perguntas em aberto (§5, Q1–Q9) — nenhuma regra `BOARD-xxx` foi escrita ainda. |\n"},{"id":"atividades/board-lista","nome":"board-lista","titulo":"Regras de Negócio — Quadro de Trabalho de uma Tarefa","versao":"1.37.0","status":"Implementado","pagina":"board.html","ids":["BOARD-PESQUISA-012","BOARD-ACESSO","BOARD-ACESSO-001","BOARD-ACESSO-002","ATV-ACESSO-002","BOARD-ACESSO-007","BOARD-ACESSO-003","IDEIA-ISO-002","BOARD-ACESSO-004","ATV-ACESSO-005","BOARD-ACESSO-005","BOARD-ACESSO-006","IDEIA-MOV-009","IDEIA-MOV-015","BOARD-QUADRO","BOARD-QUADRO-001","BOARD-QUADRO-002","BOARD-QUADRO-006","BOARD-QUADRO-003","BOARD-QUADRO-004","BOARD-QUADRO-005","ATV-TAR-EXCLUI-001","BOARD-QUADRO-007","BOARD-QUADRO-008","BOARD-SALVA-002","BOARD-QUADRO-009","BOARD-QUADRO-010","BOARD-QUADRO-011","BOARD-SALVA","BOARD-SALVA-001","BOARD-SALVA-003","BOARD-SALVA-004","ATV-TAR-CRIA-004","BOARD-SALVA-005","IDEIA-MOV-013","BOARD-SALVA-006","BOARD-SALVA-007","BOARD-TAREFA","BOARD-TAREFA-001","ATV-TAR-CONCLUIR","ATV-TAR-CONCLUIR-001","BOARD-TAREFA-002","ATV-TAR-EXCLUI","BOARD-TAREFA-003","BOARD-TAREFA-004","IDEIA-MOV-014","BOARD-TAREFA-005","ATV-ACESSO-001","IDEIA-CRIA-003","BOARD-REGISTRO","BOARD-REGISTRO-001","ATV-TAR-CRIA","BOARD-IA","BOARD-IA-001","BOARD-IA-002","IA-CONV-001","BOARD-IA-003","BOARD-PESQUISA-016","BOARD-LEITURA","BOARD-LEITURA-001"],"modificado":"2026-09-17T18:15:22.480Z","bytes":146101,"rel":"Regras_de_negocio/modulos/atividades/board-lista.md","md":"# Regras de Negócio — Quadro de Trabalho de uma Tarefa\n\n> **Versão:** 1.37.0 · **Status:** Implementado · BOARD-PESQUISA-012 a 087 **construídas**\n> **Conferido em:** 15/09/2026, contra `board.html`, `js/board.js`, `js/pesquisa.js`, `js/ia.js`, `api/src/rotas/pesquisa.ts`, `api/src/pesquisa/investigacao.ts` e `api/prisma/schema.prisma`\n> **Módulo:** Atividades · **Página:** `board.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`atividade-lista.md`](atividade-lista.md) — de onde vem a tarefa e quem pode mexer nela · [`board-analise-pre-implementacao.md`](board-analise-pre-implementacao.md) — o levantamento que precedeu estas regras · [`ideias-movimentacao.md`](../ideias/ideias-movimentacao.md) · [`ia-assistente-conversa.md`](../ia/ia-assistente-conversa.md)\n\nUma tarefa da atividade pode ter um espaço de trabalho próprio: um canvas onde a pessoa monta quadros de colunas e enche de registros. É isso que `board.html` é. Ela não substitui a lista de tarefas — ela é o *dentro* de uma tarefa.\n\n---\n\n## 1. Regras\n\n### 1.1 Como se chega aqui — `BOARD-ACESSO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-ACESSO-001 | O campo **`tipo`** da tarefa decide **o que acontece** quando ela é acessada. Hoje os dois tipos abrem uma tela local (`pesquisa` → `board.html`, `matriz_csd` → `matriz_csd.html`); amanhã um tipo pode disparar uma ferramenta externa que traz o conteúdo pronto. Nunca se decide pelo texto do título. | Decisão A24, ampliada por A31 |\n| BOARD-ACESSO-002 | **Toda tarefa tem um espaço de trabalho.** `tipo` é escolhido na criação e o padrão é **`pesquisa`** — inclusive para a tarefa-semente (`ATV-ACESSO-002`). Não existe tarefa sem destino. | Decisão A31 |\n| BOARD-ACESSO-007 | O catálogo de tipos é **fechado no banco** e cresce por migração — nunca por texto livre. Um tipo cujo destino ainda não foi construído não mostra o botão \"Acessar tarefa\" (rede de segurança de A13), mas isso é estado de obra, não um tipo válido em produção. | Decisão A31 |\n| BOARD-ACESSO-003 | `board.html` só abre com os **quatro ids** na URL (`empresa`, `projeto`, `ideia`, `tarefa`). Faltando qualquer um, é navegação inválida: volta para o lugar mais próximo que ainda faz sentido, não mostra estado vazio. | Decorre de IDEIA-ISO-002 |\n| BOARD-ACESSO-004 | O painel da esquerda mostra o título, a descrição e o status **da tarefa de verdade**, lidos da API. | Decorre de ATV-ACESSO-005 |\n| BOARD-ACESSO-005 | Tarefa concluída abre em **somente leitura** — sem criar, editar, mover ou excluir. O modo vem do `status` da tarefa, nunca de um parâmetro na URL. | Decisão A27 |\n| BOARD-ACESSO-006 | São **dois caminhos** até a tela — o botão \"Acessar tarefa\" do card e o item \"Acessar\" do menu de três pontinhos — e os dois usam o **mesmo destino**, calculado uma vez por card. Nenhum dos dois decide para onde ir por conta própria. | Decorre de IDEIA-MOV-009 |\n\n**Por que o `tipo` e não o título (BOARD-ACESSO-001).** O protótipo decidia o destino comparando o texto do título com `\"Matriz CSD\"`. É exatamente o defeito que `IDEIA-MOV-015` já teve que corrigir na ponte entre o quadro de idéias e a atividade, e quebra das mesmas três maneiras: dois títulos iguais, título editado depois, e nenhuma forma de uma tarefa nova declarar que tela ela quer. Um campo fechado no banco resolve os três.\n\n**Por que `sem_tela` deixou de existir (BOARD-ACESSO-002).** A v1.0.0 tinha um terceiro tipo, `sem_tela`, para a tarefa que era só um item de lista — e ele era o padrão. Isso quebrou em uso real: toda tarefa criada antes da migração herdou `sem_tela`, ficou sem o botão \"Acessar tarefa\", e — como não existe rota para editar o tipo de uma tarefa — ficou **permanentemente sem como abrir**. Duas tarefas órfãs na mesma atividade.\n\nA correção não foi mostrar o botão mesmo assim: foi remover o conceito. Toda tarefa tem onde trabalhar, e o tipo diz **que trabalho é**, não **se existe trabalho**. O padrão passou a ser `pesquisa` porque descobrir é o primeiro movimento de qualquer atividade — é o que a tarefa-semente faz por definição, copiando título e descrição da idéia.\n\n**Por que o campo se chama `tipo` e não `tela` (BOARD-ACESSO-001).** Porque a tela é consequência, não a coisa. Hoje escolher \"Pesquisa\" abre um quadro em branco para a pessoa preencher; a intenção é que passe a disparar uma busca externa que devolve o quadro **já preenchido** com o que ela procurava. O nome do campo precisa sobreviver a essa mudança — e sobrevive, porque o que a pessoa escolhe é o tipo de trabalho, não o destino do clique.\n\n**Por que os dois caminhos leem o mesmo valor (BOARD-ACESSO-006).** É `IDEIA-MOV-009` outra vez (\"três gestos, uma porta\"): dois caminhos para a mesma ação são duas chances de divergirem — alguém corrige o roteamento do botão e esquece do menu, e a tela passa a levar a lugares diferentes dependendo de onde se clicou. Era exatamente o estado anterior: o botão do card já roteava pelo `tipo`, enquanto o menu ainda comparava o título com \"Matriz CSD\" e, em qualquer outra tarefa, fechava sem fazer nada. O destino agora é calculado uma vez, gravado no card como `data-destino`, e lido pelos dois.\n\n**Por que o modo leitura vem do status (BOARD-ACESSO-005).** Antes vinha de `?modo=leitura` na URL — quer dizer, de qualquer coisa que a pessoa digitasse na barra de endereço. Uma tarefa concluída abria editável se o parâmetro sumisse, e uma pendente abria travada se alguém colasse o link errado. O status está no banco; a query string é palpite.\n\n### 1.2 O quadro — `BOARD-QUADRO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-QUADRO-001 | O quadro pertence à **tarefa**, não à atividade. Cada tarefa tem o seu; abrir outra tarefa mostra outro quadro. | Decisão A25 |\n| BOARD-QUADRO-002 | No formato de post-its a estrutura é **quadro > coluna > registro**: um quadro tem N colunas; cada coluna tem N registros. O formato documento não tem colunas — ver BOARD-QUADRO-006. | Interface existente; ressalva acrescentada em 13/09/2026 |\n| BOARD-QUADRO-003 | Título de **quadro** e de **coluna** podem ser vazios — é escolha de layout, e a interface já oferece \"deixe em branco para uma coluna sem título\". O título do **registro** não pode: um card sem texto é um card que ninguém sabe ler. | Interface existente |\n| BOARD-QUADRO-004 | **A tela é sempre o canvas.** Não existe estado vazio de tela cheia: tarefa sem quadro mostra a mesma superfície de trabalho, com \"Novo quadro\" no rodapé. | Decisão A33 |\n| BOARD-QUADRO-005 | Excluir a tarefa apaga o quadro dela junto. | Decorre de ATV-TAR-EXCLUI-001 |\n| BOARD-QUADRO-006 | Existem **dois formatos de quadro**, no campo `tipo` (`postits`, padrão, e `documento`). O de post-its segue a estrutura de BOARD-QUADRO-002; o de documento **não tem colunas** — o texto inteiro é um registro, e as referências são um segundo registro com título fixo. | Registrado 13/09/2026, a partir do schema e de `lerDaTela()` |\n| BOARD-QUADRO-007 | As referências de um quadro-documento são guardadas **separadas do texto**, nunca emendadas no fim dele. Emendar obrigaria a separá-las de novo por adivinhação ao reabrir. | Registrado 13/09/2026 |\n| BOARD-QUADRO-008 | O editor de referências **não tira a lista do DOM** enquanto se edita: apenas a esconde. Um autosave disparado no meio da edição (a pesquisa termina, alguém arrasta um quadro) gravaria o quadro sem as referências — que é como um editor destes costuma apagar dado sem ninguém perceber. | Registrado 13/09/2026; decorre de BOARD-SALVA-002 |\n| BOARD-QUADRO-009 | Quadros têm **ordem** dentro da tarefa, persistida em `quadros.ordem`. Arrastar um quadro pelo cabeçalho troca a ordem; excluir um faz os seguintes deslizarem para fechar o buraco. | Registrado 13/09/2026, a partir de `drag-drop-quadros.js` e `reorganizar-quadros.js` |\n| BOARD-QUADRO-010 | Arrastar quadro respeita o **zoom do canvas** (o deslocamento é dividido pela escala real do stage) e só começa depois de um **limiar** de movimento — sem o primeiro o quadro foge do cursor, sem o segundo clicar no título ou abrir o menu sacode o quadro. | Registrado 13/09/2026 |\n| BOARD-QUADRO-011 | Uma resposta de pesquisa é dividida em quadros por seção, com as referências associadas a cada uma, e o **formato de cada quadro é decidido pelo conteúdo** (documento ou post-its). | Registrado 13/09/2026, a partir de `resposta-para-quadros.js` |\n\n**Por que o quadro é da tarefa (BOARD-QUADRO-001).** A alternativa — um quadro por atividade, compartilhado por todas as tarefas dela — era defensável: daria um espaço comum onde o trabalho de várias tarefas se encontra. Perdemos isso de propósito. A tela abre no contexto de **uma** tarefa e mostra o título dela no painel da esquerda; um quadro compartilhado faria duas tarefas diferentes mostrarem o mesmo conteúdo sob dois títulos diferentes, e ninguém saberia a qual das duas um registro pertence.\n\n**Por que três tabelas e não um `Json` (BOARD-QUADRO-002).** Guardar o quadro inteiro como um documento seria menos código hoje. O registro, porém, é a unidade que a pessoa move, edita e um dia vai querer procurar entre tarefas — e nada disso se consulta dentro de um blob. O custo de normalizar agora é uma migração; o de desnormalizar depois é uma migração **mais** todo o código que aprendeu a ler o blob.\n\n**Por que não existe tela de estado vazio (BOARD-QUADRO-004).** Havia uma: ilustração, título e um botão \"Novo quadro\", ocupando a tela inteira no lugar do canvas. Ela saiu por duas razões.\n\nA primeira é que ela estava condenada. A direção do produto é que a tarefa **chegue com conteúdo** — criado por quem abriu, ou trazido por uma ferramenta externa a partir do `tipo` (§5). Uma tela cujo propósito é dizer \"ainda não há nada aqui\" desaparece junto com o problema que ela descreve; construir em cima dela é construir sobre algo que se sabe temporário.\n\nA segunda é que ela atrapalhava agora. Para aparecer, escondia o canvas **e o painel do assistente** — exatamente no momento em que o assistente é mais útil, porque a pessoa ainda não sabe por onde começar. O convite custava o recurso que atenderia o convite.\n\nO canvas vazio não é um erro a ser explicado: é uma mesa limpa, com as ferramentas à mão no rodapé.\n\n### 1.3 Gravar — `BOARD-SALVA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-SALVA-001 | Cada gesto no canvas (criar quadro, criar/editar/excluir registro, arrastar entre colunas) **grava o quadro inteiro**. Não há botão \"salvar\". | Decisão A26 |\n| BOARD-SALVA-002 | A fonte da verdade na hora de gravar é o **que está na tela**. Não existe um modelo paralelo em memória para sair de sincronia com o DOM. | Decisão A26 |\n| BOARD-SALVA-003 | A resposta da gravação é o quadro **relido do banco**, e a tela redesenha a partir dela. Ids de registro não sobrevivem entre uma gravação e a seguinte — a tela nunca depende deles. | Decisão A26 |\n| BOARD-SALVA-004 | Quem pode gravar no quadro são os mesmos três papéis que podem mexer nas tarefas (`ATV-TAR-CRIA-004`). | Decorre de ATV-TAR-CRIA-004 |\n| BOARD-SALVA-005 | Um `404` ao gravar significa que a tarefa deixou de existir enquanto a pessoa trabalhava. A tela volta para a atividade em vez de insistir. | Decorre de IDEIA-MOV-013 |\n| BOARD-SALVA-006 | **Nada é gravado antes de o quadro ter sido carregado com sucesso.** Enquanto a carga não termina — ou se ela falha —, a tela vazia significa \"ainda não chegou\", não \"quadro vazio\". | Decisão A30 |\n| BOARD-SALVA-007 | **Montar não é gravar, e quem relata precisa saber a diferença.** Todo caminho que monta quadro e dispara gravação tem de **olhar no resultado** da gravação: desenhar na tela e falhar no `PUT` produz uma tela certa e um banco vazio, e a pessoa lê só a confirmação. Quando a gravação falha, isso é dito — sem desdizer o passo anterior, porque os quadros **estão** na tela. Autosave já em curso não é falha: o pedido entra na fila daquele (`BOARD-SALVA-002`) e não há nada a relatar. | Achado em uso real pelo Ricardo · corrigido 16/09/2026 |\n\n**Por que um PUT do quadro inteiro (BOARD-SALVA-001).** A alternativa seria uma rota por gesto: criar coluna, renomear quadro, mover registro, excluir card. Duas coisas empurraram para o outro lado. A tela já salvava sozinha a cada gesto — o \"Salvando...\" do botão Voltar existia desde o protótipo, só que sem gravar nada —, então seriam doze rotas servindo a um único autosave. E arrastar um registro entre colunas muda **duas** colunas ao mesmo tempo: com estado inteiro isso é o caso comum, com rota por gesto é o caso especial que sempre esquece de ser tratado.\n\n**Por que a trava de BOARD-SALVA-006 existe.** É o outro lado de `BOARD-SALVA-002`: se o que manda é o que está na tela, então uma tela que ainda não recebeu os dados manda uma lista vazia — e o PUT, que substitui tudo, apaga o quadro da pessoa. Não é hipótese: aconteceu em teste. A pessoa abriu a tela, a carga não tinha terminado, um autosave disparou e o quadro sumiu do banco. Por isso a regra não é \"avisar\" nem \"tentar de novo\": é **não gravar**, porque uma gravação errada aqui é destrutiva e silenciosa.\n\nA trava não impede esvaziar um quadro de propósito — depois da carga, apagar o último card e gravar vazio é uma gravação legítima. Ela só separa \"vazio porque a pessoa esvaziou\" de \"vazio porque nada chegou\".\n\n**O preço, declarado.** Duas pessoas no mesmo quadro ao mesmo tempo: a última gravação vence, sem aviso, e o trabalho da outra some. É a mesma troca que `ideias-movimentacao.md` §4 já aceitou para movimentação de idéias, pelo mesmo motivo (o volume de uso atual), e está registrada em §5 como pendência — não como detalhe resolvido.\n\n### 1.4 A tarefa, vista daqui — `BOARD-TAREFA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-TAREFA-001 | Finalizar e reabrir a tarefa usam a **mesma rota** de `ATV-TAR-CONCLUIR`. Só mudam `status`. | Decorre de ATV-TAR-CONCLUIR-001 |\n| BOARD-TAREFA-002 | Excluir a tarefa usa a **mesma rota** de `ATV-TAR-EXCLUI`, e leva de volta para a atividade. | Decorre de ATV-TAR-EXCLUI-001 |\n| BOARD-TAREFA-003 | **Editar** título e descrição da tarefa **não acontece aqui** — acontece em `atividade.html`. | Decisão A28 |\n| BOARD-TAREFA-004 | Concluir uma tarefa **não move a idéia** para \"Finalizado\" e **não tira a pessoa da tela**. Quem move a idéia é concluir a atividade inteira. | Decorre de IDEIA-MOV-014 |\n| BOARD-TAREFA-005 | Voltar leva à **mesma atividade**, com empresa, projeto e idéia na URL. | Decorre de ATV-ACESSO-001 |\n\n**Por que editar não acontece aqui (BOARD-TAREFA-003).** Duas telas gravando o mesmo campo é a receita de divergirem — é o mesmo raciocínio de `IDEIA-MOV-009` (\"três gestos, uma porta\"), aplicado a telas em vez de gestos. `atividade.html` já lista todas as tarefas e é o lugar natural para renomear uma. O botão que existia aqui, aliás, nunca gravou nada: reescrevia o texto na tela e pronto — e o backend não tem, até hoje, rota de edição de tarefa.\n\n**O que BOARD-TAREFA-004 conserta.** O protótipo, ao concluir uma tarefa, gravava duas chaves de `localStorage`: `tarefa-1-status` (que só funcionava para uma tarefa fixa) e `idea-finalizada`, que criaria uma idéia **nova** direto na coluna \"Finalizado\" — contradizendo `IDEIA-CRIA-003` (\"toda idéia nasce em Minhas idéias\"). E redirecionava para fora. Concluir uma tarefa é um evento pequeno: não move idéia, não cria idéia, e não interrompe quem está trabalhando.\n\n### 1.5 Registro vira tarefa — `BOARD-REGISTRO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-REGISTRO-001 | Um registro do quadro pode virar uma **tarefa da atividade**, pela mesma rota de `ATV-TAR-CRIA`: nasce no fim da lista, pendente e `pesquisa`. | Interface existente |\n\n**Por que existia e não funcionava.** O menu do card já oferecia \"Nova tarefa\" desde o protótipo — gravava o registro em `localStorage` e navegava para a atividade. Quando `atividade.html` passou a usar a API, parou de ler essa chave, e o botão virou uma navegação que não criava nada. A ponte foi refeita pela rota real.\n\n### 1.6 O assistente — `BOARD-IA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-IA-001 | ~~A pesquisa por IA e a compra de créditos não existem nesta versão; o botão \"Pesquisar\" fica visível e desativado.~~ **Revogada em 13/09/2026.** A pesquisa está no ar (§1.8) e os créditos existem (`creditos-pagamentos-regras.md`, Fase 4). O botão pesquisa de verdade. | Decisão A29, revogada por A34 |\n| BOARD-IA-002 | O painel do assistente é a **mesma conversa do projeto** (`IA-CONV-001`), como em `visao_do_projeto.html` e `atividade.html`. Abrir um quadro não cria dimensão nova de conversa. | Decorre de IA-CONV-001 |\n| BOARD-IA-003 | O painel do assistente é também **onde a investigação se explica** enquanto roda (`BOARD-PESQUISA-016`). Ele deixa de ser só o chat do projeto nesta tela e passa a ser a superfície de acompanhamento da pesquisa — sem virar uma segunda conversa. | Decorre de BOARD-PESQUISA-016 |\n\n> **Nota de 13/09/2026.** O parágrafo abaixo descreve o estado de 29/08 e fica como registro do raciocínio da época. O que vale hoje está em §1.8.\n\n**Por que desativado e não removido (BOARD-IA-001, histórico).** O que a tela fazia era encenação: o saldo \"0 de 100\" estava escrito no HTML, e clicar em \"Pesquisar\" sempre abria \"Créditos insuficientes\" — um modal sobre um sistema de créditos que não existe em lugar nenhum do produto. Isso depende da **decisão D2** (crédito por usuário ou por empresa), aberta desde o módulo de empresas e que bloqueia a publicação. Um botão desativado com explicação é honesto sobre o que ainda não existe; um botão que finge cobrar, não. Remover também seria defensável — ficou visível porque a pesquisa é o motivo pelo qual esta tela vai existir, e escondê-la faria a intenção do produto sumir do lugar onde ela deve estar.\n\n### 1.7 Tarefa concluída não se mexe — `BOARD-LEITURA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-LEITURA-001 | Tarefa com status **concluída** abre em somente leitura. O quadro fica visível e legível; nada nele pode ser criado, movido, editado ou excluído. | Decisão A32 |\n| BOARD-LEITURA-002 | Em somente leitura ficam indisponíveis: **arrastar registros**, editar título e descrição de registro, **\"Novo registro\"**, **\"Novo quadro\"**, os menus de card e de quadro (incluindo excluir) e a edição do título do quadro. | Decisão A32 |\n| BOARD-LEITURA-003 | **\"Pesquisar\" fica desativado** numa tarefa concluída — pesquisar reescreveria o resultado que a conclusão congelou. Isso vale **independentemente** de `BOARD-IA-001`: se um dia a pesquisa for liberada, a tarefa concluída continua sem ela. | Decisão A32 |\n| BOARD-LEITURA-004 | Em somente leitura **nada é gravado**: o autosave não dispara, nem para um gesto que tenha escapado de alguma trava. | Decisão A32 |\n| BOARD-LEITURA-007 | **A trava de somente leitura mora em cada porta que cria conteúdo, não numa só.** Toda função que cria quadro ou card checa o modo **na própria entrada**. Guarda em uma irmã e não na outra é pior que guarda em nenhuma: a tela desenha o que o servidor vai recusar, a narração confirma o que não aconteceu, e o defeito só aparece na próxima visita — como o quadro em branco achado em 16/09/2026, em que `criarQuadroDocumento` não tinha a guarda que `criarQuadroResultado` já tinha. | Achado em uso real pelo Ricardo · corrigido 16/09/2026 |\n| BOARD-LEITURA-005 | O único caminho para voltar a editar é **reabrir a tarefa** (`BOARD-TAREFA-001`). Reabrir devolve a tela ao estado editável na hora, sem recarregar. | Decisão A32 |\n| BOARD-LEITURA-006 | O modo vem do **`status` da tarefa**, não de um parâmetro na URL. Ver `BOARD-ACESSO-005`. | Decisão A27 |\n\n**Por que congelar, e não apenas avisar.** Concluir uma tarefa é a afirmação de que aquele trabalho chegou a um resultado. Se o quadro continuasse editável, \"concluída\" viraria só um rótulo — o resultado poderia mudar depois de dado como pronto, e ninguém saberia se o que está na tela é o que foi concluído ou o que alguém mexeu depois. Travar a edição faz o status significar algo verificável.\n\n**Por que reabrir é a única saída (BOARD-LEITURA-005).** A alternativa seria deixar editar e mudar o status sozinho, ou pedir confirmação a cada gesto. As duas transformam uma decisão — \"isto não está mais pronto\" — em efeito colateral de um clique. Reabrir é explícito, é uma linha só de esforço, e deixa o estado da tarefa sempre igual ao que a pessoa declarou.\n\n**Por que BOARD-LEITURA-003 não depende de BOARD-IA-001.** Hoje \"Pesquisar\" está desativado para todo mundo, aguardando a decisão D2 dos créditos — então a regra parece redundante. Ela existe para o dia em que D2 sair: quem for reativar o botão mexe em `BOARD-IA-001`, e sem esta regra separada a liberação vazaria para as tarefas concluídas sem ninguém notar. A trava está no código como uma desativação que **só desativa, nunca ativa**, exatamente para sobreviver a essa mudança.\n\n---\n\n### 1.8 A pesquisa — `BOARD-PESQUISA`\n\nSubstitui `BOARD-IA-001`, revogada. O painel vive em `js/pesquisa.js` e nas rotas `/pesquisa/sessoes*`; o planejamento está em `planejamento-pesquisa-concorrentes.md`, na raiz do repositório.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| BOARD-PESQUISA-001 | O botão \"Pesquisar\" do painel da tarefa **executa uma busca externa de verdade** e devolve o resultado como quadro. Não é mais encenação nem simulação. | Registrado 13/09/2026, a partir do código |\n| BOARD-PESQUISA-002 | O painel de pesquisa **nunca desenha dentro de `#canvasStage`**. Um resultado que chega segundos depois, desenhado ali, viraria estado do quadro sem ninguém ter pedido — e `lerDaTela()` o gravaria (`BOARD-SALVA-002`), fazendo o quadro virar um segundo dono de um fato que `pesquisa_entidades` já guarda. Dois donos do mesmo fato divergem em silêncio. | Registrado 13/09/2026 |\n| BOARD-PESQUISA-003 | A ponte entre painel e canvas é um **gesto explícito** — \"Virar card\" —, que passa pelo mesmo caminho do modal de novo registro. A partir daí o card é do quadro, e a sessão de pesquisa guarda o registro como procedência. | Registrado 13/09/2026 |\n| BOARD-PESQUISA-004 | Pergunta com referência sem dono (`\"ele\"`, `\"essa empresa\"`) é **recusada antes de gastar qualquer coisa**: mandar ao provedor traria resposta sobre qualquer um, e ela voltaria convincente. | `planejamento-pesquisa-concorrentes.md` PES-004 |\n| BOARD-PESQUISA-005 | Quando a mesma pergunta pode ser respondida em níveis de custo diferentes e a heurística não teve certeza, o servidor **devolve `409` e pergunta**, em vez de escolher. Escolher o nível sozinho é escolher o custo sozinho. | `planejamento-pesquisa-concorrentes.md` PES-007 |\n| BOARD-PESQUISA-006 | Recusa **não grava consulta**. \"Não tentei\" e \"tentei e falhou\" são coisas diferentes, e encher a investigação de linhas que nunca saíram do servidor tornaria o histórico ilegível justamente onde ele serve para auditar. | Registrado 13/09/2026 |\n| BOARD-PESQUISA-007 | Consulta, fontes, entidades novas e foco são gravados **na mesma transação**. Uma entidade sem a consulta que a descobriu é um concorrente sem procedência. | Registrado 13/09/2026 |\n| BOARD-PESQUISA-008 | `BOARD-LEITURA-003` continua valendo por cima de tudo isto: **tarefa concluída não pesquisa**, agora que a pesquisa existe de verdade. | Decisão A32 |\n| BOARD-PESQUISA-009 | **Toda consulta que chama o provedor externo é medida e debitada**, com origem própria `pesquisa` na razão (`DIN-005`). Reserva pelo pior caso antes da chamada, liberação do teto e consumo do custo real depois. | Decorre de DIN-005; implementado 13/09/2026 |\n| BOARD-PESQUISA-010 | Consulta que **falhou** não cobra — a chamada não completou, e cobrar por isso é cobrar por nada. Consulta **vazia** cobra: a busca rodou, o provedor cobrou de nós, e \"não encontrei nada\" é uma resposta. A linha de consumo é gravada nos **três** casos, para o custo de chamadas que não deram em nada não ficar invisível. | Decidido na implementação, 13/09/2026 — confirmar (§5) |\n| BOARD-PESQUISA-011 | Sem saldo, a consulta **não acontece**: `402`, e a pessoa recarrega. Mesmo código do teto da sessão, porque para quem está do outro lado as duas situações são a mesma. | Implementado 13/09/2026 |\n| BOARD-PESQUISA-012 | **Nenhum nível é beco sem saída para uma tarefa que a pessoa já criou.** Toda recusa vem com o que dá para fazer com a **mesma** tarefa, agora — e o texto nunca pede para reescrevê-la. Só é oferecido o que executa de verdade: `navegacao` nunca aparece como saída, porque é recusa permanente (`PES-005`), não uma opção mais cara. | Instrução do Ricardo, 13/09/2026 · **implementada 14/09/2026** |\n| BOARD-PESQUISA-013 | A investigação lê o **conhecimento interno da empresa antes de ir à web**. **Construída em 14/09/2026**: `pesquisa/contexto-interno.ts` monta o pacote e a rota `POST /pesquisa/sessoes/:id/investigar` o entrega ao planejador antes de qualquer busca. | Decidido 13/09/2026 com o Ricardo |\n| BOARD-PESQUISA-014 | O conhecimento interno entra pelas **mesmas duas categorias do assistente**: **verdade validada** (`IA-CONHEC-002/007`) e **material de consulta** (`IA-CONHEC-003/008`), este sempre marcado como não validado (`IA-CONHEC-005`). Idéia arquivada não entra (`IA-CONHEC-004`). **Construída em 14/09/2026**, com os dois blocos separados e rotulados no texto que vai ao modelo — nunca uma lista só com um campo `status` no meio (`IA-GARANT-001`). | Decorre de IA-CONHEC; confirmado 13/09/2026 |\n| BOARD-PESQUISA-015 | Os dois recortes têm **alcances diferentes**: verdade validada vem da **empresa inteira** (`TEMA-ISO-001`); material de consulta vem **só do projeto da tarefa**. **Construída em 14/09/2026** como duas consultas distintas ao banco, provadas em `testes/contexto-interno.test.ts`. | Decidido 13/09/2026 com o Ricardo |\n| BOARD-PESQUISA-016 | O progresso da investigação é **narrado como texto dentro do assistente** (`IA-CONV-NARRA-001`), não numa linha do rodapé do compositor. **Construída em 14/09/2026 sem as etapas internas**: a entrada abre com a tarefa e o tempo correndo, narra como a tarefa foi lida e o que a busca devolveu, e fecha com o resultado, a falha ou as saídas. As etapas de dentro da busca dependem do SSE da Fase 1. | Instrução do Ricardo, 13/09/2026 |\n| BOARD-PESQUISA-017 | Cada passo narrado é **fato consumado**: emitido depois que a etapa terminou, com texto próprio e sem percentual (`IA-CONV-NARRA-005/006`). A narração **não vira mensagem da conversa** nem entra no contexto das perguntas seguintes (`IA-CONV-NARRA-003`). | Decorre de IA-CONV-NARRA · **implementada 14/09/2026** |\n| BOARD-PESQUISA-018 | ~~A estimativa que a investigação **mostra antes de gastar**~~ — **a estimativa não é mais mostrada** (`DIN-013`, 15/09/2026). Ela continua sendo **calculada**, e continua sendo **o valor total que sai do saldo**, com a comissão dentro (`DIN-007`), contando as rodadas e o preço das buscas (`DIN-009`) e não só o prompt. O que mudou é o destino: virou **reserva no servidor**, não texto na tela. Contar só o prompt continua sendo errado pelo mesmo motivo de sempre — reservar 80 vezes menos que o real deixa a busca sem cobertura no meio. | Decidido 13/09/2026; corrigido 14/09/2026; retirada da tela 15/09/2026 |\n| BOARD-PESQUISA-018a | **Valor em reais aparece num lugar só: Configurações → Créditos de uso → Histórico de uso** (`DIN-013`). Nenhuma jornada da pesquisa exibe preço, estimativa, teto ou custo — nem antes, nem durante, nem depois. Saldo não conta: saldo é quanto a pessoa tem, não quanto uma ação custa. | Instrução do Ricardo, 15/09/2026 |\n| BOARD-PESQUISA-018b | **O Histórico mostra o gasto da pesquisa mesmo quando a cobrança está desligada** (`DIN-014`). Com `CREDITOS_COBRAR=nao` a medição continua e a razão fica sem a linha; como `018a` fez do Histórico a única janela para o valor, o gasto medido aparece lá marcado como \"medido, não cobrado\". Sem isto, uma pesquisa real ficava medida, gravada e invisível em todo o produto — achado em uso pelo Ricardo em 17/09/2026. | Decorre de 018a · DIN-014 |\n| BOARD-PESQUISA-019 | Quem decide o que investigar é um **modelo lendo a tarefa**, não uma lista de palavras. O planejador transforma a tarefa em **3 a 6 perguntas verificáveis**; o limite é aplicado **no servidor**, não pedido ao modelo — pedir é instrução, cortar é garantia, e cada pergunta a mais é uma busca paga. Pergunta duplicada é descartada pelo mesmo motivo. | Decidido 14/09/2026 (Fase 1a) |\n| BOARD-PESQUISA-020 | O planejador **pode recusar**, e a recusa dele é lida, não por palavra-chave. Mas ela continua sujeita a `BOARD-PESQUISA-012`: a recusa vem com as saídas, e escolher uma cai direto em `consultar` com `nivelConfirmado`, **sem replanejar** o que uma pessoa acabou de decidir. Trocar um portão burro por um portão esperto ainda seria um portão. | Decidido 14/09/2026 (Fase 1a) |\n| BOARD-PESQUISA-021 | O **roteador não morreu — encolheu**. Resolver referência sem dono (`PES-004`: \"ele\", \"essa empresa\") continua sendo dele, porque é trabalho de texto e já funciona. O que saiu foi o papel de portão de custo. Pagar um modelo para trocar pronome seria desperdício. | Decidido 14/09/2026 (Fase 1a) |\n| BOARD-PESQUISA-022 | A investigação é um **registro com estado**, não um efeito da tela: `pesquisa_investigacoes` guarda pergunta, plano, cada passo na ordem em que aconteceu, o fecho e a consulta que a busca gerou. Estados: `correndo`, `entregue`, `parada`, `falhou`. | Decidido 14/09/2026 (Fase 1b) |\n| BOARD-PESQUISA-023 | **Resultado pago não depende da aba ficar aberta.** O servidor termina a investigação mesmo sem cliente — a busca completa, é cobrada e a consulta é gravada. Ao voltar, a tela reencontra a investigação e o resultado continua disponível. Para isso `pesquisa_consultas` passou a guardar também a **resposta** do provedor, que antes vivia só no corpo HTTP. | Decidido 14/09/2026 (Fase 1b) |\n| BOARD-PESQUISA-024 | O resultado recuperado **não vira quadro sozinho**. A pessoa pode tê-lo visto antes de recarregar, e recriar duplicaria o board — e saber se ela viu é coisa que o servidor não tem como saber. Vale `BOARD-PESQUISA-003`: a ponte entre painel e canvas é um **gesto explícito**, e ele diz que não custa nada, porque a busca já foi paga. **Continua valendo, no caso que ainda existe:** ver `024a`. | Decorre de BOARD-PESQUISA-003 · conferida 16/09/2026 |\n| BOARD-PESQUISA-024a | **Abrir a tarefa não remonta investigação já terminada.** A entrada \"Investigação anterior\" era a ponte de `024` e fazia sentido quando o resultado só virava quadro por um gesto; sem a curadoria (`033`), a pesquisa termina e os quadros já nascem no board — então reabrir a tarefa mostrava um resumo do que já estava na tela, com um botão que só duplicaria. A ponte continua nos **dois casos em que ela é a única saída**: investigação encontrada **correndo** quando a página abriu (os quadros não existem neste navegador — quem terminou foi o servidor) e \"Ver a resposta que já existe\", pedido por alguém (`077`). Calar nesses dois seria um botão morto. | Decisão do Ricardo, 16/09/2026 |\n| BOARD-PESQUISA-025 | **Pergunta respondida não vira \"pergunta em aberto\".** O quadro de perguntas em aberto é para o que o provedor perguntou a QUEM LÊ, nunca para o que ele próprio respondeu. Desde que a investigação manda várias perguntas por vez, o provedor repete cada uma como cabeçalho antes da resposta — e cabeçalho é rótulo do que vem abaixo, não pedido de resposta. | Corrigido 14/09/2026, a partir de uso real |\n| BOARD-PESQUISA-026 | **O plano responde a tarefa como ela foi escrita.** Não alarga o assunto: \"A empresa X faz Y?\" não vira \"quais empresas fazem Y\", nem \"quanto custa Y\", nem \"como é o mercado de Y\". **Uma pergunta é um plano completo** — se a tarefa já é verificável, o plano é ela, e outra só entra se for indispensável para respondê-la. Cada pergunta a mais é uma busca paga a mais. | Corrigido 14/09/2026, a partir de uso real |\n| BOARD-PESQUISA-027 | Tarefa **escrita como pergunta** entra no plano como a **primeira** pergunta, por construção no servidor — não por instrução ao modelo. Primeira porque a busca responde na ordem e o teto de saída corta o fim: a pergunta que a pessoa escreveu não pode ser a que fica sem espaço. Paráfrase conta como a mesma pergunta, para não pagar duas buscas pela mesma resposta. Tarefa escrita como instrução (\"Pesquisar X e verificar Y\") continua sendo expandida. | Decidido 14/09/2026 |\n| BOARD-PESQUISA-028 | **Toda unidade que o provedor cobra é reservada e cobrada** — inclusive a busca encadeada, que custa por unidade além dos tokens (`DIN-009`), e inclusive o crescimento da entrada a cada rodada de busca, que é o que faz uma reserva ser reserva de verdade. | Decorre de DIN-009; corrigido 14/09/2026 |\n| BOARD-PESQUISA-029 | A investigação **abre as páginas que decidem a resposta**, não só os trechos da busca. Três tetos, cada um segurando uma coisa: **quantas páginas** (contra a deriva de seguir links), **quanto de cada uma** (contra a página gorda de portal, com menu e rodapé) e **quanto o modelo escreve** (que subiu para 2.048, porque com até seis perguntas a resposta encostava no teto antigo). Toda página aberta é citada — é o trecho citado que mantém a afirmação auditável quando a página sair do ar (`PES-006`). | Decidido 14/09/2026 (Fase 1b) |\n| BOARD-PESQUISA-030 | ~~O que a pessoa vê antes de gastar é um **teto**, escrito como teto em cima do botão que gasta: *\"Buscar custa até R$ X. O que não for gasto volta para o saldo.\"*~~ **Revogada em 15/09/2026**, junto com o botão que ela rotulava: a frase morava em cima de \"Buscar agora\", que não existe mais. O raciocínio da regra continua bom e não foi jogado fora — ele só não tem mais onde acontecer nesta tela. Onde o valor aparece agora é assunto de `BOARD-PESQUISA-018`. | Decorre de PES-007; 14/09/2026 · revogada 15/09/2026 |\n| BOARD-PESQUISA-031 | Cada **afirmação** da resposta carrega a fonte que a sustenta e o trecho citado, vindos das **citações do provedor** — não de uma segunda leitura. Afirmação sem fonte é **marcada e contada**, nunca escondida (`PES-006`). Cabeçalho não é afirmação: é rótulo do que vem abaixo. | Decidido 14/09/2026 (Fase 1b) |\n| BOARD-PESQUISA-032 | ~~As afirmações ainda não são gravadas.~~ **Superada em 14/09/2026** por `BOARD-PESQUISA-042`: a espera valeu. O contrato de §3.1 foi guardado inteiro, com `removida_pelo_usuario`, numa migração só, depois de a forma do rascunho se provar em uso. | Decidido e superado 14/09/2026 |\n| BOARD-PESQUISA-042 | **A resposta é gravada partida nas frases que a sustentam**, cada uma com a posição em que começa e com a fonte ligada por **chave**, não por índice de array. Tabela, e não mais um campo Json: `removida_pelo_usuario` é campo que a pessoa muda, e mudar um item dentro de um Json é reescrever o array inteiro. O índice era pior que frágil — `fonteIds: [0, 1]` só existe dentro de uma resposta HTTP; gravado, é referência que não referencia nada. | Contrato de §3.1 do plano · construída 14/09/2026 |\n| BOARD-PESQUISA-043 | ~~**A curadoria é um gesto gravado.** Salvar e descartar mandam ao servidor o que ficou.~~ **Sem uso desde 15/09/2026:** nada mais escreve `removida_pelo_usuario` — não há tela que colete essa decisão. A rota e o campo continuam existindo e continuam sendo **lidos** (`035a`), porque as investigações curadas entre 14 e 15/09/2026 têm decisões gravadas que precisam ser honradas. | Decorre de 042 · sem uso 15/09/2026 |\n| BOARD-PESQUISA-044 | **`removida_pelo_usuario` nulo quer dizer \"ninguém decidiu ainda\"**. ~~É por este campo que a tela sabe que há algo esperando.~~ **Metade revista em 15/09/2026:** o significado do nulo continua igual, mas ele deixou de ser um pedido de atenção — hoje \"ninguém decidiu\" quer dizer apenas *fica*. `rascunho_pendente` continua vindo do servidor e não significa mais nada no cliente; segui-lo faria **toda investigação antiga oferecer um rascunho que não existe**. | Decorre de 042 · revista 15/09/2026 |\n| BOARD-PESQUISA-045 | ~~**Rascunho pendente reabre por botão, nunca sozinho.**~~ **Revogada em 15/09/2026** — não há rascunho para reabrir. O princípio de que nada salta na cara de quem abriu a página continua valendo em `BOARD-PESQUISA-003`, que é de onde ele veio. | Decorre de BOARD-PESQUISA-003 · revogada 15/09/2026 |\n| BOARD-PESQUISA-046 | **O que foi descartado não volta a ser oferecido.** Investigação com **todas** as afirmações removidas não oferece trazer nada para o quadro: seria desfazer uma decisão, e traria texto vazio. **Continua valendo em 15/09/2026**, e não por inércia — é a única regra desta seção que ainda tem trabalho a fazer, justamente sobre as investigações curadas enquanto o rascunho existiu. | Decorre de 036 e 043 |\n| BOARD-PESQUISA-033 | ~~**O resultado só vira quadro por decisão explícita de uma pessoa.** A investigação termina num **rascunho**, não no board.~~ **Revogada em 15/09/2026, por instrução do Ricardo:** a pesquisa termina e **os quadros já nascem no board**. A decisão de descartar não sumiu — mud
