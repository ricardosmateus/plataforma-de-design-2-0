ou de lugar e de momento: acontece no próprio board, card a card, onde a pessoa já sabe mexer, e sem um dialog entre ela e o resultado que ela acabou de pagar. | Instrução do Ricardo · construída 14/09/2026 · revogada 15/09/2026 |\n| BOARD-PESQUISA-033a | **Nada do que o rascunho garantia foi perdido — só o lugar mudou.** Apagar o que não presta: no board, card a card. Ver de onde saiu cada frase: em \"Ver as fontes\" (`053`) e no relatório (`057`). O que acabou foi a **obrigação de decidir antes de ver o resultado no lugar onde ele serve**. | Registrado 15/09/2026 |\n| BOARD-PESQUISA-034 | ~~No rascunho, cada afirmação aparece ao lado da fonte e do trecho que a sustenta.~~ **Sem efeito desde 15/09/2026** — não há rascunho. A exigência que ela expressa (não decidir sobre uma frase sem ver o trecho que a sustenta) passou inteira para `053`: é lá, em \"Ver as fontes\", que afirmação, fonte e trecho continuam lado a lado. | Decidido 14/09/2026 · sem efeito 15/09/2026 |\n| BOARD-PESQUISA-035 | ~~Afirmação **sem fonte chega desligada**~~ — **revertido em 15/09/2026.** \"Desligada\" só fazia sentido porque existia um rascunho onde a pessoa podia ligá-la de volta antes de virar quadro; sem esse rascunho, chegar desligada viraria **sumir**, e `PES-006` proíbe esconder. Hoje ela chega no board como as outras e a falta continua dita em palavras (\"Sem fonte declarada\"), onde quem lê decide se apaga o card. | Decorre de PES-006 · revertida 15/09/2026 |\n| BOARD-PESQUISA-035a | **Sem decisão gravada, tudo fica** (`fica: removida !== true`). O padrão antigo, mantido só na recuperação, faria a **mesma investigação dar quadros diferentes** conforme a pessoa tivesse ou não recarregado a página: ao vivo tudo entra, recuperada faltariam as sem fonte. Decisão explícita de quem curou enquanto o rascunho existiu continua valendo por cima do padrão, nas duas direções. | Construída 15/09/2026 |\n| BOARD-PESQUISA-037 | **Nenhum dinheiro sai da busca sem um gesto — e o gesto é o clique em \"Pesquisar\".** ~~Depois de planejar, a investigação para e mostra o plano e o preço; a busca só acontece se alguém confirmar.~~ **Revista em 15/09/2026:** o portão ao vivo saiu. Quem clicou em \"Pesquisar\" já autorizou o gasto; \"Buscar agora\"/\"Agora não\" perguntavam de novo o que aquele clique já tinha respondido. Planejar e buscar são, para quem lê, **um gesto só**: a narração não fecha entre os dois, e o segundo stream escreve dentro da mesma entrada. O gesto não sumiu, mudou de lugar. | Instrução do Ricardo · construída 14/09/2026 · revista 15/09/2026 |\n| BOARD-PESQUISA-037a | **O portão continua existindo no servidor.** `aguardando` é gravado e `/buscar` continua sendo uma segunda chamada — o que mudou é só que o cliente deixou de parar nela. Por isso `038`, `040` e `041` continuam valendo inteiras, e removê-las junto com o portão da tela seria apagar as garantias sem apagar o risco que elas seguram. | Registrado 15/09/2026 |\n| BOARD-PESQUISA-038 | **O portão sobrevive a fechar a aba.** O plano, a pergunta que iria à web e o preço ficam **gravados** no estado `aguardando`; reabrir a tarefa reencontra a espera e oferece o mesmo preço. Segurar a conexão aberta esperando o clique seria o contrário: proxy que corta, computador que dorme e servidor que reinicia matariam um planejamento **já pago**. Um portão que morre com a conexão é um aviso com prazo. | Decorre de 037 e de BOARD-PESQUISA-030 |\n| BOARD-PESQUISA-039 | **O preço é reconferido na hora de confirmar.** Se ficou mais barato, cobra-se o mais barato. Se ficou mais caro — a cotação anda —, **não se cobra a diferença calado**. ~~O plano volta com o número novo e o portão fecha de novo.~~ **Metade revista em 15/09/2026:** a reconferência continua igual no servidor, mas sem portão e sem preço na tela não há o que reabrir; o `mudou` que vinha no evento deixou de ter destino. Quem segura o gasto passou a ser o **teto**, no servidor. O cliente, por sua vez, não confirma de novo sozinho — ver `086`. | Decorre de PES-007 · revista 15/09/2026 |\n| BOARD-PESQUISA-040 | **Confirmar duas vezes busca uma vez.** Clique duplo, aba antiga e botão de voltar batem no estado: só `aguardando` pode ser confirmado, e confirmar sai desse estado **antes** de qualquer gasto. Se o servidor cair no meio da busca, a investigação fica presa em `correndo` e ninguém a confirma de novo — que é o lado certo para errar quando os dois erros possíveis são \"cobrar duas vezes\" e \"pedir para recomeçar\". | Decorre de 037 |\n| BOARD-PESQUISA-041 | **Saldo insuficiente na confirmação devolve a investigação à espera**, não ao fracasso. O planejamento já foi pago e o plano continua bom; recarregar crédito é uma saída de dois minutos. Fechar como `falhou` cobraria o planejamento duas vezes de quem ficou sem saldo por um instante. | Decorre de 038 |\n| BOARD-PESQUISA-086 | **Só o stream que PLANEJA pode confirmar sozinho.** O stream de `/buscar` nunca recebe essa permissão: se o servidor pedir espera de novo — e ele faz isso, por `039` —, o cliente **para**. Sem essa trava, remover o portão criaria um laço em que cliente e servidor se confirmam mutuamente; e um laço aqui não é tela travada, é dinheiro saindo em rodadas. É o pior defeito que este caminho pode ter, e por isso a trava é estrutural (um parâmetro que só um dos dois caminhos passa), não uma contagem de tentativas. | Construída 15/09/2026, junto com a saída do portão |\n| BOARD-PESQUISA-087 | **Espera encontrada sem clique de hoje não busca sozinha.** A aba morreu entre planejar e buscar, ou faltou crédito na confirmação: ao reabrir, a investigação está em `aguardando` e **ninguém clicou em \"Pesquisar\" nesta visita**. Buscar aí gastaria sem gesto nenhum, o que é exatamente o que `037` proíbe. A tela oferece **\"Continuar a pesquisa\"** — um link só, porque \"agora não\" é fechar a aba e o plano fica guardado de qualquer jeito (`038`). | Construída 15/09/2026 |\n| BOARD-PESQUISA-047 | **A investigação pode ser perguntada.** Depois de entregue, ela oferece \"Perguntar sobre estas fontes\": a pergunta de acompanhamento é respondida **só com o que aquela busca já coletou**. Sem busca nova, sem conhecimento geral do modelo. `\"Isso não está nas fontes desta investigação\"` é resposta **certa** (`PES-008`), e a tela não a desenha como erro. | Fase 3a · construída 14/09/2026 |\n| BOARD-PESQUISA-048 | **O caderno não tem ferramenta.** A garantia de que nenhuma busca sai não é uma instrução ao modelo: a chamada é feita **sem `tools`**. Se tivesse, a pergunta de centavos poderia virar uma busca cara sem passar pelo portão (`037`) — e uma regra que depende de o modelo obedecer não é garantia, é pedido. | Decorre de 037 |\n| BOARD-PESQUISA-049 | **O caderno lê o que sobreviveu à curadoria**, não a resposta original. Quem apagou uma afirmação disse que aquilo não presta; devolver o texto original ao modelo o contrabandearia de volta na resposta seguinte. As **fontes** ficam todas — uma fonte é um documento que foi lido e pago, mesmo que a frase que ela sustentava tenha saído. **Depois de 15/09/2026** isso quase sempre quer dizer \"a resposta inteira\", porque quase nada é removido; o filtro fica porque as investigações curadas antes continuam tendo o que filtrar. | Decorre de 043 · conferida 15/09/2026 |\n| BOARD-PESQUISA-050 | **A conversa com o caderno não entra no contexto do assistente do projeto**, e vice-versa. Ela tem persistência própria (`pesquisa_perguntas`), como a narração (`IA-CONV-NARRA-003`). Se entrasse, um achado da web — que só vale com a fonte colada — voltaria depois como coisa que a empresa sabe, que é o que `IA-GERAL-005` existe para impedir. | Decorre de IA-GERAL-005 |\n| BOARD-PESQUISA-051 | **Perguntar ao caderno não pergunta nada antes**, e ~~o custo é dito depois, na própria resposta~~ — **o custo saiu da resposta em 15/09/2026** (`DIN-013`). Confirmar cada pergunta mataria a conversa, e o preço colado na resposta não ajudava a decidir nada: a pergunta já tinha sido feita e paga. O **teto de R$ 3 da investigação** continua valendo por cima, no servidor — é ele, e não um texto na tela, que impede uma conversa longa de virar gasto sem ninguém notar. | Decidido pelo Ricardo em 14/09/2026 · custo retirado 15/09/2026 |\n| BOARD-PESQUISA-052 | **O modo caderno é ligado por gesto e fica visível enquanto durar**, com saída de um clique. As duas perguntas parecem iguais (\"e quantas lojas eles têm?\") e têm respostas de naturezas diferentes — uma lê o conhecimento da empresa, a outra não pode sair de um material fechado. Um roteador que escolhesse sozinho erraria em silêncio, e a pessoa não teria como saber qual dos dois respondeu. | Decorre de 047 |\n| BOARD-PESQUISA-053 | **A procedência fica.** A investigação entregue oferece \"Ver as fontes\": cada fonte com o trecho citado e as afirmações que dependem dela. *\"De onde saiu isso?\"* é a pergunta que o produto existe para responder, e até 14/09/2026 ela só tinha resposta no momento do rascunho — que passa. | Fase 3b · construída 14/09/2026 |\n| BOARD-PESQUISA-054 | **Fonte que não sustenta nada continua listada**, e dita como tal: *\"Lida, mas nenhuma afirmação citou esta fonte.\"* Uma página lida custou tokens; sumir com ela faria toda leitura parecer produtiva. Vai para o fim da lista — começar pelo que não serviu esconde o que serviu. | Decorre de 053 |\n| BOARD-PESQUISA-055 | **Afirmação que a pessoa tirou do quadro continua na lista de fontes**, riscada e marcada. Ela é o que explica por que aquela fonte foi lida e paga; escondê-la deixaria sem resposta a pergunta *\"por que paguei por esta página?\"*. O quadro fica com o que ficou; a procedência mostra a história inteira. | Decorre de 043 e 053 |\n| BOARD-PESQUISA-056 | **A tela de fontes é só leitura.** O plano previa apagar fonte por ali; não faz. A curadoria já aconteceu no momento certo (o rascunho), e um segundo lugar para desfazê-la criaria dois donos da mesma decisão (`BOARD-PESQUISA-002`) — além de deixar órfãs afirmações que já estão no quadro, que esta tela não tem como consertar. | Decorre de BOARD-PESQUISA-002 |\n| BOARD-PESQUISA-057 | **A investigação sai do produto num arquivo.** O Markdown traz a tarefa, as perguntas escritas e o porquê de cada uma, o que a empresa já sabia, os achados com fonte, o que não foi mantido, as fontes com trecho e a conversa com o caderno. ~~E o **custo**.~~ **O custo saiu em 15/09/2026** (`DIN-013`); no lugar dele o rodapé diz o **tamanho** do que foi apurado — quantas fontes lidas, quantas afirmações, quantas não ficaram —, que é o que se audita num relatório. Markdown, não PDF: material de trabalho, e um texto que ninguém pode corrigir custaria uma biblioteca para servir menos. | Fase 3c · construída 14/09/2026 · custo retirado 15/09/2026 |\n| BOARD-PESQUISA-057a | **\"Download\" mora no painel da tarefa, não na conversa.** Ele é `ghost` do sistema de design e fica acima de \"Excluir tarefa\". O motivo não é arrumação: dentro do assistente ele só existia depois de `entregarResultado`, então quem voltasse à tarefa amanhã não tinha como baixar o relatório de uma investigação já paga. Ação que vale para a tarefa inteira pertence ao painel da tarefa; a conversa é para o que acontece **agora**. | Instrução do Ricardo, 16/09/2026 |\n| BOARD-PESQUISA-058 | **O que não foi mantido entra no relatório**, em seção própria. É isso que separa um relatório de um resumo: quem lê amanhã precisa poder perguntar *\"o que mais apareceu e não ficou?\"*. Um documento que esconde o que foi jogado fora não é auditável — é propaganda do próprio resultado. | Decorre de 043 |\n| BOARD-PESQUISA-059 | A seção chama-se **\"Apareceu e não foi mantido\"**, nunca \"descartado por quem leu\". Afirmação sem fonte chega **desligada** (`035`): ninguém a tirou, ela nunca entrou. Atribuir à pessoa um ato que ela não praticou é inventar decisão alheia, e num documento que serve para auditar isso é pior do que impreciso. | Decorre de 035 |\n| BOARD-PESQUISA-060 | **O relatório é montado no clique, não na entrega.** Entre o resultado e o download a pessoa pode ter perguntado ao caderno, e essas perguntas fazem parte do que a investigação apurou. Montá-lo antes congelaria a investigação num instante que já passou. | Decorre de 047 |\n| BOARD-PESQUISA-061 | **Placeholder não é tarefa, e é recusado ANTES de qualquer gasto.** Texto que a própria interface escreveu num campo — o convite do post-it (`\"Responda aqui…\"`), o aviso de falha de carga, `\"Sem título\"` — não vira investigação. A guarda é uma comparação de texto, não uma instrução ao modelo: reconhecer um placeholder não precisa de modelo, e recusar antes da chamada custa zero e não tem como derivar. Vale nas três rotas que gastam. | Achado em uso real, 14/09/2026 |\n| BOARD-PESQUISA-062 | **Recusar um campo em branco não é \"pedir para reescrever a tarefa\"** (o texto que a Fase 0 tirou da tela). Lá a tela mandava reformular uma tarefa BOA para compensar um limite nosso. Aqui não há tarefa: o campo está com o texto de convite. O aviso **mostra o que encontrou** — *\"o que está no campo é «Responda aqui…»\"* — e diz que nada foi cobrado. | Decorre de 061 e de BOARD-PESQUISA-012 |\n| BOARD-PESQUISA-063 | **A investigação diz o que NÃO respondeu.** Terminado o quadro, a narração nomeia as partes que ficaram sem nenhuma afirmação com fonte. É a informação que decide se dá para confiar no resultado — e a que some mais facilmente, porque o quadro nasce bonito com o que deu certo. | Fase 3c · construída 14/09/2026 |\n| BOARD-PESQUISA-064 | **A lacuna é derivada, não perguntada.** Nenhuma chamada de modelo: ou uma parte tem afirmação com fonte sobrevivendo, ou não tem. Pagar um modelo para dizer o que a contagem diz seria cobrar por aritmética. | Decorre de 063 |\n| BOARD-PESQUISA-065 | **Cada lacuna vem com o motivo**, porque os dois pedem coisas diferentes de quem lê: *\"tem texto, mas nenhuma fonte\"* é para conferir; *\"não ficou nada no quadro\"* é para buscar de novo. E a tela **não afirma a causa** de uma parte vazia — busca que não achou e curadoria que apagou são indistinguíveis daqui. | Decorre de 063 |\n| BOARD-PESQUISA-066 | **Sem lacuna, silêncio.** Dizer \"0 lacunas\" transformaria a boa notícia em ruído, e treinaria a pessoa a ignorar a linha justamente quando ela passar a importar. | Decorre de 063 |\n| BOARD-PESQUISA-067 | **Mudança de qualidade se mede antes de se defender.** Trocar modelo, mexer no prompt, cortar buscas ou filtrar domínio são apostas sobre qualidade; sem régua, \"melhorou?\" é opinião de quem mexeu. O corpus (`api/corpus/planejador.ts`) é a régua, e roda **antes e depois** de cada mudança da Fase 4. | Fase 4 · construída 14/09/2026 |\n| BOARD-PESQUISA-068 | **A régua não é um modelo juiz.** Um juiz custa por rodada, deriva como qualquer modelo, e precisaria da própria avaliação para se saber confiável — régua que precisa de régua não mede nada. Só entra o que se confere por contagem e comparação de texto; o que exige julgamento é **impresso**, para quem lê julgar. Uma régua honesta que mede metade vale mais que uma nota inventada que parece medir tudo. | Decorre de 067 |\n| BOARD-PESQUISA-069 | **A régua é testada antes de medir.** `testes/corpus-planejador.test.ts` prova, com planos fabricados, que ela reprova o plano derivado real de 14/09/2026 e aprova o fiel. Régua não medida daria verde num defeito — pior do que não ter régua, porque ninguém mais olharia. | Decorre de 067 |\n| BOARD-PESQUISA-070 | **O plano não pode ter duas perguntas para a mesma coisa.** Duas perguntas iguais são duas buscas pagas para uma resposta. A garantia que injeta a pergunta da tarefa (`BOARD-PESQUISA-019`) reconhece a pergunta **estreita que cabe dentro da tarefa** e não injeta por cima dela: quando o modelo pergunta só a parte que falta — porque o resto está no Bloco A — ele acertou, e reinjetar a tarefa inteira desfaz o acerto. | Achado pela régua em 15/09/2026 |\n| BOARD-PESQUISA-071 | **A garantia contra deriva não afrouxa por causa de 070.** Pergunta derivada não cabe dentro da tarefa — não compartilha as palavras dela —, então a injeção continua acontecendo no caso que a criou. Os dois lados são cobrados por teste: o que não pode duplicar e o que não pode deixar de corrigir. | Decorre de 070 |\n| BOARD-PESQUISA-072 | **O modelo que planeja e o que sintetiza são configuráveis em separado** (`IA_MODELO` e `IA_MODELO_BUSCA`). Até 15/09/2026 os dois liam a mesma variável, e o efeito era o contrário do que o plano supunha: a etapa mais profunda — ler a web e escrever a análise — rodava no modelo mais barato. Vazio mantém o comportamento anterior; a troca é **decisão de produto**, porque quase dobra o custo da investigação (medido: ~R$ 0,69 → ~R$ 1,33). | Fase 4 · construída 15/09/2026 |\n| BOARD-PESQUISA-073 | **O teto reservado e a chamada que gasta leem o MESMO modelo**, de uma função só (`modeloDaBusca()`). Enquanto duas leituras de `env` coincidiam, a estimativa era verdadeira por coincidência; no dia em que divergissem, ela mentiria — a mesma classe de erro que fez a reserva errar por 80× em 14/09/2026. | Decorre de 072 e de PES-007 |\n| BOARD-PESQUISA-074 | **Modelo sem preço na tabela não busca: a investigação recusa.** Sem preço não há teto; sem teto não há reserva; e `custoDe` também devolve `null`, então nem o consumo é lançado — a busca sairia de graça para quem pede e paga pela plataforma, com as buscas encadeadas (US$ 0,01 cada) junto. Não dá para cobrar o que não se sabe precificar, e regalar em silêncio é pior do que parar. | Mesma família de DIN-009 · 15/09/2026 |\n| BOARD-PESQUISA-075 | **O corte entre preparação e resposta procura o resultado de ferramenta em QUALQUER profundidade.** A resposta do provedor é o que vem depois do último resultado de busca ou leitura; com filtragem dinâmica (`web_search_20260209`+) esses resultados chegam **aninhados** dentro do bloco de execução de código. Varrer só o nível de cima faria a narração do modelo (*\"Vou buscar informações sobre…\"*) voltar a vazar para dentro da resposta — o defeito que o corte existe para evitar, ressuscitado por mudança de formato e não por mudança de código. | Fase 4 · construída 15/09/2026 |\n| BOARD-PESQUISA-076 | **A versão da ferramenta de busca é configurável, com o padrão de sempre** (`PESQUISA_BUSCA_VERSAO`). A filtragem dinâmica ataca o maior custo da investigação — 38.662 tokens de entrada contra 724 do planejador — e não cobra pela execução de código que a faz. Mas ela muda o formato da resposta, e formato novo não se liga sem olhar uma investigação de verdade. | Decorre de 075 |\n| BOARD-PESQUISA-077 | **Tarefa que já tem investigação entregue não é investigada de novo em silêncio.** Medido em 14/09/2026: a MESMA tarefa foi investigada duas vezes na mesma sessão, R$ 0,67 no total. Nada no caminho perguntava se já havia resposta — nem o cliente, nem a rota. A recusa acontece **antes do fluxo abrir**, antes do planejador: nem os centavos dele saem. | Achado no dado real · construída 15/09/2026 |\n| BOARD-PESQUISA-078 | **A recusa de 077 é escolha, não bloqueio**, com o preço de cada saída à vista: *ver a resposta que já existe* não custa nada (a busca já foi feita e paga) e *investigar de novo* custa. A resposta pode ter envelhecido ou ter vindo ruim — refazer continua sendo direito de quem trabalha (`BOARD-PESQUISA-012`: nenhuma recusa é beco sem saída). Refazer é **explícito** (`refazer: true`); nada no caminho normal o liga sozinho. | Decorre de 077 |\n| BOARD-PESQUISA-079 | **Quando a investigação anterior aconteceu se diz em distância, não em data.** *\"há 2 horas\"* responde à pergunta que a pessoa tem — *isso ainda serve?* — e `14/09/2026 13:25` não. Data no futuro (relógio torto, fuso) nunca vira número negativo: vira *\"agora há pouco\"*. | Decorre de 077 |\n| BOARD-PESQUISA-080 | **Toda resposta que passa por cima do Fastify manda os cabeçalhos de CORS por conta própria.** `resposta.hijack()` existe para tirar o Fastify do caminho e escrever SSE direto no socket — e o `@fastify/cors` escreve num hook do Fastify. Tirar o Fastify do caminho tirava o CORS junto: o navegador descartava a investigação inteira com *\"No 'Access-Control-Allow-Origin' header is present\"*, enquanto a API anunciava, na partida, exatamente a origem que o navegador usava. O preflight `OPTIONS` continua passando pelo plugin e responde certo, o que faz a permissão ser concedida e depois não aparecer. | Achado na primeira investigação real, 15/09/2026 |\n| BOARD-PESQUISA-081 | **A lista de origens do stream é a MESMA do plugin**, de uma função só (`cabecalhosCorsDeStream`, encostada em `origensPermitidas`). Duas listas divergiriam no primeiro ajuste, e a divergência reapareceria como o erro de `080` — num ambiente onde ninguém está olhando. Mesma família de `BOARD-PESQUISA-073`: o valor que autoriza e o valor que executa se leem do mesmo lugar. | Decorre de 080 |\n| BOARD-PESQUISA-082 | **O stream devolve a origem exata, nunca `*`.** A sessão viaja em cookie, então o CORS roda com `credentials: true` — e nesse modo o navegador **rejeita** o coringa. Um `*` trocaria um erro visível por outro, com cara de conserto. Vai junto `Vary: Origin`, senão um cache intermediário serviria a uma origem o cabeçalho emitido para outra. | Decorre de 080 |\n| BOARD-PESQUISA-083 | **Bloco sem citação não é uma afirmação — é o texto que sobrou entre duas citações.** Nele vêm juntos o rabo da frase anterior, o título da seção seguinte e a afirmação de verdade que o modelo não citou. Tratar os três como uma coisa só pede à pessoa uma decisão sobre meia frase, e faz a decisão valer para o resto que veio grudado. O bloco **sem** citação é partido por parágrafo; o bloco **com** citação continua inteiro, porque a fonte sustenta o texto todo e partir orfanaria a atribuição. | Achado na primeira investigação real, 15/09/2026 |\n| BOARD-PESQUISA-084 | **A declaração de limite do modelo é afirmação, não cola.** Medido em 15/09/2026: a seção *\"O que faltou\"* — onde o modelo diz o que NÃO conseguiu responder — chegou colada a um fragmento que começava em *\"— mas não atua com condomínios\"*, desmarcada (sem fonte chega desmarcada, `029`) e foi descartada sem ninguém decidir isso. É o parágrafo mais valioso de uma resposta que não achou o que procurava, e é irmão das lacunas derivadas de `063`: os dois dizem o que ficou sem resposta, um pela estrutura e outro pelas palavras do modelo. | Decorre de 083 |\n| BOARD-PESQUISA-085 | **Título não é afirmação em nenhuma posição, e em nenhuma das duas formas.** A guarda anterior reconhecia `## Assim` e só quando o bloco COMEÇAVA com ele; o dado real trouxe `**Assim:**` no meio de um bloco. Uma guarda que só olha o começo de um bloco não protege um bloco que é vários parágrafos. | Decorre de 083 |\n| BOARD-PESQUISA-036 | **Descartar não apaga a investigação.** O que foi descartado não vira quadro, mas a consulta, as fontes e o gasto continuam no histórico — saber o que foi jogado fora é parte de auditar uma investigação que já foi paga. | Decidido 14/09/2026 |\n\n**O que BOARD-LEITURA-003 provou.** Ela foi escrita em 29/08 prevendo o dia em que a pesquisa fosse liberada, com a trava que *\"só desativa, nunca ativa\"*. Esse dia chegou em 06/09, e tarefa concluída continuou sem pesquisar — sem ninguém precisar lembrar. É a regra que mais claramente pagou o próprio custo neste documento.\n\n**Por que a investigação não podia ser mais restrita que o assistente (BOARD-PESQUISA-014).** A primeira versão do plano dizia que a investigação leria só as idéias finalizadas. Seria mais restrito do que `IA-CONHEC` já permite ao painel lateral — e cego para o caso mais comum: **a tarefa que está sendo pesquisada vive numa idéia que ainda não foi finalizada.** \"Pesquisar outras logitechs\" está em `Em andamento`; uma investigação que só enxerga `Finalizado` não vê a própria hipótese que ela existe para confirmar ou derrubar.\n\nO ganho de ler o material de consulta não é só não ficar cega: a síntese passa a poder dizer *\"a web confirma a suposição S, que está em andamento\"* — a lógica de certezas, suposições e dúvidas que a matriz CSD já usa, agora com fonte externa de um lado.\n\n**A curadoria (Fase 2, 14/09/2026).** Era o pedido que abriu este plano — *\"dar a opção para o usuário deletar algum conteúdo que ele não queira salvar\"*. O resultado deixou de virar quadro sozinho: a investigação termina num rascunho, com cada afirmação ao lado da fonte e do trecho citado, e o quadro nasce do que sobrou.\n\n**Duas coisas que a montagem do rascunho precisou resolver, e que não eram óbvias.** Ao salvar, o texto é remontado só com o que ficou — e as posições das fontes **são recalculadas**. Sem isso, apagar uma afirmação no começo empurraria todas as fontes para o quadro errado, porque o casamento fonte↔quadro é por posição. E fonte que só sustentava afirmação apagada sai da lista: uma fonte listada sem nada que ela sustente é procedência de coisa nenhuma.\n\n**Sobre D1 (rascunho obrigatório ou com atalho).** Obrigatório, por enquanto, e por um motivo mensurável: ainda não se sabe quanto as pessoas apagam. Um \"salvar direto\" agora seria desenhado no escuro; depois de medir, ele se desenha sozinho — ou se descobre desnecessário.\n\n~~**O que o rascunho ainda não faz.** Não é gravado. Vive entre o fim da busca e o \"Salvar\"…~~ **Parágrafo morto duas vezes:** primeiro em 14/09/2026, quando `BOARD-PESQUISA-042` gravou as afirmações; depois em 15/09/2026, quando o rascunho inteiro saiu. Fica riscado, e não apagado, porque a sequência ensina uma coisa: a disciplina de `032` — não gastar migração num contrato antes de a forma se provar em uso — evitou gravar, em 14/09 de manhã, o desenho de uma tela que não existiria 24 horas depois.\n\n**Fonte por afirmação saiu de graça, e ficou melhor do que o plano previa.** O plano previa uma **terceira chamada de modelo** para isso: um sintetizador que releria a resposta e re-atribuiria as fontes. Custaria cerca de R$ 0,36 por investigação em Sonnet, quase dobrando o gasto típico.\n\nNão foi preciso. Quando as citações estão ligadas, a API devolve a resposta **partida em blocos, cada um com as citações que o sustentam** — a atribuição já existe, e vem da origem. O provedor juntava tudo numa string e descartava essa estrutura. O trabalho foi parar de descartar.\n\nE o resultado é mais confiável, não só mais barato: uma segunda atribuição feita por leitura é **palpite sobre a primeira**. Vale aqui o mesmo princípio de `IA-CONV-NARRA-005` — o que é determinístico não se pede a um modelo. Se um dia a granularidade sair grossa demais (fonte por parágrafo em vez de por frase), a chamada de síntese volta à mesa, com o custo declarado.\n\n**A leitura de página (Fase 1b, 14/09/2026).** `web_search` devolve trecho, e trecho responde \"quem são\" sem responder \"como funciona\" — foi exatamente o que a investigação da Loggi mostrou, com resposta certa e rasa. `web_fetch` abre a página inteira. A ferramenta **não cobra por uso**; o que ela custa são tokens, e tokens de página lida são muitos e voltam ao contexto a cada rodada.\n\n**A segurança aqui não depende de disciplina nossa.** `web_fetch` só abre URL que já apareceu na conversa, e a única coisa que aparece nesta chamada são os resultados da própria busca. O conhecimento interno da empresa **nunca chega a este provedor** — ele vai para o planejador, noutra chamada. É o que o §6 do plano pede em duas frases: contexto interno e conteúdo lido jamais no mesmo bloco.\n\n**O que a leitura custou na conta.** O pior caso da investigação passou a ~R$ 1,50 — cinco buscas, três páginas, resposta cheia — contra o teto de R$ 3 de `D2`. Cabe, com folga para a síntese que ainda vem. E as constantes que dimensionam isso saíram de dentro da rota: quem sabe quanto a chamada pode gastar é quem a faz, e constante de custo copiada é reserva que diverge do provedor na primeira vez que alguém ajusta um dos dois lados.\n\n**O terceiro defeito do dia estava no dinheiro, e ninguém tinha reclamado.** Olhando a razão da investigação da Loggi: 4 buscas, 31.196 tokens de entrada. Dois problemas de uma vez.\n\nA busca encadeada custa **US$ 0,01 por unidade** além dos tokens, e `consumos_pesquisa.buscas` guardava a contagem desde sempre sem ela virar dinheiro. Não era detalhe: US$ 0,040 de busca contra US$ 0,036 de tokens — **mais da metade da conta**. A plataforma cobrava menos da metade do que pagava, e quanto mais fundo a investigação ia, maior o prejuízo. O oposto do que se quer de um produto que vende profundidade.\n\nE a reserva contava a entrada **pelo texto do prompt** — uns 400 tokens contra 31.196 reais, quase 80 vezes menos. Numa chamada com ferramenta o resultado da web volta para o contexto e o contexto inteiro é reenviado a cada rodada; a entrada cresce com o quadrado do número de buscas. Efeito: a reserva não travava o que ia ser gasto, o teto de R$ 3 não segurava nada, e era esse número que aparecia para a pessoa como \"custo estimado\". `PES-007` existe justamente para esse número ser verdade.\n\nOs dois estão registrados em `creditos-pagamentos-regras.md` como `DIN-009`, com a tabela de quanto se cobrou a menos.\n\n**O segundo defeito do mesmo dia, e este era pior.** Depois de consertado o board, a tarefa *\"A Loggi opera serviço de ponto de coleta em condomínios residenciais ou comerciais?\"* produziu um plano com quatro perguntas: principais logtechs do Brasil, e-commerces com locker, custo de locker inteligente, maiores e-commerces do mundo. **Nenhuma respondia o que estava escrito na tarefa.** O defeito anterior mostrava errado uma resposta certa; este gastava quatro buscas para não responder.\n\n**Três causas, e a primeira era minha.** O planejador tinha piso de **3 perguntas**. Uma tarefa que já é uma pergunta inteira não tem três perguntas dentro — então o modelo preenchia a cota alargando o assunto. Cota de pergunta é cota de busca paga: o piso não só desviava, cobrava por isso. O piso virou 1.\n\nA segunda estava na instrução: *\"Nome próprio é sinal forte de fato externo — `Pesquisar outras logitechs` é pesquisa de concorrentes\"*. Ela ensinava que empresa nomeada significa pesquisa de mercado. Mas o que faz \"outras logitechs\" pedir concorrentes é a palavra **outras**, não o nome próprio — e a instrução não dizia isso. Agora diz, com os dois exemplos lado a lado.\n\nA terceira era a ficha da empresa. Ela entra no contexto para o planejador **interpretar** a tarefa, e estava sendo usada para **substituí-la**: os motivos que ele escreveu diziam, com todas as letras, *\"complementa a pesquisa de concorrentes diretos da iHouseLog\"*. Ninguém pediu concorrentes. A regra nova separa as duas coisas.\n\n**E a garantia, porque instrução não basta.** `BOARD-PESQUISA-027`: quando a tarefa está escrita como pergunta, o servidor a põe como primeira do plano, tenha o modelo obedecido ou não. Mesma disciplina do teto de 3–6, que também é cortado no servidor: pedir é instrução, garantir é garantia — e o que está em jogo é a pessoa receber a resposta que pediu.\n\n**O defeito de 14/09/2026, achado pelo Ricardo em uso real.** A investigação sobre a Loggi devolveu resposta certa para as quatro perguntas, com fonte — e o board mostrou outra coisa. O primeiro quadro tinha o título da pergunta 1 e, dentro, as respostas 1, 2 e 3 grudadas; e havia um post-it *\"A Loggi opera serviço de ponto de coleta em condomínios residenciais ou comerciais? — Responda aqui…\"*, como se ninguém tivesse respondido. A resposta estava logo abaixo da pergunta o tempo todo.\n\n**A causa era um número.** `secoesDaResposta` só reconhecia cabeçalho de até **80 caracteres**. O limite fazia sentido para as formas ambíguas (negrito sozinho, frase capitalizada com dois-pontos), onde um teto baixo impede um parágrafo inteiro de virar título. Mas valia também para `# Assunto`, que é marcação inequívoca — a linha É um título, independente do tamanho.\n\nAntes da Fase 1a isso nunca aparecia: ia uma pergunta ao provedor e a resposta raramente tinha cabeçalho longo. Depois da 1a vão de 3 a 6 perguntas, o provedor repete cada uma como cabeçalho, e **pergunta é longa**: duas das quatro passaram de 80 caracteres, não viraram título, caíram no corpo da seção anterior — e lá `partirSecao` as confundiu com perguntas que o provedor teria feito de volta.\n\n**O que isso ensina sobre a Fase 1a.** Ela mudou a FORMA da resposta, não só o conteúdo, e um pedaço da máquina calibrado para a forma antiga continuou rodando com a régua velha. O corpus do roteador não pegaria isso, os testes puros não pegariam, e a prova com DOM da 1a usava uma resposta curta de uma pergunta só. Quem pegou foi o uso. Agora há `ferramentas/provar-quadros.mjs`, que trava o caso com a resposta real desta investigação.\n\n**O defeito que a Fase 1b encontrou, e que ninguém tinha visto.** A persistência entrou no plano como \"a narração sobrevive ao F5\" — conforto. Lendo o código da 1a com cuidado apareceu coisa maior: **o servidor não para quando a aba fecha.** A busca completa, o crédito é consumido e a consulta é gravada; quem some é só o cliente — e é ele quem monta o quadro. Ou seja, fechar a aba no meio de uma investigação **custava o dinheiro de uma busca e não entregava nada**.\n\nPior: o texto da resposta nem estava guardado. `pesquisa_consultas` tinha pergunta, nível, resultado, provedor e fontes — tudo menos a prosa que se pagou para obter. Ela vivia no corpo HTTP e virava conteúdo do quadro que o navegador desenhava. Se o navegador não desenhasse, o texto não existia em lugar nenhum.\n\n**Por que guardar a resposta não contraria BOARD-PESQUISA-002.** Aquela regra separa o CANVAS de `pesquisa_entidades`: dois donos do mesmo fato divergem em silêncio. Aqui os papéis também são distintos, e é justamente por isso que as duas cópias fazem sentido: a **consulta é o registro do que foi comprado**; o **quadro é o que a pessoa resolveu ficar**. Editar um card não reescreve a consulta — e é isso que torna possível conferir depois se o quadro ainda diz o que a busca disse.\n\n**O que a Fase 1a trocou, e o que ela deliberadamente não trocou.** Trocou o portão: `SUJEITO_EXTERNO` e companhia deixaram de decidir se uma tarefa vira busca. `testes/roteador.test.ts` media a heurística em **14 de 18**, e os quatro erros eram a mesma falha quatro vezes — verbo de levantamento com alvo que é nome próprio ou categoria de produto, contra uma lista fechada de substantivos genéricos. Nenhuma lista fechada cobre nomes próprios, então aquilo não tinha conserto por ajuste: tinha por troca de mecanismo.\n\nNão trocou a resolução de referência (`BOARD-PESQUISA-021`), nem a busca em si: continua sendo uma chamada ao provedor, que encadeia internamente. O que mudou é a **pergunta** que ela recebe — a tarefa mais as perguntas planejadas, em vez do texto cru. `web_fetch` por página e síntese com fonte por afirmação são Fase 1b.\n\n**A estimativa virou portão (BOARD-PESQUISA-037).** Por um dia ela foi só informação: o evento `plano` entregava o custo em reais, com a comissão dentro, antes de a busca sair — e a busca saía sozinha logo depois. Estava dito aqui, em vez de escondido, mas dizer não conserta. Desde 14/09/2026 o stream de `investigar` **termina** no plano, e buscar é uma segunda chamada que só existe se alguém clicar.\n\n**E o portão saiu do caminho um dia depois (BOARD-PESQUISA-037, revista).** Instrução do Ricardo, 15/09/2026: *\"ele já clicou, e já sabemos que ele quer pesquisar\"*. O portão tinha sido construído para segurar uma coisa — gastar sem ninguém autorizar — e a autorização já existia um passo antes, no clique em \"Pesquisar\". Pior: a única informação que o portão carregava era o preço, e o preço tinha saído dali horas antes, quando os valores foram recolhidos para Configurações. Sobrou uma pergunta sem conteúdo, feita a quem já tinha respondido.\n\n**O quadro em branco, e por que ele passou por todas as provas (BOARD-LEITURA-007, BOARD-SALVA-007).** Achado em uso real pelo Ricardo: uma pesquisa concluída, salva, e na volta o board vazio. Duas causas, uma em cima da outra. A primeira: `criarQuadroDocumento` não tinha o `if (modoLeitura) return null` que `criarQuadroResultado` já tinha — a guarda estava numa irmã e não na outra. A segunda, que é o que tornou a primeira invisível: a narração dizia *\"Montei 3 quadros no board\"* e disparava a gravação **sem olhar no que dava**. Os quadros estavam na tela, a gravação era recusada em silêncio, e a única coisa que a pessoa tinha lido era uma confirmação.\n\n**Por que nenhuma prova pegou isso antes.** Todas as suítes existentes substituíam `criarQuadroResultado` e `criarQuadroDocumento` por dublês — cada uma provava o que vinha *antes* de montar o quadro. Nada cobria o trecho board → `lerDaTela()` → `PUT` → recarregar, que é exatamente onde os dois defeitos moravam. A prova nova (`ferramentas/provar-gravacao.mjs`) carrega a página inteira e só finge a rede; foi conferida falhando sem as correções. É a lição mais cara desta correção: um dublê bem colocado apaga justamente a fronteira onde o defeito mora.\n\n**Os três lugares que mostravam o mesmo dinheiro (BOARD-PESQUISA-018a).** Antes de 15/09/2026 o valor aparecia em três momentos da mesma jornada: o teto em cima do botão de buscar, o custo no fim de cada resposta do caderno, e o custo no rodapé do relatório. Três números, uma decisão — e a decisão já tinha sido tomada quando o primeiro deles aparecia. Nenhum foi substituído por outro: os três saíram, e o valor passou a morar num lugar só, Configurações → Créditos de uso → Histórico de uso (`DIN-013`).\n\n**Por que o preço antes de gastar não era a proteção que parecia.** Ele nasceu como proteção, e a intenção era boa: ninguém deve gastar sem saber quanto. Mas o teto aparecia **depois** do clique em \"Pesquisar\" — depois da decisão, portanto —, e ainda por cima como um valor que quase nunca acontece. Custava atenção, criava expectativa errada e não mudava nada. O que protege o gasto continua no servidor: o **teto por investigação** e a reserva de `018`. Tirar o número da tela não tirou nada da razão — a medição é a mesma (`DIN-011`), e é ela que alimenta o Histórico de uso.\n\n**O que NÃO saiu, e por quê.** A tentação era apagar de `037` a `041` de uma vez, já que \"o portão acabou\". Seria trocar uma segunda pergunta por três buracos. `038`, `040` e `041` não descrevem a pergunta — descrevem o que o **servidor** faz com a espera que ele grava de qualquer jeito: sobreviver a fechar a aba, não buscar duas vezes com clique duplo, e devolver à espera quem ficou sem saldo. Nada disso deixou de ser verdade, e nada disso seria reconstruído por quem lesse um documento onde essas linhas não existem mais. Por isso ficaram, e ganharam `037a` dizendo em voz alta que o portão continua de pé do lado de lá.\n\n**O laço que a remoção quase criou (BOARD-PESQUISA-086).** Tirar o portão significa: chegou `aguardando`, confirme. Só que o servidor manda `aguardando` em mais de uma situação — entre elas a de `039`, preço que subiu entre planejar e confirmar. Um cliente que confirma todo `aguardando` responderia a esse também, e o servidor responderia com outro, e cada volta é uma **busca paga**. A trava não é um contador de tentativas: é um parâmetro que só o stream de planejamento recebe. O caminho de `/buscar` não tem como se auto-confirmar porque nunca ganha a permissão, e não porque alguém lembrou de contar até dois.\n\n**Por que ainda existe um botão de continuar (BOARD-PESQUISA-087).** Parece contradição com \"o portão saiu\", e não é: o que saiu foi perguntar de novo a quem **acabou de clicar**. Quem reabre a tarefa amanhã e encontra um plano parado não clicou em nada hoje — buscar por conta própria ali seria gastar o dinheiro de alguém a partir de um clique de ontem. É um botão só, e não um par: \"agora não\" é fechar a aba, e o plano fica guardado de qualquer jeito.\n\n**Dois gestos, e eles pedem coisas diferentes.** O portão pergunta *\"posso gastar?\"* antes da busca; o rascunho (`BOARD-PESQUISA-033`) pergunta *\"o que fica?\"* depois dela. Foi tentador tratar o rascunho como o portão do gasto — ele já era uma decisão da pessoa, e adiar o portão teria sido barato. Mas no rascunho o dinheiro **já saiu**: decidir ali é escolher o que fazer com o que se pagou, não se paga. São duas perguntas, e uma não responde a outra.\n\n**E os dois gestos caíram, com 24 horas de diferença e por motivos opostos.** O portão saiu porque **repetia** uma pergunta já respondida (o clique em \"Pesquisar\"). O rascunho saiu porque fazia uma pergunta **cedo demais**: pedia para escolher o que fica olhando uma lista dentro de um dialog, quando o lugar onde se julga se uma frase presta é o board, com ela ao lado das outras. O parágrafo acima continua certo no que afirma — as duas perguntas são diferentes, e uma não responde a outra —, e errado no que supõe: que as duas precisavam ser feitas *ali*.\n\n**O que uma curadoria obrigatória custava, e não estava escrito em lugar nenhum.** Entre a busca terminar e o resultado aparecer onde serve havia um dialog que só podia ser atravessado decidindo. Quem só queria ver o que tinha comprado precisava primeiro curar. E a decisão era pedida no pior momento possível para tomá-la: antes de ver as frases no board, ao lado do que já estava lá — que é exatamente a comparação que faz alguém perceber que uma frase é redundante ou fraca.\n\n**Por que `agruparEmSecoes` e `remontar` ficaram (BOARD-PESQUISA-035a).** Elas nasceram para o rascunho, e a leitura apressada é que morreram com ele. Não morreram: as investigações curadas entre 14 e 15/09/2026 têm `removida_pelo_usuario` gravado por afirmação, e reabrir uma delas tem de devolver ao quadro **o que aquela pessoa manteve — nem mais, nem menos**. Apagá-las por serem \"código do rascunho\" mataria a decisão de quem leu junto com a tela que a coletou. O padrão que elas aplicam, esse sim mudou: sem decisão gravada, tudo fica.\n\n**Por que o preço mudou de lugar na tela.** Ele saía como mais um passo da narração, no meio da lista do que o assistente estava fazendo. Agora sai **colado no botão**, com peso de texto e não de legenda. Número numa linha e escolha em outra vira aviso; número em cima do botão vira decisão — e é a mesma razão pela qual \"Agora não\" não tem o peso visual de \"Buscar agora\": duas ações com o mesmo peso deixam a escolha sem recomendação, e a recomendação aqui é que ninguém gaste por inércia.\n\n**O terceiro defeito achado em uso real, e o mais caro (14/09/2026).** Uma tarefa cuja descrição era literalmente `\"Responda aqui...\"` — o convite que o próprio produto escreve nos post-its de pergunta em aberto — virou **duas** investigações pagas, R$ 0,67. O planejador não recusou. Sem tarefa em que se apoiar, ele preencheu o vazio com a **ficha da empresa** e escreveu cinco perguntas sobre o mercado de lockers em condomínios. Os \"porquês\" que ele gravou denunciam o mecanismo: *\"A proposta central da iHouseLog é…\"*, *\"A descrição menciona…\"*. Ele planejou a partir do CONTEXTO, que é exatamente o que a regra 5 do prompt proíbe.\n\n**Por que a regra 5 não segurou, e por que o conserto não foi no prompt.** A regra diz que a ficha da empresa nunca substitui a tarefa — e ela vale quando existe uma tarefa para não ser substituída. Aqui não existia. Pior: a regra 7 empurra na direção errada nesse caso (*\"na dúvida, prefira perguntar\"*). Mexer no prompt seria pedir ao modelo que reconhecesse um texto que qualquer comparação de string reconhece de graça — e **instrução não é garantia**, pela quarta vez neste projeto. A guarda virou `tarefaSemConteudo`, pura e testada, antes de qualquer reserva.\n\n**Uma lição sobre a própria guarda.** A primeira versão escrevia a lista de placeholders já normalizada à mão, e errou na estreia: o aviso de falha do board termina em ponto, e a comparação passava ao lado por causa dele. A lista passou a ser normalizada pela **mesma função** que normaliza a entrada. Duas normalizações do mesmo dado é o defeito de sempre, em miniatura — e foi o teste que pegou.\n\n**O que a documentação confirmou, e o que ela obrigou a consertar antes (15/09/2026).** A filtragem dinâmica existe de `web_search_20260209` em diante, **não cobra** pela execução de código que a realiza, e **preserva as citações** — `url`, `título` e `cited_text` continuam presos aos blocos de texto, então a fonte por afirmação (`031`) sobrevive. Três fatos que não dava para supor, e que mudaram o trabalho: o item deixou de ser \"ligar a filtragem\" e passou a ser \"garantir que ligar não quebre nada\".\n\n**O que ela quebraria.** O corte entre preparação e resposta procurava `web_search_tool_result` **no nível de cima** do `content[]`. Com filtragem, os resultados chegam aninhados dentro do bloco de execução de código: a varredura acharia `-1` e devolveria a resposta inteira, com o *\"Vou buscar informações sobre…\"* colado na frente. Nenhuma linha do corte teria mudado — só a forma da resposta.\n\n**E o teto de profundidade quase repetiu o erro em miniatura.** A primeira versão parava em 4 níveis, e **cada array come um nível**: o caminho documentado já gasta cinco. Um teto justo demais não falha com erro — ele silenciosamente para de achar o resultado, que é exatamente o defeito que se queria evitar. Foi o teste que mostrou, com um nível a mais do que a API documenta hoje.\n\n**A síntese rodava no modelo mais barato — descoberto em 15/09/2026, lendo o `.env`.** `IA_MODELO=claude-haiku-4-5`, e tanto o planejador quanto a busca liam essa variável. O plano sempre supôs o contrário (*\"barato para planejar, principal para sintetizar\"*), e a tabela de custo dele — ~R$ 1,25 por investigação — foi calculada com Sonnet na síntese. O que estava em produção custava metade disso e pensava com metade da capacidade, na etapa que mais precisa dela.\n\n**Por que separar e não trocar.** Trocar é decisão de dinheiro do usuário, e o ganho de qualidade não foi medido. O código passou a permitir a escolha, com o padrão igual ao de hoje: quem decide é quem paga, e a decisão custa uma linha no `.env`. É o oposto de embutir a preferência de quem escreveu o código.\n\n**A porta estreita que a separação abriu, e que já estava aberta.** Modelo fora da tabela de preços fazia a investigação correr **de graça**: `tetoBuscaUsdMicros` devolve `null`, `null` virava estimativa 0, estimativa 0 não reserva nada, e no fim `custoDe` também devolve `null` — nem o consumo era lançado. As buscas encadeadas iam junto. O buraco existia antes; um `IA_MODELO_BUSCA` com erro de digitação só tornou fácil cair nele. Agora a investigação recusa.\n\n**O que a régua achou na primeira rodada real (15/09/2026), e o que isso ensina sobre réguas.** Cinco de cinco casos passaram — e um deles passou **com uma duplicata na tela**: duas perguntas para a mesma coisa, uma busca paga a mais. A régua não olhava para duplicata, e *o que a régua não olha não existe*. O critério entrou, e o primeiro teste dele é o plano real que tinha passado.\n\n**A causa era minha, e era assimetria.** `ehAMesmaPergunta(a, b)` divide as palavras comuns pelo tamanho de `a` — assimétrica de propósito. A garantia de fidelidade só perguntava `ehAMesmaPergunta(tarefa, p)`, a direção em que a tarefa longa quase nunca bate. Numa tarefa composta (*\"quais marcas vendem no Brasil **e** qual a participação da Logitech?\"*) com metade já validada no Bloco A, o modelo **acertou** — perguntou só o que faltava — e a garantia reinjetou a tarefa inteira por cima. A garantia que consertou um defeito criou outro, menor, no caso em que o modelo estava certo.\n\n**O sinal que faltava no diagnóstico.** Descobrir se a pergunta duplicada veio do modelo ou da injeção exigiu calcular `ehAMesmaPergunta` à mão. O `porque` de cada pergunta já dizia isso — a injeção assina *\"É a própria tarefa, escrita como pergunta\"* — e o runner não o imprimia. Agora imprime: **um diagnóstico que existe no dado e não aparece na ferramenta custa uma investigação inteira para ser refeito.**\n\n**O ponto cego do `tsc`, achado em 14/09/2026.** O `tsconfig.json` incluía só `src/` e `testes/`. Os scripts da raiz — `ver-investigacao.ts`, `medir-planejador.ts` — **nunca foram compilados**, e um deles foi estendido nesse mesmo dia sob três declarações de \"tsc limpo\" que não o tinham olhado. Ferramenta de diagnóstico que não compila quebra exatamente na hora em que alguém foi conferir um defeito. O `include` passou a cobrir a raiz e o `corpus/`.\n\n**Por que a lacuna é apurada pela seção, e não pela pergunta do plano.** Seria mais bonito dizer *\"a pergunta 3 ficou sem resposta\"*. Mas o provedor parafraseia o cabeçalho: no dado real de 14/09/2026 a pergunta era *\"Quais são as principais empresas de logtech que atuam no Brasil atualmente?\"* e o cabeçalho virou *\"1. Principais empresas de logtech que atuam no Brasil\"*. Casar os dois exigiria comparação difusa, que erra em silêncio. A seção é o que existe de verdade no texto, e o cabeçalho dela **é** a pergunta, na prática.\n\n**O terceiro defeito posicional do mesmo dia, e o mais bem escondido.** A lista que o rascunho devolve ao relatório e às lacunas não carregava o `inicio` de cada afirmação. `undefined >= 0` é **falso**, então `agruparEmSecoes` jogava tudo na primeira seção — e o resultado parecia plausível: a contagem saía \"3 de 4\" em vez de \"2 de 4\", com nomes de seções reais. Só a prova pegou. A correção foi fazer a **posição viajar com o item**, como o id já viajava: é a terceira vez que uma posição perdida produz erro silencioso (`BOARD-PESQUISA-031`, `remontar`, e agora esta), e as três tinham a mesma forma — um dado derivado do texto original sendo lido contra um texto diferente.\n\n**O custo entra no relatório porque uma conclusão sem preço não deixa ninguém julgar se valeu.** É o total que saiu do saldo, com a comissão dentro e sem desmembrar (`DIN-007`) — o mesmo número da tela, agora no documento que vai circular. Sem ele, o relatório responde \"o que descobrimos\" e não responde \"quanto custou descobrir\", que é metade da decisão de repetir a investigação ou não.\n\n**A tela de fontes não tem rota (BOARD-PESQUISA-053).** Ela se monta com o que o cliente já tem: `fontes` e `afirmacoes`, que chegam iguais no fim de uma busca e na recuperação de uma investigação antiga. Um endpoint novo seria uma segunda maneira de perguntar a mesma coisa, e duas maneiras divergem no primeiro ajuste. É a mesma economia de `afirmacoesDosBlocos`, que derivou a fonte por afirmação das citações que já vinham, em vez de pagar uma segunda leitura para descobri-la.\n\n**O caderno é o contrário do assistente, e é por isso que ele é útil (BOARD-PESQUISA-047).** O assistente do projeto lê o conhecimento interno e responde com o que sabe. O caderno tem um material fechado na frente e não pode sair dele. Isso parece uma limitação e é o valor: toda frase da resposta aponta para uma fonte listada logo acima, e quando o material não responde, a resposta é dizer isso. É a régua do NotebookLM, e é ela que torna a resposta conferível por quem vai decidir dinheiro em cima dela.\n\n**Instrução não é garantia — de novo.** O plano descrevia \"responder só com as fontes já coletadas\" como comportamento a pedir ao modelo. Pedir é frágil: um modelo que decide buscar transformaria uma pergunta de centavos numa busca cara, e por fora do portão. A chamada é feita **sem `tools`**: não há como buscar, tenha o modelo entendido a regra ou não. Mesmo princípio de `comPerguntaDaTarefa` no planejador — pedir é instrução, cortar é garantia.\n\n**O material vai numa mensagem, não no `system`.** `system` é onde mora a instrução; misturar as duas coisas é o que faz um texto vindo da web parecer ordem. É o mesmo cuidado que já separa o contexto interno (no `system`) do conteúdo lido na busca (resultado de ferramenta) — e aqui ele importa mais, porque o material do caderno é, por definição, texto que veio da internet.\n\n**Por que as afirmações viraram tabela, e não mais um campo Json (BOARD-PESQUISA-042).** `plano` e `passos` são Json porque ninguém os edita: são registro do que aconteceu, e o formato ainda ia mudar. A afirmação é o contrário. `removida_pelo_usuario` é um campo que **a pessoa muda**, e mudar um item dentro de um array Json é reescrever o array inteiro — foi exatamente isso que obrigou `anotarPasso` a serializar gravações numa fila. E a Fase 3 quer perguntar *\"quais afirmações dependem desta fonte\"*, que é pergunta de tabela. O caminho Json → tabela existe; o contrário não.\n\n**O índice de array não sobrevive a ser gravado.** Ao vivo, `fonteIds: [0, 1]` são posições dentro da lista de fontes de uma resposta HTTP, e funcionam porque as duas pontas leem o mesmo objeto. Gravado, isso é uma referência que não referencia nada: basta a ordem mudar para a procedência apontar para a página errada — e o erro seria silencioso, que é o pior tipo num produto cujo valor é a fonte estar certa (`PES-006`). No banco a ligação é chave estrangeira; a API continua devolvendo índice, calculado contra a mesma lista que ela mesma entrega.\n\n**O que a espera de `BOARD-PESQUISA-032` comprou.** Em 14/09 de manhã a decisão foi **não** gravar meio contrato — guardar as afirmações sem `removida_pelo_usuario` custaria uma migração que a Fase 2 substituiria. À tarde, com a forma do rascunho já provada em uso, o contrato foi guardado inteiro numa migração só. A regra que fica: adiar persistência de formato que ainda vai mudar é economia real, desde que o adiamento esteja escrito e tenha prazo — o prazo aqui era \"quando a Fase 2 desenhar o rascunho\".\n\n**O defeito que isto fechou, e que ninguém tinha visto.** Antes, quem recarregava a página depois de uma investigação recebia a prosa e **todas as fontes empilhadas no primeiro quadro** — a recuperação não tinha como saber onde cada fonte entrava, porque essa informação (a posição de cada citação) só existia na resposta ao vivo. Com as posições gravadas, o resultado recuperado nasce igual ao resultado ao vivo. E `remontar` recalcula as posições sobre o que **sobrou**: sem isso, apagar uma afirmação no começo do texto empurraria todas as fontes seguintes para o quadro errado.\n\n**`aguardando` não é `parada`.** Na narração são estados diferentes, com desenho diferente (✋ contra ⏸️), porque significam coisas opostas: `parada` é o assistente dizendo que não dá para seguir; `aguardando` é ele esperando você. Só uma das duas tem dinheiro do outro lado do botão. O relógio para junto, e é certo que pare: o tempo que a pessoa leva para decidir não é tempo de investigação.\n\n**Duas etapas, dois lançamentos.** Planejar e buscar são chamadas separadas, cada uma com seu `operacaoId`, reserva e consumo. O planejamento **é cobrado mesmo quando decide não buscar** — o modelo rodou e o provedor cobrou de nós. Ele entra na razão como `nivel: conhecimento`, que o enum define literalmente como \"não sai chamada para fora\": o planejador raciocina, não busca.\n\n**Como BOARD-PESQUISA-012 foi cumprida, e o que ela custou de verdade.** Quase nada de mecanismo: o servidor aceitava `nivelConfirmado` desde 02/09 e ninguém nunca mandou — o cliente parava em `planejar` e jamais chegava ao `409` de `consultar` (limite L3 do plano). O trabalho foi decidir **o que oferecer**, e isso virou `api/src/pesquisa/saidas.ts`, com `testes/saidas.test.ts` provando as duas metades da regra: toda recusa oferece caminho, e **nenhum caminho oferecido leva a outra recusa** — a armadilha seria mostrar \"Buscar por proximidade\" numa instalação sem provedor de lugares, transformando uma recusa em duas.\n\n**O texto que precisou sair.** A recusa de `conhecimento` dizia *\"Reescreva a tarefa como uma pergunta verificável (com número, data, nome ou fonte) e a busca executa.\"* Era a tela pedindo que a pessoa compensasse um limite nosso — e, no caso que originou tudo isto, a tarefa **já tinha nome próprio**: \"Pesquisar outras logitechs que atuam aqui no brasil\". O novo texto admite a falha: *\"Li esta tarefa como reflexão... Posso estar errado — a leitura é por palavra-chave, e nome próprio costuma escapar dela.\"* Sem essa admissão, o botão ao lado leria como teimosia; com ela, é uma oferta.\n\n**Um lugar só para o texto.** As recusas eram redigidas em dois lugares — as mensagens de `501`/`503` em `rotas/pesquisa.ts` e `motivoNaoExecutavel()` em `js/pesquisa.js` —, escritas em momentos diferentes e já divergindo; qual delas a pessoa lia dependia do caminho por onde ela chegou. Agora `planejar` devolve `impedimento` e `saidas`, e a tela desenha sem redigir. Junto saiu uma mentira pequena: confirmar `conhecimento` caía no `503` *\"a pesquisa não está configurada\"* — não falta configuração nenhuma, falta ser uma coisa que a plataforma faz (`PES-006`).\n\n**Por que o feedback vai para o assistente, e não para o botão (BOARD-PESQUISA-016).** Porque o rodapé do compositor não comporta o que se quer contar. Ali cabe uma linha, sem histórico, apagada no fim — e a investigação da Fase 1 tem seis etapas para relatar. O painel certo já está na tela e já é o mesmo módulo (`BOARD-IA-002`): faltava a investigação ter direito de escrever nele. O ganho não é só a espera parecer menos morta; é a investigação passar a deixar **rastro** de onde ela leu e quanto custou, no mesmo lugar onde a pessoa vai fazer a pergunta seguinte.\n\n**O que BOARD-PESQUISA-017 impede.** O caminho fácil seria a narração ser mensagem do assistente — a thread já sabe desenhar mensagem. Só que mensagem vai ao modelo na pergunta seguinte (`IA-CONV-004`), e aí toda conversa do projeto passaria a carregar \"buscando 2 de 4\" como se alguém tivesse dito aquilo. Ver `IA-CONV-NARRA-003`.\n\n**Por que a estimativa é um número só (BOARD-PESQUISA-018).** Porque é o número que a pessoa precisa para decidir: o que vai sair do saldo dela. Mostrar \"provedor R$ 0,95 + plataforma R$ 0,05\" responde uma pergunta que ninguém fez e convida à que não interessa — comparar o nosso preço com a tabela do fornecedor a cada investigação. O desmembramento existe e continua existindo, em `consumos_pesquisa`, para auditoria nossa (`DIN-005`); o que `DIN-007` fixa é que ele não atravessa a fronteira da API.\n\n**Como BOARD-PESQUISA-009 foi cumprida.** A regra foi escrita em 13/09 como não cumprida e implementada no mesmo dia. O encanamento já existia inteiro e desligado: `OperacaoConsumo` tinha `'pesquisa'`, `ORIGEM.pesquisa` apontava para a origem própria que DIN-005 exige, a descrição \"pesquisa de concorrentes\" estava escrita, e a tabela `consumos_pesquisa` existia com as colunas certas. Faltava a rota chamar. Ver `creditos-pagamentos-regras.md` para o que ainda não entra na conta.\n\n---\n\n## 2. Contrato da API\n\nTodas autenticadas pelo cookie de acesso, e todas sob a corrente completa: **empresa → projeto → idéia → tarefa**. Qualquer elo que falhe devolve `404` com a mesma mensagem, pelo mesmo motivo de `IDEIA-ISO-004`: não contar a quem está adivinhando ids se a coisa não existe ou só não é dele.\n\n### `GET /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId/quadros`\n\nDevolve `{ quadros: [...] }`, cada quadro com suas colunas e cada coluna com seus registros, em ordem. **Lista vazia é resposta válida** e significa \"tarefa sem quadro ainda\".\n\nDiferente de `GET .../tarefas`, aqui **não** existe \"encontra ou cria\": um quadro-semente seria conteúdo que ninguém pediu.\n\n### `PUT /empresas/:empresaId/projetos/:projetoId/ideias/:ideiaId/tarefas/:tarefaId/quadros`\n\n**Corpo:** `{ quadros: [ { titulo, colunas: [ { titulo, registros: [ { titulo, descricao } ] } ] } ] }`\n\nSubstitui o quadro inteiro da tarefa, numa transação. Devolve o quadro relido do banco.\n\n| Situação | Resposta | O que a tela faz |\n|---|---|---|\n| Sucesso | `200` com `{ quadros }` | Redesenha a partir da resposta |\n| Registro sem título, ou campo acima do limite | `400` com `campo` | Mostra o erro; o canvas continua como está |\n| Sessão inválida | `401` | Renovação silenciosa; só então login |\n| Papel não permite escrever | `403` | Mostra o erro |\n| Qualquer elo da corrente falha | `404` | Volta para a atividade (BOARD-SALVA-005) |\n\nTetos: 40 quadros por tarefa, 12 colunas por quadro, 200 registros por coluna. Existem para recusar um payload absurdo antes de virar transação — não porque alguém vá esbarrar neles.\n\n### Rotas reaproveitadas\n\nNenhuma rota nova para o ciclo de vida da tarefa. `board.html` chama exatamente as mesmas de `atividade.html`:\n\n- `PATCH .../tarefas/:tarefaId/status` — finalizar e reabrir (`ATV-TAR-CONCLUIR`)\n- `DELETE .../tarefas/:tarefaId` — excluir (`ATV-TAR-EXCLUI`)\n- `POST .../tarefas` — registro vira tarefa (`ATV-TAR-CRIA`)\n\n---\n\n## 3. Modelo de dados\n\n```\ntarefas\n  ...                                             -- já existia\n  tipo   TipoTarefa NOT NULL DEFAULT 'pesquisa'   -- BOARD-ACESSO-001/002\n         -- enum: 'pesquisa' | 'matriz_csd'  (A31 retirou 'sem_tela')\n\nquadros\n  id            uuid (pk)\n  tarefa_id     uuid (fk -> tarefas.id, CASCADE)\n  titulo        varchar(60) NOT NULL DEFAULT ''   -- vazio é válido\n  ordem         integer\n  criado_em     timestamp\n  atualizado_em timestamp\n\nquadro_colunas\n  id        uuid (pk)\n  quadro_id uuid (fk -> quadros.id, CASCADE)\n  titulo    varchar(60) NOT NULL DEFAULT ''       -- vazio é válido\n  ordem     integer\n\nregistros\n  id            uuid (pk)\n  coluna_id     uuid (fk -> quadro_colunas.id, CASCADE)\n  titulo        varchar(60) NOT NULL              -- CHECK: não vazio\n  descricao     varchar(280) NOT NULL DEFAULT ''\n  ordem         integer\n  criado_em     timestamp\n  atualizado_em timestamp\n```\n\n**Sobre o `CASCADE`.** Em `tarefas` o cascade é rede de segurança — na prática idéias são arquivadas, não apagadas. Aqui ele é **real**: `ATV-TAR-EXCLUI-001` apaga a linha da tarefa de verdade, e o quadro dela precisa ir junto. Um quadro órfão não teria como ser alcançado nem apagado por ninguém depois.\n\n---\n\n## 4. Decisões\n\n| ID | Questão | Decisão | Data |\n|---|---|---|---|\n| A24 *(o padrão `sem_tela` foi revogado por A31)* | Como o \"Acessar tarefa\" decide a tela de destino (P3)? | Por um campo **`tipo`** na tarefa (`pesquisa`/`matriz_csd`/`sem_tela`), escolhido na criação, com padrão `sem_tela`. Nunca pelo texto do título — mesmo defeito que `IDEIA-MOV-015` corrigiu. | 29/08/2026 |\n| A25 | O quadro pertence à tarefa ou à atividade? | **À tarefa.** A tela abre no contexto de uma tarefa e mostra o título dela; um quadro compartilhado faria duas tarefas mostrarem o mesmo conteúdo sob títulos diferentes. | 29/08/2026 |\n| A26 | Uma rota por gesto, ou grava o quadro inteiro? | **Inteiro, num PUT.** A tela já salvava a cada gesto, e arrastar entre colunas muda duas colunas de uma vez. Preço aceito e declarado: edição simultânea, a última vence (§5). | 29/08/2026 |\n| A27 | O modo somente leitura vem de onde? | **Do `status` da tarefa**, não de `?modo=leitura`. A query string é palpite de quem digitou a URL; o status está no banco. | 29/08/2026 |\n| A28 | Editar tarefa acontece nesta tela? | **Não.** Só em `atividade.html`, que já lista todas as tarefas. Duas telas gravando o mesmo campo divergem — e o backend nem tem rota de edição de tarefa. | 29/08/2026 |\n| A29 | O que fazer com \"Pesquisar\" e a compra de créditos, que dependem de D2? | **Desativar com explicação, não remover.** O saldo era fixo no HTML e o clique só abria \"Créditos insuficientes\" — encenação. Fica visível porque é o motivo de a tela existir, mas não finge cobrar. | 29/08/2026 |\n| A30 | O autosave pode gravar antes de o quadro ter carregado? | **Não.** A tela é a fonte do que se grava (`BOARD-SALVA-002`), e uma tela que ainda não carregou não representa nada — gravar ali apaga o quadro do banco. Só grava depois que o servidor respondeu e a tela foi desenhada. | 29/08/2026 |\n| A31 | Existe tarefa que é só um item da lista, sem espaço de trabalho? | **Não.** `sem_tela` foi retirado do catálogo: ele era o padrão, e por isso toda tarefa anterior à migração ficou sem botão \"Acessar tarefa\" e sem como ganhar um — defeito observado em uso. O padrão passou a ser `pesquisa`, e o `tipo` diz que **tipo de trabalho** a tarefa é, não se existe trabalho. | 29/08/2026 |\n| A32 | Tarefa concluída pode ter o quadro editado? | **Não.** O resultado fica congelado: nada de arrastar, editar, criar, excluir ou pesquisar, e o autosave não dispara. Quem quiser mudar **reabre a tarefa** — decisão explícita, não efeito colateral de um clique. Sem isso, \"concluída\" seria só um rótulo. | 29/08/2026 |\n| A34 | A pesquisa entra antes da decisão D2 dos créditos? | **Entrou** — a pesquisa foi ligada em 06/09/2026 com o provedor externo de verdade, sem esperar D2. Revoga A29. A consequência **não foi aceita conscientemente**: cada consulta chama um provedor pago e não é medida nem debitada (§5). | Registrado 13/09/2026, a partir do código |\n| A38 | O que a narração garante sobre o que foi gravado, e onde fica o \"Download\"? | **A narração relata a gravação, não o desenho** (`BOARD-SALVA-007`): gravação falhada é dita, sem desdizer que os quadros estão na tela. **A trava de leitura mora em cada porta** que cria conteúdo (`BOARD-LEITURA-007`). **\"Download\" foi para o painel da tarefa** (`057a`), porque dentro da conversa ele só existia logo depois da pesquisa. E **abrir a tarefa não remonta investigação terminada** (`024a`). | 16/09/2026 |\n| A37 | Onde o usuário vê valor em reais? | **Num lugar só: Configurações → Créditos de uso → Histórico de uso** (`DIN-013`). Nenhuma jornada exibe preço, estimativa, teto ou custo. A estimativa continua calculada como reserva no servidor (`018`); o teto por investigação continua segurando o gasto. Saldo não é preço e continua onde estava. | 15/09/2026 |\n| A36 | A curadoria obrigatória fica, depois de o portão sair? | **Não.** A pesquisa termina e os quadros nascem no board. Um dialog obrigatório entre a busca paga e o lugar onde o resultado serve pedia a decisão no pior momento para tomá-la — antes de ver as frases ao lado do que já estava no quadro. Apagar continua existindo, card a card; a procedência continua em `053` e `057`. O padrão de recuperação inverte: sem decisão gravada, tudo fica (`035a`). | 15/09/2026 |\n| A35 | O portão de confirmação da busca fica, depois de \"Pesquisar\" já ser um clique? | **Não na tela; sim no servidor.** Quem autoriza o gasto é o clique em \"Pesquisar\" — perguntar de novo é perguntar a quem já respondeu, ainda mais depois que o preço saiu dali. `aguardando` e `/buscar` continuam existindo (`037a`), com a trava de `086` contra laço e o \"Continuar a pesquisa\" de `087` para quem chega sem ter clicado hoje. | 15/09/2026 |\n| A33 | Manter a tela de estado vazio? | **Não.** Ela some junto com o problema que descreve: a direção é a tarefa chegar com conteúdo, criado ou trazido por ferramenta externa. E enquanto existia, escondia o canvas **e o assistente** — o convite custava o recurso que atenderia o convite. Tarefa sem quadro mostra o canvas com \"Novo quadro\" no rodapé. | 29/08/2026 |\n\n---\n\n## 5. Pendências abertas\n\n| Item | Situação |\n|---|---|\n| ~~**A pesquisa não é medida nem debitada**~~ | **Resolvido em 13/09/2026**, no mesmo dia em que foi aberto. A rota agora reserva pelo pior caso, libera o teto e consome o custo real, e grava a linha em `consumos_pesquisa`. **Continua de fora** o preço por busca encadeada (`web_search_requests`), que não existe registrado em lugar nenhum do repositório: as buscas ficam gravadas como unidade, sem virar dinheiro, então o total cobrado é menor que o custo real. Ver `creditos-pagamentos-regras.md`. O texto original do defeito: **Crítica, aberta em 13/09/2026.** `rotas/pesquisa.ts` chama o provedor externo e grava consulta, fontes e entidades — mas **nunca** chama `reservar`, `consumir` ou `razao.lancar()`. A tabela `ConsumoPesquisa` existe no schema, com `total_micros` e contadores de token, e **nada escreve nela**. Como `gastoDaSessao()` soma exatamente essa tabela, ela devolve sempre zero; somado a `estimativaMicros = 0`, fixo no código, o `cabeNoTeto()` nunca barra e **o `402` nunca dispara**. Consequências: a pesquisa é gratuita e ilimitada para quem a usa; o custo do provedor não aparece em lugar nenhum; o extrato em Configurações › Créditos de uso não mostra pesquisa porque não há lançamento; e o teto por sessão, que existe na interface, não tem efeito. `BOARD-PESQUISA-009` é a regra que falta cumprir. Observado pelo Ricardo no histórico de uso e confirmado no código. |\n| ~~**Créditos — decisão D2**~~ | **Superada pelos fatos em 13/09/2026.** Bloqueava `BOARD-IA-001`, que foi revogada: a pesquisa entrou no ar sem esperar a decisão (A34). A pergunta original — crédito por usuário ou por empresa — **continua sem resposta registrada**, e agora sem nada travando enquanto isso. Ver a pendência acima. |\n| ~~Pesquisa por IA (Q4 da análise)~~ | **Resolvido em 13/09/2026** — `BOARD-PESQUISA` (§1.8). O fluxo é de proposta/confirmação em dois pontos: `409` quando o nível de custo é ambíguo (BOARD-PESQUISA-005), e \"Virar card\" como gesto explícito para o resultado entrar no quadro (BOARD-PESQUISA-003). `criarQuadroResultado` ganhou gatilho em 06/09. |\n| **Ferramentas externas por tipo** | A direção acordada em 29/08/2026: o `tipo` deve poder disparar uma **chamada externa** que traz o conteúdo pronto, em vez de abrir um quadro em branco. O caso concreto é `pesquisa` integrar uma ferramenta de busca na internet (Manus) e devolver o quadro já preenchido com o que a pessoa procurava. **Não construído** — decidido explicitamente adiar. Quando entrar, `BOARD-ACESSO-001` já cobre a regra; falta o contrato da chamada, o custo (ver D2) e o que acontece quando a ferramenta falha ou demora. |\n| Tipos novos no catálogo | Hoje são dois (`pesquisa`, `matriz_csd`). Citados como prováveis: jornada de usuário, entregáveis, dinâmicas. Cada um exige decidir o que acontece ao acessar — tela local ou ferramenta externa — e entra por migração (`BOARD-ACESSO-007`). |\n| Edição simultânea | Duas pessoas no mesmo quadro: a última gravação vence, sem aviso (`BOARD-SALVA-001`). Mesma pendência já aceita em `ideias-movimentacao.md` §4. Revisitar se o uso colaborativo crescer. |\n| \"Solicitar ajuda do Designer\" | O botão saiu por não ter comportamento nenhum. O que essa ação deveria fazer — abrir contato, criar um pedido, marcar a tarefa — segue sem definição (Q8 da análise). |\n| Mudar o `tipo` de uma tarefa depois de criada | Hoje o tipo é escolhido na criação e não muda. Não decidido se deve ser editável, e o que acontece com o quadro de uma tarefa que deixa de ser `pesquisa`. |\n| Excluir uma tarefa **concluída** | `BOARD-LEITURA` congela o conteúdo do quadro, mas \"Excluir tarefa\" continua disponível numa tarefa concluída — apagar a tarefa inteira não é \"editar o resultado\", é outra intenção, e `atividade.html` também permite. Não decidido se deveria exigir reabrir antes. |\n| `matriz_csd.html` | Continua sem falar com a API — o `tipo` já roteia para ela, mas aquela tela tem a mesma dívida que esta tinha. Pendência própria dela. |\n| Cor do card | O canvas guarda a cor escolhida em `data-cor`, mas ela **não é gravada**: `registros` não tem coluna de cor. Recarregar devolve todos ao amarelo padrão. Fora do escopo desta versão. |\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.37.0 | 2026-09-17 | **O gasto da pesquisa voltou a ser visível com a cobrança desligada.** Achado em uso pelo Ricardo: a pesquisa \"Amazon Logistch\" correu e não apareceu no Histórico de uso. Causa imediata: `CREDITOS_COBRAR=nao`, que mede sem lançar (`DIN-011`). Causa de fundo: `018a`/`DIN-013` fizeram do Histórico a única janela para o valor, e o Histórico só lia a razão — as duas decisões juntas deixavam um gasto medido e gravado invisível em todo o produto. Nova `018b`, apontando para a regra de dinheiro nova `DIN-014`: consumo medido sem lançamento aparece no Histórico, marcado, e nunca se lança na razão para preencher a a sentido com um rascunho para religar; sem ele viraria sumir, e `PES-006` proíbe esconder. Nova `033a` listando onde foi parar cada coisa que o rascunho garantia, e nova `035a` com o padrão invertido: sem decisão gravada, tudo fica — senão a mesma investigação daria quadros diferentes conforme a pessoa tivesse recarregado a página. `043` e `044` passam a \"lidas, nunca escritas\": `removida_pelo_usuario` e `rascunho_pendente` continuam no servidor para honrar as investigações curadas entre 14 e 15/09/2026, e `agruparEmSecoes`/`remontar` ficam por isso. `046` e `049` conferidas e mantidas. |\n| 1.33.0 | 2026-09-15 | **O portão de confirmação saiu da tela** (decisão A35, instrução do Ricardo). \"Buscar agora\"/\"Agora não\" perguntavam de novo o que o clique em \"Pesquisar\" já tinha respondido, e a única informação que carregavam — o preço — tinha saído dali antes. `037` revista: o gesto que autoriza o gasto é o clique em \"Pesquisar\"; planejar e buscar viraram uma narração só. `030` revogada junto com o botão que ela rotulava. `039` revista pela metade: o servidor continua reconferindo o preço, mas não há portão para reabrir. Nova `037a`, dizendo que `aguardando` e `/buscar` continuam de pé no servidor — e que por isso `038`, `040` e `041` continuam inteiras. Nova `086`: só o stream que planeja pode confirmar sozinho, trava estrutural contra um laço de buscas pagas. Nova `087`: espera encontrada sem clique de hoje não busca sozinha, oferece \"Continuar a pesquisa\". |\n| 1.32.0 | 2026-09-15 | **A primeira investigação real, segundo achado: o que o rascunho estava pedindo para julgar.** Das 7 afirmações, 2 \"sem fonte\" não eram afirmações — uma começava em `.` e a outra em *\"— mas não atua com condomínios\"*, e esta engolia inteira a seção *\"O que faltou\"*, que foi descartada sem decisão. Causa: um bloco sem citação é *o resto entre duas citações*, não uma afirmação. Agora ele é partido por parágrafo e cada natureza é julgada pelo que é (`083` a `085`); o bloco isa`), registrado em §5 como direção acordada e **deliberadamente não construída** nesta versão. Nova `BOARD-ACESSO-007` sobre o catálogo fechado. |\n| 1.1.0 | 2026-08-29 | **Corrigida uma perda de dados** e o painel do assistente. (1) `BOARD-SALVA-006` / decisão A30: o autosave gravava o que estava na tela mesmo antes de a carga terminar — com zero painéis na tela, o PUT (que substitui tudo) apagava o quadro do banco. Foi observado ao vivo: um quadro com colunas e card sumiu sozinho depois de um clique em \"Voltar\". Agora `js/board.js` só grava depois que o GET respondeu e a tela foi desenhada (`carregado`), e a tela nem anuncia \"Salvando...\" antes disso (`BoardAcoes.pronto()`). (2) O painel do assistente aparecia com o texto cortado na lateral: `board.html` tinha um comentário CSS corrompido no topo (`==================/* ... */1);`) que fazia o navegador descartar o reset `box-sizing:border-box` da página inteira — o mesmo defeito já corrigido em `atividade.html`. Sem border-box, `.assistant-inner` ficava 384px dentro de um painel de 320px com `overflow:hidden`. Verificado ao vivo: quadro preservado ao forçar um autosave durante a carga, gravação normal funcionando, e o assistente respondendo com o texto inteiro dentro do painel. **Varredura:** o mesmo comentário corrompido foi encontrado e corrigido em mais três páginas — `matriz_csd.html` (painel explicativo cortando texto em cima e embaixo), `Sobre_a_empresa.html` (\"Sugestão de tarefa\" cortado na borda direita) e `criar-empresa.html` (modal estourando a viewport). Nenhuma regra mudou: é o mesmo defeito de CSS, e as três foram conferidas visualmente antes e depois. Não resta nenhuma ocorrência no projeto. |\n| 1.0.1 | 2026-08-29 | `BOARD-ACESSO-006`: o item \"Acessar\" do menu de três pontinhos passou a abrir `board.html` também. Na v1.0.0 só o botão \"Acessar tarefa\" do card tinha sido religado ao `tipo`; o menu continuava com o código do protótipo, que comparava o título com \"Matriz CSD\" e, em qualquer outra tarefa, fechava sem navegar. Os dois caminhos agora leem o mesmo `data-destino`, calculado uma vez por card em `js/atividade.js`, e o item some do menu quando a tarefa é `sem_tela` (regra de CSS, mesmo critério do botão). Junto: `.btn:disabled` ganhou estado visual — \"Pesquisar\" estava desativado de verdade mas com aparência de ativo. **Verificado ao vivo**: tarefa `pesquisa` criada pelo modal, aberta pelos três pontinhos, quadro de três colunas e um registro criados, página recarregada com tudo no lugar, \"Voltar\" preservando o contexto, e o menu de uma tarefa `sem_tela` sem o item \"Acessar\". |\n| 1.0.0 | 2026-08-29 | Documento criado, a partir de [`board-analise-pre-implementacao.md`](board-analise-pre-implementacao.md). **Implementado.** Campo `tarefas.tipo` (enum `TipoTarefa`) e tabelas `quadros`/`quadro_colunas`/`registros` (migração manual `20260829000000_board_quadros`); rotas `GET`/`PUT .../tarefas/:tarefaId/quadros` em `api/src/rotas/board.ts`, registradas em `servidor.ts`; `board.html` religada à API por `js/board.js` (novo). Resolve a pendência **P3** de `atividade-lista.md`: o \"Acessar tarefa\" passou a rotear pelo `tipo` em vez de comparar o texto do título. Removido da tela: as três pontes por `localStorage` (`tarefa-1-status`, `nova-tarefa`, `idea-finalizada` — a última contradizia `IDEIA-CRIA-003`), a conversa de exemplo falsa do assistente (`IA-CONV-006`), o controle \"Ver empty state\" (ferramenta de pré-visualização), o botão \"Solicitar ajuda do Designer\" (sem comportamento) e o \"Editar tarefa\" com seu modal órfão (decisão A28). O assistente foi religado a `js/ia.js`, mesma conversa do projeto. \"Pesquisar\" e a compra de créditos ficaram desativados aguardando D2 (decisão A29). Decisões A24 a A29. |\n"}]},{"nome":"empresas","emoji":"🏢","docs":[{"id":"empresas/empresas-criacao","nome":"empresas-criacao","titulo":"Regras de Negócio — Criação de Empresa","versao":"1.0.0","status":"Regras definidas; implementação em andamento","pagina":"empresas.html","ids":["EMP-LIST-004","EMP-CRIA-001","EMP-CRIA-002","EMP-CRIA-003","EMP-CRIA-004","EMP-CRIA-005"],"modificado":"2026-08-23T00:06:00.355Z","bytes":5049,"rel":"Regras_de_negocio/modulos/empresas/empresas-criacao.md","md":"# Regras de Negócio — Criação de Empresa\n\n> **Versão:** 1.0.0 · **Status:** Regras definidas; implementação em andamento\n> **Módulo:** Empresas · **Página:** `empresas.html` (modal \"Nova empresa\")\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`empresas-listagem.md`](empresas-listagem.md) — a listagem que este modal alimenta\n\n---\n\n## Identificação\n\n| Campo | Valor |\n|---|---|\n| Nome | Nova empresa (modal) |\n| Módulo | Empresas |\n| Endpoint | `POST /empresas` |\n| Entidades | `empresas`, `empresa_membros` |\n| Componentes | Modal, dropzone de logotipo |\n\nO modal é o mesmo em duas situações — aberto pelo botão do cabeçalho ou pelo botão do estado vazio (EMP-LIST-004 em `empresas-listagem.md`). Este documento cobre o que acontece **dentro** dele: o que é aceito, o que é recusado, e para onde vai o arquivo do logotipo.\n\n---\n\n## 1. Regras\n\n| ID | Regra | Fonte |\n|---|---|---|\n| EMP-CRIA-001 | Nome é obrigatório, até 120 caracteres. | Já implementado |\n| EMP-CRIA-002 | Nome duplicado é bloqueado **por conta** — não globalmente. Comparação ignora maiúscula/minúscula e acento. Empresa arquivada não conta: o nome fica livre para reuso. | Decidido 22/08/2026 |\n| EMP-CRIA-003 | Logotipo é opcional. Aceita SVG, PNG ou JPG, até 2MB. Validado no cliente **e** no servidor — o cliente pode ser contornado. | Decidido 22/08/2026 |\n| EMP-CRIA-004 | O arquivo do logotipo vive em armazenamento externo (Cloudflare R2, compatível com S3). O banco guarda só a URL. | Decidido 22/08/2026 |\n| EMP-CRIA-005 | Sem armazenamento configurado (`S3_DRIVER=none`), criar empresa **sem** logotipo continua funcionando. Anexar um arquivo devolve mensagem clara em vez de erro genérico. | Decidido 22/08/2026 — m
