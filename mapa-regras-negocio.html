<!doctype html>

<title>Regras de Negócio — Plataforma de Design 2.0</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#fff; --border:#e3e6ea; --ink:#14181f; --muted:#5b6472;
    --accent:#2563eb; --accent-soft:#eff4ff; --ok:#0f9960; --warn:#b7791f; --code:#f2f4f7;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1216; --surface:#161b22; --border:#2a313a; --ink:#e6eaf0; --muted:#9aa5b4;
           --accent:#5b9bff; --accent-soft:#17233c; --ok:#3fb984; --warn:#e0a44a; --code:#1c222b; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid; grid-template-columns:300px 1fr; grid-template-rows:100vh;
  }
  aside{background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0}
  .marca{padding:18px 18px 12px; border-bottom:1px solid var(--border)}
  .marca h1{margin:0; font-size:15px; letter-spacing:-.01em}
  .marca p{margin:4px 0 0; font-size:12px; color:var(--muted)}
  .busca{padding:12px 14px; border-bottom:1px solid var(--border)}
  .busca input{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px;
    background:var(--bg); color:var(--ink); font-size:13px}
  .busca input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  nav{overflow-y:auto; flex:1; padding:8px 0 24px; min-height:0}
  .modulo>summary{list-style:none; cursor:pointer; padding:9px 16px; font-weight:600; font-size:13px;
    display:flex; align-items:center; gap:8px; user-select:none}
  .modulo>summary::-webkit-details-marker{display:none}
  .modulo>summary:hover{background:var(--accent-soft)}
  .modulo>summary .cont{margin-left:auto; font-weight:500; font-size:11px; color:var(--muted)}
  .modulo a{display:block; padding:7px 16px 7px 38px; font-size:13px; color:var(--muted);
    text-decoration:none; border-left:2px solid transparent}
  .modulo a:hover{background:var(--accent-soft); color:var(--ink)}
  .modulo a.ativo{color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); font-weight:500}
  main{overflow-y:auto; min-height:0}
  .envelope{max-width:860px; margin:0 auto; padding:40px 40px 120px}
  .painel{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:0 0 32px}
  .cartao{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px}
  .cartao b{display:block; font-size:24px; line-height:1.2; color:var(--accent)}
  .cartao span{font-size:12px; color:var(--muted)}
  .cabecalho{border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:24px}
  .cabecalho h2{margin:0 0 10px; font-size:26px; letter-spacing:-.02em; line-height:1.25}
  .selos{display:flex; gap:8px; flex-wrap:wrap}
  .selo{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--code);
    color:var(--muted); border:1px solid var(--border)}
  .selo.ok{color:var(--ok); border-color:currentColor}
  .selo.warn{color:var(--warn); border-color:currentColor}
  .caminho{font-size:12px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:10px}
  .md h1{font-size:24px; margin:32px 0 12px; letter-spacing:-.02em}
  .md h2{font-size:19px; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border)}
  .md h3{font-size:16px; margin:24px 0 8px}
  .md h4{font-size:14px; margin:20px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  .md p{margin:0 0 14px}
  .md ul,.md ol{margin:0 0 14px; padding-left:24px}
  .md li{margin:4px 0}
  .md blockquote{margin:0 0 18px; padding:10px 16px; border-left:3px solid var(--accent);
    background:var(--accent-soft); border-radius:0 6px 6px 0; color:var(--muted); font-size:14px}
  .md blockquote p:last-child{margin:0}
  .md code{background:var(--code); padding:2px 5px; border-radius:4px; font-size:.88em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .md pre{background:var(--code); padding:14px 16px; border-radius:8px; overflow-x:auto;
    margin:0 0 18px; border:1px solid var(--border)}
  .md pre code{background:none; padding:0; font-size:13px; line-height:1.55}
  .md hr{border:0; border-top:1px solid var(--border); margin:28px 0}
  .md a{color:var(--accent)}
  .rolagem{overflow-x:auto; margin:0 0 18px}
  .md table{border-collapse:collapse; width:100%; font-size:13.5px}
  .md th,.md td{border:1px solid var(--border); padding:8px 11px; text-align:left; vertical-align:top}
  .md th{background:var(--code); font-weight:600}
  mark{background:#fde68a; color:#14181f; border-radius:3px; padding:0 2px}
  .vazio{color:var(--muted); padding:12px 16px; font-size:13px}
  .rodape{margin-top:60px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted)}
  @media (max-width:860px){
    body{grid-template-columns:1fr; grid-template-rows:auto 1fr}
    aside{max-height:42vh}
    .envelope{padding:24px 18px 80px}
  }
</style>
</head>

<script id="dados" type="application/json">{"geradoEm":"2026-09-17T18:44:03.124Z","totalDocs":26,"totalKB":"538","modulos":[{"nome":"acesso","emoji":"🔐","docs":[{"id":"acesso/cadastro","nome":"cadastro","titulo":"Regras de Negócio — Criação de Conta","versao":"1.3.1","status":"Implementado e ligado na API","pagina":"cadastro.html","ids":["CAD-CONTA","CAD-CONTA-001","CAD-CONTA-002","CAD-CONTA-003","CAD-CONTA-004","CAD-CONTA-005","CAD-CONTA-006","ACS-LOGIN-004","CAD-SENHA","CAD-SENHA-001","CAD-SENHA-002","CAD-SENHA-003","CAD-SENHA-004","CAD-SENHA-005","CAD-SENHA-006","ACS-LOGIN-002","CAD-ACEITE","CAD-ACEITE-001","CAD-ACEITE-002","CAD-DESTINO","CAD-DESTINO-001","ACS-LOGIN-010","ACS-LOGIN-017","CAD-DESTINO-002","EMP-LIST-008"],"modificado":"2026-08-22T22:03:51.855Z","bytes":12848,"rel":"Regras_de_negocio/modulos/acesso/cadastro.md","md":"# Regras de Negócio — Criação de Conta\n\n> **Versão:** 1.3.1 · **Status:** Implementado e ligado na API\n> **Módulo:** Acesso · **Página:** `cadastro.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documento irmão:** [`login.md`](login.md) — identidade, perfis e roteamento\n\n---\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Criar sua conta |\n| Módulo | Acesso |\n| Rota | `/cadastro.html` |\n| Arquivo de interface | `cadastro.html` |\n| Arquivo de comportamento | `js/cadastro.js` |\n| Arquivo de regras | `Regras_de_negocio/modulos/acesso/cadastro.md` *(este documento)* |\n| Entidades | `users`, `otp_codes` |\n| Componentes | Casca de login, Campo, Botão, Alerta, Modal de verificação, Medidor de força, Requisitos, Aceite |\n| Páginas relacionadas | `login.html`, `empresas.html` |\n\n---\n\n## 1. Regras\n\n### 1.1 Conta — `CAD-CONTA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| CAD-CONTA-001 | O cadastro coleta **nome, e-mail e senha**. Nada além disso. | D1 · D5 · `login.md` §2 |\n| CAD-CONTA-002 | Não há escolha de perfil no cadastro. As capacidades vêm dos vínculos. | D1 · `login.md` §2.1 |\n| CAD-CONTA-003 | E-mail já cadastrado **é revelado**, com caminho para o login. | Decidido 21/08/2026 — ver nota abaixo |\n| CAD-CONTA-004 | O nome exige ao menos duas palavras. | Interface existente |\n| CAD-CONTA-005 | A conta nasce com `email_verificado = false` e só é utilizável após a confirmação por código. | Plano backend §5 |\n| CAD-CONTA-006 | CPF **não** é coletado aqui. | D5 · `login.md` §7 |\n\n**Nota sobre CAD-CONTA-003 — divergência deliberada com o login.** `ACS-LOGIN-004` proíbe revelar se um e-mail existe, para barrar enumeração de contas. No cadastro a regra se inverte: omitir isso transforma a tela num beco sem saída, a pessoa não entende por que falhou e tenta de novo com os mesmos dados. A informação, aliás, já é obtível por qualquer fluxo de recuperação de senha. Trocamos um vazamento que o atacante consegue de outro jeito por uma tela que funciona — e oferecemos o caminho útil, que é entrar.\n\n### 1.2 Senha — `CAD-SENHA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| CAD-SENHA-001 | Mínimo de **8 caracteres**. | NIST SP 800-63B Rev 4 |\n| CAD-SENHA-002 | A senha é conferida contra lista de senhas comuns e vazadas. | NIST SP 800-63B Rev 4 |\n| CAD-SENHA-003 | **Não** se exige maiúscula, número nem símbolo. | NIST SP 800-63B Rev 4 |\n| CAD-SENHA-004 | O medidor de força mede **comprimento**, não variedade de caracteres. Senha na blocklist nunca passa do nível mais baixo, por mais longa que seja. | Decorrência de 001–003 |\n| CAD-SENHA-005 | Não há campo de confirmação de senha; o botão de revelar cumpre esse papel. | Decidido 21/08/2026 |\n| CAD-SENHA-006 | A conferência que vale é no servidor. O cliente valida formato e dá resposta imediata. | Plano backend §2 |\n\n**Por que oito e não quinze.** A Rev 4 exige mínimo de 15 quando a senha é o **único** autenticador. Aqui não é: `ACS-LOGIN-002` acrescenta código por e-mail em dispositivo novo. Com segundo fator, o piso de 8 é o aplicável.\n\n**Por que largar as regras de composição.** O texto da norma é que sistemas \"shall not impose arbitrary composition requirements beyond the basic length and blocklist checks\". Exigir maiúscula, número e símbolo produz `Senha1!` — que satisfaz as quatro regras e é péssima — e rejeita `cavalo bateria grampo correto`, que é ordens de grandeza mais forte. A norma trocou composição por comprimento e blocklist porque as regras antigas pioravam o resultado que diziam proteger.\n\n### 1.3 Aceite — `CAD-ACEITE`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| CAD-ACEITE-001 | O aceite dos Termos de uso e da Política de privacidade é obrigatório e explícito — caixa desmarcada por padrão. | Interface existente · LGPD |\n| CAD-ACEITE-002 | A data e a versão dos documentos aceitos são registradas na conta. | ✅ `users.termos_versao` e `termos_aceitos_em` |\n\n### 1.4 Destino — `CAD-DESTINO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| CAD-DESTINO-001 | Confirmado o código, a conta segue pela cascata de `login.md` §4 — que leva a `empresas.html`, onde o estado vazio convida a criar a primeira. | ACS-LOGIN-010 · ACS-LOGIN-017 |\n| CAD-DESTINO-002 | O cadastro **não cria empresa alguma** — nem implícita, nem \"pessoal\", nem de exemplo. A conta nasce com zero vínculos, e é por isso que o estado vazio da listagem é a primeira tela real de toda conta nova. | EMP-LIST-008 |\n\nA tentação em CAD-DESTINO-002 é criar uma empresa automática para que a listagem nunca nasça vazia. Seria acolhedor e violaria \"Ensinar antes de executar\": a pessoa ganharia uma empresa sem entender o que uma empresa é aqui dentro, e a tela que ensina isso nunca seria vista.\n\nUma conta recém-criada nunca tem vínculo, e mesmo assim entra pela listagem. Ela aprende primeiro **onde fica a casa**, e o estado vazio a convida a mobiliar — daí para o fluxo completo de criação. Cair direto no formulário sem nunca ter visto a tela principal deixa quem desiste no meio sem saber para onde voltar.\n\n---\n\n## 2. Estados obrigatórios\n\n| Estado | Situação | Observação |\n|---|---|---|\n| Primeiro acesso | **Não se aplica** | A página inteira *é* o primeiro acesso |\n| Vazio | **Não se aplica** | Formulário, não listagem |\n| Carregando | ✅ `.is-loading` no botão | — |\n| Sucesso | ✅ Modal de verificação → cascata | — |\n| Erro | ✅ `field-error` por campo | — |\n| Sem permissão | **Não se aplica** | Cadastro é público por definição |\n| Arquivado | ✅ `alertDuplicado` — e-mail já cadastrado | A conta existente pode estar suspensa; o login trata |\n| Offline | ✅ `alertOffline` — trava o envio | — |\n| Sessão expirada | **Não se aplica** | Não há sessão antes do cadastro |\n| Integração indisponível | ✅ Provedor fora do ar → a modal avisa em vez de deixar esperando | — |\n\n**Os dez avaliados**, sendo quatro justificados como não aplicáveis, conforme a skill permite. Nenhum pendente.\n\n---\n\n## 3. Gatilhos de demonstração\n\n> **Não há mais gatilhos de demonstração.** Desde 22/08/2026 a tela conversa com a API de verdade: quem decide é o servidor. O que segue é como exercitar cada caminho de verdade.\n\n| Para ver | Faça |\n|---|---|\n| E-mail já cadastrado | Cadastre o mesmo e-mail duas vezes |\n| Reprovação por comprimento | Senha com menos de 8 caracteres |\n| Reprovação pela blocklist | `password1` (barrado no cliente) ou qualquer senha vazada conhecida (barrada no servidor, via Have I Been Pwned) |\n| Frase longa aceita | `cavalo bateria grampo correto` — sem maiúscula, número ou símbolo |\n| Código inválido | Digite um código diferente do que chegou |\n| Fluxo completo | O código sai no e-mail; com `EMAIL_DRIVER=console`, no log da API |\n\n---\n\n## 4. O que mudou nesta etapa\n\n| Antes | Depois | Regra |\n|---|---|---|\n| Nome, CPF, e-mail, senha, confirmar senha | Nome, e-mail, senha | CAD-CONTA-001 |\n| CPF obrigatório com validação de dígito | Removido; código preservado em `js/cpf.js` | CAD-CONTA-006 |\n| 4 requisitos de composição | 2 requisitos: comprimento e blocklist | CAD-SENHA-001 a 003 |\n| Medidor conta classes de caracteres | Medidor mede comprimento | CAD-SENHA-004 |\n| Confirmar senha | Removido | CAD-SENHA-005 |\n| Sem estado offline | `alertOffline` | Estados obrigatórios |\n| Alerta de duplicado nunca acionado | Acionado, com link para o login | CAD-CONTA-003 |\n| Destino: `empresas.html` | Destino: `empresas.html`, agora por decisão e não por acaso | CAD-DESTINO-001 |\n| Botão do Google ativo | Placeholder desabilitado | Plano backend §1 |\n\nO CPF **não foi apagado**. A máscara e a validação de dígito verificador foram para `js/cpf.js`, prontas para a tela onde o especialista informa dados fiscais no primeiro recebimento.\n\n---\n\n## 5. Pendências\n\n### ⚠ P2 — Termos e Política apontam para `#` — **BLOQUEIA PUBLICAÇÃO**\n\nOs dois links do aceite não levam a lugar nenhum, e o aceite é obrigatório. A conta já registra *quando* e *qual versão* foi aceita — mas não existe documento na versão registrada. Pedir aceite de documento inexistente não se sustenta juridicamente, e é o tipo de pendência que só aparece quando já é tarde.\n\nRegistrada em conjunto com a **D10** de `login.md`, que trata da mesma família: promessas que a tela faz e o produto não cumpre.\n\n### ✅ P1 e P3 — resolvidas em 22/08/2026\n\n**Registro do aceite:** a API grava `termos_versao` e `termos_aceitos_em` ao criar a conta. O registro existe — falta o documento que está sendo aceito (P2).\n\n**Blocklist real:** o servidor confere contra a base do Have I Been Pwned por *k-anonymity* — só os cinco primeiros caracteres do SHA-1 saem da API, então a senha nunca trafega. A lista local de quinze senhas continua, agora só para dar resposta imediata enquanto a pessoa digita e poupar uma ida à rede no caso óbvio.\n\n### ✅ P4 — Dívida técnica da tela — **PAGA em 22/08/2026**\n\n| | Antes | Depois |\n|---|---|---|\n| `cadastro.html` | 1216 linhas | **284** |\n| CSS embutido | 477 linhas, 49 seletores duplicados | 16 linhas, só o que diverge |\n| JavaScript embutido | 468 linhas | 0 — extraído para `js/cadastro.js` |\n| SVG inline | 11 | 1 (o logotipo do Google, ver abaixo) |\n| Componentes fora do styleguide | 10 | 0 |\n\n**Os ícones eram o problema maior, e não eram dois — eram três.** Havia sprite inline no `login.html`, outro no `styleguide.html`, e SVG solto no cadastro. Pior: o mesmo ícone já tinha divergido — o olho, o envelope e o X do cadastro tinham traçados diferentes dos do login. Ninguém notaria, porque ninguém abre dois arquivos lado a lado para comparar geometria. Agora existe `img/icones.svg`, com 16 símbolos, referenciado pelas três páginas.\n\n**O logotipo do Google continua inline, por limite técnico real:** variável CSS não atravessa para dentro de um SVG externo, e ele usa as cores de marca em `var()`.\n\n**Componentes promovidos ao sistema**, em `components.css` e catalogados no styleguide: medidor de força (`.strength*`), requisitos (`.requisito*`), aceite de termos (`.form-aceite`, `.checkbox--aceite`) e o modificador `.form--signup`.\n\n`.senha-dica` virou **`.campo-dica`** na promoção: orientação abaixo de um campo não é exclusiva de senha. Pequeno, mas é a diferença entre componente de sistema e remendo de página.\n\n*(`.field-grid` e `.input--numeric` foram removidos: existiam só para o par Nome + CPF.)*\n\n**Duas armadilhas encontradas no caminho, registradas para quem editar os ícones.** Comentário em arquivo SVG não pode conter dois hifens seguidos — é XML estrito, e um `--` derruba o arquivo inteiro com sintoma silencioso: todos os ícones somem de uma vez, sem erro no console. E símbolo com `viewBox` deslocado, consumido por um `\u003csvg>` que declara o mesmo `viewBox`, aplica a transformação duas vezes e recorta o desenho; por isso todo traçado no sprite começa na origem.\n\n---\n\n## 6. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.3.1 | 2026-08-22 | Acrescentada CAD-DESTINO-002: o cadastro não cria empresa alguma. Páginas relacionadas corrigidas. |\n| 1.3.0 | 2026-08-22 | Destino após o cadastro passa a ser `empresas.html`, acompanhando a simplificação da cascata (ACS-LOGIN-017). |\n| 1.2.0 | 2026-08-22 | **Dívida técnica paga (P4).** `cadastro.html` caiu de 1216 para 284 linhas: CSS duplicado removido em favor de `components.css`, JavaScript extraído para `js/cadastro.js`, e os ícones unificados em `img/icones.svg` — que substituiu três sprites concorrentes cujos traçados já haviam divergido. Os componentes exclusivos viraram componentes de sistema e estão catalogados no styleguide. `.senha-dica` renomeada para `.campo-dica`. |\n| 1.1.0 | 2026-08-22 | Tela ligada na API: `POST /auth/registrar` e `/auth/otp/verificar` no lugar das simulações. O 409 passa a acionar o alerta de e-mail duplicado, e erros `{campo, mensagem}` marcam o campo correspondente. |\n| 1.0.0 | 2026-08-21 | Documento criado. CPF removido do cadastro (D5), com máscara e validação preservadas em `js/cpf.js`. Política de senha migrada de quatro regras de composição para comprimento mais blocklist, conforme NIST SP 800-63B Rev 4. Campo de confirmação removido. Estado offline acrescentado. Alerta de e-mail duplicado ligado, com caminho para o login. Destino pós-cadastro corrigido para `criar-empresa.html`. Botão do Google alinhado ao placeholder do login. |\n\n---\n\n**Fontes externas consultadas**\n\n- [NIST SP 800-63B Rev 4 — o que mudou em senhas (Enzoic)](https://www.enzoic.com/blog/nist-sp-800-63b-rev4/)\n- [NIST password guidelines: SP 800-63B explained (Netwrix)](https://netwrix.com/en/resources/blog/nist-password-guidelines/)\n"},{"id":"acesso/login","nome":"login","titulo":"Regras de Negócio — Acesso à Plataforma","versao":"1.6.1","status":"Implementado e ligado na API","pagina":"login.html","ids":["ACS-LOGIN-012","ACS-LOGIN-011","ACS-CONTA","ACS-CONTA-001","ACS-CONTA-002","ACS-CONTA-003","ACS-CONTA-004","ACS-CONTA-005","ACS-CONTA-006","ACS-CONTA-007","ACS-CONTA-008","ACS-CONTA-009","ACS-LOGIN","ACS-LOGIN-001","ACS-LOGIN-002","ACS-LOGIN-003","ACS-LOGIN-004","ACS-LOGIN-005","ACS-LOGIN-006","ACS-LOGIN-007","ACS-LOGIN-008","ACS-LOGIN-009","ACS-LOGIN-010","ACS-LOGIN-013","ACS-LOGIN-014","ACS-LOGIN-015","ACS-LOGIN-016","ACS-LOGIN-017","ACS-SESSAO","ACS-SESSAO-001","ACS-SESSAO-002","ACS-SESSAO-003","ACS-SESSAO-004","EMP-LIST-003","EMP-LIST-005","EMP-LIST-004"],"modificado":"2026-08-22T22:03:51.455Z","bytes":32403,"rel":"Regras_de_negocio/modulos/acesso/login.md","md":"# Regras de Negócio — Acesso à Plataforma\n\n> **Versão:** 1.6.1 · **Status:** Implementado e ligado na API · **Uma pendência bloqueia publicação (D10)**\n> **Módulo:** Acesso · **Página:** `login.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill` (Guardião de Regras de Negócio por Página)\n\n---\n\n## Identificação da página\n\n| Campo | Valor |\n|---|---|\n| Nome | Entrar na conta |\n| Módulo | Acesso |\n| Rota | `/login.html` |\n| Arquivo de interface | `login.html` |\n| Arquivo de comportamento | `js/login.js` |\n| Arquivo de regras | `Regras_de_negocio/modulos/acesso/login.md` *(este documento)* |\n| Entidades | `users`, `perfil_especialista`, `empresa_membros`, `administradores`, `sessions`, `otp_codes`, `login_attempts` |\n| Componentes | Casca de login, Formulário de login, Modal de verificação, Alerta, Divisor, Botão, Campo |\n| Páginas relacionadas | `cadastro.html`, `empresas.html`, `admin.html` *(a criar)* |\n\n---\n\n## 1. Fontes consultadas\n\n| Fonte | O que forneceu |\n|---|---|\n| `Regras_de_negocio/Sobre a Plataforma de Design/O_que_e_q_plataforma_de_design.md` | Público-alvo, Comunidade de Especialistas, modelo de negócio, princípios |\n| `Documentacao/Backend/PLANO_BACKEND_LOGIN.md` | Modelo de dados, endpoints, política de OTP, sessão, rate limiting |\n| `Skills/regra_de_negocio.skill` | Formato obrigatório, estados obrigatórios, regra de IDs, proibições |\n| `login.html` · `js/login.js` | Comportamento implementado hoje |\n| `empresas.html` · `projetos.html` · `visao_do_projeto.html` | Hierarquia de entidades, painel de perfil, créditos |\n| `css/tokens.css` | Token `--fill-pro` declarado como \"reservado ao plano Pro\" |\n\n### Hierarquia de entidades observada nas telas\n\n```\nUsuário  →  Empresa (\"Minhas Empresas\")  →  Projeto  →  Artefatos\n                                                        ├── Ideias / Visão do projeto\n                                                        ├── Pesquisa\n                                                        ├── Matriz CSD\n                                                        ├── Sobre a empresa\n                                                        └── Atividade\n```\n\nO consumo de IA acontece **dentro dos artefatos**, que pertencem a um **projeto**, que pertence a uma **empresa**. Já os créditos aparecem hoje no painel de perfil do **usuário**. Essa assimetria é a origem da Decisão D2 (seção 7).\n\n---\n\n## 2. Identidade e papéis\n\nA documentação principal nomeia dois públicos: **Empreendedor** *(Visão Geral; Objetivos Estratégicos §1)* e **Especialista** *(Comunidade de Especialistas)*.\n\n### 2.1 Princípio: uma pessoa, uma conta\n\n**Empreendedor e Especialista não são atributos da pessoa. São atributos da relação dela com cada empresa.**\n\nQuem cria a empresa \"Nike\" é Proprietário ali. Quem é contratado pela \"Adidas\" é Especialista lá. São dois vínculos de *uma* pessoa com *duas* empresas — nunca duas pessoas. Vínculo é linha em tabela, não conta nova.\n\nDisso decorre a regra de identidade da plataforma:\n\n> **Uma pessoa = um e-mail = uma senha = uma conta.** O que ela pode fazer é determinado pelos vínculos que possui, não por um tipo gravado na conta.\n\n**Consequências práticas:**\n\n- Ninguém precisa de segundo e-mail para atuar dos dois lados da plataforma.\n- Não existe campo `users.perfil`. Um tipo único na conta é justamente o que forçaria a duplicação.\n- Não existe seletor de \"visão\": o contexto **é** a empresa que a pessoa abriu.\n- A **Empresa já é o limite de separação** do produto. Uma camada de \"conta\" acima dela repetiria a mesma fronteira duas vezes.\n\n### 2.2 As três camadas de identidade\n\n| Camada | Responde | Onde vive | Cardinalidade |\n|---|---|---|---|\n| **Conta** | Quem é a pessoa | `users` | 1 por pessoa |\n| **Perfil de especialista** | Ela se oferece para contratação? | `perfil_especialista` | 0 ou 1 por conta |\n| **Vínculo** | O que ela faz *nesta* empresa | `empresa_membros` | N por conta |\n\nO perfil de especialista é uma **extensão opcional** da conta, criada quando a pessoa decide se oferecer para contratação. Guarda o que é dela e não de nenhuma empresa: portfólio, especialidades, avaliações, disponibilidade e — só no momento do primeiro recebimento — dados fiscais e bancários.\n\n### 2.3 Papéis no vínculo\n\n| Papel | Origem | Escopo |\n|---|---|---|\n| **Proprietário** | Derivado de \"Minhas Empresas\" | Controle total, inclusive créditos e exclusão da empresa |\n| **Membro** | **PROPOSTA** | Edita projetos e artefatos; não mexe em créditos nem em membros |\n| **Especialista** | Derivado de \"contratações seguras dentro do próprio ecossistema\" | Acesso apenas aos projetos em que foi contratado, com prazo definido |\n\n### 2.4 Administrador\n\nStaff interno da plataforma. Não é perfil de conta nem vínculo com empresa: é uma tabela própria, alimentada só por provisionamento interno. Manter separado impede que qualquer caminho de auto-cadastro conceda privilégio administrativo por engano.\n\n### 2.5 Modelo de dados proposto\n\n```\nusers                          -- uma linha por pessoa\n  id                uuid (pk)\n  nome              text\n  email             text (unique, lowercase)\n  senha_hash        text (argon2id)\n  email_verificado  boolean (default false)\n  suspenso_em       timestamptz (nullable)\n  suspensao_motivo  enum('violacao','inadimplencia') (nullable)  -- ACS-LOGIN-012\n  criado_em, atualizado_em\n  -- NÃO existe campo \"perfil\": ver §2.1\n\ndispositivos_confiaveis        -- ACS-LOGIN-011, dispensa OTP repetido\n  id                uuid (pk)\n  user_id           uuid (fk users)\n  token_hash        text\n  expira_em         timestamptz\n  ultimo_uso_em     timestamptz\n  criado_em\n\nperfil_especialista            -- extensão 0..1 de users\n  user_id           uuid (pk, fk users)\n  titulo            text\n  bio               text\n  especialidades    text[]\n  status            enum('rascunho','em_analise','aprovado','recusado')\n  cpf               text (criptografado, nullable)   -- só no 1º recebimento\n  dados_bancarios   jsonb (criptografado, nullable)  -- só no 1º recebimento\n  criado_em, aprovado_em\n\nempresa_membros                -- vínculo N:N entre users e empresas\n                               -- a tabela `empresas` está especificada em\n                               -- modulos/empresas/empresas-listagem.md §3\n  id                uuid (pk)\n  empresa_id        uuid (fk empresas)\n  user_id           uuid (fk users)\n  papel             enum('proprietario','membro','especialista')\n  convidado_por     uuid (fk users, nullable)\n  expira_em         timestamptz (nullable)   -- contrato com prazo\n  criado_em, revogado_em\n\nadministradores                -- staff interno, provisionamento manual\n  user_id           uuid (pk, fk users)\n  criado_em\n```\n\n---\n\n## 3. Regras de acesso\n\nCada regra cita a fonte. Regras marcadas **[PROPOSTA]** não têm respaldo documental e exigem autorização antes de virar código.\n\n### 3.1 Identidade e vínculo — `ACS-CONTA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ACS-CONTA-001 | Uma pessoa possui exatamente uma conta, identificada por um e-mail único. | [PROPOSTA] — §2.1 |\n| ACS-CONTA-002 | A conta não carrega tipo. As capacidades vêm dos vínculos e da existência do perfil de especialista. | [PROPOSTA] — §2.1 |\n| ACS-CONTA-003 | Criar uma empresa gera automaticamente vínculo de Proprietário para quem criou. | Doc principal, Visão Geral |\n| ACS-CONTA-004 | Qualquer conta pode criar empresa e, simultaneamente, ser contratada como Especialista em empresas de terceiros — sem segunda conta. | [PROPOSTA] — §2.1 |\n| ACS-CONTA-005 | O perfil de especialista é opcional, criado por ação explícita da pessoa, e só fica visível para contratação após aprovação. | [PROPOSTA] — D4 |\n| ACS-CONTA-006 | Privilégio administrativo nunca é concedido por auto-cadastro nem por vínculo com empresa. | [PROPOSTA] — §2.4 |\n| ACS-CONTA-007 | O perfil público de especialista nunca revela as empresas das quais a pessoa é Proprietária ou Membro. | [PROPOSTA] — §2.1 |\n| ACS-CONTA-008 | CPF e dados bancários só são solicitados no primeiro recebimento, nunca no cadastro. | D5 · LGPD, minimização |\n| ACS-CONTA-009 | Excluir a conta não apaga o contexto dos projetos de empresas onde a pessoa era apenas Especialista ou Membro. | Princípio \"Preservar todo o contexto do projeto\" |\n\n### 3.2 Entrada na plataforma — `ACS-LOGIN`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ACS-LOGIN-001 | O acesso exige e-mail verificado. Conta com `email_verificado=false` é redirecionada para a verificação de cadastro. | Plano backend §4, §5 |\n| ACS-LOGIN-002 | O código OTP é exigido apenas em **dispositivo ainda não reconhecido**. Em dispositivo conhecido, e-mail e senha bastam. | D7 · decidido 21/08/2026 |\n| ACS-LOGIN-003 | A validação de credencial acontece exclusivamente no servidor. O cliente valida apenas formato. | Plano backend §2 |\n| ACS-LOGIN-004 | A mensagem de erro de credencial nunca revela se o e-mail existe. | Prática de segurança; já respeitado pela tela |\n| ACS-LOGIN-005 | Após 3 tentativas malsucedidas, a conta entra em espera de 30 s, sinalizada pelo alerta \"Muitas tentativas\". | Plano backend §6 (resposta 429) |\n| ACS-LOGIN-006 | O código OTP tem 6 dígitos, expira em 10 minutos e é de uso único. | Plano backend §6 |\n| ACS-LOGIN-007 | O reenvio de código respeita intervalo de 30 s. | Plano backend §5 |\n| ACS-LOGIN-008 | \"Lembrar de mim\" controla a vida do refresh token. | Plano backend §6 |\n| ACS-LOGIN-009 | Conta suspensa não entra. A suspensão só é revelada **depois** da credencial validada — antes disso confirmaria que o e-mail existe, o que ACS-LOGIN-004 proíbe —, mas **não exige o segundo fator**: mandar a pessoa buscar um código para só então dizer que a conta está suspensa a faria perder tempo à toa. | D8 · decidido 21/08/2026 |\n| ACS-LOGIN-010 | O destino após o login é decidido pela cascata da §4. | [PROPOSTA] |\n| ACS-LOGIN-011 | O dispositivo é reconhecido por cookie assinado pelo servidor. Com \"Lembrar de mim\", o reconhecimento dura 90 dias; sem, expira ao fechar o navegador. O valor nunca pode ser forjável pelo cliente. | D7 · decidido 21/08/2026 |\n| ACS-LOGIN-012 | A suspensão tem dois motivos, com saídas distintas: **violação dos termos** encaminha ao suporte para contestação; **inadimplência** encaminha à regularização do pagamento. | D8 · decidido 21/08/2026 |\n| ACS-LOGIN-013 | A suspensão por inadimplência usa tratamento de aviso, não de erro — é pendência que a própria pessoa resolve, não uma punição. | D8 · decidido 21/08/2026 |\n| ACS-LOGIN-014 | O destino retomado após o login aceita apenas caminho relativo interno. URL absoluta é descartada em favor do destino padrão. | Segurança — impede open redirect |\n| ACS-LOGIN-015 | A cascata da §4 é avaliada **antes** do segundo fator, porque dois de seus ramos o dispensam. | Decidido 21/08/2026 — ver §4 |\n| ACS-LOGIN-016 | O destino retomado (`?destino=`) só é honrado para quem tem ao menos um vínculo. | Decidido 21/08/2026 — ver §4 |\n| ACS-LOGIN-017 | A cascata decide **se** a pessoa entra, não **o que** ela vê lá dentro. Distinções internas ao módulo de empresas são resolvidas pela listagem. | Decidido 22/08/2026 — ver §4 |\n\n### 3.3 Sessão — `ACS-SESSAO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ACS-SESSAO-001 | O token de acesso vive 15 minutos; a renovação usa o refresh token em cookie `httpOnly`. | Plano backend §6 |\n| ACS-SESSAO-002 | Sessão expirada devolve o usuário ao login com aviso explícito, preservando o destino pretendido. | [PROPOSTA] |\n| ACS-SESSAO-003 | Sair da conta revoga a sessão no servidor, não apenas no navegador. | Plano backend §5 |\n| ACS-SESSAO-004 | Revogar um vínculo encerra o acesso da pessoa àquela empresa na renovação seguinte, sem derrubar sua sessão nas demais. | [PROPOSTA] |\n\n---\n\n## 4. Roteamento após o login\n\nA regra ACS-LOGIN-010 delega o destino a uma decisão em cascata, implementada em `js/login.js` — **a primeira condição verdadeira decide**:\n\n| # | Condição | Destino | Situação |\n|---|---|---|---|\n| 1 | `email_verificado = false` | Verificação de cadastro | ✅ Modal, propósito `cadastro` |\n| 2 | `suspenso_em` preenchido | Estado de conta suspensa | ✅ Implementado |\n| 3 | Consta em `administradores` | `admin.html` | Tela **a criar** |\n| 4 | Todos os demais | `empresas.html` | ✅ Tela existe |\n\n**ACS-LOGIN-017 — a cascata decide se você entra, não o que você vê lá dentro.** Até 22/08/2026 ela tinha seis linhas: escolhia entre `criar-empresa.html`, `painel-especialista.html` e a listagem, conforme vínculos e perfil. Eram três rotas para três situações que a **própria listagem já sabe distinguir**, pelas variantes do estado vazio (EMP-LIST-003 e EMP-LIST-005).\n\nDecidir aquilo aqui obrigava o login a conhecer regras do módulo de empresas — e obrigava a manter as duas em acordo para sempre. Agora toda conta que pode entrar entra pela mesma porta, e a listagem resolve o resto.\n\n**O que isso não perde.** O fluxo completo de criação continua sendo o caminho de quem tem zero empresas: o estado vazio leva a `criar-empresa.html` (EMP-LIST-004). Mudou a ordem, não o destino — a pessoa vê a casa antes de mobiliar, e quem desiste no meio sabe para onde voltar.\n\n**ACS-LOGIN-015 — o segundo fator guarda a entrada, não a decisão.** A cascata é avaliada antes do OTP, porque dois ramos o dispensam: a verificação de e-mail (linha 1) já *é* um código, e pedir o de login antes cobraria dois códigos seguidos; e a suspensão (linha 2) encerra o acesso ali. Nas linhas 3 e 4, o OTP roda entre a decisão e a navegação, conforme ACS-LOGIN-002.\n\n**ACS-LOGIN-016 — o destino retomado só vale para quem tem vínculo.** Mandar quem ainda não tem empresa direto a uma tela interna produziria \"sem permissão\" na própria entrada. Sem vínculo, a linha 4 prevalece sobre o `?destino=`: a pessoa entra pela listagem, e não por uma tela interna a que ainda não tem acesso.\n\nDuas observações:\n\n**A linha 4 não distingue papel.** `empresas.html` passa a listar num só lugar as empresas que a pessoa possui e aquelas onde foi contratada, com um selo indicando o papel em cada uma. É isso que dispensa qualquer seletor de visão: a troca de contexto acontece ao abrir uma empresa ou outra.\n\n---\n\n## 5. Estados obrigatórios da página\n\nA skill exige avaliar dez estados. Situação de `login.html` hoje:\n\n| Estado | Hoje | Ação necessária |\n|---|---|---|\n| Primeiro acesso | ✅ Cascata linha 4 → `empresas.html`, estado vazio | — |\n| Vazio | **Não se aplica** — a tela é um formulário, não uma listagem | Justificado |\n| Carregando | ✅ `.is-loading` no botão | — |\n| Sucesso | ✅ Cascata da §4 decide o destino | Ligar em dados reais na Fase 4 |\n| Erro | ✅ `alertCredencial` + `field-error` | Ligar na resposta da API na Fase 4 |\n| Sem permissão | ✅ `alertSemPermissao` — `?motivo=sem-permissao` | — |\n| Arquivado | ✅ `alertSuspensaoViolacao` e `alertSuspensaoPagamento` | — |\n| Offline | ✅ `alertOffline` — escuta `online`/`offline`, trava o envio | — |\n| Sessão expirada | ✅ `alertSessaoExpirada` — `?motivo=sessao-expirada&destino=` | — |\n| Integração indisponível | Pendente | Provedor de e-mail fora: o OTP não chega. Depende da Fase 4 |\n\n**Situação em 21/08/2026:** **nove dos dez estados resolvidos**. Resta \"Integração indisponível\" (provedor de e-mail fora do ar), que só pode ser tratado quando houver provedor — Fase 4.\n\n---\n\n## 6. Planejamento de execução\n\n### Página\n`login.html` — Acesso à plataforma.\n\n### Objetivo\nTransformar a tela de login, hoje uma simulação sem noção de identidade, no ponto de entrada que reconhece quem é o usuário e o conduz ao lugar certo da plataforma.\n\n### Regras consultadas\n`ACS-CONTA-001` a `009`, `ACS-LOGIN-001` a `010`, `ACS-SESSAO-001` a `004`, estados obrigatórios da skill.\n\n### Situação em 21/08/2026, quando este plano foi escrito\n\n> Retrato do ponto de partida. As Fases 2, 3 e 4 já foram entregues desde então — a §5 tem a situação corrente dos estados obrigatórios, e o §9 o histórico.\n\n- A tela está visualmente completa e conforme o design system (auditoria de 21/08/2026).\n- Todo o comportamento é simulado com `setTimeout`; não há API.\n- Não existe nenhuma noção de identidade: o formulário coleta e-mail e senha, e o destino é fixo.\n- Quatro dos dez estados obrigatórios estão implementados.\n- Não existia documento de regras para esta página até a versão 1.0.0 deste arquivo.\n\n### Nova solução — fases\n\n| Fase | Entrega | Depende de | Backend? |\n|---|---|---|---|\n| **0 — Governança** | Decisões D2, D3, D10 resolvidas; este documento aprovado | — | Não |\n| **1 — Modelo de identidade** ◐ | `perfil_especialista`, `empresa_membros`, `administradores`; migração | Fase 0 | Sim |\n| **2 — Estados faltantes** ✅ | Offline, sessão expirada, conta suspensa (dois motivos), sem permissão | Fase 0 | Não |\n| **3 — Roteamento pós-login** ✅ | Cascata da §4 implementada sobre conta simulada | Fases 1, 2 | Só para dados reais |\n| **4 — Ligação com a API** ✅ | Troca dos três `setTimeout` por `fetch` real | Fase 3 | Sim |\n| **5 — Porta do Especialista** | Ativação do perfil, curadoria e painel | Fase 4 | Sim |\n\n**Situação em 22/08/2026:** Fases 2, 3 e 4 entregues. A Fase 1 está **parcial** (◐): a migração criou `usuarios`, `sessoes`, `codigos_otp`, `dispositivos_confiaveis` e `tentativas_login`, mas `perfil_especialista`, `empresa_membros` e `administradores` ainda não existem — por isso `/auth/sessao` devolve `administrador`, `vinculos` e `perfil_especialista` fixos. A tabela `empresas`, autorizada em 22/08/2026, está especificada em [`../empresas/empresas-listagem.md`](../empresas/empresas-listagem.md) §3.\n\n### Impactos\n\n| Área | Impacto |\n|---|---|\n| Modelo de dados | Três tabelas novas; `users` **perde** o campo de perfil — **exige autorização** |\n| Permissões | Criação do conceito de vínculo por empresa — **exige autorização** |\n| `cadastro.html` | **Simplifica**: sai a coleta de CPF e não entra escolha de perfil. Restam nome, e-mail e senha |\n| `empresas.html` | Passa a listar empresas próprias e contratadas, com selo de papel |\n| Componentes compartilhados | Nenhum. Os estados novos usam `.alert` e variantes já catalogadas |\n| Documentação | Este documento passa a ser fonte oficial da página |\n\n### Dependências\n1. Aprovação das decisões em aberto D2, D3 e D10 (as demais estão resolvidas — ver §7). **D10 bloqueia a publicação.**\n2. Decisões em aberto do plano de backend §8 (provedor de e-mail, hospedagem, domínio).\n3. Telas ainda inexistentes: console administrativo (`admin.html`, linha 3 da cascata) e o painel do especialista, que a ACS-LOGIN-017 deixou de exigir para entrar mas o módulo de especialista ainda vai precisar.\n\n### Arquivos afetados\n\n| Arquivo | Natureza |\n|---|---|\n| `Regras_de_negocio/modulos/acesso/login.md` | Este documento |\n| `login.html` | Marcação dos estados novos |\n| `js/login.js` | Roteamento e, na Fase 4, chamadas reais |\n| `cadastro.html` | Remoção do CPF |\n| `empresas.html` | Selo de papel na listagem |\n| `Documentacao/Backend/PLANO_BACKEND_LOGIN.md` | Schema da §2.5; CPF sai de `users` |\n| `styleguide.html` | Catalogar os estados novos, se surgir variante |\n\n### Critérios de aceite\n\n**Fase 2 — verificáveis sem backend**\n\n- [ ] Sem rede, submeter o formulário mostra aviso de conexão e não dispara requisição.\n- [ ] Chegar ao login por expiração exibe aviso de sessão expirada e preserva o destino pretendido.\n- [ ] Conta suspensa exibe estado próprio, distinto de credencial inválida.\n- [ ] Todos os estados novos usam componentes já catalogados no styleguide.\n- [ ] Nenhuma cor, raio, sombra ou duração fora de token.\n- [ ] Navegação por teclado alcança todos os estados; foco visível em cada um.\n\n**Fase 3 — roteamento**\n\n- [ ] Conta sem nenhum vínculo cai em `empresas.html`, na variante certa do estado vazio.\n- [ ] Conta com vínculo cai em `empresas.html`, vendo próprias e contratadas na mesma lista.\n- [ ] Conta não verificada cai na verificação, nunca no app.\n- [ ] Conta suspensa não entra, mesmo com credencial e OTP corretos.\n- [ ] A cascata da §4 é avaliada na ordem, e a primeira condição verdadeira decide.\n\n**Fase 4 — API**\n\n- [ ] Nenhum `setTimeout` de simulação permanece em `js/login.js`.\n- [ ] Erro da API no formato `{campo, mensagem}` aparece no `field-error` correspondente.\n- [ ] Resposta 429 aciona `alertBloqueio` com a contagem vinda do servidor.\n- [ ] O código OTP nunca aparece em log do navegador.\n\n**Fase 5 — especialista**\n\n- [ ] A mesma conta consegue possuir uma empresa e ser contratada em outra, sem segundo e-mail.\n- [ ] O perfil público não expõe as empresas das quais a pessoa é Proprietária (ACS-CONTA-007).\n- [ ] CPF só é pedido no primeiro recebimento (ACS-CONTA-008).\n\n### Necessita autorização?\n\n**Sim.** O plano altera modelo de dados, cria o conceito de permissões e muda o fluxo principal de entrada — três gatilhos que a skill classifica como autorização obrigatória.\n\n---\n\n## 7. Decisões\n\n### Em aberto\n\n### D2 — Créditos pertencem ao usuário ou à empresa?\n\n**Regra atual:** A tela mostra créditos no painel de perfil do usuário.\n**Impacto:** Faturamento, e é a base do modelo de negócio.\n**Consequências:** Se um usuário tem três empresas, créditos por usuário significam que o consumo de uma esgota o saldo das outras — e um Especialista contratado gastaria o crédito de quem o contratou sem limite visível.\n**Recomendação:** Créditos por **empresa**, com o Proprietário responsável pela recarga. Alinha com \"Taxa de intermediação sobre o consumo\" e torna o gasto atribuível a quem o gerou. A decisão D1 reforça isso: agora que uma conta pode atuar em várias empresas com papéis distintos, saldo por pessoa fica ambíguo.\n\n### D3 — O plano Pro existe?\n\n**Regra atual:** `css/tokens.css` declara `--fill-pro` como \"reservado ao plano Pro\", mas nenhuma tela usa o token como plano, e a documentação de negócio descreve apenas créditos e comissão.\n**Consequências:** Token órfão no design system sugere um conceito de produto que não existe, e alguém vai construir em cima dele.\n**Recomendação:** Confirmar que o modelo é só créditos e **remover** a família `--*-pro` dos tokens, ou documentar o plano Pro na documentação de negócio.\n\n### ⚠ D10 — \"Esqueci minha senha\" exibe sucesso falso — **BLOQUEIA PUBLICAÇÃO**\n\n**Situação atual:** o link não tem endpoint nem tela. Ao ser clicado, exibe o alerta verde *\"Link enviado — Enviamos as instruções de recuperação para o seu e-mail\"*. **Nada é enviado.**\n**Por que é pior que um link morto:** um link inerte a pessoa percebe e procura outro caminho. Uma confirmação falsa faz esperar um e-mail que não vem, tentar de novo achando que errou, e concluir que a plataforma está quebrada — sem nunca recuperar a conta.\n**Decisão de 22/08/2026:** manter como está **durante o desenvolvimento**.\n**Condição:** esta mensagem não pode ir ao ar. Antes de publicar, é obrigatório construir a recuperação (Fase 2 do roadmap do plano de backend) ou trocar o texto por um aviso honesto de indisponibilidade com canal de contato.\n**Também pendente na mesma família:** os links de Termos de uso e Política de privacidade em `cadastro.html` apontam para `#`, e o aceite deles é obrigatório. A API já grava `termos_versao` e `termos_aceitos_em`, então o registro existe — falta o documento que está sendo aceito.\n\n---\n\n### Resolvidas\n\n### ✅ D1 — Como uma pessoa atua dos dois lados da plataforma — **RESOLVIDA em 21/08/2026**\n\n**Decisão:** Uma pessoa, uma conta, um e-mail. Sem campo de perfil na conta; as capacidades vêm dos vínculos. Perfil de especialista é extensão opcional. Sem seletor de visão — o contexto é a empresa aberta.\n**Alternativas descartadas:** contas múltiplas sob o mesmo e-mail (a Empresa já é o limite de separação, uma camada de conta acima dela seria redundante) e CPF como chave de identidade (ver D5).\n**Formalizada em:** §2.1, §2.2, §2.5, ACS-CONTA-001 a 004.\n\n### ✅ D4 — Especialista entra por auto-cadastro ou curadoria? — **RESOLVIDA em 21/08/2026**\n\n**Decisão:** Ativação livre do perfil, visibilidade sob aprovação. A pessoa cria o perfil e monta o portfólio quando quiser; ele só aparece para contratação após revisão (`status = aprovado`).\n**Formalizada em:** ACS-CONTA-005, `perfil_especialista.status`.\n\n### ✅ D5 — CPF é obrigatório para quem? — **RESOLVIDA em 21/08/2026**\n\n**Decisão:** CPF sai do cadastro. É solicitado apenas no primeiro recebimento, junto dos dados bancários, e guardado criptografado em `perfil_especialista`.\n**Razão:** CPF não serve como chave de identidade — espalharia dado sensível por todo índice e log, excluiria especialista estrangeiro e exigiria documento antes da pessoa conhecer o produto. Sua função legítima é fiscal: habilitar recebimento e emissão de nota.\n**Efeito colateral positivo:** `cadastro.html` fica mais curto — nome, e-mail e senha.\n**Formalizada em:** ACS-CONTA-008, §2.5.\n\n### ✅ D6 — Fonte oficial da documentação principal — **RESOLVIDA em 22/08/2026**\n\n**Era:** `Documentacao/Plataforma_de_Design_2.0.md` e `Regras_de_negocio/Sobre a Plataforma de Design/O_que_e_q_plataforma_de_design.md` eram o **mesmo documento**, byte a byte, com diferença de um espaço de indentação.\n**Decisão:** `Regras_de_negocio/` é a fonte oficial, porque é onde a skill manda procurar. A cópia em `Documentacao/` foi substituída por um redirecionamento que explica a mudança.\n**Por que importava:** a skill determina que a documentação prevalece sobre o código em conflito. Com duas cópias, não havia \"a documentação\" — havia um empate sem critério de desempate.\n\n---\n\n### ✅ D7 — Quando o OTP é exigido? — **RESOLVIDA em 21/08/2026**\n\n**Decisão:** Só em dispositivo ainda não reconhecido. Depois da primeira verificação naquele navegador, e-mail e senha bastam.\n**Razão:** A leitura literal do plano de backend (código a cada login) impunha abrir o e-mail toda vez. Para um público que a documentação descreve esperando \"abrir um link e usar na hora\", isso é atrito que custa adoção sem ganho proporcional de segurança — o segundo fator continua protegendo exatamente o caso que importa, o acesso a partir de uma máquina desconhecida.\n**Formalizada em:** ACS-LOGIN-002, ACS-LOGIN-011, tabela `dispositivos_confiaveis`.\n\n### ✅ D8 — Contas podem ser suspensas? — **RESOLVIDA em 21/08/2026**\n\n**Decisão:** Sim, por dois motivos com saídas distintas — violação dos termos (contato com o suporte) e inadimplência (regularização do pagamento).\n**Nuance de tratamento:** inadimplência recebe tratamento de aviso, não de erro. É pendência que a pessoa resolve sozinha; pintá-la de vermelho como uma violação seria punir quem só está atrasado.\n**Formalizada em:** ACS-LOGIN-009, ACS-LOGIN-012, ACS-LOGIN-013, `users.suspensao_motivo`.\n\n### ✅ D9 — `--text-warning` reprovava em contraste — **RESOLVIDA em 22/08/2026**\n\n**Decisão:** `--text-warning` passou a apontar para um `--amber-700` (`#B45309`) novo na camada base.\n**Resultado medido:** de **3,07:1** para **4,84:1** sobre `--bg-warning`, acima do mínimo AA de 4,5:1. Verificado em todos os alertas da tela: os quatro que reprovavam agora passam, e os que já passavam não regrediram.\n**Alcance:** afeta o styleguide e qualquer página com alerta de aviso. O âmbar ficou um degrau mais escuro, diferença quase imperceptível a olho e decisiva na medição.\n**Nota:** `--amber-600` continua na paleta para preenchimento e ícone, onde a regra de contraste é outra. O 700 existe para texto.\n\n## 8. Histórico\n\n| Versão | Data | Alteração |\n|---|---|---|\n| 1.6.1 | 2026-08-22 | §6 rotulado como retrato datado de 21/08/2026 — era lido como \"situação atual\" e afirmava quatro estados implementados quando a §5 já registrava nove, além de listar a tela de conta suspensa como inexistente e a D6 como pendente. ACS-LOGIN-015, 016 e 017 promovidas de prosa para a tabela de regras — existiam só como comentário e nenhuma podia ser citada como fonte. Corrigidas as referências às linhas 5 e 6 da cascata antiga, que a 1.6.0 havia deixado apontando para linhas inexistentes. Referências residuais a `criar-empresa.html` corrigidas (estado \"Primeiro acesso\", checklist da Fase 3 e páginas relacionadas). §2.5 passou a apontar onde a tabela `empresas` está especificada. |\n| 1.6.0 | 2026-08-22 | **Cascata simplificada de seis linhas para quatro** (nova ACS-LOGIN-017). As rotas para `criar-empresa.html` e `painel-especialista.html` saíram: a listagem de empresas já distingue essas situações pelas variantes do estado vazio, e decidi-las no login obrigava o acesso a conhecer regras do módulo de empresas. Toda conta que pode entrar entra por `empresas.html`. O cadastro passa a levar para lá também. |\n| 1.5.0 | 2026-08-22 | Dívida técnica do `cadastro.html` paga, com efeito colateral sobre esta tela: o sprite de ícones que vivia inline no `login.html` saiu para `img/icones.svg`, junto com os outros dois que existiam no styleguide e no cadastro. Eram **três fontes** para os mesmos ícones, e o olho, o envelope e o X já tinham traçados divergentes entre elas. Componentes de senha e aceite promovidos a `components.css` e catalogados no styleguide. |\n| 1.4.0 | 2026-08-22 | **Frontend ligado na API.** Nenhuma simulação resta em login e cadastro: credencial, suspensão, reconhecimento de dispositivo e contagem de bloqueio passaram a ser decididos pelo servidor, com a sessão em cookie `httpOnly` que a página não alcança. D9 resolvida — `--text-warning` corrigido para `--amber-700`, e todos os alertas passam em AA. Aberta a D10, que **bloqueia publicação**: o \"Esqueci minha senha\" exibe sucesso falso. A API passou a poder servir o frontend (`SERVIR_FRONTEND`), com allowlist que impede o `.env` e o código-fonte de vazarem por HTTP. |\n| 1.3.0 | 2026-08-21 | **Fase 3 concluída** no frontend: a cascata de roteamento da §4 está implementada sobre uma conta simulada, com os seis ramos verificados em teste. Nove dos dez estados obrigatórios resolvidos. Novas regras ACS-LOGIN-015 (a cascata é avaliada antes do segundo fator, porque dois ramos o dispensam) e ACS-LOGIN-016 (destino retomado só vale para quem tem vínculo). ACS-LOGIN-009 refinada: a suspensão é revelada após a credencial validada, sem exigir o segundo fator. Restam construir as telas de console administrativo e painel do especialista, hoje sinalizadas por andaime temporário. |\n| 1.2.0 | 2026-08-21 | Decisões D7 (OTP só em dispositivo novo) e D8 (suspensão por violação ou inadimplência) resolvidas e implementadas. **Fase 2 concluída**: os quatro estados faltantes que não dependiam de backend estão na tela, elevando de quatro para oito os dez estados obrigatórios resolvidos. Novas regras ACS-LOGIN-011 a 014. Tabela `dispositivos_confiaveis` e campo `users.suspensao_motivo` acrescentados ao modelo. Botão do Google devolvido à condição de placeholder, conforme decisão do plano de backend §1. Aberta a D9, defeito de contraste pré-existente em `--text-warning`. |\n| 1.1.0 | 2026-08-21 | Decisões D1, D4 e D5 resolvidas. Removido o conceito de perfil único na conta: identidade passa a ser uma pessoa / uma conta, com capacidades derivadas de vínculos (`empresa_membros`) e de extensão opcional (`perfil_especialista`). CPF sai do cadastro para o primeiro recebimento. Administrador vira tabela própria. Novas regras ACS-CONTA-007 (privacidade do perfil público) e ACS-SESSAO-004 (revogação de vínculo). Cascata de roteamento reescrita sobre vínculo em vez de tipo de conta. |\n| 1.0.0 | 2026-08-21 | Documento criado. Perfis derivados da documentação principal, regras de acesso com IDs, roteamento pós-login, avaliação dos dez estados obrigatórios e seis decisões em aberto. |\n"}]},{"nome":"atividades","emoji":"📋","docs":[{"id":"atividades/atividade-analise-pre-implementacao","nome":"atividade-analise-pre-implementacao","titulo":"Análise pré-implementação — atividade.html","versao":null,"status":"Levantamento feito. **Parcialmente substituído** por [`atividade-lista.md`](atividade-lista.md) (v1.1.0, implementado) — Acessar, adicionar tarefa, priorizar por ordem e concluir tarefa já têm regra oficial e código. §4 (modelo de dados com tabela `atividades` própria) **não** foi o modelo adotado — `atividade-lista.md` §0 decidiu não ter tabela separada. As perguntas P2–P5, P8–P10 e \"Excluir tarefa\" abaixo continuam sem resposta.","pagina":"atividade.html","ids":["IDEIA-MOV-PONTE","IDEIA-MOV-014","IDEIA-MOV-015","IDEIA-MOV-016","IDEIA-MOV-006","IA-CONV","IDEIA-CRIA-003","IA-CONV-001","IA-ACAO","IDEIA-CRIA-PAPEL","IA-CONV-006"],"modificado":"2026-08-28T21:28:31.282Z","bytes":14957,"rel":"Regras_de_negocio/modulos/atividades/atividade-analise-pre-implementacao.md","md":"# Análise pré-implementação — `atividade.html`\n\n> **Módulo:** Atividades (novo — ainda não existe no backend)\n> **Página:** `atividade.html`\n> **Status:** Levantamento feito. **Parcialmente substituído** por [`atividade-lista.md`](atividade-lista.md) (v1.1.0, implementado) — Acessar, adicionar tarefa, priorizar por ordem e concluir tarefa já têm regra oficial e código. §4 (modelo de dados com tabela `atividades` própria) **não** foi o modelo adotado — `atividade-lista.md` §0 decidiu não ter tabela separada. As perguntas P2–P5, P8–P10 e \"Excluir tarefa\" abaixo continuam sem resposta.\n> **Gerado sob:** `Skills/regra_de_negocio.skill` — fase de análise, antes do planejamento\n> **Documentos irmãos (já existentes, e que já preveem este módulo):** [`ideias-movimentacao.md`](../ideias/ideias-movimentacao.md) §1.4 e §4 · [`ideias-quadro.md`](../ideias/ideias-quadro.md) §5 · [`ideias-criacao.md`](../ideias/ideias-criacao.md)\n\nEste documento **não é** a fonte oficial de regras do módulo — ele existe para reunir, num só lugar, tudo que hoje descreve o comportamento pretendido de `atividade.html`, comparar com o que já foi decidido em outros módulos, e levantar as perguntas que faltam responder antes de planejar a implementação. Depois que essas perguntas tiverem resposta, o conteúdo aprovado vira o `atividade-lista.md` de verdade, com regras `ATV-xxx` e versionamento próprio — como já existe para `empresas`, `projetos`, `ideias` e `ia`.\n\n---\n\n## 1. Onde a página se encaixa hoje\n\n`atividade.html` **não é uma página nova conceitualmente** — o encaixe dela já está registrado em dois documentos que a citam como dependência:\n\n- `ideias-movimentacao.md` §1.4 (`IDEIA-MOV-PONTE`): já decide que **concluir a atividade de uma idéia move essa idéia para \"Finalizado\" automaticamente** (`IDEIA-MOV-014`), que a idéia afetada precisa ser identificada **pelo `id`, nunca pelo título** (`IDEIA-MOV-015` — corrige um bug específico do protótipo atual, descrito abaixo), e que essa mudança **precisa ser persistida pela API como qualquer outra movimentação** (`IDEIA-MOV-016`). A pendência aberta nesse mesmo documento diz literalmente: *\"o gatilho exato entra junto do módulo de atividades\"* — é isso que este documento começa a especificar.\n- `ideias-quadro.md` §5 (tabela de pendências): registra que o botão **\"Acessar\" do card de idéia** leva hoje a `atividade.html` ou a `matriz_csd.html`, e que o contrato dessa navegação \"entra junto do módulo de atividades\".\n- Em `visao_do_projeto.html`, o próprio código do botão \"Acessar\" documenta a lacuna: hoje, na ausência do módulo, o botão apenas move a idéia para a coluna seguinte — um substituto **honesto**, não a navegação real (comentário no código: *\"o destino do 'Acessar' pertence ao módulo de atividades, que ainda não existe\"*).\n\n**Conclusão:** este não é um pedido de página nova solta — é o módulo que dois outros documentos já esperam e citam por nome. Isso significa que parte das regras **já está decidida** e não deveria ser revisitada aqui, só implementada (ver §5).\n\n---\n\n## 2. Estado atual da interface — o que existe e o que é ilusão\n\nIgual ao que valeu para `visao_do_projeto.html` antes do assistente ser implementado: a tela está **inteiramente pronta visualmente e inteiramente falsa por baixo**. Nenhuma chamada à API, nenhum `js/api.js` carregado, nenhum dado vindo de lugar nenhum — tudo é HTML fixo e `localStorage`.\n\n| Aspecto | Situação hoje |\n|---|---|\n| Autenticação / sessão | **Nenhuma.** A página não importa `js/api.js`, não verifica login, não redireciona sem sessão. Qualquer um que abra o arquivo vê a tela. |\n| Empresa / projeto / idéia | **Fixos no HTML.** O título mostra sempre \"Nike / site\"; não há leitura de `?empresa=` / `?projeto=` na URL, nem de qual idéia esta atividade pertence. |\n| Lista de tarefas | 6 `\u003cli>` fixas no HTML, a maioria com `hidden` (reveladas de uma vez só pelo botão \"Gerar tarefas com IA\" — que não gera nada, só tira o `hidden`). |\n| Criar tarefa | O formulário mostra \"Tarefa adicionada com sucesso\" **mas nunca insere o card na lista** — só o caminho de edição (`tarefaEditando` preenchido) atualiza o DOM. Bug do protótipo, não decisão. |\n| Editar / duplicar / excluir tarefa | Mexem só no DOM local (clona nó, edita texto, remove nó). Nada persiste; recarregar a página desfaz tudo. |\n| Finalizar / reabrir tarefa | Troca a cor/ícone do selo de status. **Finalizar uma tarefa individual redireciona imediatamente para `visao_do_projeto.html?board=1`** — o que parece efeito colateral de teste, não comportamento pretendido (ver pergunta P6). |\n| \"Acessar tarefa\" | O link vai para `pesquisa.html` em todos os cards, **exceto** o card cujo título é literalmente o texto `\"Matriz CSD\"`, que vai para `matriz_csd.html`. A escolha de destino é feita **comparando o texto do título**, não um tipo/id da tarefa — a mesma classe de bug que `IDEIA-MOV-015` já teve que corrigir em outro lugar. |\n| Editar / excluir a atividade em si | Os modais existem no HTML e o JavaScript que os abre também — mas **o botão/menu que deveria abri-los não existe na página**. É código morto hoje: não há como um usuário chegar a esses dois modais pela interface. |\n| \"Concluir atividade\" (botão do cabeçalho) | Abre confirmação e, ao confirmar, **só navega** para `visao_do_projeto.html?board=1`. Não move nenhuma idéia (não poderia — não há id de idéia em lugar nenhum da página). |\n| Reordenar tarefas | Arrastar (mouse) e setas (teclado) funcionam **só no DOM**, mesma mecânica de `IDEIA-MOV-006/007` do quadro de idéias. Não persiste — mesmo caso já registrado como pendência aceitável em `ideias-movimentacao.md` §4 (\"ordem dentro da coluna\"). |\n| Assistente de IA (painel lateral) | Existe visualmente, mas está **totalmente desconectado**: sem `js/ia.js`, sem `js/api.js`, e com a **mesma conversa de exemplo falsa** (texto sobre inadimplência e moradores vendendo em e-commerce) que `visao_do_projeto.html` tinha antes de `IA-CONV` ser implementado. O mesmo bug, na mesma frase, ainda não corrigido aqui. |\n| Navegação / menu lateral | A página **não aparece em nenhum menu** — nenhuma outra tela linka para `atividade.html` diretamente; hoje só seria alcançável por um \"Acessar\" que, como visto acima, nem leva até ela de verdade. |\n| Ponte com `pesquisa.html` | Via `localStorage`, com duas chaves: `tarefa-1-status` (marca **uma única tarefa fixa**, \"tarefa-1\", como concluída — não generaliza para outras tarefas) e `nova-tarefa` (um objeto de tarefa criado em `pesquisa.html` e inserido aqui uma única vez ao carregar). Nenhuma das duas passa pelo servidor. |\n| Ponte com `matriz_csd.html` | Só a navegação por link (`Acessar` → `matriz_csd.html`, ou `matriz_csd.html?modo=leitura` se a tarefa já estiver concluída). Nenhum dado troca de mão. |\n\n---\n\n## 3. Um sinal a **não** seguir: `idea-finalizada` em `pesquisa.html`\n\nAo concluir uma tarefa em `pesquisa.html`, o código grava (além de `tarefa-1-status`) uma segunda chave, `idea-finalizada`, com título/descrição/importância — aparentemente para nascer um card **novo**, direto na coluna \"Finalizado\" de `visao_do_projeto.html`.\n\nDuas coisas importantes:\n\n1. **Essa chave nunca é lida em `visao_do_projeto.html`** — é código morto, nunca ficou conectada. Não é um comportamento ativo hoje.\n2. **Se fosse implementada como está**, contradiria uma regra já decidida: `IDEIA-CRIA-003` — *\"Toda idéia nasce na coluna 'Minhas idéias' ... Não é possível criar já em outra coluna.\"* Criar uma idéia nova direto em \"Finalizado\" ao concluir uma tarefa de pesquisa reabriria exatamente essa porta.\n\nRegistro aqui só para deixar claro: ao construir o módulo de verdade, o caminho correto é o que `IDEIA-MOV-014` já decidiu — **mover a idéia existente** (pelo `id`) para \"Finalizado\" quando a atividade é concluída — nunca criar uma idéia nova nesse momento.\n\n---\n\n## 4. Modelo sugerido (rascunho, não decidido)\n\nSó para dar forma à conversa — nenhum campo aqui está fechado:\n\n```\natividades\n  id            uuid (pk)\n  ideia_id      uuid (fk → ideias.id, único? — ver P1)\n  criado_em     timestamp\n  concluida_em  timestamp (null enquanto aberta)\n\ntarefas\n  id            uuid (pk)\n  atividade_id  uuid (fk → atividades.id, cascade)\n  tipo          enum (pesquisa | entregavel | dinamica | ...)  -- ver P3\n  titulo        text\n  descricao     text\n  status        enum (pendente | concluida)\n  ordem         ? -- ver P7\n  criado_em     timestamp\n```\n\n`tipo` é o que decidiria para qual página o \"Acessar tarefa\" navega (`pesquisa.html`, `matriz_csd.html`, ou outras que ainda não existem) — em vez de comparar o texto do título, como o protótipo faz hoje.\n\n---\n\n## 5. O que já está decidido e não deveria ser reaberto aqui\n\n- **`IDEIA-MOV-014`** — concluir a atividade move a idéia para \"Finalizado\" automaticamente; é um atalho, o movimento livre (`I5`) continua valendo.\n- **`IDEIA-MOV-015`** — a idéia afetada é identificada pelo `id`, nunca por título/texto. Isso também deveria valer para \"Acessar tarefa\" escolher a página de destino (hoje compara o título \"Matriz CSD\" — mesmo defeito, mesma correção).\n- **`IDEIA-MOV-016`** — a mudança é persistida pela API; nada vive só no navegador (isso invalida o padrão `localStorage` usado hoje entre `atividade.html` e `pesquisa.html`).\n- **`IDEIA-CRIA-003`** — nenhuma idéia nasce fora de \"Minhas idéias\" (ver §3 acima).\n- **`IA-CONV-001`** — a conversa do assistente é por pessoa, **dentro de cada projeto** — não há hoje o conceito de conversa por atividade. Ver `P8`.\n\n---\n\n## 6. Perguntas em aberto — precisam de decisão antes do planejamento\n\n| # | Pergunta | Por que importa |\n|---|---|---|\n| P1 | Uma idéia tem **no máximo uma** atividade, ou pode ter várias ao longo do tempo? A atividade nasce automaticamente no primeiro \"Acessar\", ou por uma ação explícita? | Define o modelo de dados (`ideia_id` único ou não) e o que \"Acessar\" faz na primeira vez. |\n| P2 | Ao concluir a atividade (`IDEIA-MOV-014`), o que acontece se ainda houver tarefas pendentes? Bloqueia, avisa e deixa seguir, ou é ignorado silenciosamente? | Hoje o botão \"Concluir atividade\" não olha para o estado das tarefas. |\n| P3 | Os \"tipos\" de tarefa (Mais utilizados / Pesquisa / Entregáveis / Dinâmicas, vistos no modal \"Nova tarefa\") são uma lista fixa e pequena, ou precisa ser extensível? Cada tipo tem uma página própria (como `pesquisa.html` e `matriz_csd.html` hoje), e o que acontece com um tipo que ainda não tem página? | Decide o enum de `tipo` e como o roteamento de \"Acessar tarefa\" funciona sem comparar texto. |\n| P4 | \"Gerar tarefas com IA\" segue o mesmo padrão de proposta/confirmação do assistente (`IA-ACAO` — a IA nunca grava sozinha, só propõe) ou é outro fluxo? | Hoje é só um botão que revela cards já escritos à mão — nada é gerado de verdade. |\n| P5 | O menu \"editar atividade\" / \"excluir atividade\" (modais já existem, sem gatilho na tela) — continua fazendo parte do escopo, ou foi abandonado de propósito? Se existir, excluir a atividade também exclui a idéia, ou só desfaz a atividade e a idéia volta a existir sem ela? | Hoje é código morto: precisa decisão para saber se implementa o gatilho ou remove o resto. |\n| P6 | Finalizar **uma tarefa** individual, no protótipo, redireciona para `visao_do_projeto.html?board=1` — parece efeito colateral de teste. O comportamento pretendido é permanecer na atividade depois de finalizar uma tarefa? | Sair da tela ao concluir uma única tarefa (não a atividade inteira) parece um bug de navegação, não uma decisão. |\n| P7 | Reordenar tarefas arrastando: persiste (exige campo de posição, como `ideias-movimentacao.md` §4 já registrou como pendência em aberto para idéias) ou fica só na sessão, igual está hoje? | Mesma pendência já aceita para idéias — vale decidir se este módulo segue o mesmo padrão. |\n| P8 | A conversa do assistente nesta tela é **a mesma** conversa do projeto (`IA-CONV-001`, que hoje é por pessoa+projeto), reaproveitada aqui, ou o módulo de atividades precisa de uma dimensão nova (por pessoa+atividade)? | Muda o modelo de dados de `ia_conversas` se for uma dimensão nova; se for a mesma, só precisa carregar o painel como já existe em `visao_do_projeto.html`. |\n| P9 | Quem pode ver/mexer numa atividade — os mesmos três papéis de idéias (proprietário, membro, especialista — `IDEIA-CRIA-PAPEL`), ou alguma regra adicional (por exemplo, só quem \"acessou\" primeiro)? | Define a régua de permissão da rota, mesmo raciocínio já usado em `ideias.ts` e `ia.ts`. |\n| P10 | Duplicar uma tarefa — hoje é só um clone no DOM. No real, duplicar deveria criar a tarefa nova imediatamente no servidor (com um novo id), ou abrir pré-preenchido no modal de criação para revisão antes de salvar? | Muda se \"Duplicar\" é uma ação de um clique ou passa por confirmação de conteúdo. |\n\n---\n\n## 7. Defeitos do protótipo a corrigir ao construir (não são decisões, são bugs)\n\n- Criar tarefa nova não insere o card — só mostra a mensagem de sucesso.\n- O rótulo \"Concluir atividade\" é usado tanto no botão do cabeçalho (finaliza a atividade inteira) quanto no menu de cada tarefa (que na verdade finaliza só aquela tarefa) — mesmo texto, ações diferentes.\n- \"Acessar tarefa\" decide o destino comparando o texto do título (\"Matriz CSD\") em vez de um tipo/id estável.\n- Ponte com `pesquisa.html` via `localStorage` com chave fixa `tarefa-1-status`, que só funciona para uma tarefa específica, não generaliza.\n- Conversa do assistente com o mesmo texto de exemplo falso já corrigido em `visao_do_projeto.html` (`IA-CONV-006`) — aqui ainda não.\n- Nenhum estado de carregando / vazio / erro / sem permissão / offline — a tela sempre mostra os mesmos dados fixos.\n\n---\n\n## 8. Classificação (conforme `Skills/regra_de_negocio.skill`)\n\n**Impacto desconhecido / módulo novo.** Não há regra existente sendo contradita (as poucas regras já escritas em outros módulos — `IDEIA-MOV-014/015/016`, `IDEIA-CRIA-003` — são compatíveis com o que a tela tenta fazer, só ainda não foram implementadas do lado de `atividade.html`). O que falta não é resolver conflito, é **decidir as perguntas da §6** para poder escrever as regras `ATV-xxx` de verdade e então planejar a implementação.\n\n---\n\n## 9. Próximo passo sugerido\n\nResponder as perguntas P1–P10 (ou marcar as que preferir decidir só na hora do planejamento). A partir das respostas, o passo seguinte é o planejamento formal (arquivos afetados, contrato de API, modelo de dados definitivo, critérios de aceite) — ainda não incluído aqui, como pedido.\n"},{"id":"atividades/atividade-lista","nome":"atividade-lista","titulo":"Regras de Negócio — Lista de Tarefas da Atividade","versao":"1.7.0","status":"Implementado e verificado ao vivo (backend + `atividade.html` + `visao_do_projeto.html`)","pagina":"atividade.html","ids":["IDEIA-MOV-014","ATV-ACESSO","ATV-TAR-CRIA","ATV-TAR-ORDEM","ATV-TAR-CONCLUIR","ATV-ACESSO-001","ATV-ACESSO-002","ATV-ACESSO-003","ATV-ACESSO-004","ATV-ACESSO-005","IDEIA-MOV-001","ATV-TAR-CRIA-001","IDEIA-CRIA-001","ATV-TAR-CRIA-002","ATV-TAR-CRIA-003","IDEIA-CRIA-003","ATV-TAR-CRIA-004","IDEIA-CRIA-PAPEL","ATV-TAR-ORDEM-001","ATV-TAR-ORDEM-002","IDEIA-MOV-CAMINHOS","ATV-TAR-ORDEM-003","IDEIA-MOV-009","ATV-TAR-ORDEM-004","IDEIA-MOV-011","ATV-TAR-ORDEM-005","IDEIA-MOV-003","ATV-TAR-CONCLUIR-001","ATV-TAR-CONCLUIR-002","ATV-TAR-CONCLUIR-003","ATV-TAR-CONCLUIR-004","ATV-TAR-EXCLUI","ATV-TAR-EXCLUI-001","IDEIA-EXCL-001","ATV-TAR-EXCLUI-002","ATV-TAR-EXCLUI-003","IDEIA-MOV-012","ATV-TAR-EXCLUI-004","ATV-TAR-EXCLUI-005","ATV-CONCLUIR","ATV-CONCLUIR-001","ATV-CONCLUIR-002","ATV-CONCLUIR-003","ATV-CONCLUIR-004","ATV-TAR-EDIT","ATV-TAR-EDIT-001","ATV-TAR-EDIT-002","ATV-TAR-EDIT-003","IDEIA-ISO-003","ATV-TAR-EDIT-004","BOARD-ACESSO","ATV-GERAR","ATV-GERAR-001","IA-ACAO","ATV-GERAR-002","IA-CUSTO","IA-GARANT","IA-CONHEC","ATV-GERAR-003","ATV-GERAR-004"],"modificado":"2026-09-13T11:18:47.112Z","bytes":32944,"rel":"Regras_de_negocio/modulos/atividades/atividade-lista.md","md":"# Regras de Negócio — Lista de Tarefas da Atividade\n\n> **Versão:** 1.7.0 · **Status:** Implementado e verificado ao vivo (backend + `atividade.html` + `visao_do_projeto.html`)\n> **Conferido em:** 13/09/2026, contra `api/src/rotas/tarefas.ts`, `js/atividade.js` e `js/orquestrador-gateway.js`\n> **Módulo:** Atividades · **Página:** `atividade.html`\n> **Gerado sob:** `Skills/regra_de_negocio.skill`\n> **Documentos irmãos:** [`ideias-movimentacao.md`](../ideias/ideias-movimentacao.md) — de onde vem `IDEIA-MOV-014/015/016` · [`ideias-criacao.md`](../ideias/ideias-criacao.md) · [`ideias-quadro.md`](../ideias/ideias-quadro.md)\n> **Substitui em parte:** [`atividade-analise-pre-implementacao.md`](atividade-analise-pre-implementacao.md) — este documento resolve as perguntas P1 (parcialmente), e define `ATV-ACESSO`, `ATV-TAR-CRIA`, `ATV-TAR-ORDEM` e `ATV-TAR-CONCLUIR`. As perguntas P2–P10 que este documento **não** resolve continuam abertas — ver §5.\n\n---\n\n## 0. O que é uma \"atividade\"\n\nNão existe uma entidade separada de \"atividade\" no banco. **A atividade É a idéia** — a página `atividade.html` é a visão de trabalho de uma idéia que está sendo executada, e a lista que ela mostra é a lista de tarefas **daquela idéia**. Não há uma tabela `atividades`: existe `ideias` (já existente) e uma nova `tarefas`, presa direto ao `id` da idéia.\n\nIsso simplifica o modelo pretendido em `atividade-analise-pre-implementacao.md` §4 (que cogitava uma tabela `atividades` intermediária) — ela deixa de ser necessária.\n\n---\n\n## 1. Regras\n\n### 1.1 Entrar na atividade — `ATV-ACESSO`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-ACESSO-001 | Clicar em **\"Acessar\"** no card de uma idéia (em `visao_do_projeto.html`) faz duas coisas juntas: move a idéia para a coluna **\"Em andamento\"** (se ainda não estiver lá) e abre `atividade.html` para aquela idéia. | Decisão A17 |\n| ATV-ACESSO-002 | Na **primeira** vez que uma idéia é acessada, uma tarefa nasce sozinha, copiando o **título** e a **descrição** da idéia — é essa tarefa que aparece como o primeiro card da lista. | Decisão A17 |\n| ATV-ACESSO-003 | Da segunda vez em diante, \"Acessar\" só abre a lista de tarefas que já existe — **não** cria uma segunda tarefa-semente. | Decorre de ATV-ACESSO-002 |\n| ATV-ACESSO-004 | A tarefa nascida da idéia (`ATV-ACESSO-002`) é uma tarefa comum depois de criada: pode ser editada, reordenada, concluída ou excluída como qualquer outra. Não fica protegida nem se distingue das demais. | Decisão A17 |\n| ATV-ACESSO-005 | Editar o título/descrição da idéia depois de a atividade já existir **não** reescreve a tarefa-semente. A cópia foi feita uma vez, no momento do acesso; dali em diante são registros independentes. | Decorre de ATV-ACESSO-002 — mesmo princípio de `fontes` em `ia_mensagens` (cópia no momento, não sincronização contínua) |\n\n**Por que mover para \"Em andamento\" faz parte de \"Acessar\" (`ATV-ACESSO-001`).** Isto substitui o comportamento provisório que existe hoje em `visao_do_projeto.html` (mover para a coluna seguinte, um substituto \"honesto\" registrado no próprio código). Continua sendo **um atalho**, não uma restrição nova: `IDEIA-MOV-001` (movimento livre) continua valendo — a pessoa pode arrastar a idéia para qualquer coluna a qualquer momento, inclusive para fora de \"Em andamento\" enquanto a atividade segue existindo.\n\n**Por que a idéia não \"vira\" a tarefa, ela gera uma cópia (`ATV-ACESSO-002`).** A idéia continua existindo como idéia — ela tem que continuar podendo ser movida, editada e eventualmente chegar em \"Finalizado\" (`IDEIA-MOV-014`), o que só faz sentido se ela não deixar de existir. \"Transformar em tarefa\" é a idéia **gerar** o primeiro item de trabalho da sua própria atividade, não se converter nele.\n\n### 1.2 Adicionar tarefa — `ATV-TAR-CRIA`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-TAR-CRIA-001 | Toda tarefa nova exige **título** (até 260 caracteres) e **descrição** (até 280 caracteres) — mesmos limites já usados em idéias (`IDEIA-CRIA-001/002`), pelo mesmo motivo: consistência entre módulos. | Decisão A18 |\n| ATV-TAR-CRIA-002 | Uma tarefa nova nasce **sempre no fim da lista** — depois da última tarefa já existente, nunca no meio nem no topo. | Pedido do Ricardo, 28/08/2026 |\n| ATV-TAR-CRIA-003 | Uma tarefa nova nasce com status **pendente**. Não é possível criar uma tarefa já concluída. | Decorre de `ATV-TAR-CRIA-002` — mesmo raciocínio de `IDEIA-CRIA-003` |\n| ATV-TAR-CRIA-004 | Criar uma tarefa é uma ação de quem pode escrever na idéia — os mesmos três papéis já definidos (proprietário, membro, especialista — `IDEIA-CRIA-PAPEL`). | Decorre de `IDEIA-CRIA-PAPEL` |\n\n**Por que sempre no fim, e não numa posição escolhida (`ATV-TAR-CRIA-002`).** É a lista de reordenação (`ATV-TAR-ORDEM`) que decide onde uma tarefa importa mais — criar já permite escolher uma posição duplicaria essa decisão em dois lugares diferentes. Entrar no fim é previsível: a pessoa sempre sabe onde procurar o que acabou de criar, e decide depois, arrastando, se aquilo é prioridade.\n\n### 1.3 Priorização — `ATV-TAR-ORDEM`\n\nEsta tela existe, em grande parte, para isto: a ordem dos cards **é** a prioridade das tarefas dentro da atividade — não é um detalhe visual.\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-TAR-ORDEM-001 | A posição de uma tarefa na lista é um dado gravado (`ordem`), não uma decisão de exibição. Duas pessoas olhando a mesma atividade veem a mesma ordem. | Pedido do Ricardo, 28/08/2026 |\n| ATV-TAR-ORDEM-002 | A pessoa pode reordenar de **dois jeitos**: arrastar com o mouse (pelo alça já existente no protótipo) ou usar as setas para cima/baixo com o card em foco. | Decisão A19 — mesmo princípio de `IDEIA-MOV-CAMINHOS` |\n| ATV-TAR-ORDEM-003 | Os dois caminhos passam pela **mesma** função de reordenação e pela **mesma** chamada à API. Nenhum dos dois special-cases a gravação. | Decorre de `ATV-TAR-ORDEM-002` — mesmo raciocínio de `IDEIA-MOV-009` |\n| ATV-TAR-ORDEM-004 | O card se move na tela imediatamente; a chamada ao servidor segue em paralelo. Se falhar, o card **volta** para a posição de onde saiu e a tela avisa. | Decorre de `IDEIA-MOV-011/012` — mesmo padrão, mesma razão |\n| ATV-TAR-ORDEM-005 | Soltar a tarefa na mesma posição de onde saiu não é uma alteração: não chama a API, não emite mensagem. | Decorre de `IDEIA-MOV-003` |\n\n**Por que isto muda a decisão de `ideias-movimentacao.md` §4 (não a contradiz).** Lá, a ordem dentro de uma coluna de idéias foi deixada de fora de propósito — o quadro de idéias é sobre round-trip de brainstorm, não sobre fila de execução, e não havia pedido para persistir posição. Aqui é o oposto: o Ricardo pediu explicitamente que esta tela sirva para priorizar. São páginas com propósitos diferentes; a mesma pergunta pode ter respostas diferentes em cada uma sem que isso seja inconsistência.\n\n**Por que arrastar sozinho não basta (`ATV-TAR-ORDEM-002`).** Mesma razão já registrada para idéias: arrastar com mouse é o único caminho que exclui parte das pessoas. As setas não são um extra — são o que torna a priorização possível pelo teclado e por leitor de tela.\n\n### 1.4 Concluir tarefa — `ATV-TAR-CONCLUIR`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-TAR-CONCLUIR-001 | Concluir uma tarefa muda **só** o `status` dela, para \"concluída\". Não move nem apaga nenhuma outra tarefa, não mexe na idéia, não navega para fora da tela. | Corrige o protótipo — ver nota abaixo |\n| ATV-TAR-CONCLUIR-002 | Toda tarefa concluída pode ser **reaberta** — volta para \"pendente\". Não é uma ação de mão única. | Interface já existente (`taskReopenModal`) |\n| ATV-TAR-CONCLUIR-003 | Concluir/reabrir passa por confirmação antes de gravar — mesma proteção contra clique acidental que já existe no protótipo para as outras ações destrutivas ou que mudam estado. | Interface já existente |\n| ATV-TAR-CONCLUIR-004 | Concluir a **última** tarefa pendente de uma atividade **não** conclui a atividade nem move a idéia sozinha. Quem move a idéia para \"Finalizado\" continua sendo exclusivamente o botão \"Concluir atividade\" (`IDEIA-MOV-014`). | Decisão A20 |\n\n**O bug que `ATV-TAR-CONCLUIR-001` conserta.** Hoje, no protótipo, confirmar a conclusão de uma tarefa individual redireciona a pessoa para `visao_do_projeto.html?board=1` — sai da atividade inteira por ter concluído **uma** tarefa dentro dela. Não há pedido nem razão registrada para isso: parece resíduo de teste, não comportamento pretendido. A regra corrige isso: concluir uma tarefa é um evento local à lista, a pessoa continua na atividade e pode seguir trabalhando nas tarefas seguintes.\n\n**Por que `ATV-TAR-CONCLUIR-004` é regra explícita.** Era tentador deixar \"todas as tarefas concluídas\" disparar sozinho a conclusão da atividade — mas isso tiraria da pessoa a decisão que `IDEIA-MOV-014`/`I5` já protegem: mover para \"Finalizado\" é sempre um ato explícito. Automatizar aqui reabriria, por um caminho novo, a mesma pergunta que `I5` já respondeu (a coluna reflete a intenção da pessoa, não um fato calculado sozinho).\n\n### 1.5 Excluir tarefa — `ATV-TAR-EXCLUI`\n\n| ID | Regra | Fonte |\n|---|---|---|\n| ATV-TAR-EXCLUI-001 | Excluir uma tarefa apaga a linha **de verdade** no banco — não é arquivamento como em idéias (`IDEIA-EXCL-001`). Não existe \"lixeira\" nem forma de recuperar depois. | Pedido do Ricardo, 29/08/2026 |\n| ATV-TAR-EXCLUI-002 | Excluir passa por confirmação antes de gravar — mesma proteção contra clique acidental já usada nas demais ações destrutivas desta tela. | Interface já existente (`taskDeleteModal`) |\n| ATV-TAR-EXCLUI-003 | O card só some da tela **depois** que a API confirma a exclusão — nunca antes. Se a chamada falhar, o card continua ali e a tela avisa. | Decorre do mesmo raciocínio de `IDEIA-MOV-012`, aplicado a uma ação sem meio-termo |\n| ATV-TAR-EXCLUI-004 | Excluir é uma ação de quem pode escrever na idéia — os mesmos três papéis já usados para criar, reordenar e concluir tarefa (`ATV-TAR-CRIA-004`). Resolve a metade \"excluir\" de P9 (§5); duplicar (P10) continua em aberto. | Decisão A22 |\n| ATV-TAR-EXCLUI-005 | Qualquer tarefa pode ser excluída, inclusive a tarefa-semente nascida do \"Acessar\" (`ATV-ACESSO-002/004`). Se a lista ficar vazia, o próximo acesso à atividade cria uma semente nova a partir da idéia — a atividade nunca fica \"quebrada\" por falta de tarefas. | Decorre de `ATV-ACESSO-004` |\n\n**Por que apagar de verdade, e não arquivar como idéias (`ATV-TAR-EXCLUI-001`).** Idéias e empresas são coisas que vale a pena poder recuperar — representam decisão e histórico. Uma tarefa dentro de uma atividade é mais parecida com um ite
