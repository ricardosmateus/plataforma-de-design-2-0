<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" role="img" aria-label="Lupa com uma lâmpada de ideia e post-its flutuando">
  <!-- Pontinhos -->
  <circle cx="233" cy="48" r="4.5" fill="#181D27"/>
  <circle cx="384" cy="52" r="4.5" fill="#181D27"/>

  <!-- Estrela principal (faísca) -->
  <g transform="translate(300 86)">
    <path fill="#FAC515" stroke="#181D27" stroke-width="9" stroke-linejoin="round"
      d="M0 -40 C4 -18 7 -16 24 -14 C7 -12 4 -10 0 12 C-4 -10 -7 -12 -24 -14 C-7 -16 -4 -18 0 -40 Z"/>
  </g>

  <!-- Mini-estrelas -->
  <g transform="translate(525 122)">
    <path fill="#A855F7" stroke="#181D27" stroke-width="6" stroke-linejoin="round"
      d="M0 -13 C1 -6 3 -5 9 -4 C3 -3 1 -1 0 7 C-1 -1 -3 -3 -9 -4 C-3 -5 -1 -6 0 -13 Z"/>
  </g>
  <g transform="translate(120 322)">
    <path fill="#0BA5EC" stroke="#181D27" stroke-width="6" stroke-linejoin="round"
      d="M0 -13 C1 -6 3 -5 9 -4 C3 -3 1 -1 0 7 C-1 -1 -3 -3 -9 -4 C-3 -5 -1 -6 0 -13 Z"/>
  </g>

  <!-- Lente da lupa -->
  <circle cx="300" cy="300" r="160" fill="#E0F2FE" stroke="#181D27" stroke-width="16"/>
  <!-- Brilho do vidro -->
  <line x1="236" y1="178" x2="282" y2="140" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity=".9"/>
  <line x1="205" y1="212" x2="214" y2="203" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".6"/>

  <!-- Lâmpada dentro da lente -->
  <g>
    <circle cx="300" cy="268" r="84" fill="#FACC15" stroke="#181D27" stroke-width="13"/>
    <circle cx="272" cy="234" r="22" fill="#FFFFFF" opacity=".5"/>
    <rect x="280.5" y="336" width="39" height="24" rx="9" fill="#181D27"/>
    <g stroke="#181D27" stroke-width="11" stroke-linecap="round">
      <line x1="300" y1="168" x2="300" y2="146"/>
      <line x1="225" y1="202" x2="210" y2="188"/>
      <line x1="375" y1="202" x2="390" y2="188"/>
      <line x1="196" y1="268" x2="174" y2="268"/>
      <line x1="404" y1="268" x2="426" y2="268"/>
    </g>
  </g>

  <!-- Cabo da lupa -->
  <line x1="432" y1="400" x2="504" y2="472" stroke="#181D27" stroke-width="46" stroke-linecap="round"/>
  <line x1="432" y1="400" x2="504" y2="472" stroke="#FAC515" stroke-width="26" stroke-linecap="round"/>

  <!-- Post-it (limão, canto superior esquerdo) -->
  <g transform="rotate(-10 150 150)">
    <rect x="75" y="75" width="150" height="150" fill="#FEF9C3" stroke="#181D27" stroke-width="10"/>
    <rect x="189" y="75" width="36" height="36" fill="#181D27"/>
    <line x1="105" y1="150" x2="195" y2="150" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
    <line x1="105" y1="180" x2="180" y2="180" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
  </g>

  <!-- Post-it (vermelho, canto superior direito) -->
  <g transform="rotate(10 470 150)">
    <rect x="395" y="75" width="150" height="150" fill="#FECACA" stroke="#181D27" stroke-width="10"/>
    <rect x="521" y="75" width="24" height="24" fill="#181D27"/>
    <line x1="425" y1="150" x2="515" y2="150" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
    <line x1="425" y1="180" x2="500" y2="180" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
  </g>

  <!-- Post-it (verde, canto inferior esquerdo) -->
  <g transform="rotate(8 145 445)">
    <rect x="70" y="370" width="150" height="150" fill="#BBF7D0" stroke="#181D27" stroke-width="10"/>
    <rect x="160" y="370" width="36" height="36" fill="#181D27"/>
    <line x1="100" y1="445" x2="190" y2="445" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
    <line x1="100" y1="475" x2="175" y2="475" stroke="#181D27" stroke-width="8" stroke-linecap="round" opacity=".22"/>
  </g>

  <!-- Pontinhos soltos -->
  <circle cx="255" cy="470" r="4" fill="#181D27"/>
  <circle cx="285" cy="505" r="4" fill="#181D27"/>
  <circle cx="150" cy="560" r="4" fill="#181D27"/>
</svg>