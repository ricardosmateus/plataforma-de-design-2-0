<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A marca antiga: apagada, ficando para trás -->
  <g transform="rotate(-12 170 300)">
    <rect x="58" y="176" width="220" height="264" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <g opacity=".3" stroke="#111111" stroke-width="6">
      <rect x="120" y="228" width="96" height="96" rx="4"/>
      <circle cx="168" cy="276" r="30"/>
    </g>
    <g opacity=".3" stroke="#111111" stroke-linecap="round">
      <path d="M104 362 h128" stroke-width="9"/>
      <path d="M126 390 h84" stroke-width="5"/>
    </g>
  </g>

  <!-- Seta de transformação: da antiga para a nova -->
  <path d="M150 150 C 180 60 330 40 400 118" stroke="#111111" stroke-width="24" stroke-linecap="round"/>
  <path d="M150 150 C 180 60 330 40 400 118" stroke="#FFDC4D" stroke-width="12" stroke-linecap="round"/>
  <path d="M378 86 L436 106 L406 160 Z" fill="#FFDC4D" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- A marca nova: viva, na frente -->
  <g transform="rotate(8 420 330)">
    <rect x="300" y="178" width="240" height="300" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <path d="M312 178 h216 a12 12 0 0 1 12 12 v118 h-240 v-118 a12 12 0 0 1 12 -12 z" fill="#3D98E7"/>
    <path d="M300 308 h240" stroke="#111111" stroke-width="6"/>
    <rect x="300" y="178" width="240" height="300" rx="12" stroke="#111111" stroke-width="6"/>
    <!-- símbolo novo -->
    <rect x="378" y="200" width="84" height="84" rx="14" transform="rotate(45 420 242)" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <circle cx="420" cy="242" r="24" fill="#ED4546" stroke="#111111" stroke-width="6"/>
    <!-- assinatura nova -->
    <path d="M346 346 h148" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
    <path d="M372 374 h96" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <!-- nova paleta -->
    <g stroke="#111111" stroke-width="5">
      <circle cx="372" cy="428" r="18" fill="#3D98E7"/>
      <circle cx="420" cy="428" r="18" fill="#FFDC4D"/>
      <circle cx="468" cy="428" r="18" fill="#ED4546"/>
    </g>
  </g>

  <!-- Brilhos: o novo -->
  <path d="M556 212 q4 22 22 26 q-18 4 -22 26 q-4 -22 -22 -26 q18 -4 22 -26 z" fill="#FFDC4D" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <path d="M290 480 q3 16 16 19 q-13 3 -16 19 q-3 -16 -16 -19 q13 -3 16 -19 z" fill="#FFDC4D" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>

  <!-- Enfeites, no mesmo traço do card Startup -->
  <path d="M40 70 c26 -30 44 4 22 20 c-16 12 -26 -12 -6 -24 c22 -14 48 8 44 34" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 500 c30 46 58 46 62 12 c3 -26 -26 -30 -30 -4 c-5 30 34 52 66 40" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="486" cy="40" r="10" fill="#ED4546"/>
  <circle cx="522" cy="52" r="10" fill="#ED4546"/>
  <circle cx="558" cy="64" r="10" fill="#ED4546"/>
</svg>
