<svg xmlns="http://www.w3.org/2000/svg">
<!--
     ÍCONES — fonte única do projeto
     ============================================================
     Antes disto o mesmo ícone existia duas vezes, com traçados
     diferentes: o olho, o envelope e o X do cadastro não eram os
     mesmos do login. Ninguém notava porque ninguém compara dois
     arquivos lado a lado.

     Base: Feather Icons v4, traçado de 2px em grade de 24.

     USO
       <svg viewBox="0 0 24 24" aria-hidden="true">
         <use href="img/icones.svg#icon-check"/>
       </svg>

     A cor vem de currentColor: o ícone herda a cor do contexto,
     então não há fill nem stroke fixo aqui.

     ATENÇÃO AO EDITAR
     Este é um documento XML, não HTML: comentário não pode conter
     dois hifens seguidos. Escrever "algo" com prefixo de variável
     CSS dentro de um comentário quebra o arquivo inteiro, e o
     sintoma é silencioso — todos os ícones somem de uma vez.

     LIMITE CONHECIDO
     Variável CSS não atravessa para dentro de um SVG externo. Por
     isso o logotipo do Google continua inline nas telas: ele usa
     as cores de marca em var(), e aqui essas variáveis não existem.
     ============================================================
-->

  <!-- Estado e sinalização -->
  <symbol id="icon-alert-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12"/>
  </symbol>
  <symbol id="icon-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8"/>
  </symbol>
  <symbol id="icon-slash" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
  </symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  </symbol>
  <symbol id="icon-wifi-off" viewBox="0 0 24 24">
    <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
  </symbol>

  <!-- Acesso -->
  <symbol id="icon-lock" viewBox="0 0 24 24">
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="icon-eye-off" viewBox="0 0 24 24">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
  </symbol>
  <symbol id="icon-mail" viewBox="0 0 24 24">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/>
  </symbol>
  <symbol id="icon-credit-card" viewBox="0 0 24 24">
    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
  </symbol>

  <!-- Controle -->
  <symbol id="icon-mais" viewBox="0 0 24 24">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="icon-usuario" viewBox="0 0 24 24">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24">
    <polyline points="15 18 9 12 15 6"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="icon-copiar" viewBox="0 0 24 24">
    <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
  </symbol>

  <!-- Carregando. Traço mais grosso que os demais: em 20px girando, 2px some. -->
  <symbol id="icon-spinner" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" stroke-width="2.5" opacity=".25"/>
    <path d="M21 12a9 9 0 0 0-9-9" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- Marca. Usa fill, não stroke, e fill é propriedade herdada:
       a cor continua vindo do CSS da página.

       Traçado normalizado para a origem: o original vivia em
       5.6,9 e exigia um viewBox deslocado, que precisava ser
       repetido igual na página. Qualquer divergência entre os dois
       recortava o monograma. Agora começa em 0,0 como todo o
       resto. -->
  <symbol id="icon-marca" viewBox="0 0 28.8 22">
    <path fill-rule="evenodd" d="M0 0 H5.2 A6.4 6.4 0 0 1 5.2 12.8 L5.2 22 H0 Z M5.2 3.4 A3 3 0 0 1 5.2 9.4 Z M14.6 0 H19.8 A9 11 0 0 1 19.8 22 H14.6 Z M19.8 4.6 A6.4 6.4 0 0 1 19.8 17.4 Z"/>
  </symbol>
</svg>
