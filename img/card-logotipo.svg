<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Prancheta de criação: a marca sendo construída sobre a grade -->
  <g transform="rotate(-8 300 300)">
    <rect x="66" y="96" width="400" height="336" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <path d="M78 96 h376 a12 12 0 0 1 12 12 v30 h-400 v-30 a12 12 0 0 1 12 -12 z" fill="#111111"/>
    <path d="M66 138 h400" stroke="#111111" stroke-width="6"/>
    <circle cx="96" cy="117" r="7" fill="#FFFFFF"/>
    <circle cx="120" cy="117" r="7" fill="#FFFFFF"/>
    <circle cx="144" cy="117" r="7" fill="#FFFFFF"/>

    <!-- Grade de construção -->
    <g stroke="#111111" stroke-width="3" stroke-dasharray="8 9" opacity=".35">
      <circle cx="262" cy="262" r="104"/>
      <circle cx="262" cy="262" r="64"/>
      <path d="M100 262 h324"/>
      <path d="M262 150 v240"/>
    </g>

    <!-- A marca: círculo + triângulo -->
    <circle cx="236" cy="262" r="60" fill="#3D98E7" stroke="#111111" stroke-width="6"/>
    <path d="M244 318 L310 206 L376 318 Z" fill="#FFDC4D" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

    <!-- Caixa de seleção com alças -->
    <rect x="164" y="190" width="224" height="140" stroke="#111111" stroke-width="3"/>
    <g fill="#FFFFFF" stroke="#111111" stroke-width="3">
      <rect x="157" y="183" width="14" height="14"/>
      <rect x="381" y="183" width="14" height="14"/>
      <rect x="157" y="323" width="14" height="14"/>
      <rect x="381" y="323" width="14" height="14"/>
    </g>

    <!-- Assinatura (wordmark) -->
    <path d="M186 372 h152" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <path d="M214 400 h96" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Curva de Bézier saindo da ponta da caneta -->
  <path d="M442 330 C 470 408 520 376 544 452" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <path d="M510 492 L578 412" stroke="#111111" stroke-width="3"/>
  <circle cx="510" cy="492" r="7" fill="#111111"/>
  <circle cx="578" cy="412" r="7" fill="#111111"/>
  <rect x="536" y="444" width="16" height="16" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

  <!-- Caneta vetorial -->
  <g transform="translate(496 250) rotate(38)">
    <path d="M0 94 L-34 24 L-34 -8 L34 -8 L34 24 Z" fill="#FFDC4D" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 92 V44" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="36" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
    <rect x="-40" y="-64" width="80" height="56" rx="10" fill="#ED4546" stroke="#111111" stroke-width="6"/>
  </g>
  <rect x="434" y="322" width="16" height="16" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

  <!-- Paleta de cores -->
  <g transform="rotate(-6 150 486)">
    <rect x="50" y="450" width="200" height="72" rx="36" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <circle cx="90" cy="486" r="20" fill="#3D98E7" stroke="#111111" stroke-width="5"/>
    <circle cx="150" cy="486" r="20" fill="#FFDC4D" stroke="#111111" stroke-width="5"/>
    <circle cx="210" cy="486" r="20" fill="#ED4546" stroke="#111111" stroke-width="5"/>
  </g>

  <!-- Enfeites, no mesmo traço do card Startup -->
  <path d="M40 60 c26 -30 44 4 22 20 c-16 12 -26 -12 -6 -24 c22 -14 48 8 44 34" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <path d="M470 40 c34 -22 62 -4 44 22 c-14 20 -40 6 -30 -16 c10 -22 48 -26 74 -8" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="500" cy="118" r="10" fill="#ED4546"/>
  <circle cx="536" cy="130" r="10" fill="#ED4546"/>
  <circle cx="572" cy="142" r="10" fill="#ED4546"/>
  <path d="M300 540 c30 30 58 30 62 4 c3 -20 -26 -24 -30 -2 c-5 24 34 40 66 30" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
</svg>
