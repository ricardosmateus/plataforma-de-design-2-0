<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Uma página só, comprida, com um único botão de ação -->
  <g transform="rotate(-7 300 300)">
    <rect x="150" y="58" width="290" height="470" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <path d="M162 58 h266 a12 12 0 0 1 12 12 v30 h-290 v-30 a12 12 0 0 1 12 -12 z" fill="#111111"/>
    <path d="M150 100 h290" stroke="#111111" stroke-width="6"/>
    <circle cx="178" cy="79" r="7" fill="#FFFFFF"/>
    <circle cx="202" cy="79" r="7" fill="#FFFFFF"/>
    <circle cx="226" cy="79" r="7" fill="#FFFFFF"/>

    <!-- Barra de rolagem: a página continua para baixo -->
    <rect x="418" y="118" width="10" height="392" rx="5" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    <rect x="418" y="118" width="10" height="120" rx="5" fill="#111111"/>

    <!-- Imagem de destaque -->
    <rect x="176" y="122" width="226" height="118" rx="8" fill="#3D98E7" stroke="#111111" stroke-width="6"/>
    <circle cx="354" cy="156" r="16" fill="#FFDC4D" stroke="#111111" stroke-width="5"/>
    <path d="M179 237 L240 172 L282 214 L310 188 L399 237 Z" fill="#FFFFFF" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>

    <!-- Título e subtítulo -->
    <path d="M200 276 h178" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
    <path d="M222 302 h134" stroke="#111111" stroke-width="5" stroke-linecap="round"/>

    <!-- O botão de ação -->
    <rect x="206" y="326" width="166" height="48" rx="24" fill="#ED4546" stroke="#111111" stroke-width="6"/>
    <path d="M250 350 h78" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Seções abaixo da dobra -->
    <path d="M150 400 h268" stroke="#111111" stroke-width="3" stroke-dasharray="8 9" opacity=".35"/>
    <g stroke="#111111" stroke-width="5">
      <rect x="180" y="424" width="56" height="56" rx="8" fill="#FFDC4D"/>
      <rect x="262" y="424" width="56" height="56" rx="8" fill="#FFFFFF"/>
      <rect x="344" y="424" width="56" height="56" rx="8" fill="#3D98E7"/>
    </g>
    <g stroke="#111111" stroke-width="4" stroke-linecap="round">
      <path d="M186 500 h44"/><path d="M268 500 h44"/><path d="M350 500 h44"/>
    </g>
  </g>

  <!-- Cursor clicando no botão -->
  <g transform="translate(352 352) rotate(-14)">
    <path d="M0 0 L0 74 L18 58 L32 88 L46 81 L32 52 L56 50 Z" fill="#FFFFFF" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <g stroke="#111111" stroke-width="5" stroke-linecap="round">
    <path d="M340 314 l-3 -20"/>
    <path d="M366 316 l13 -16"/>
    <path d="M388 334 l20 -5"/>
  </g>

  <!-- Alvo: a página existe para um objetivo só -->
  <g transform="translate(474 168)">
    <circle r="62" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <circle r="40" fill="#ED4546" stroke="#111111" stroke-width="6"/>
    <circle r="18" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <circle r="5" fill="#111111"/>
  </g>
  <g transform="translate(474 168) rotate(-40)">
    <path d="M0 0 H104" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <path d="M86 0 l22 -18 h20 l-20 18 l20 18 h-20 z" fill="#FFDC4D" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Enfeites, no mesmo traço do card Startup -->
  <path d="M52 110 c26 -30 44 4 22 20 c-16 12 -26 -12 -6 -24 c22 -14 48 8 44 34" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 470 c30 46 58 46 62 12 c3 -26 -26 -30 -30 -4 c-5 30 34 52 66 40" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="486" cy="470" r="10" fill="#ED4546"/>
  <circle cx="522" cy="482" r="10" fill="#ED4546"/>
  <circle cx="558" cy="494" r="10" fill="#ED4546"/>
  <path d="M500 540 c30 -26 60 -6 44 18" fill="none" stroke="#FFDC4D" stroke-width="5" stroke-linecap="round"/>
</svg>
