# ============================================================
# Render — um serviço só, API e site na mesma origem
# ============================================================
# Por que um serviço e não dois: com SERVIR_FRONTEND=sim o próprio
# Fastify serve os .html/.css/.js da raiz do repositório
# (api/src/servidor.ts, allowlist PERMITIDO). Mesma origem significa
# sem CORS e sem cookie cross-site — e o cookie de sessão é
# `sameSite: strict`, que é justamente o que NÃO atravessa origens.
# Separar em dois serviços obrigaria a afrouxar essa política.
#
# Por que não serverless: a investigação transmite por SSE
# (`text/event-stream` em src/rotas/pesquisa.ts). Função com teto de
# duração corta a conexão no meio de uma busca JÁ PAGA. Este serviço
# precisa ser um processo que fica de pé.
#
# rootDir: api — o build e o start rodam dentro de api/, mas o Render
# faz checkout do repositório INTEIRO. É isso que mantém
# `RAIZ_SITE` (api/dist/../.. = raiz do repo) apontando para os
# .html do site. Mudar rootDir para a raiz quebraria o start.
# ============================================================
services:
  - type: web
    name: plataforma-de-design
    runtime: node
    plan: starter
    # O banco é Neon em AWS us-east-2, que é Ohio. App e banco na
    # mesma região porque CADA consulta paga a ida e volta: com o app
    # no Brasil e o banco em Ohio seriam ~120ms por consulta, e uma
    # tela como o board faz várias em sequência.
    region: ohio
    rootDir: api

    # A versão do Node vem de `api/.node-version` (= 22). Sem esse
    # arquivo o Render lê `engines: >=20` do package.json e escolhe a
    # mais nova que existir — em 19/09/2026 isso deu Node 26, três
    # majors à frente da 22 que roda aqui e da `@types/node` ^22 com
    # que o código é compilado. Desenvolver numa versão e publicar em
    # outra é adiar o erro para o único lugar onde ele custa caro;
    # `argon2` ainda por cima compila nativo e depende de haver
    # binário pronto para a versão em uso.

    # `npm ci` e não `npm install`: instala exatamente o que está no
    # lock.
    #
    # `--include=dev` não é enfeite: `NODE_ENV=production` (declarado
    # mais abaixo) vale TAMBÉM durante o build, e com ele o npm passa
    # a omitir as devDependencies por conta própria. Só que é lá que
    # moram `typescript` e `@types/node` — sem eles o `npm run build`
    # morre em `error TS2688: Cannot find type definition file for
    # 'node'`, que foi exatamente o que aconteceu em 19/09/2026 e
    # custou três deploys até alguém desconfiar do NODE_ENV.
    #
    # `prisma generate` antes do build porque o TypeScript não
    # compila sem o client. `migrar` é `prisma migrate deploy` —
    # aplica o que falta e nunca cria migração nova (ao contrário de
    # `migrar:dev`, que não deve chegar perto de um servidor).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run migrar && npm run build
    startCommand: npm run start

    # /saude faz `SELECT 1` no banco. É de propósito: um serviço que
    # responde 200 sem conseguir falar com o banco está de pé e
    # inútil, e o Render promoveria o deploy achando que deu certo.
    healthCheckPath: /saude
    autoDeployTrigger: commit

    envVars:
      # ---- O que decide o comportamento ----
      - key: NODE_ENV
        value: production
      # Explícito e obrigatório: em produção o env.ts desliga o site
      # por padrão (`producao ? 'nao' : 'sim'`). Sem esta linha o
      # deploy sobe uma API sem nenhuma tela.
      - key: SERVIR_FRONTEND
        value: sim

      # ---- Segredos que o Render gera e eu nunca vejo ----
      # `generateValue` cria o valor no primeiro deploy e o guarda.
      # Não reutilize os do .env local: segredo de desenvolvimento
      # circula em máquina, backup e histórico de terminal.
      # Trocar JWT_SEGREDO invalida as sessões abertas; trocar
      # OTP_PIMENTA invalida os códigos de verificação em trânsito.
      - key: JWT_SEGREDO
        generateValue: true
      - key: OTP_PIMENTA
        generateValue: true

      # ---- O que você preenche no painel ----
      # sync: false = o Render pede o valor e não o guarda aqui, que
      # é o que mantém este arquivo publicável no repositório.
      - key: DATABASE_URL
        sync: false
      # Allowlist de origens (env.ts §ORIGENS). Com tudo na mesma
      # origem ela quase não é exercitada, mas as rotas de stream
      # escrevem o cabeçalho de CORS à mão depois do `hijack()` e
      # leem esta lista — deixá-la no padrão `http://localhost:8000`
      # faria a investigação falhar só em produção.
      #
      # Valor à vista (não é segredo) para haver menos coisa a digitar
      # no painel. Se o endereço do serviço mudar, muda aqui.
      #
      # É `app.` e NÃO `www.`: o `www.plataformadedesign.com` é o
      # site institucional, que continua hospedado na Hostinger e não
      # tem nada a ver com este serviço. Apontar esta lista para o www
      # seria autorizar uma origem que nunca chama esta API e deixar
      # de fora a única que chama.
      - key: ORIGENS
        value: https://app.plataformadedesign.com
      # Chave da IA. Sem ela o assistente e a pesquisa não funcionam;
      # o resto da plataforma sobe normalmente.
      - key: IA_API_KEY
        sync: false

      # ---- Cobrança e pagamento ----
      #
      # A ORDEM IMPORTA, e é por isso que estas duas chaves não viram
      # juntas. Não existe saldo inicial nem crédito de boas-vindas em
      # lugar nenhum do produto: toda conta começa em zero. Ligar a
      # cobrança antes de a compra funcionar de verdade bloqueia
      # assistente, pesquisa, classificação e recortes para todo mundo
      # na primeira chamada, sem caminho para destravar.
      #
      # Passo 1 (este commit): Pix real. PSP_DRIVER=mercado_pago, com as
      #   credenciais preenchidas no painel do Render (abaixo) e a URL
      #   do webhook cadastrada no painel do Mercado Pago:
      #     https://app.plataformadedesign.com/webhooks/pix/mercado-pago
      #   Confirmar com um Pix de valor baixo antes de seguir.
      #
      # Passo 2 (depois, e só depois): CREDITOS_COBRAR=sim. Com saldo
      #   já creditado nas contas ativas — `npm run creditar -- email 50
      #   "motivo"` (SEG-PAG-006) —, ninguém para no meio do trabalho.
      #
      # Enquanto o passo 2 não acontece, `reservar()` volta na primeira
      # linha: nada é debitado, não existe SaldoInsuficiente e, desde
      # que o teto por investigação saiu (18d58cb), a pesquisa não tem
      # limite nenhum. O gasto real continua na conta do provedor de IA.
      # É o passo 2 que rearma essa proteção.
      #
      # Sintoma de hoje, esperado: o Histórico de uso mostra o consumo
      # medido com a etiqueta "medido, não cobrado" (DIN-011/DIN-014).
      - key: CREDITOS_COBRAR
        value: nao

      # Pix de verdade. `env.ts` derruba o boot (process.exit) se este
      # valor for `mercado_pago` e alguma das duas credenciais abaixo
      # estiver vazia — trocar o driver sem preenchê-las não degrada,
      # tira a API do ar.
      - key: PSP_DRIVER
        value: mercado_pago
      # Suas integrações → Credenciais, no painel do Mercado Pago.
      # `sync: false`: o valor é preenchido no painel do Render e nunca
      # entra no repositório.
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      # Segredo do HMAC que assina o webhook deles (SEG-PAG-001). Sai
      # junto com o cadastro da URL do webhook no painel do Mercado
      # Pago. Diferente de WEBHOOK_PIX_SECRET, que é do PSP sandbox:
      # cada Psp assina do seu jeito.
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
